<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>EduPlay – Free Learning Games</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    /* Light theme (default) */
    :root {
      --bg-body: linear-gradient(145deg, #f6f9fc 0%, #eef2f7 100%);
      --bg-container: rgba(255,255,255,0.75);
      --text-primary: #1a2c3e;
      --border-light: #cbdde6;
      --card-bg: white;
      --card-border: #e2edf2;
      --cat-btn-bg: white;
      --cat-btn-border: #cbdde6;
      --cat-btn-text: #1f4e6e;
      --cat-active-bg: #2a9d8f;
      --cat-active-text: white;
      --input-border: #cfdfe9;
      --feedback-bg: #ffffffdd;
      --footer-text: #4a627a;
      --shadow: 0 12px 20px -12px rgba(0,0,0,0.15);
      --icon-filter: none;
    }

    /* Dark theme */
    body.dark {
      --bg-body: linear-gradient(145deg, #121826 0%, #1a1f2c 100%);
      --bg-container: rgba(30, 35, 48, 0.85);
      --text-primary: #eef2f7;
      --border-light: #2d3a46;
      --card-bg: #232a37;
      --card-border: #334152;
      --cat-btn-bg: #1e2532;
      --cat-btn-border: #3a485a;
      --cat-btn-text: #cbdde6;
      --cat-active-bg: #2a9d8f;
      --cat-active-text: #ffffff;
      --input-border: #3a485a;
      --feedback-bg: #1e2532cc;
      --footer-text: #9aaebf;
      --shadow: 0 12px 20px -12px rgba(0,0,0,0.4);
      --icon-filter: brightness(0.9);
    }

    body {
      background: var(--bg-body);
      font-family: system-ui, 'Segoe UI', 'Roboto', 'Noto Sans', sans-serif;
      color: var(--text-primary);
      line-height: 1.4;
      padding: 1rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      background: var(--bg-container);
      backdrop-filter: blur(2px);
      border-radius: 2rem;
      padding: 1.5rem;
      box-shadow: 0 25px 45px -12px rgba(0,0,0,0.2);
    }

    /* top bar with theme toggle */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--border-light);
    }

    .logo h1 {
      font-size: 1.8rem;
      background: linear-gradient(135deg, #1f7b4d, #2a9d8f);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.3px;
    }

    .logo p {
      font-size: 0.85rem;
      color: #2c6e49;
    }
    body.dark .logo p {
      color: #6fbf8a;
    }

    .right-actions {
      display: flex;
      justify-content: center;
      align-content: center;
      gap: 0.9rem;
      flex-wrap: wrap;
    }

    .theme-toggle {
      background: var(--cat-btn-bg);
      border: 1px solid var(--cat-btn-border);
      border-radius: 60px;
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 1.2rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--cat-btn-text);
      transition: 0.2s;
    }
    .theme-toggle:hover {
      background: var(--cat-active-bg);
      color: white;
    }

    .support-btn {
      background: linear-gradient(105deg, #ff9800, #f57c00);
      padding: 0.6rem 1.3rem;
      border-radius: 60px;
      font-weight: bold;
      text-decoration: none;
      color: #1e2a2f;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border: 1px solid rgba(255,255,240,0.6);
    }
    .support-btn:hover {
      transform: translateY(-2px);
      background: #ff9100;
    }

    /* search + category */
    .search-section {
      margin-bottom: 2rem;
    }
    .search-box input {
      width: 100%;
      padding: 0.9rem 1.2rem;
      font-size: 1rem;
      border: 2px solid var(--input-border);
      border-radius: 60px;
      outline: none;
      background: var(--card-bg);
      color: var(--text-primary);
      font-family: inherit;
    }
    .category-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 1rem;
    }
    .cat-btn {
      background: var(--cat-btn-bg);
      border: 1px solid var(--cat-btn-border);
      padding: 0.6rem 1.5rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      color: var(--cat-btn-text);
      transition: 0.2s;
    }
    .cat-btn.active {
      background: var(--cat-active-bg);
      color: var(--cat-active-text);
      border-color: var(--cat-active-bg);
      box-shadow: 0 6px 12px -8px var(--cat-active-bg);
    }
    .cat-btn:hover:not(.active) {
      background: var(--cat-active-bg);
      color: white;
      opacity: 0.8;
    }

    .section-title {
      font-size: 1.6rem;
      margin: 2rem 0 1rem 0;
      font-weight: 600;
      border-left: 5px solid #ff9800;
      padding-left: 1rem;
    }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.8rem;
      margin-bottom: 2rem;
    }
    .game-card {
      background: var(--card-bg);
      border-radius: 1.5rem;
      overflow: hidden;
      transition: 0.25s ease;
      box-shadow: var(--shadow);
      border: 1px solid var(--card-border);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }
    .game-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 24px 30px -16px rgba(0,0,0,0.3);
    }
    .game-img {
      height: 140px;
      background: linear-gradient(125deg, #d9e8f0, #c2dbeb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
    }
    body.dark .game-img {
      background: linear-gradient(125deg, #2c3848, #1e2a36);
    }
    .game-info {
      padding: 1.2rem;
    }
    .game-title {
      font-weight: 700;
      font-size: 1.2rem;
      margin-bottom: 0.4rem;
    }
    .game-category {
      display: inline-block;
      background: #eef3f0;
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      color: #1f6e4a;
    }
    body.dark .game-category {
      background: #2c3e2b;
      color: #b8e0b4;
    }
    .play-badge {
      margin-top: 0.7rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: #2a9d8f;
    }
    .no-results {
      text-align: center;
      padding: 3rem;
      background: var(--feedback-bg);
      border-radius: 2rem;
      font-size: 1.2rem;
    }
    /* feedback */
    .feedback-section {
      background: var(--feedback-bg);
      backdrop-filter: blur(8px);
      border-radius: 2rem;
      padding: 1.8rem;
      margin-top: 2rem;
      border: 1px solid var(--border-light);
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      border-radius: 1.5rem;
      border: 1px solid var(--input-border);
      background: var(--card-bg);
      color: var(--text-primary);
      font-family: inherit;
    }
    .whatsapp-btn {
      background: #25D366;
      color: white;
      border: none;
      padding: 0.8rem 1.8rem;
      border-radius: 3rem;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
    }
    footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--footer-text);
      border-top: 1px solid var(--border-light);
      padding-top: 1.5rem;
    }
    @media (max-width: 640px) {
      .container { padding: 1rem; }
      .logo h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <div class="logo">
      <h1>🎮 EduPlay</h1>
      <p>free learning games</p>
    </div>
    <div class="right-actions">
      <button id="themeToggleBtn" class="theme-toggle" aria-label="Dark/Light mode">🌓 Dark/Light</button>
      <a href="#" id="dataStoreLink" class="support-btn" target="_blank" rel="noopener noreferrer">
        📦 Support Us<br>Buy Our Data Bundles
      </a>
    </div>
  </div>

  <div class="search-section">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 Search games... (e.g., times, solar)">
    </div>
    <div class="category-filters" id="categoryContainer"></div>
  </div>

  <h2 class="section-title">🎲 Play & Learn</h2>
  <div id="gamesGrid" class="games-grid"></div>

  <div class="feedback-section">
    <h3>💬 Suggestions & Feedback</h3>
    <p style="margin-bottom: 1rem;">Ideas help us improve – send directly via WhatsApp.</p>
    <div class="form-group">
      <input type="text" id="feedbackName" placeholder="Your name (optional)">
    </div>
    <div class="form-group">
      <textarea id="feedbackMsg" placeholder="Game request, comment, or suggestion..."></textarea>
    </div>
    <button class="whatsapp-btn" id="sendWhatsAppBtn">📲 Send via WhatsApp</button>
  </div>
  <footer>
    🧠 100% free educational games — support the mission by buying data bundles (MTN, AirtelTigo, Telecel).
  </footer>
</div>

<script>
  // ---------- GAMES DATABASE (single array) ----------
  // Add any new game with any category – the category button will appear automatically.
  const games = [
    { title: "Times Table Blaster", category: "math", url: "#", icon: "✖️", description: "Practice multiplication 1-12" },
    { title: "Fraction Splat", category: "math", url: "#", icon: "🧮", description: "Compare and simplify fractions" },
    { title: "Geometry Dash (angles)", category: "math", url: "#", icon: "📐", description: "Identify acute, obtuse, right angles" },
    { title: "Algebra Balance", category: "math", url: "#", icon: "⚖️", description: "Intro to equations" },
    { title: "Solar System Explorer", category: "science", url: "#", icon: "🪐", description: "Learn planet order & facts" },
    { title: "Human Body Quiz", category: "science", url: "#", icon: "🧬", description: "Organs, bones, and systems" },
    { title: "Plant Life Cycle", category: "science", url: "#", icon: "🌱", description: "From seed to pollination" },
    { title: "Animal Habitats", category: "science", url: "#", icon: "🐘", description: "Desert, rainforest, arctic" },
    { title: "Phonics Fun: CVC", category: "phonics", url: "#", icon: "🔊", description: "Consonant-vowel-consonant blends" },
    { title: "Letter Sound Match", category: "phonics", url: "#", icon: "📖", description: "Match phonemes to letters" },
    { title: "Word Family Train", category: "phonics", url: "#", icon: "🚂", description: "-at, -an, -ap word endings" },
    { title: "Digraph Detectives", category: "phonics", url: "#", icon: "🕵️", description: "sh, ch, th, wh sounds" }
    // Add more games here – if you use a new category like "history", a button will appear automatically!
  ];

  // ---------- DYNAMIC CATEGORY GENERATION ----------
  function getUniqueCategories() {
    const cats = games.map(g => g.category);
    return ['all', ...new Set(cats)];
  }

  function generateCategoryButtons() {
    const container = document.getElementById('categoryContainer');
    const categories = getUniqueCategories();
    // map category to display name with optional icons
    const getDisplayName = (cat) => {
      if (cat === 'all') return 'All';
      if (cat === 'math') return '📐 Math';
      if (cat === 'science') return '🔬 Science';
      if (cat === 'phonics') return '🔤 Phonics';
      return cat.charAt(0).toUpperCase() + cat.slice(1);  // fallback for any new category
    };
    container.innerHTML = categories.map(cat => `
      <button data-cat="${cat}" class="cat-btn ${cat === activeCategory ? 'active' : ''}">
        ${getDisplayName(cat)}
      </button>
    `).join('');

    // attach event listeners
    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const cat = btn.getAttribute('data-cat');
        setActiveCategory(cat);
      });
    });
  }

  // ---------- GLOBAL STATE ----------
  let activeCategory = 'all';
  let searchTerm = '';

  // DOM elements
  const gamesGrid = document.getElementById('gamesGrid');
  const searchInput = document.getElementById('searchInput');

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function renderGames() {
    let filtered = games.filter(game => {
      if (activeCategory !== 'all' && game.category !== activeCategory) return false;
      const haystack = (game.title + ' ' + game.description).toLowerCase();
      return haystack.includes(searchTerm.toLowerCase());
    });

    if (filtered.length === 0) {
      gamesGrid.innerHTML = `<div class="no-results">😕 No games match "${escapeHtml(searchTerm)}" in ${activeCategory === 'all' ? 'all categories' : activeCategory}. Try another keyword!</div>`;
      return;
    }

    const gridHtml = filtered.map(game => `
      <a href="${game.url}" class="game-card" target="_blank" rel="noopener noreferrer">
        <div class="game-img">${game.icon || '🎮'}</div>
        <div class="game-info">
          <div class="game-title">${escapeHtml(game.title)}</div>
          <span class="game-category">${game.category.toUpperCase()}</span>
          <div class="play-badge">▶️ Click to play →</div>
          <p style="font-size:0.8rem; margin-top:0.6rem;">${escapeHtml(game.description)}</p>
        </div>
      </a>
    `).join('');
    gamesGrid.innerHTML = gridHtml;
  }

  function setActiveCategory(cat) {
    activeCategory = cat;
    // update button active styles
    document.querySelectorAll('.cat-btn').forEach(btn => {
      if (btn.getAttribute('data-cat') === cat) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });
    renderGames();
  }

  function initSearch() {
    searchInput.addEventListener('input', (e) => {
      searchTerm = e.target.value;
      renderGames();
    });
  }

  // WhatsApp feedback
  function sendToWhatsApp() {
    let name = document.getElementById('feedbackName').value.trim();
    let message = document.getElementById('feedbackMsg').value.trim();
    if (!message) {
      alert("📝 Please write a suggestion or comment before sending.");
      return;
    }
    let fullMessage = `*New feedback from EduPlay*%0A`;
    if (name) fullMessage += `*Name:* ${encodeURIComponent(name)}%0A`;
    else fullMessage += `*Name:* (Anonymous)%0A`;
    fullMessage += `*Message:* ${encodeURIComponent(message)}%0A`;
    fullMessage += `*Category:* ${activeCategory}%0A`;
    fullMessage += `*Search:* ${encodeURIComponent(searchTerm) || 'none'}%0A`;
    fullMessage += `— %0A🙏 Support: buy data bundles to keep games free!`;
    const phone = "233279645804";
    window.open(`https://wa.me/${phone}?text=${fullMessage}`, '_blank');
    document.getElementById('feedbackMsg').value = '';
    alert("✓ Opening WhatsApp. Please tap Send to share your feedback. Thank you!");
  }

  // Data store link - replace with your actual URL
  function initDataStoreLink() {
    const storeLink = document.getElementById('dataStoreLink');
    // *********************************************
    // ✅ REPLACE THIS with your real data bundle store link
    const YOUR_STORE_URL = "https://your-data-store-link.com/buy-bundles";
    // *********************************************
    storeLink.href = YOUR_STORE_URL;
    if (YOUR_STORE_URL === "https://your-data-store-link.com/buy-bundles") {
      console.warn("⚠️ Please update the data store URL in initDataStoreLink()");
    }
  }

  // ---------- DARK MODE TOGGLE ----------
  function initThemeToggle() {
    const toggleBtn = document.getElementById('themeToggleBtn');
    // Check localStorage for saved preference
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.body.classList.add('dark');
    } else if (savedTheme === 'light') {
      document.body.classList.remove('dark');
    } else {
      // optional: follow system preference
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.body.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    }
    toggleBtn.addEventListener('click', () => {
      if (document.body.classList.contains('dark')) {
        document.body.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        document.body.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    });
  }

  // ---------- INITIALIZE EVERYTHING ----------
  document.addEventListener('DOMContentLoaded', () => {
    generateCategoryButtons();   // dynamic buttons based on games array
    initSearch();
    renderGames();
    initDataStoreLink();
    initThemeToggle();

    const whatsappBtn = document.getElementById('sendWhatsAppBtn');
    if (whatsappBtn) whatsappBtn.addEventListener('click', sendToWhatsApp);
  });
</script>
</body>
</html>
