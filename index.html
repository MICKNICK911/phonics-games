  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f8f9ff 0%, #eef2ff 100%);
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #1e293b;
    }

    header {
      text-align: center;
      padding: 2rem;
      width: 100%;
      max-width: 1200px;
      margin-bottom: 1.5rem;
    }

    header h1 {
      font-size: 2.8rem;
      font-weight: 800;
      margin-bottom: 0.6rem;
      background: linear-gradient(to right, #4f46e5, #7c3aed);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      position: relative;
      display: inline-block;
    }

    header h1::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 4px;
      background: linear-gradient(to right, #4f46e5, #7c3aed);
      border-radius: 2px;
    }

    .subtitle {
      color: #64748b;
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
    }

    .task-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 0 1rem;
    }

    .task-card {
      background: white;
      border-radius: 16px;
      padding: 1.75rem;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.08);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      border: 1px solid #e5e7eb;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeIn 0.5s ease forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .task-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(to right, #4f46e5, #7c3aed);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .task-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 24px rgba(99, 102, 241, 0.15);
    }

    .task-card:hover::before {
      opacity: 1;
    }

    .task-number {
      position: absolute;
      top: -10px;
      right: -10px;
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
      box-shadow: 0 4px 10px rgba(108, 99, 255, 0.3);
    }

    .task-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #1e293b;
      transition: color 0.2s ease;
    }

    .task-description {
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.25rem;
      flex-grow: 1;
    }

    .loading {
      display: none;
      margin-top: 1rem;
      text-align: center;
      color: #4f46e5;
      font-weight: 500;
      position: relative;
      padding-left: 24px;
    }

    .loading::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      border: 3px solid rgba(79, 70, 229, 0.2);
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: translateY(-50%) rotate(360deg); }
    }

    .task-card.active {
      background: #f8fafc;
      border-color: #c7d2fe;
    }

    .task-card.active .loading {
      display: block;
    }

    .footer {
      margin-top: 3rem;
      text-align: center;
      color: #64748b;
      font-size: 0.9rem;
      padding: 1.5rem 0 0;
      border-top: 1px solid #e2e8f0;
      max-width: 800px;
      width: 100%;
    }

    @media (max-width: 768px) {
      header h1 {
        font-size: 2.25rem;
      }
      
      .task-container {
        grid-template-columns: 1fr;
      }
      
      .subtitle {
        font-size: 1rem;
      }
    }
  </style>

    title.className = "task-title";

    loading.className = "loading";
    loading.textContent = "Loading task...";

    card.appendChild(title);
    card.appendChild(description);
    card.appendChild(loading);
    container.appendChild(card);

      event.preventDefault();
      if (card.classList.contains("active")) return;
      card.classList.add("active");
      window.setTimeout(function () {
        window.location.href = href;
      }, 800);
