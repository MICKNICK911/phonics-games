<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Slingshot FIXED</title>
    <style>
        body { background: #222; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        canvas { border: 2px solid gold; cursor: crosshair; background: #87CEEB; }
        .info { color: white; margin-top: 10px; font-family: monospace; }
        button { margin-top: 10px; padding: 8px 16px; }
    </style>
</head>
<body>
<div>
    <canvas id="gameCanvas" width="800" height="500" style="width:100%; height:auto; max-width:800px; border-radius:12px;"></canvas>
    <div class="info">
        <span>Score: <span id="score">0</span></span>
        <span id="status">⚡ Drag from the slingshot (left side) backward → release</span>
    </div>
    <button id="reset">Reset Game</button>
</div>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Fix dimensions: set canvas resolution explicitly
        canvas.width = 800;
        canvas.height = 500;
        const W = 800, H = 500;
        
        // Slingshot anchor
        const slingX = 120, slingY = 400;
        
        // Game state
        let blocks = [];
        let bird = { exists: false, x: 0, y: 0, vx: 0, vy: 0, radius: 12 };
        let score = 0;
        let canShoot = true;
        let dragActive = false;
        let dragPoint = { x: slingX, y: slingY };
        
        // Physics
        const GRAVITY = 0.35;
        const GROUND_Y = H - 40;
        const BOUNCE = 0.65;
        
        function updateScoreUI() {
            document.getElementById('score').innerText = score;
        }
        
        // Blocks - simple stack
        function initBlocks() {
            blocks = [];
            const startX = 550, startY = GROUND_Y - 30;
            for (let i = 0; i < 5; i++) {
                blocks.push({ x: startX + i*45, y: startY, w: 40, h: 30, hp: 1 });
            }
            for (let i = 0; i < 4; i++) {
                blocks.push({ x: startX + 22.5 + i*45, y: startY - 30, w: 40, h: 30, hp: 1 });
            }
            for (let i = 0; i < 3; i++) {
                blocks.push({ x: startX + 45 + i*45, y: startY - 60, w: 40, h: 30, hp: 1 });
            }
        }
        
        // Bird update
        function updateBird() {
            if (!bird.exists) return;
            bird.vx *= 0.99;
            bird.vy += GRAVITY;
            bird.x += bird.vx;
            bird.y += bird.vy;
            
            // Ground
            if (bird.y + bird.radius >= GROUND_Y) {
                bird.y = GROUND_Y - bird.radius;
                bird.vy = -bird.vy * BOUNCE;
                if (Math.abs(bird.vy) < 1 && bird.vy >= 0) bird.vy = 0;
            }
            // Walls
            if (bird.x - bird.radius < 0) { bird.x = bird.radius; bird.vx = -bird.vx * 0.5; }
            if (bird.x + bird.radius > W) { bird.x = W - bird.radius; bird.vx = -bird.vx * 0.5; }
            
            // Collision with blocks
            for (let i=0; i<blocks.length; i++) {
                const b = blocks[i];
                const closestX = Math.max(b.x, Math.min(bird.x, b.x+b.w));
                const closestY = Math.max(b.y, Math.min(bird.y, b.y+b.h));
                const dx = bird.x - closestX;
                const dy = bird.y - closestY;
                if (Math.hypot(dx, dy) < bird.radius) {
                    blocks.splice(i,1);
                    score++;
                    updateScoreUI();
                    bird.vx += (Math.random()-0.5)*2;
                    bird.vy -= 2;
                    break;
                }
            }
            
            // Stop condition
            if ((bird.y + bird.radius >= GROUND_Y-2 && Math.abs(bird.vy) < 0.5 && Math.abs(bird.vx) < 0.8) || bird.x < -50) {
                bird.exists = false;
                canShoot = true;
                document.getElementById('status').innerText = '✅ Ready! Drag back to shoot';
            } else {
                document.getElementById('status').innerText = '🐦 Flying!';
            }
        }
        
        // Drag handling with reliable coordinate conversion
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;   // canvas physical width / CSS displayed width
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            let canvasX = (clientX - rect.left) * scaleX;
            let canvasY = (clientY - rect.top) * scaleY;
            canvasX = Math.min(Math.max(canvasX, 0), W);
            canvasY = Math.min(Math.max(canvasY, 0), H);
            return { x: canvasX, y: canvasY };
        }
        
        function onDragStart(e) {
            e.preventDefault();
            if (!canShoot) return;
            const { x, y } = getCanvasCoords(e);
            // Check if click is near slingshot (radius 30px)
            const distToSling = Math.hypot(x - slingX, y - slingY);
            if (distToSling > 40) return;
            dragActive = true;
            dragPoint = { x: slingX, y: slingY };
            canvas.style.cursor = 'grabbing';
        }
        
        function onDragMove(e) {
            if (!dragActive || !canShoot) return;
            e.preventDefault();
            let { x, y } = getCanvasCoords(e);
            // Limit drag distance
            let dx = x - slingX;
            let dy = y - slingY;
            const maxDist = 100;
            let dist = Math.hypot(dx, dy);
            if (dist > maxDist) {
                dx = dx * (maxDist / dist);
                dy = dy * (maxDist / dist);
                x = slingX + dx;
                y = slingY + dy;
            }
            dragPoint = { x, y };
        }
        
        function onDragEnd(e) {
            if (!dragActive || !canShoot) {
                dragActive = false;
                return;
            }
            dragActive = false;
            canvas.style.cursor = 'crosshair';
            // Compute velocity
            let pullX = slingX - dragPoint.x;
            let pullY = slingY - dragPoint.y;
            let power = Math.min(Math.hypot(pullX, pullY), 100) / 100;
            let strength = 11;
            let vx = pullX * strength * power;
            let vy = pullY * strength * power;
            if (Math.hypot(vx, vy) > 2) {
                bird.exists = true;
                bird.x = slingX;
                bird.y = slingY;
                bird.vx = vx;
                bird.vy = vy;
                canShoot = false;
                document.getElementById('status').innerText = '🎯 Launched!';
            } else {
                document.getElementById('status').innerText = '💪 Pull harder!';
                setTimeout(() => { if (canShoot) document.getElementById('status').innerText = '✅ Drag back to shoot'; }, 800);
            }
            dragPoint = { x: slingX, y: slingY };
        }
        
        // Drawing
        function draw() {
            ctx.clearRect(0, 0, W, H);
            // Sky & ground
            ctx.fillStyle = '#9ac0cd';
            ctx.fillRect(0, 0, W, GROUND_Y);
            ctx.fillStyle = '#6b4c3b';
            ctx.fillRect(0, GROUND_Y, W, H-GROUND_Y);
            
            // Blocks
            for (let b of blocks) {
                ctx.fillStyle = '#c9a87b';
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.fillStyle = '#a57c52';
                ctx.fillRect(b.x+4, b.y+4, b.w-8, b.h-8);
            }
            
            // Slingshot
            ctx.fillStyle = '#a0522d';
            ctx.fillRect(slingX-15, slingY-10, 30, 50);
            ctx.fillStyle = '#d2691e';
            ctx.beginPath();
            ctx.ellipse(slingX, slingY-5, 10, 16, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Bird
            if (bird.exists) {
                ctx.fillStyle = '#e34234';
                ctx.beginPath();
                ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(bird.x-3, bird.y-3, 3, 0, Math.PI*2);
                ctx.fill();
            } else if (canShoot) {
                // Bird on sling
                ctx.fillStyle = '#e34234';
                ctx.beginPath();
                ctx.arc(slingX, slingY, 12, 0, Math.PI*2);
                ctx.fill();
                // If dragging, show ghost
                if (dragActive) {
                    ctx.globalAlpha = 0.5;
                    ctx.beginPath();
                    ctx.arc(dragPoint.x, dragPoint.y, 10, 0, Math.PI*2);
                    ctx.fillStyle = '#ff8c69';
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    // Draw trajectory preview
                    let pullX = slingX - dragPoint.x;
                    let pullY = slingY - dragPoint.y;
                    let power = Math.min(Math.hypot(pullX, pullY), 100) / 100;
                    let vx = pullX * 11 * power;
                    let vy = pullY * 11 * power;
                    let px = slingX, py = slingY;
                    let pvx = vx, pvy = vy;
                    ctx.beginPath();
                    ctx.moveTo(px, py);
                    ctx.strokeStyle = 'yellow';
                    ctx.setLineDash([5,7]);
                    for (let step=0; step<30; step++) {
                        pvx *= 0.99;
                        pvy += GRAVITY;
                        px += pvx;
                        py += pvy;
                        if (py >= GROUND_Y) break;
                        ctx.lineTo(px, py);
                    }
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }
            
            // Score text
            ctx.font = 'bold 20px monospace';
            ctx.fillStyle = 'white';
            ctx.shadowBlur = 0;
            ctx.fillText('Score: '+score, 20, 50);
        }
        
        function gameLoop() {
            updateBird();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        function resetGame() {
            score = 0;
            updateScoreUI();
            initBlocks();
            bird.exists = false;
            canShoot = true;
            dragActive = false;
            dragPoint = { x: slingX, y: slingY };
            document.getElementById('status').innerText = '✅ Reset. Drag from slingshot backward.';
        }
        
        // Events
        canvas.addEventListener('mousedown', onDragStart);
        window.addEventListener('mousemove', onDragMove);
        window.addEventListener('mouseup', onDragEnd);
        canvas.addEventListener('touchstart', onDragStart, { passive: false });
        window.addEventListener('touchmove', onDragMove, { passive: false });
        window.addEventListener('touchend', onDragEnd);
        
        document.getElementById('reset').addEventListener('click', resetGame);
        
        initBlocks();
        updateScoreUI();
        gameLoop();
        canvas.style.cursor = 'crosshair';
        console.log('Game started - drag from the left side wooden slingshot');
    })();
</script>
</body>
</html>
