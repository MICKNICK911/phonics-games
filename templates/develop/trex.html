<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>T-Rex Runner - Chrome Dino Game</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
        }
        .game-container {
            background: #f7f7f0;
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 16px;
            box-shadow: 0 0 0 4px #5a5a5a, 0 0 0 8px #3a3a3a;
            background: #fefae0;
            cursor: pointer;
        }
        .info {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 18px;
            background: #e9e4cc;
            padding: 8px 20px;
            border-radius: 48px;
            color: #2c2c1c;
            font-weight: bold;
            gap: 20px;
            flex-wrap: wrap;
        }
        .score-board {
            background: #2c2c1c;
            color: #f0e6a0;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 1.3rem;
        }
        button {
            background: #5c4e2b;
            border: none;
            color: #f7f3d9;
            font-weight: bold;
            font-size: 1rem;
            padding: 5px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-family: monospace;
        }
        button:hover {
            background: #8b753f;
            transform: scale(0.97);
        }
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .status {
            font-size: 0.8rem;
            background: #cdc9a5;
            padding: 4px 12px;
            border-radius: 30px;
        }
        .touch-btn {
            background: #3e3a2b;
            border: none;
            color: #ffefb0;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 6px 18px;
            border-radius: 60px;
            box-shadow: 0 3px 0 #1e1a0e;
            cursor: pointer;
            transition: 0.03s linear;
            font-family: monospace;
            touch-action: manipulation;
        }
        .touch-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1e1a0e;
        }
        @media (max-width: 700px) {
            .touch-btn { font-size: 1.2rem; padding: 4px 14px; }
            .score-board { font-size: 1rem; }
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="300"></canvas>
        <div class="info">
            <div class="score-board">🏆 SCORE: <span id="scoreValue">0</span></div>
            <div class="controls">
                <span class="status">🦖 SPACE / ▲ JUMP</span>
                <button id="resetBtn">🔄 RESTART</button>
            </div>
        </div>
        <div style="display: flex; justify-content: center; gap: 20px; margin-top: 15px;">
            <button class="touch-btn" id="jumpBtn">▲ JUMP</button>
        </div>
    </div>
    <p style="color:#cdc99b; text-align:center; margin-top:12px; font-size:0.75rem;">
        ⬆️ Press SPACE, UP arrow, or tap JUMP button to make the dino jump. Avoid cacti!
    </p>
</div>

<script>
    (function(){
        // ---------- CANVAS ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 300;
        const W = 800, H = 300;
        
        // ---------- GAME STATE ----------
        let gameRunning = true;
        let score = 0;
        let frame = 0;          // for cactus spawn timing & score increment
        let speed = 5;          // initial cactus scroll speed
        let baseSpeed = 5;
        let speedIncreaseCounter = 0;
        
        // Dino
        const dino = {
            x: 70,
            y: H - 45,      // ground level (ground Y = H-10)
            width: 24,
            height: 28,
            vy: 0,
            gravity: 0.8,
            jumpPower: -10,
            grounded: true
        };
        const groundY = H - 10;   // ground line
        
        // Cacti array
        let cacti = [];
        const CACTUS_WIDTH = 18;
        const CACTUS_HEIGHT = 28;
        
        // Frame counters for spawn cooldown
        let spawnCooldown = 0;
        
        // ---------- UTILITIES ----------
        function updateScoreUI() {
            document.getElementById('scoreValue').innerText = Math.floor(score);
        }
        
        // Spawn a new cactus at the right edge
        function spawnCactus() {
            cacti.push({
                x: W,
                y: groundY - CACTUS_HEIGHT + 5, // sits on ground
                width: CACTUS_WIDTH,
                height: CACTUS_HEIGHT,
                passed: false   // for scoring when it passes dino
            });
        }
        
        // Reset game completely
        function resetGame() {
            gameRunning = true;
            score = 0;
            frame = 0;
            speed = baseSpeed;
            speedIncreaseCounter = 0;
            cacti = [];
            dino.y = groundY - dino.height;
            dino.vy = 0;
            dino.grounded = true;
            spawnCooldown = 0;
            updateScoreUI();
        }
        
        // ---------- UPDATE (physics, collisions, spawning) ----------
        function updateGame() {
            if (!gameRunning) return;
            
            // Increase score over time (each frame = ~0.1 point, but we'll add once per ~6 frames)
            frame++;
            if (frame % 6 === 0) {
                score += 1;
                updateScoreUI();
                // Increase difficulty: every 200 points, speed increases (max 14)
                if (Math.floor(score) > 0 && Math.floor(score) % 200 === 0 && speed < 14) {
                    speed += 0.5;
                    baseSpeed = speed;
                }
            }
            
            // ---- Dino jump physics ----
            dino.vy += dino.gravity;
            dino.y += dino.vy;
            if (dino.y >= groundY - dino.height) {
                dino.y = groundY - dino.height;
                dino.vy = 0;
                dino.grounded = true;
            } else {
                dino.grounded = false;
            }
            if (dino.y < 0) {
                dino.y = 0;
                if (dino.vy < 0) dino.vy = 0;
            }
            
            // ---- Cactus movement & collision ----
            for (let i = 0; i < cacti.length; i++) {
                const c = cacti[i];
                c.x -= speed;
                
                // Score when cactus passes dino (without collision)
                if (!c.passed && c.x + c.width < dino.x) {
                    c.passed = true;
                    // optional: extra scoring, but already handled by time, so not needed
                }
                
                // Collision detection (AABB)
                if (dino.x < c.x + c.width &&
                    dino.x + dino.width > c.x &&
                    dino.y < c.y + c.height &&
                    dino.y + dino.height > c.y) {
                    gameRunning = false;
                }
            }
            // Remove off-screen cacti
            cacti = cacti.filter(c => c.x + c.width > 0);
            
            // ---- Cactus spawning (random interval) ----
            if (spawnCooldown <= 0) {
                // random chance each frame, but with cooldown to avoid clusters
                if (Math.random() < 0.018) {  // ~1.8% per frame after cooldown
                    spawnCactus();
                    spawnCooldown = 45 + Math.random() * 40;   // frames until next spawn
                }
            } else {
                spawnCooldown--;
            }
        }
        
        // ---------- DRAW EVERYTHING (pixel-style) ----------
        function draw() {
            ctx.clearRect(0, 0, W, H);
            // Sky gradient
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#ece4c2');
            grad.addColorStop(1, '#e2d8b0');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
            
            // Ground
            ctx.fillStyle = '#8b6946';
            ctx.fillRect(0, groundY - 4, W, 6);
            ctx.fillStyle = '#c99e6f';
            ctx.fillRect(0, groundY, W, H - groundY);
            // Ground line details
            ctx.fillStyle = '#aa7a4a';
            for(let i=0;i<W+20;i+=25){
                ctx.fillRect(i, groundY-2, 12, 4);
            }
            
            // Draw cacti (simple green shape)
            for (let c of cacti) {
                ctx.fillStyle = '#2f6b2f';
                ctx.shadowBlur = 2;
                ctx.fillRect(c.x, c.y, c.width, c.height);
                ctx.fillStyle = '#4cae4c';
                ctx.fillRect(c.x+3, c.y-6, c.width-6, 8);
                // spikes
                ctx.fillStyle = '#1f471f';
                for(let s=0; s<3; s++){
                    ctx.fillRect(c.x+4 + s*4, c.y+6, 3, 8);
                }
            }
            
            // Draw Dino (T-Rex style)
            ctx.fillStyle = '#3e5a2b';
            ctx.fillRect(dino.x, dino.y, dino.width, dino.height);
            ctx.fillStyle = '#5e823b';
            ctx.fillRect(dino.x+4, dino.y-6, dino.width-8, 8);
            // eye
            ctx.fillStyle = 'white';
            ctx.fillRect(dino.x+16, dino.y+5, 5, 5);
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(dino.x+17, dino.y+6, 2, 3);
            // legs (if grounded)
            if (dino.grounded) {
                ctx.fillStyle = '#2f471f';
                ctx.fillRect(dino.x+4, dino.y+dino.height-6, 5, 8);
                ctx.fillRect(dino.x+14, dino.y+dino.height-6, 5, 8);
            } else {
                // jumping: legs tucked
                ctx.fillRect(dino.x+4, dino.y+dino.height-4, 5, 6);
                ctx.fillRect(dino.x+14, dino.y+dino.height-4, 5, 6);
            }
            // spikes on back
            ctx.fillStyle = '#2c4b1a';
            for (let i=0;i<3;i++) {
                ctx.fillRect(dino.x+6+i*5, dino.y-4, 4, 8);
            }
            
            // Score text on canvas
            ctx.font = "bold 20px 'Courier New'";
            ctx.fillStyle = '#3d2b1a';
            ctx.fillText(`⚡ ${Math.floor(score)}`, W-80, 40);
            
            // Game over message
            if (!gameRunning) {
                ctx.font = "bold 28px monospace";
                ctx.fillStyle = '#5a2e1a';
                ctx.shadowBlur = 0;
                ctx.fillText("GAME OVER", W/2-85, H/2-25);
                ctx.font = "16px monospace";
                ctx.fillStyle = '#3a2a1a';
                ctx.fillText("click RESTART", W/2-55, H/2+15);
            }
            
            ctx.shadowBlur = 0;
            // instruction hint
            if (gameRunning && dino.grounded && frame < 120) {
                ctx.font = "12px monospace";
                ctx.fillStyle = '#7a6a40';
                ctx.fillText("Press SPACE / ▲ or tap JUMP", W-200, H-15);
            }
        }
        
        // ---------- JUMP FUNCTION (called on key/button) ----------
        function jump() {
            if (!gameRunning) return;
            if (dino.grounded) {
                dino.vy = dino.jumpPower;
                dino.grounded = false;
            }
        }
        
        // ---------- EVENT HANDLERS (Keyboard + Touch button) ----------
        function handleKeyDown(e) {
            const key = e.key;
            if (key === 'ArrowUp' || key === ' ' || key === 'Space') {
                e.preventDefault();
                jump();
            }
            // optional: restart with R key
            if (key === 'r' || key === 'R') {
                e.preventDefault();
                resetGame();
            }
        }
        
        // for touch button
        function attachJumpButton() {
            const btn = document.getElementById('jumpBtn');
            if (!btn) return;
            const doJump = (e) => {
                e.preventDefault();
                jump();
            };
            btn.addEventListener('click', doJump);
            btn.addEventListener('touchstart', doJump, { passive: false });
        }
        
        // ---------- GAME LOOP ----------
        function gameLoop() {
            updateGame();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // ---------- INIT ----------
        function init() {
            resetGame();
            window.addEventListener('keydown', handleKeyDown);
            document.getElementById('resetBtn').addEventListener('click', () => resetGame());
            attachJumpButton();
            gameLoop();
        }
        
        init();
    })();
</script>
</body>
</html>
