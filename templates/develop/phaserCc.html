<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Star Collector – Yellow vs Red (Top‑Down)</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(145deg, #0a2f3a, #05161f);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Courier New', monospace;
            margin: 0;
            padding: 20px;
        }
        .game-container {
            background: #1b3b4b;
            border-radius: 32px;
            padding: 20px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: 0 0 0 4px #f9d56e, 0 0 0 8px #3b2a1f;
            cursor: none;
        }
        .info {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 18px;
            background: #071e26;
            padding: 12px 24px;
            border-radius: 48px;
            color: #f7ecc7;
            font-weight: bold;
            font-size: 1.2rem;
            gap: 20px;
            flex-wrap: wrap;
        }
        .score-board, .red-counter {
            background: #00000077;
            padding: 6px 20px;
            border-radius: 40px;
        }
        button {
            background: #f3b33d;
            border: none;
            color: #1e2a2f;
            font-weight: bold;
            font-size: 1rem;
            padding: 6px 20px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.08s linear;
            font-family: monospace;
        }
        button:hover {
            background: #ffcf6e;
            transform: scale(0.96);
        }
        .controls-tip {
            font-size: 0.7rem;
            background: #00000066;
            padding: 4px 14px;
            border-radius: 26px;
        }
        .touch-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .ctrl-btn {
            background: #2c3e2f;
            border: none;
            color: #f9e0a0;
            font-size: 1.8rem;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 60px;
            box-shadow: 0 5px 0 #1a2a1a;
            cursor: pointer;
            transition: 0.05s linear;
            font-family: monospace;
            touch-action: manipulation;
            min-width: 80px;
        }
        .ctrl-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #1a2a1a;
        }
        @media (max-width: 700px) {
            .ctrl-btn { font-size: 1.2rem; padding: 8px 15px; min-width: 60px; }
            .info { font-size: 0.9rem; justify-content: center; }
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <canvas id="gameCanvas" width="900" height="500"></canvas>
        <div class="info">
            <div class="score-board">⭐ YELLOW: <span id="yellowScore">0</span></div>
            <div class="red-counter">💀 RED HITS: <span id="redHits">0</span> / 3</div>
            <div class="controls-tip">🕹️ WASD / arrows + buttons below</div>
            <button id="resetGameBtn">🔄 RESTART</button>
        </div>
        <div class="touch-controls">
            <button class="ctrl-btn" id="btnUp">▲ UP</button>
            <button class="ctrl-btn" id="btnLeft">◀ LEFT</button>
            <button class="ctrl-btn" id="btnDown">▼ DOWN</button>
            <button class="ctrl-btn" id="btnRight">RIGHT ▶</button>
        </div>
    </div>
    <p style="color:#c7e9ff; text-align:center; margin-top:12px; font-size:0.8rem;">
        🧭 Move freely. Collect YELLOW stars (+1). Avoid RED stars (-1, and 3 reds = GAME OVER). Navigate around grey platforms.
    </p>
</div>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 900;
        canvas.height = 500;
        const W = 900, H = 500;
        
        // ---------- GAME STATE ----------
        let yellowStars = [];    // each {x, y, radius, collected}
        let redStars = [];
        let obstacles = [];      // platforms (rectangles)
        let player = {
            x: W/2, y: H/2,
            radius: 14,
            speed: 4
        };
        
        let yellowScore = 0;
        let redHits = 0;
        let totalYellowCount = 0;
        let gameOver = false;
        let gameWin = false;
        
        // Input handling (keyboard + buttons)
        const input = { up: false, down: false, left: false, right: false };
        
        // ---------- LEVEL DESIGN ----------
        function buildLevel() {
            // Obstacles (platforms) – player cannot pass through
            obstacles = [
                { x: 200, y: 150, w: 80, h: 30 },
                { x: 400, y: 300, w: 100, h: 30 },
                { x: 600, y: 100, w: 70, h: 30 },
                { x: 150, y: 400, w: 90, h: 30 },
                { x: 700, y: 380, w: 80, h: 30 },
                { x: 500, y: 450, w: 100, h: 30 },
                { x: 50, y: 220, w: 60, h: 30 },
                { x: 780, y: 250, w: 60, h: 30 },
                { x: 320, y: 80, w: 70, h: 30 }
            ];
            
            // Yellow stars (10-15 scattered, avoid obstacles)
            yellowStars = [];
            const yellowCount = 12;
            for (let i = 0; i < yellowCount; i++) {
                let placed = false;
                let attempts = 0;
                while (!placed && attempts < 100) {
                    const x = 30 + Math.random() * (W - 60);
                    const y = 30 + Math.random() * (H - 60);
                    // check collision with obstacles
                    let collides = false;
                    for (let obs of obstacles) {
                        if (x > obs.x - 20 && x < obs.x + obs.w + 20 &&
                            y > obs.y - 20 && y < obs.y + obs.h + 20) {
                            collides = true;
                            break;
                        }
                    }
                    // also avoid spawning on player start
                    if (!collides && Math.hypot(x - player.x, y - player.y) > 40) {
                        yellowStars.push({ x, y, radius: 10, collected: false });
                        placed = true;
                    }
                    attempts++;
                }
                if (!placed) yellowStars.push({ x: 100 + i*60, y: 100, radius: 10, collected: false });
            }
            
            // Red stars (5-7 scattered)
            redStars = [];
            const redCount = 7;
            for (let i = 0; i < redCount; i++) {
                let placed = false;
                let attempts = 0;
                while (!placed && attempts < 100) {
                    const x = 30 + Math.random() * (W - 60);
                    const y = 30 + Math.random() * (H - 60);
                    let collides = false;
                    for (let obs of obstacles) {
                        if (x > obs.x - 20 && x < obs.x + obs.w + 20 &&
                            y > obs.y - 20 && y < obs.y + obs.h + 20) {
                            collides = true;
                            break;
                        }
                    }
                    if (!collides && Math.hypot(x - player.x, y - player.y) > 40) {
                        redStars.push({ x, y, radius: 10, collected: false });
                        placed = true;
                    }
                    attempts++;
                }
                if (!placed) redStars.push({ x: 300 + i*50, y: 400, radius: 10, collected: false });
            }
            
            totalYellowCount = yellowStars.length;
        }
        
        // ---------- COLLISION & MOVEMENT ----------
        function collidesWithObstacles(newX, newY, radius) {
            const testRect = { x: newX - radius, y: newY - radius, w: radius*2, h: radius*2 };
            for (let obs of obstacles) {
                if (testRect.x < obs.x + obs.w &&
                    testRect.x + testRect.w > obs.x &&
                    testRect.y < obs.y + obs.h &&
                    testRect.y + testRect.h > obs.y) {
                    return true;
                }
            }
            // also keep inside canvas
            if (newX - radius < 0 || newX + radius > W || newY - radius < 0 || newY + radius > H) {
                return true;
            }
            return false;
        }
        
        function movePlayer() {
            if (gameOver || gameWin) return;
            let moveX = 0, moveY = 0;
            if (input.left) moveX = -player.speed;
            if (input.right) moveX = player.speed;
            if (input.up) moveY = -player.speed;
            if (input.down) moveY = player.speed;
            if (moveX === 0 && moveY === 0) return;
            
            // Normalize diagonal movement
            if (moveX !== 0 && moveY !== 0) {
                moveX *= 0.707;
                moveY *= 0.707;
            }
            
            let newX = player.x + moveX;
            let newY = player.y + moveY;
            
            if (!collidesWithObstacles(newX, player.y, player.radius)) {
                player.x = newX;
            }
            if (!collidesWithObstacles(player.x, newY, player.radius)) {
                player.y = newY;
            }
        }
        
        function collectStars() {
            // Yellow stars collection
            for (let i = 0; i < yellowStars.length; i++) {
                const s = yellowStars[i];
                if (s.collected) continue;
                const dx = player.x - s.x;
                const dy = player.y - s.y;
                if (Math.hypot(dx, dy) < player.radius + s.radius) {
                    s.collected = true;
                    yellowScore++;
                    document.getElementById('yellowScore').innerText = yellowScore;
                }
            }
            
            // Red stars collection (deduct score and count red hits)
            for (let i = 0; i < redStars.length; i++) {
                const s = redStars[i];
                if (s.collected) continue;
                const dx = player.x - s.x;
                const dy = player.y - s.y;
                if (Math.hypot(dx, dy) < player.radius + s.radius) {
                    s.collected = true;
                    redHits++;
                    document.getElementById('redHits').innerText = redHits;
                    // score deduction: yellowScore decreases by 1 (can't go below 0)
                    yellowScore = Math.max(0, yellowScore - 1);
                    document.getElementById('yellowScore').innerText = yellowScore;
                    
                    if (redHits >= 3) {
                        gameOver = true;
                    }
                }
            }
            
            // Check win condition: all yellow stars collected
            const allYellowCollected = yellowStars.every(s => s.collected === true);
            if (allYellowCollected && !gameOver && yellowStars.length > 0) {
                gameWin = true;
            }
        }
        
        // ---------- DRAW EVERYTHING ----------
        function draw() {
            ctx.clearRect(0, 0, W, H);
            // Background
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#1e476b');
            grad.addColorStop(1, '#3c8da8');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
            
            // Draw obstacles (grey platforms)
            ctx.fillStyle = '#6b6b6b';
            ctx.shadowBlur = 4;
            for (let obs of obstacles) {
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                ctx.fillStyle = '#8a8a8a';
                ctx.fillRect(obs.x+3, obs.y-3, obs.w-6, 6);
                ctx.fillStyle = '#6b6b6b';
            }
            
            // Draw yellow stars
            for (let s of yellowStars) {
                if (s.collected) continue;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI*2);
                ctx.fillStyle = '#FFD966';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius-3, 0, Math.PI*2);
                ctx.fillStyle = '#FFBF00';
                ctx.fill();
                ctx.fillStyle = '#FFE484';
                for(let a=0;a<5;a++){
                    let angle = a * (Math.PI*2/5);
                    let x2 = s.x + Math.cos(angle)* (s.radius-2);
                    let y2 = s.y + Math.sin(angle)* (s.radius-2);
                    ctx.beginPath();
                    ctx.arc(x2, y2, 2, 0, Math.PI*2);
                    ctx.fill();
                }
            }
            
            // Draw red stars
            for (let s of redStars) {
                if (s.collected) continue;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI*2);
                ctx.fillStyle = '#E34234';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius-3, 0, Math.PI*2);
                ctx.fillStyle = '#B22222';
                ctx.fill();
                ctx.fillStyle = '#FFAAAA';
                for(let a=0;a<5;a++){
                    let angle = a * (Math.PI*2/5);
                    let x2 = s.x + Math.cos(angle)* (s.radius-2);
                    let y2 = s.y + Math.sin(angle)* (s.radius-2);
                    ctx.beginPath();
                    ctx.arc(x2, y2, 2, 0, Math.PI*2);
                    ctx.fill();
                }
            }
            
            // Draw player (circle)
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
            ctx.fillStyle = '#2c7fb8';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(player.x-4, player.y-4, 3, 0, Math.PI*2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.fillStyle = '#001122';
            ctx.beginPath();
            ctx.arc(player.x-5, player.y-5, 1.5, 0, Math.PI*2);
            ctx.fill();
            // smile
            ctx.beginPath();
            ctx.arc(player.x, player.y+3, 5, 0.05, Math.PI - 0.05);
            ctx.strokeStyle = '#2b1e0e';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.shadowBlur = 0;
            
            // Game messages
            if (gameOver) {
                ctx.font = "bold 34px monospace";
                ctx.fillStyle = "#FFAAAA";
                ctx.shadowBlur = 3;
                ctx.fillText("💀 GAME OVER 💀", W/2-160, H/2-30);
                ctx.font = "18px monospace";
                ctx.fillStyle = "#FFE8C0";
                ctx.fillText("Press RESTART to try again", W/2-140, H/2+30);
            } else if (gameWin) {
                ctx.font = "bold 34px monospace";
                ctx.fillStyle = "#FFEAA0";
                ctx.fillText("★ YOU WIN! ★", W/2-120, H/2-30);
                ctx.font = "18px monospace";
                ctx.fillText("All yellow stars collected!", W/2-140, H/2+30);
            }
            
            // remaining yellow count
            const remainingYellow = yellowStars.filter(s => !s.collected).length;
            ctx.font = "bold 18px monospace";
            ctx.fillStyle = "#FFEFC0";
            ctx.fillText(`⭐ Left: ${remainingYellow}`, W-100, 30);
        }
        
        // ---------- RESET GAME ----------
        function resetGame() {
            buildLevel();
            yellowScore = 0;
            redHits = 0;
            gameOver = false;
            gameWin = false;
            player.x = W/2;
            player.y = H/2;
            document.getElementById('yellowScore').innerText = "0";
            document.getElementById('redHits').innerText = "0";
            // ensure no input remains
            input.up = false; input.down = false; input.left = false; input.right = false;
        }
        
        // ---------- UPDATE LOOP ----------
        function update() {
            if (!gameOver && !gameWin) {
                movePlayer();
                collectStars();
            }
        }
        
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // ---------- INPUT HANDLING (Keyboard + Buttons) ----------
        function handleKeyDown(e) {
            const key = e.key;
            if (key === 'ArrowUp' || key === 'w' || key === 'W') { e.preventDefault(); input.up = true; }
            if (key === 'ArrowDown' || key === 's' || key === 'S') { e.preventDefault(); input.down = true; }
            if (key === 'ArrowLeft' || key === 'a' || key === 'A') { e.preventDefault(); input.left = true; }
            if (key === 'ArrowRight' || key === 'd' || key === 'D') { e.preventDefault(); input.right = true; }
        }
        
        function handleKeyUp(e) {
            const key = e.key;
            if (key === 'ArrowUp' || key === 'w' || key === 'W') { input.up = false; }
            if (key === 'ArrowDown' || key === 's' || key === 'S') { input.down = false; }
            if (key === 'ArrowLeft' || key === 'a' || key === 'A') { input.left = false; }
            if (key === 'ArrowRight' || key === 'd' || key === 'D') { input.right = false; }
        }
        
        function attachButton(btnId, direction) {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            const activate = (e) => { e.preventDefault(); input[direction] = true; };
            const deactivate = (e) => { e.preventDefault(); input[direction] = false; };
            btn.addEventListener('mousedown', activate);
            btn.addEventListener('mouseup', deactivate);
            btn.addEventListener('mouseleave', deactivate);
            btn.addEventListener('touchstart', activate, { passive: false });
            btn.addEventListener('touchend', deactivate);
            btn.addEventListener('touchcancel', deactivate);
        }
        
        // ---------- INIT ----------
        function init() {
            buildLevel();
            resetGame();
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);
            document.getElementById('resetGameBtn').addEventListener('click', () => resetGame());
            attachButton('btnUp', 'up');
            attachButton('btnDown', 'down');
            attachButton('btnLeft', 'left');
            attachButton('btnRight', 'right');
            gameLoop();
        }
        
        init();
    })();
</script>
</body>
</html>
