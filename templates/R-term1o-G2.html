:root{--bad:#c62f35;--bg:#d9ecff;--surface:#fff;--ink:#14224d;--muted:#51618f;--accent:#ff5d8f;--good:#128a52;--gold:#ffc83d;--overlay:rgba(14,21,51,.72)}
.dark-mode{--bad:#ff8a8f;--bg:#0e1533;--surface:#1a2452;--ink:#eaf0ff;--muted:#9fb0e6;--good:#4ade80;--overlay:rgba(3,6,20,.8)}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
body{overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Andika","Century Gothic","Avenir Next","Avenir","Trebuchet MS","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none;transition:background-color .3s,color .3s;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.container{width:100vw;height:300vh;height:300dvh;transition:transform .5s ease-in-out}
.screen{position:relative;overflow:hidden;width:100vw;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
.tools{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:50;display:flex;gap:8px}
.round{width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);background:var(--surface);box-shadow:0 3px 0 var(--ink);font-size:18px}
.round:active{transform:translateY(3px);box-shadow:none}
.big{padding:16px 40px;border:2px solid var(--ink);border-radius:16px;background:var(--gold);color:#14224d;font-size:22px;font-weight:700;box-shadow:0 6px 0 var(--ink);margin-top:10px}
.big:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
/* start */
.hero{display:flex;gap:8px;margin-bottom:18px}
.key{display:grid;place-items:center;width:clamp(44px,13vw,60px);aspect-ratio:1;border:2px solid var(--ink);border-radius:14px;background:var(--surface);box-shadow:0 6px 0 var(--ink);font-size:clamp(26px,8vw,36px);font-weight:700}
.key:nth-child(odd){transform:rotate(-5deg)}.key:nth-child(even){transform:rotate(4deg) translateY(4px)}
.key:nth-child(3){background:var(--gold);color:#14224d}
h1{font-size:clamp(32px,9vw,48px);line-height:1.1}
.date{margin-top:8px;color:var(--muted);font-size:18px}
.tag{margin-top:4px;font-size:22px;font-weight:700}
.how{margin:12px 0 14px;max-width:300px;color:var(--muted);line-height:1.4}
#screen1{justify-content:flex-start;overflow-y:auto}#screen1>:first-child{margin-top:auto}#screen1>:last-child{margin-bottom:auto}
.who-form{display:flex;flex-direction:column;align-items:center;width:100%;max-width:340px}
.fields{display:flex;gap:10px;width:100%;text-align:left}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}.field.grade{flex:0 0 116px}
.field label{font-size:14px;color:var(--muted)}
.field input,.field select{width:100%;min-width:0;padding:11px 10px;border:2px solid var(--ink);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.field [aria-invalid=true]{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad)}
.error{margin-top:10px;color:var(--bad);font-size:15px;font-weight:700;line-height:1.35}
/* game */
.game{display:flex;flex-direction:column;width:100%;max-width:640px;height:100%;padding-top:calc(env(safe-area-inset-top,0px) - 4px);padding-bottom:env(safe-area-inset-bottom,0px);text-align:left}
.hud{display:flex;align-items:center;gap:14px;min-height:42px;padding-right:104px}
.hearts{display:flex;gap:2px;font-size:28px;line-height:1;color:var(--accent)}
.hearts .lost{color:var(--muted);opacity:.35}
.hearts .hit{animation:shake .35s}
.score{display:flex;align-items:center;gap:8px;font-size:24px}
.combo{padding:3px 10px;border-radius:99px;background:var(--gold);color:#14224d;font-size:14px;font-weight:700;animation:land .25s}
.progress{margin:10px 0 4px}.progress .row{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:26px}
.progress span{font-size:14px;color:var(--muted)}
.bar{height:10px;margin-top:4px;border:2px solid var(--ink);border-radius:99px;background:var(--surface);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s}
#prompt{text-align:center;margin:10px 0 6px;font-size:16px;font-weight:700;color:var(--muted)}
.tiles{flex:1;min-height:0;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:10px;overflow-y:auto;padding:6px 4px 12px}
.tiles.enter{animation:enter .3s}
.tile{position:relative;flex:0 0 clamp(82px,26vw,120px);min-height:48px;padding:7px 4px;border:2px solid var(--ink);border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:0 5px 0 var(--ink);font-size:clamp(17px,4.6vw,22px);font-weight:700;white-space:nowrap;min-width:0;transition:transform .1s,box-shadow .1s,background-color .15s}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.tile.sel{background:var(--gold);color:#14224d;transform:translateY(-3px);box-shadow:0 8px 0 var(--ink)}
.tile.done{background:hsl(var(--h) 80% 88%);color:hsl(var(--h) 60% 22%);border-color:hsl(var(--h) 60% 35%);box-shadow:0 2px 0 hsl(var(--h) 60% 35%);transform:translateY(3px);pointer-events:none;animation:land .3s}
.tile.shake{animation:shake .35s}
.pop{position:absolute;left:50%;top:20%;color:var(--good);font-size:18px;pointer-events:none;animation:rise .7s forwards}
.dock{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:12px 4px 16px;border-top:2px dashed var(--muted)}
.cat{flex:0 0 clamp(86px,27vw,150px);min-width:0;line-height:1.15;padding:12px 6px;border:2px solid var(--ink);border-radius:14px;background:hsl(var(--h) 70% 40%);color:#fff;font-size:clamp(13px,3.8vw,17px);font-weight:700;box-shadow:0 5px 0 var(--ink)}
.cat:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.toast{position:absolute;top:calc(env(safe-area-inset-top,0px) + 64px);left:50%;padding:8px 18px;border:2px solid var(--ink);border-radius:99px;background:var(--surface);font-weight:700;opacity:0;pointer-events:none;max-width:calc(100vw - 32px);text-align:center;z-index:4}
.toast.show{animation:toast 1.1s}
.over{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:var(--overlay)}
.card{max-width:320px;padding:28px 24px;border:2px solid var(--ink);border-radius:22px;background:var(--surface);box-shadow:0 8px 0 var(--ink);text-align:center}
.card h2{font-size:26px}.card p{margin:10px 0 8px;color:var(--muted);line-height:1.5}
/* win */
#screen3 img{width:clamp(84px,18dvh,160px);height:clamp(84px,18dvh,160px);object-fit:contain;margin-bottom:6px}.who{margin-top:6px;line-height:1.4}.who b{font-size:22px}.who span{color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 6px;width:100%;max-width:340px}
.stats div{padding:8px;border:2px solid var(--ink);border-radius:14px;background:var(--surface)}
.stats dt{font-size:13px;color:var(--muted)}.stats dd{font-size:24px;font-weight:700}
#confetti{position:absolute;inset:0;pointer-events:none}
#confetti i{position:absolute;top:-16px;left:var(--x);width:9px;height:14px;background:hsl(var(--c) 85% 55%);animation:fall var(--d) var(--dl) ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(var(--r))}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes land{50%{transform:translateY(3px) scale(1.08)}}
@keyframes rise{to{opacity:0;transform:translate(-50%,-34px)}}
@keyframes enter{from{opacity:0;transform:translateY(16px)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}15%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<div class="tools">

  <section class="screen" id="screen2">
    <div class="game">

      <div id="tiles" class="tiles"></div>
      <div id="dock" class="dock"></div>

    <div id="toast" class="toast" role="status"></div>
    <div id="over" class="over" hidden>

    </div>
  </section>

  <section class="screen" id="screen3">
    <div id="confetti"></div>
    <img id="finishImg" alt="" onerror="this.hidden=true">

    <p class="who"><b id="wName"></b><br><span id="wMeta"></span></p>

      <div><dt>Best streak</dt><dd id="sStreak">0</dd></div>
    </dl>
    <button id="finish-continue-button" class="big" hidden>Continue</button>
    <button id="play-again-button" class="big">Play again</button>
  </section>
</div>

const LIVES = 1;                       // hearts per run
const FINISH_IMAGE = '../assets/images/chis250.png';   // picture on the finish screen
const HUES = [220, 340, 155, 25, 275, 190, 45, 0];
let learn = true;                      // true: out of hearts = retry same level; false: restart whole run

let order = [], gameLevel = 0, lives = LIVES, score = 0, combo = 0, bestCombo = 0;
let right = 0, wrong = 0, done = 0, total = 0, startTime = 0, locked = true, selected = null, snap = { score: 0, right: 0 };

const $ = s => document.querySelector(s);
const slider = $('#slider');
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const prettyName = n => n.replace(/^\d+[a-z]?\.\s*/i, '');
const mult = () => Math.min(1 + Math.floor(combo / 3), 5);

/* ---------- theme + slider ---------- */
function toggleTheme() {
  document.body.classList.toggle('dark-mode');
  try { localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light'); } catch (e) {}
}
let savedTheme = null; try { savedTheme = localStorage.getItem('theme'); } catch (e) {}
if (savedTheme ? savedTheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) document.body.classList.add('dark-mode');

let currentPosition = 0;
function navigate(p) { currentPosition = p; slider.style.transform = `translateY(-${p * 100}dvh)`; }
function instantRestart() {
  slider.style.transition = 'none'; navigate(0); void slider.offsetHeight; slider.style.transition = '';
}

/* ---------- sound (Web Audio, no files needed) ---------- */
const Sound = (() => {
  let ctx, muted = false;
  try { muted = localStorage.getItem('muted') === '1'; } catch (e) {}
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  function tone(freq, at, dur, type, vol, slideTo) {
    if (!ctx || muted) return;
    const t = ctx.currentTime + at, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  const run = (notes, gap, type, vol, len) => notes.forEach((m, i) => tone(hz(m), i * gap, len, type, vol));
  const scale = [60, 62, 64, 67, 69, 72, 74, 76, 79];
  return {
    init() {
      if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) ctx = new AC(); }
      if (ctx && ctx.state === 'suspended') ctx.resume();
    },
    get muted() { return muted; },
    toggle() { muted = !muted; try { localStorage.setItem('muted', muted ? '1' : '0'); } catch (e) {} this.init(); return muted; },
    select() { tone(hz(72), 0, 0.07, 'triangle', 0.12); },
    correct(c) { const m = scale[Math.min(c - 1, scale.length - 1)]; tone(hz(m), 0, 0.2, 'triangle', 0.25); tone(hz(m + 12), 0, 0.12, 'sine', 0.08); },
    wrong() { tone(190, 0, 0.32, 'sawtooth', 0.16, 80); },
    levelUp() { run([72, 76, 79, 84], 0.08, 'square', 0.1, 0.16); },
    win() { run([72, 76, 79, 84, 79, 84, 88, 91], 0.12, 'square', 0.1, 0.22); },
    lose() { run([67, 64, 60, 55], 0.16, 'triangle', 0.2, 0.3); }
  };
})();
const soundBtn = $('#soundToggle');
const syncSound = () => { soundBtn.textContent = Sound.muted ? '🔇' : '🔊'; };
soundBtn.onclick = () => { Sound.toggle(); syncSound(); Sound.select(); };
syncSound();

/* ---------- game ---------- */
function newGame() {
  order = shuffle(Object.keys(dictionaryY));     // levels in a new random order every run
  gameLevel = 0; lives = LIVES; score = 0; combo = 0; bestCombo = 0; right = 0; wrong = 0;
  startTime = Date.now();
}

function renderHUD() {
  $('#hearts').innerHTML = Array.from({ length: LIVES }, (_, i) => `<span class="${i < lives ? '' : 'lost'}">♥</span>`).join('');
  $('#score').textContent = score;
  const c = $('#combo'); c.hidden = combo < 3;
  if (combo >= 3) c.textContent = `${combo} in a row ×${mult()}`;
  $('#levelLabel').textContent = `Level ${gameLevel + 1} of ${order.length}`;
  $('#barFill').style.width = ((gameLevel + (total ? done / total : 0)) / order.length * 100) + '%';
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg;
  t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
}

// Shrink any word or label that is too wide for its box, so nothing bleeds on small screens or with a fallback font.
function fit(el) {
  el.style.fontSize = '';
  let s = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > el.clientWidth + 1 && s > 11) { s -= 0.5; el.style.fontSize = s + 'px'; }
}
function fitAll() { document.querySelectorAll('#tiles .tile, #dock .cat').forEach(fit); }
addEventListener('resize', fitAll);
addEventListener('orientationchange', () => setTimeout(fitAll, 200));
if (document.fonts) { document.fonts.ready.then(fitAll); document.fonts.addEventListener('loadingdone', fitAll); }

function loadLevel() {
  const name = order[gameLevel], cats = dictionaryY[name];
  snap = { score, right }; done = 0; locked = false; selected = null;
  $('#prompt').textContent = prettyName(name);
  const words = shuffle(Object.values(cats).flat());
  total = words.length;
  const tiles = $('#tiles'); tiles.innerHTML = '';
  words.forEach(w => {
    const b = document.createElement('button');
    b.className = 'tile'; b.textContent = w; b.onclick = () => pick(b);
    tiles.appendChild(b);
  });
  tiles.scrollTop = 0; tiles.classList.remove('enter'); void tiles.offsetWidth; tiles.classList.add('enter');
  const dock = $('#dock'); dock.innerHTML = '';
  shuffle(Object.keys(cats).map((c, i) => [c, i])).forEach(([c, i]) => {
    const b = document.createElement('button');
    b.className = 'cat'; b.textContent = c; b.style.setProperty('--h', HUES[i % HUES.length]);
    b.onclick = () => answer(c, b);
    dock.appendChild(b);
  });
  renderHUD(); fitAll();
}

function pick(tile) {
  if (locked || tile.classList.contains('done')) return;
  if (selected) selected.classList.remove('sel');
  tile.classList.add('sel'); selected = tile; Sound.select();
}

function answer(cat, btn) {
  if (locked) return;
  if (!selected) { toast('Pick a word first'); return; }
  const tile = selected;
  if (dictionaryY[order[gameLevel]][cat].includes(tile.textContent)) {
    combo++; bestCombo = Math.max(bestCombo, combo); right++; done++;
    const pts = 10 * mult(); score += pts;
    tile.classList.remove('sel'); tile.style.setProperty('--h', btn.style.getPropertyValue('--h')); tile.classList.add('done');
    const pop = document.createElement('b'); pop.className = 'pop'; pop.textContent = '+' + pts; tile.appendChild(pop);
    setTimeout(() => pop.remove(), 700);
    selected = null; Sound.correct(combo); renderHUD();
    if (done === total) levelDone();
  } else {
    combo = 0; wrong++; lives--; selected = null;
    tile.classList.remove('sel'); tile.classList.remove('shake'); void tile.offsetWidth; tile.classList.add('shake');
    Sound.wrong(); if (navigator.vibrate) navigator.vibrate(120);
    renderHUD(); const h = $('#hearts').children[lives]; if (h) h.classList.add('hit');
    if (lives <= 0) gameOver();
  }
}

// Level finished: bonus, chime, and straight into the next level (no continue screen).
function levelDone() {
  locked = true; score += 50; gameLevel++;
  Sound.levelUp();
  if (gameLevel >= order.length) { renderHUD(); setTimeout(showWin, 500); return; }
  let msg = `Level ${gameLevel} clear! +50`;
  if (gameLevel % 3 === 0 && lives < LIVES) { lives++; msg += ' · +1 heart'; }
  toast(msg); renderHUD();
  setTimeout(loadLevel, 450);
}

function gameOver() {
  locked = true; Sound.lose();
  $('#overText').textContent = learn
    ? `You scored ${score}. Try this level again.`
    : `You reached level ${gameLevel + 1} of ${order.length} with ${score} points. Start a new run.`;
  $('#retry').textContent = learn ? 'Try again' : 'Start over';
  setTimeout(() => { $('#over').hidden = false; }, 350);
}

$('#retry').onclick = () => {
  $('#over').hidden = true;
  if (learn) { score = snap.score; right = snap.right; combo = 0; lives = LIVES; } else newGame();
  Sound.select(); loadLevel();
};

function confetti() {
  const box = $('#confetti'); box.innerHTML = '';
  for (let i = 0; i < 48; i++) {
    const s = document.createElement('i');
    s.style.cssText = `--x:${Math.random() * 100}%;--d:${1.8 + Math.random() * 1.6}s;--dl:${Math.random() * 0.6}s;--c:${Math.floor(Math.random() * 360)};--r:${Math.floor(Math.random() * 720)}deg`;
    box.appendChild(s);
  }
}

function showWin() {
  const t = Date.now() - startTime;
  $('#sScore').textContent = score;
  $('#sTime').textContent = `${Math.floor(t / 60000)}m ${String(Math.floor((t % 60000) / 1000)).padStart(2, '0')}s`;
  $('#sAcc').textContent = Math.round(right / Math.max(1, right + wrong) * 100) + '%';
  $('#sStreak').textContent = bestCombo;
  $('#wName').textContent = learner.name; $('#wMeta').textContent = `Grade ${learner.grade} · ${fmtDate(new Date())}`;
  confetti(); Sound.win(); navigate(2);
}

/* ---------- live date (read from the device clock, never hardcoded) ---------- */
const fmtDate = d => `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear()}`;
const showDate = () => { $('#todayDate').textContent = fmtDate(new Date()); };
showDate(); setInterval(showDate, 30000); document.addEventListener('visibilitychange', showDate);
$('#finishImg').src = FINISH_IMAGE;

/* ---------- learner details ---------- */
let learner = { name: '', grade: '' };
const nameEl = $('#learnerName'), gradeEl = $('#learnerGrade'), errEl = $('#formError');
const cleanName = v => v.trim().replace(/\s+/g, ' ').replace(/(^|[\s'’-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
function validateForm() {
  const name = cleanName(nameEl.value), grade = gradeEl.value, problems = [];
  const letters = (name.match(/\p{L}/gu) || []).length;
  const nameOk = name.length <= 40 && letters >= 2 && /^\p{L}[\p{L}'’ .-]*$/u.test(name);
  const gradeOk = /^(?:[1-9]|1[0-2])$/.test(grade);
  nameEl.setAttribute('aria-invalid', String(!nameOk)); gradeEl.setAttribute('aria-invalid', String(!gradeOk));
  if (!nameOk) problems.push('Enter your name using letters only.');
  if (!gradeOk) problems.push('Choose your grade.');
  errEl.hidden = !problems.length; errEl.textContent = problems.join(' ');
  if (problems.length) { (nameOk ? gradeEl : nameEl).focus(); return null; }
  return { name, grade };
}
['input', 'change'].forEach(ev => [nameEl, gradeEl].forEach(el => el.addEventListener(ev, () => { el.removeAttribute('aria-invalid'); errEl.hidden = true; })));
$('#who-form').addEventListener('submit', e => {
  e.preventDefault();
  const l = validateForm(); if (!l) return;
  learner = l; nameEl.value = l.name;
  Sound.init(); newGame(); $('#over').hidden = true; loadLevel(); Sound.select(); navigate(1);
});
$('#finish-continue-button').addEventListener('click', () => window.open('P-form-sent.html', '_blank'));
$('#play-again-button').addEventListener('click', instantRestart);
</script>
