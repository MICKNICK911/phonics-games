<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Math Tug of War · Two‑Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0b1120; --surface: #111b2e; --blue: #3b82f6; --blue-light: #60a5fa;
      --red: #ef4444; --red-light: #f87171; --text: #f1f5f9; --text-dim: #94a3b8;
      --border: #1e293b; --radius: 16px; --shadow: 0 10px 30px rgba(0,0,0,0.5);
      --transition: 0.4s cubic-bezier(0.2, 0.9, 0.4, 1);
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: clamp(8px, 2vh, 20px); overflow: hidden;
      user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .game-layout {
      display: flex; width: 100%; height: 100%;
      gap: clamp(12px, 2vw, 24px); max-width: 1300px;
    }
    .player-panel {
      flex: 1; background: var(--surface); border-radius: var(--radius);
      border: 2px solid var(--border); padding: clamp(12px, 2vw, 24px);
      display: flex; flex-direction: column; align-items: center;
      gap: clamp(10px, 2vh, 18px); box-shadow: var(--shadow);
      transition: border-color 0.2s; min-width: 0;
    }
    .player-panel.p1 { border-top: 4px solid var(--blue); }
    .player-panel.p2 { border-top: 4px solid var(--red); }
    .player-name {
      font-weight: 700; font-size: clamp(1rem, 2vw, 1.4rem); letter-spacing: 1px;
      background: rgba(255,255,255,0.05); padding: 0.4rem 1.2rem; border-radius: 2rem;
    }
    .p1 .player-name { color: var(--blue-light); }
    .p2 .player-name { color: var(--red-light); }
    .round-badge {
      font-size: 0.9rem; font-weight: 600; color: var(--text-dim);
      background: rgba(255,255,255,0.05); padding: 0.3rem 1rem; border-radius: 1rem;
    }
    .question {
      font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 700;
      font-family: 'Fira Code', monospace; background: rgba(0,0,0,0.3);
      padding: 0.6rem 1.8rem; border-radius: 2rem; margin: 0.2rem 0; white-space: nowrap;
    }
    .answer-box {
      background: #0f172a; border: 2px solid #334155; border-radius: 1rem;
      padding: 0.8rem 1.5rem; font-size: clamp(1.6rem, 3.5vw, 2.2rem);
      font-family: 'Fira Code', monospace; font-weight: 700; text-align: center;
      min-width: 160px; transition: border-color 0.2s, background 0.2s;
    }
    .answer-box.placeholder { color: #475569; font-weight: 400; font-size: 1rem; }
    .number-pad {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      width: 100%; max-width: 240px;
    }
    .num-btn {
      aspect-ratio: 1.2; font-size: 1.4rem; font-weight: 700;
      background: #1e293b; border: 2px solid #334155; border-radius: 0.8rem;
      color: white; cursor: pointer; transition: all 0.1s;
      display: flex; align-items: center; justify-content: center;
    }
    .num-btn:active { transform: scale(0.92); background: #0f172a; }
    .num-btn:disabled { opacity: 0.4; pointer-events: none; }
    .action-row {
      display: flex; gap: 10px; width: 100%; max-width: 240px;
    }
    .action-btn {
      flex: 1; padding: 0.8rem; font-weight: 700; font-size: 1rem;
      border: none; border-radius: 2rem; cursor: pointer; text-transform: uppercase;
      letter-spacing: 0.5px; transition: 0.15s; display: flex;
      align-items: center; justify-content: center; gap: 0.3rem;
    }
    .undo-btn { background: #f59e0b; color: #0f172a; }
    .undo-btn:active { background: #b45309; }
    .check-btn { background: #22c55e; color: white; }
    .check-btn:active { background: #15803d; }
    .action-btn:disabled { opacity: 0.5; pointer-events: none; }
    .feedback-flash { animation: flashBorder 0.5s ease-out; }
    @keyframes flashBorder {
      0% { border-color: #22c55e; box-shadow: 0 0 20px #22c55e; }
      100% { border-color: #334155; box-shadow: none; }
    }
    .wrong-flash { animation: shake 0.4s ease; }
    @keyframes shake {
      0%,100%{ transform: translateX(0); }
      20%{ transform: translateX(-6px); }
      40%{ transform: translateX(6px); }
      60%{ transform: translateX(-4px); }
      80%{ transform: translateX(4px); }
    }
    .center-column {
      flex: 0 0 clamp(260px, 30vw, 340px);
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 1rem;
    }
    .settings-toggle {
      background: none; border: 2px solid #334155; color: #cbd5e1;
      border-radius: 2rem; padding: 0.4rem 1.2rem; font-weight: 600;
      font-size: 0.85rem; cursor: pointer; transition: 0.2s;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .settings-toggle:hover { background: #1e293b; }
    .settings-panel {
      display: none; background: #1e293b; border-radius: 1rem;
      padding: 1rem; width: 100%; flex-direction: column; gap: 0.8rem;
      border: 1px solid #334155;
    }
    .settings-panel.open { display: flex; }
    .setting-row {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 0.4rem;
    }
    .setting-row label { font-size: 0.85rem; font-weight: 500; color: #cbd5e1; }
    .setting-row input[type="text"],
    .setting-row input[type="number"] {
      background: #0f172a; border: 1px solid #334155; color: white;
      padding: 0.4rem 0.5rem; border-radius: 0.5rem; font-weight: 600;
      text-align: center;
    }
    .setting-row input[type="text"] { width: 90px; }
    .setting-row input[type="number"] { width: 60px; }
    .radio-group {
      display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;
    }
    .radio-group label {
      display: flex; align-items: center; gap: 0.2rem;
      font-size: 0.85rem; cursor: pointer; color: #cbd5e1;
    }
    .radio-group input[type="radio"] { accent-color: #6366f1; width: auto; margin: 0; }
    .apply-settings-btn {
      background: #6366f1; color: white; border: none; border-radius: 2rem;
      padding: 0.6rem; font-weight: 700; cursor: pointer; letter-spacing: 0.5px;
      margin-top: 0.2rem;
    }
    .war-bar-container {
      width: 100%; position: relative; height: 70px; background: white;
      border-radius: 40px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }
    .war-bar-blue, .war-bar-red {
      position: absolute; top: 0; height: 100%;
      transition: width 0.6s cubic-bezier(0.2, 0.9, 0.4, 1);
    }
    .war-bar-blue { left: 0; background: linear-gradient(180deg, #3b82f6, #1e40af); border-radius: 40px 0 0 40px; }
    .war-bar-red { right: 0; background: linear-gradient(180deg, #ef4444, #991b1b); border-radius: 0 40px 40px 0; }
    .bar-divider {
      position: absolute; top: 5%; height: 90%; width: 4px; background: white;
      box-shadow: 0 0 12px white; border-radius: 4px;
      transition: left 0.6s cubic-bezier(0.2, 0.9, 0.4, 1); z-index: 5;
    }
    .bar-scores {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none; z-index: 10; display: flex;
      justify-content: space-between; align-items: center; padding: 0 20px;
    }
    .bar-score {
      font-weight: 900; font-size: 1.8rem; color: white;
      text-shadow: 0 2px 8px black; line-height: 1;
    }
    .score-summary {
      display: flex; justify-content: space-between; width: 100%; font-weight: 700;
    }
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px); display: flex; align-items: center;
      justify-content: center; z-index: 50; opacity: 0; pointer-events: none;
      transition: opacity 0.4s;
    }
    .overlay.active { opacity: 1; pointer-events: auto; }
    .result-card {
      background: #1e293b; border-radius: 2rem; padding: 2rem;
      text-align: center; box-shadow: 0 20px 40px black;
      max-width: 400px; width: 90%;
    }
    .result-icon { font-size: 4rem; margin-bottom: 0.5rem; }
    .result-title { font-size: 2rem; font-weight: 900; }
    .result-scores { display: flex; justify-content: center; gap: 2rem; margin: 1.5rem 0; }
    .play-again-btn {
      background: #6366f1; border: none; color: white; padding: 0.8rem 2.5rem;
      border-radius: 3rem; font-weight: 700; font-size: 1.1rem; cursor: pointer;
    }
    @media (max-width: 750px) {
      .game-layout { flex-direction: column; gap: 10px; }
      .center-column { flex: 0 0 auto; width: 100%; order: -1; }
      .war-bar-container { height: 50px; }
    }
  </style>
</head>
<body>
<div class="game-layout">
  <div class="player-panel p1" id="p1Panel">
    <div class="player-name" id="p1NameDisplay">🔵 PLAYER 1</div>
    <div class="round-badge" id="p1RoundBadge">Round 1 / 10</div>
    <div class="question" id="p1Question">3 + 4 = ?</div>
    <div class="answer-box placeholder" id="p1Answer">Your answer</div>
    <div class="number-pad" id="p1Pad">
      <button class="num-btn">1</button><button class="num-btn">2</button><button class="num-btn">3</button>
      <button class="num-btn">4</button><button class="num-btn">5</button><button class="num-btn">6</button>
      <button class="num-btn">7</button><button class="num-btn">8</button><button class="num-btn">9</button>
      <button class="num-btn" style="grid-column:2">0</button>
    </div>
    <div class="action-row">
      <button class="action-btn undo-btn" id="p1Undo">↩ Undo</button>
      <button class="action-btn check-btn" id="p1Check" disabled>✓ Check</button>
    </div>
  </div>
  <div class="center-column">
    <button class="settings-toggle" id="settingsToggle">⚙️ Settings</button>
    <div class="settings-panel" id="settingsPanel">
      <div class="setting-row">
        <label>Player 1 Name</label>
        <input type="text" id="p1NameInput" value="Player 1" maxlength="12">
      </div>
      <div class="setting-row">
        <label>Player 2 Name</label>
        <input type="text" id="p2NameInput" value="Player 2" maxlength="12">
      </div>
      <div class="setting-row">
        <label>Number Range</label>
        <div style="display:flex; align-items:center; gap:4px;">
          <input type="number" id="minNumberInput" value="1" min="1" max="50" step="1">
          <span style="color:#cbd5e1;">–</span>
          <input type="number" id="maxNumberInput" value="9" min="1" max="50" step="1">
        </div>
      </div>
      <div class="setting-row">
        <label>Operation</label>
        <div class="radio-group" id="operationGroup">
          <label><input type="radio" name="operation" value="add" checked> +</label>
          <label><input type="radio" name="operation" value="sub"> −</label>
          <label><input type="radio" name="operation" value="mul"> ×</label>
          <label><input type="radio" name="operation" value="div"> ÷</label>
        </div>
      </div>
      <div class="setting-row">
        <label>Rounds</label>
        <input type="number" id="roundsInput" value="10" min="1" max="20" step="1">
      </div>
      <button class="apply-settings-btn" id="applySettingsBtn">Apply & Restart</button>
    </div>
    <div style="font-weight:700; color:#cbd5e1; letter-spacing:1px;">⚡ TUG OF WAR ⚡</div>
    <div class="war-bar-container">
      <div class="war-bar-blue" id="blueBar"></div>
      <div class="war-bar-red" id="redBar"></div>
      <div class="bar-divider" id="barDivider"></div>
      <div class="bar-scores">
        <span class="bar-score" id="blueScore">0</span>
        <span class="bar-score" id="redScore">0</span>
      </div>
    </div>
    <div class="score-summary">
      <span style="color:var(--blue-light);">🔵 <span id="p1SummaryName">Player 1</span>: <strong id="p1ScoreChip">0</strong></span>
      <span style="color:var(--red-light);">🔴 <span id="p2SummaryName">Player 2</span>: <strong id="p2ScoreChip">0</strong></span>
    </div>
  </div>
  <div class="player-panel p2" id="p2Panel">
    <div class="player-name" id="p2NameDisplay">🔴 PLAYER 2</div>
    <div class="round-badge" id="p2RoundBadge">Round 1 / 10</div>
    <div class="question" id="p2Question">5 + 2 = ?</div>
    <div class="answer-box placeholder" id="p2Answer">Your answer</div>
    <div class="number-pad" id="p2Pad">
      <button class="num-btn">1</button><button class="num-btn">2</button><button class="num-btn">3</button>
      <button class="num-btn">4</button><button class="num-btn">5</button><button class="num-btn">6</button>
      <button class="num-btn">7</button><button class="num-btn">8</button><button class="num-btn">9</button>
      <button class="num-btn" style="grid-column:2">0</button>
    </div>
    <div class="action-row">
      <button class="action-btn undo-btn" id="p2Undo">↩ Undo</button>
      <button class="action-btn check-btn" id="p2Check" disabled>✓ Check</button>
    </div>
  </div>
</div>
<div class="overlay" id="overlay">
  <div class="result-card">
    <div class="result-icon" id="resultIcon">🏆</div>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-scores">
      <div><div style="color:var(--blue-light);" id="finalP1Label">🔵 P1</div><div style="font-size:2.5rem; font-weight:900;" id="finalP1">0</div></div>
      <div><div style="color:var(--red-light);" id="finalP2Label">🔴 P2</div><div style="font-size:2.5rem; font-weight:900;" id="finalP2">0</div></div>
    </div>
    <button class="play-again-btn" id="playAgainBtn">🔄 Play Again</button>
  </div>
</div>
<script>
  (function() {
    // DOM references
    const p1NameDisplay = document.getElementById('p1NameDisplay');
    const p2NameDisplay = document.getElementById('p2NameDisplay');
    const p1Question = document.getElementById('p1Question');
    const p1Answer = document.getElementById('p1Answer');
    const p1RoundBadge = document.getElementById('p1RoundBadge');
    const p1Pad = document.getElementById('p1Pad');
    const p1Undo = document.getElementById('p1Undo');
    const p1Check = document.getElementById('p1Check');
    const p1Panel = document.getElementById('p1Panel');
    const p2Question = document.getElementById('p2Question');
    const p2Answer = document.getElementById('p2Answer');
    const p2RoundBadge = document.getElementById('p2RoundBadge');
    const p2Pad = document.getElementById('p2Pad');
    const p2Undo = document.getElementById('p2Undo');
    const p2Check = document.getElementById('p2Check');
    const p2Panel = document.getElementById('p2Panel');
    const blueBar = document.getElementById('blueBar');
    const redBar = document.getElementById('redBar');
    const barDivider = document.getElementById('barDivider');
    const blueScoreEl = document.getElementById('blueScore');
    const redScoreEl = document.getElementById('redScore');
    const p1ScoreChip = document.getElementById('p1ScoreChip');
    const p2ScoreChip = document.getElementById('p2ScoreChip');
    const p1SummaryName = document.getElementById('p1SummaryName');
    const p2SummaryName = document.getElementById('p2SummaryName');
    const settingsToggle = document.getElementById('settingsToggle');
    const settingsPanel = document.getElementById('settingsPanel');
    const p1NameInput = document.getElementById('p1NameInput');
    const p2NameInput = document.getElementById('p2NameInput');
    const minNumberInput = document.getElementById('minNumberInput');
    const maxNumberInput = document.getElementById('maxNumberInput');
    const roundsInput = document.getElementById('roundsInput');
    const applySettingsBtn = document.getElementById('applySettingsBtn');
    const operationRadios = document.getElementsByName('operation');
    const overlay = document.getElementById('overlay');
    const resultIcon = document.getElementById('resultIcon');
    const resultTitle = document.getElementById('resultTitle');
    const finalP1Label = document.getElementById('finalP1Label');
    const finalP2Label = document.getElementById('finalP2Label');
    const finalP1 = document.getElementById('finalP1');
    const finalP2 = document.getElementById('finalP2');
    const playAgainBtn = document.getElementById('playAgainBtn');

    // Game state
    let TOTAL_ROUNDS = 10;
    let MIN_NUMBER = 1;
    let MAX_NUMBER = 9;
    let OPERATION = 'add';
    let PLAYER1_NAME = 'Player 1';
    let PLAYER2_NAME = 'Player 2';
    let gameActive = true;
    let barPosition = 50;

    function createPlayer() {
      return { score: 0, round: 1, answer: '', num1: 0, num2: 0, correctAnswer: 0, locked: false, lastKey: '' };
    }
    let p1 = createPlayer();
    let p2 = createPlayer();

    function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function generateQuestion(player) {
      let n1, n2, key, correct;
      const maxAttempts = 200;
      let attempts = 0;
      do {
        attempts++;
        n1 = rand(MIN_NUMBER, MAX_NUMBER);
        n2 = rand(MIN_NUMBER, MAX_NUMBER);
        switch (OPERATION) {
          case 'add':
            correct = n1 + n2;
            key = `${n1}+${n2}`;
            break;
          case 'sub':
            if (n1 < n2) [n1, n2] = [n2, n1];
            correct = n1 - n2;
            key = `${n1}−${n2}`;
            break;
          case 'mul':
            correct = n1 * n2;
            key = `${n1}×${n2}`;
            break;
          case 'div':
            const divisor = rand(MIN_NUMBER, MAX_NUMBER);
            const minQ = Math.ceil(MIN_NUMBER / divisor);
            const maxQ = Math.floor(MAX_NUMBER / divisor);
            if (minQ > maxQ) continue;
            const quotient = rand(minQ, maxQ);
            n1 = divisor * quotient;
            n2 = divisor;
            correct = quotient;
            key = `${n1}÷${n2}`;
            break;
        }
        if (attempts > maxAttempts) break;
      } while (key === player.lastKey);

      player.num1 = n1;
      player.num2 = n2;
      player.correctAnswer = correct;
      player.lastKey = key;
    }

    function getOperatorSymbol() {
      switch (OPERATION) {
        case 'add': return '+';
        case 'sub': return '−';
        case 'mul': return '×';
        case 'div': return '÷';
        default: return '+';
      }
    }

    function renderQuestion(player, element) {
      element.textContent = `${player.num1} ${getOperatorSymbol()} ${player.num2} = ?`;
    }

    function updateAnswerDisplay(player, element) {
      if (player.answer === '') {
        element.textContent = 'Your answer';
        element.classList.add('placeholder');
      } else {
        element.textContent = player.answer;
        element.classList.remove('placeholder');
      }
    }

    function updateRoundBadge(player, badge) {
      badge.textContent = `Round ${player.round} / ${TOTAL_ROUNDS}`;
    }

    function updateAllBarUI() {
      blueBar.style.width = barPosition + '%';
      redBar.style.width = (100 - barPosition) + '%';
      barDivider.style.left = barPosition + '%';
      blueScoreEl.textContent = p1.score;
      redScoreEl.textContent = p2.score;
      p1ScoreChip.textContent = p1.score;
      p2ScoreChip.textContent = p2.score;
    }

    function updatePlayerNames() {
      p1NameDisplay.textContent = `🔵 ${PLAYER1_NAME}`;
      p2NameDisplay.textContent = `🔴 ${PLAYER2_NAME}`;
      p1SummaryName.textContent = PLAYER1_NAME;
      p2SummaryName.textContent = PLAYER2_NAME;
      finalP1Label.textContent = `🔵 ${PLAYER1_NAME}`;
      finalP2Label.textContent = `🔴 ${PLAYER2_NAME}`;
    }

    function shiftBar(favorBlue) {
      barPosition = favorBlue ? Math.min(92, barPosition + 5) : Math.max(8, barPosition - 5);
      updateAllBarUI();
    }

    function setControlsDisabled(player, disabled) {
      const pad = player === p1 ? p1Pad : p2Pad;
      const undo = player === p1 ? p1Undo : p2Undo;
      const check = player === p1 ? p1Check : p2Check;
      pad.querySelectorAll('button').forEach(b => b.disabled = disabled);
      undo.disabled = disabled;
      check.disabled = disabled || player.answer === '';
    }

    function lockPlayer(player) { player.locked = true; setControlsDisabled(player, true); }
    function unlockPlayer(player) { player.locked = false; setControlsDisabled(player, false); }

    function handleAnswer(player, playerId) {
      if (!gameActive || player.locked || player.round > TOTAL_ROUNDS) return;
      if (player.answer === '') {
        const box = playerId === 'p1' ? p1Answer : p2Answer;
        box.classList.add('wrong-flash');
        setTimeout(() => box.classList.remove('wrong-flash'), 400);
        return;
      }
      const answerNum = parseInt(player.answer, 10);
      const isCorrect = answerNum === player.correctAnswer;
      const panel = playerId === 'p1' ? p1Panel : p2Panel;
      const ansBox = playerId === 'p1' ? p1Answer : p2Answer;
      const questionEl = playerId === 'p1' ? p1Question : p2Question;
      const badgeEl = playerId === 'p1' ? p1RoundBadge : p2RoundBadge;
      lockPlayer(player);
      if (isCorrect) {
        ansBox.classList.add('feedback-flash');
        panel.style.boxShadow = '0 0 30px #22c55e';
        setTimeout(() => {
          ansBox.classList.remove('feedback-flash');
          panel.style.boxShadow = '';
        }, 500);
      } else {
        ansBox.classList.add('wrong-flash');
        setTimeout(() => ansBox.classList.remove('wrong-flash'), 400);
      }
      if (isCorrect) {
        player.score++;
        shiftBar(playerId === 'p1');
      } else {
        shiftBar(playerId !== 'p1');
      }
      setTimeout(() => {
        if (!gameActive) return;
        if (isCorrect) {
          if (player.round === TOTAL_ROUNDS) {
            player.round = TOTAL_ROUNDS + 1;
            player.answer = '';
            updateAnswerDisplay(player, ansBox);
            updateRoundBadge(player, badgeEl);
            unlockPlayer(player);
            if (p1.round > TOTAL_ROUNDS || p2.round > TOTAL_ROUNDS) endGame();
          } else {
            player.round++;
            player.answer = '';
            generateQuestion(player);
            renderQuestion(player, questionEl);
            updateAnswerDisplay(player, ansBox);
            updateRoundBadge(player, badgeEl);
            unlockPlayer(player);
          }
        } else {
          player.answer = '';
          updateAnswerDisplay(player, ansBox);
          unlockPlayer(player);
        }
      }, 500);
    }

    function appendDigit(player, digit, answerEl) {
      if (!gameActive || player.locked || player.round > TOTAL_ROUNDS) return;
      if (player.answer.length >= 4) return;
      player.answer += digit;
      updateAnswerDisplay(player, answerEl);
      const checkBtn = player === p1 ? p1Check : p2Check;
      checkBtn.disabled = false;
    }

    function undoAnswer(player, answerEl) {
      if (!gameActive || player.locked || player.round > TOTAL_ROUNDS) return;
      player.answer = '';
      updateAnswerDisplay(player, answerEl);
      const checkBtn = player === p1 ? p1Check : p2Check;
      checkBtn.disabled = true;
    }

    function endGame() {
      if (!gameActive) return;
      gameActive = false;
      setControlsDisabled(p1, true);
      setControlsDisabled(p2, true);

      if (p1.score > p2.score) {
        resultIcon.textContent = '🏆';
        resultTitle.textContent = `🔵 ${PLAYER1_NAME} Wins!`;
        resultTitle.style.color = 'var(--blue-light)';
      } else if (p2.score > p1.score) {
        resultIcon.textContent = '🏆';
        resultTitle.textContent = `🔴 ${PLAYER2_NAME} Wins!`;
        resultTitle.style.color = 'var(--red-light)';
      } else {
        resultIcon.textContent = '🤝';
        resultTitle.textContent = "It's a Tie!";
        resultTitle.style.color = '#fbbf24';
      }
      finalP1.textContent = p1.score;
      finalP2.textContent = p2.score;
      overlay.classList.add('active');
    }

    function fullReset() {
      gameActive = true;
      barPosition = 50;
      p1 = createPlayer();
      p2 = createPlayer();
      generateQuestion(p1);
      generateQuestion(p2);
      renderQuestion(p1, p1Question);
      renderQuestion(p2, p2Question);
      updateAnswerDisplay(p1, p1Answer);
      updateAnswerDisplay(p2, p2Answer);
      updateRoundBadge(p1, p1RoundBadge);
      updateRoundBadge(p2, p2RoundBadge);
      updateAllBarUI();
      updatePlayerNames();  // re-apply current names (in case they changed)
      unlockPlayer(p1);
      unlockPlayer(p2);
      overlay.classList.remove('active');
    }

    function readSettingsFromUI() {
      let p1name = p1NameInput.value.trim();
      let p2name = p2NameInput.value.trim();
      if (p1name === '') p1name = 'Player 1';
      if (p2name === '') p2name = 'Player 2';
      let min = parseInt(minNumberInput.value, 10);
      let max = parseInt(maxNumberInput.value, 10);
      if (isNaN(min) || min < 1) min = 1;
      if (isNaN(max) || max < 1) max = 1;
      if (min > max) [min, max] = [max, min];
      if (min > 50) min = 50;
      if (max > 50) max = 50;
      minNumberInput.value = min;
      maxNumberInput.value = max;
      let rounds = parseInt(roundsInput.value, 10);
      if (isNaN(rounds) || rounds < 1) rounds = 1;
      if (rounds > 20) rounds = 20;
      roundsInput.value = rounds;
      let op = 'add';
      for (let radio of operationRadios) {
        if (radio.checked) { op = radio.value; break; }
      }
      return { p1name, p2name, min, max, rounds, op };
    }

    function applySettingsAndReset() {
      const s = readSettingsFromUI();
      PLAYER1_NAME = s.p1name;
      PLAYER2_NAME = s.p2name;
      MIN_NUMBER = s.min;
      MAX_NUMBER = s.max;
      TOTAL_ROUNDS = s.rounds;
      OPERATION = s.op;
      settingsPanel.classList.remove('open');
      fullReset();
    }

    // Event wiring
    p1Pad.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn || btn.disabled) return;
      appendDigit(p1, btn.textContent.trim(), p1Answer);
    });
    p1Pad.addEventListener('touchstart', e => {
      const btn = e.target.closest('button');
      if (!btn || btn.disabled) return;
      e.preventDefault();
      appendDigit(p1, btn.textContent.trim(), p1Answer);
    }, { passive: false });
    p2Pad.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn || btn.disabled) return;
      appendDigit(p2, btn.textContent.trim(), p2Answer);
    });
    p2Pad.addEventListener('touchstart', e => {
      const btn = e.target.closest('button');
      if (!btn || btn.disabled) return;
      e.preventDefault();
      appendDigit(p2, btn.textContent.trim(), p2Answer);
    }, { passive: false });

    p1Undo.addEventListener('click', () => undoAnswer(p1, p1Answer));
    p2Undo.addEventListener('click', () => undoAnswer(p2, p2Answer));
    p1Check.addEventListener('click', () => handleAnswer(p1, 'p1'));
    p2Check.addEventListener('click', () => handleAnswer(p2, 'p2'));

    settingsToggle.addEventListener('click', () => settingsPanel.classList.toggle('open'));
    applySettingsBtn.addEventListener('click', applySettingsAndReset);
    playAgainBtn.addEventListener('click', applySettingsAndReset);

    document.addEventListener('touchstart', e => {
      if (e.target.closest('button') && e.touches.length > 1) e.preventDefault();
    }, { passive: false });

    // Initial setup
    updatePlayerNames();
    generateQuestion(p1);
    generateQuestion(p2);
    renderQuestion(p1, p1Question);
    renderQuestion(p2, p2Question);
    updateRoundBadge(p1, p1RoundBadge);
    updateRoundBadge(p2, p2RoundBadge);
    updateAllBarUI();
    unlockPlayer(p1);
    unlockPlayer(p2);
  })();
</script>
</body>
</html>
