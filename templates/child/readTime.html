<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Clock Lab: Move the Hands | Learn to Read Time</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #1a472a 0%, #0e2a1a 100%);
            font-family: 'Segoe UI', 'Roboto', 'Poppins', system-ui, -apple-system, 'Quicksand', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            background: #fef5e7;
            border-radius: 64px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.6);
            padding: 25px 20px 30px 20px;
            transition: all 0.2s ease;
        }

        .clock-card {
            background: #fff8f0;
            border-radius: 48px;
            padding: 20px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 200, 0.8), 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 50%;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3), 0 0 0 8px #f3e1be, 0 0 0 12px #c9a87b;
            background: #fffef7;
            cursor: pointer;
            transition: transform 0.05s linear;
        }

        .time-panel {
            background: #2e241f;
            color: #fae67a;
            padding: 20px 15px;
            border-radius: 60px;
            margin: 20px 10px 10px 10px;
            text-align: center;
            box-shadow: inset 0 2px 5px #1f1814, 0 5px 10px rgba(0, 0, 0, 0.2);
        }

        .digital-clock {
            font-family: 'Fira Mono', 'Courier New', monospace;
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 4px;
            background: #000000aa;
            background: #0a0a0a;
            display: inline-block;
            padding: 10px 24px;
            border-radius: 50px;
            backdrop-filter: blur(2px);
            text-shadow: 0 0 5px #ffd966;
            box-shadow: inset 0 1px 4px #ffecb3, 0 2px 8px black;
        }

        .ampm {
            font-size: 1.4rem;
            background: #1f2a1b;
            border-radius: 30px;
            padding: 5px 14px;
            margin-left: 15px;
            font-weight: bold;
        }

        .selected-hand {
            background: #efcd90;
            color: #2c1e12;
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 1rem;
            font-weight: bold;
            display: inline-block;
            margin-top: 8px;
        }

        .info-text {
            font-size: 0.9rem;
            background: #fff0d4;
            padding: 8px 12px;
            border-radius: 28px;
            color: #443829;
            font-weight: 600;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            background: #ffcd94;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 48px;
            font-family: inherit;
            color: #3d2b1a;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:active {
            transform: scale(0.96);
            box-shadow: 0 1px 3px black;
        }

        .btn-rotate {
            background: #f6ae2d;
            color: #241f0f;
            font-size: 1.3rem;
            letter-spacing: 1px;
        }

        .challenge-area {
            background: #f7e5cc;
            margin: 18px 10px 5px 10px;
            border-radius: 42px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .challenge-text {
            font-size: 1.3rem;
            font-weight: bold;
            background: #2e2c2a;
            padding: 5px 15px;
            border-radius: 30px;
            color: #ffe1a0;
        }

        .message {
            font-weight: bold;
            background: #d9c5a0;
            border-radius: 30px;
            padding: 5px 15px;
            color: #2c471c;
        }

        footer {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 16px;
            color: #4a3b2a;
        }

        @media (max-width: 500px) {
            .digital-clock {
                font-size: 1.8rem;
                padding: 6px 12px;
            }
            .btn {
                padding: 6px 14px;
                font-size: 0.9rem;
            }
            canvas {
                width: 280px;
                height: 280px;
            }
            .game-container {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="clock-card">
            <canvas id="clockCanvas" width="400" height="400"
                style="width:100%; height:auto; max-width:400px; aspect-ratio:1/1"></canvas>

            <div class="time-panel">
                <div>
                    <span class="digital-clock" id="digitalTime">--:--:--</span>
                    <span class="ampm" id="ampmLabel">--</span>
                </div>
                <div class="selected-hand" id="activeHandLabel">✨ Tap a hand to select it</div>
                <div class="info-text">👉 Use the buttons below to move the selected hand precisely</div>
            </div>

            <div class="challenge-area">
                <span class="challenge-text">🎯 CHALLENGE: <span id="challengeTarget">--:--:--</span></span>
                <button class="btn" id="randomChallengeBtn">🎲 New Time</button>
                <button class="btn" id="checkMatchBtn">✅ Check Match</button>
            </div>
            <div class="button-group">
                <button class="btn btn-rotate" id="rotateCounterClockwise">⏪ Anti‑Clockwise</button>
                <button class="btn btn-rotate" id="rotateClockwise">⏩ Clockwise</button>
            </div>
            <div class="button-group">
                <button class="btn" id="resetCurrentBtn">🕒 Set to Real Time</button>
            </div>
            <div id="feedbackMsg" class="message" style="text-align: center; margin-top: 12px;">👉 Tap a hand, then rotate it</div>
            <footer>⚡ Tap hour / minute / second hand to select – then rotate step by step</footer>
        </div>
    </div>

    <script>
        (function() {
            // --- DOM elements ---
            const canvas = document.getElementById('clockCanvas');
            const ctx = canvas.getContext('2d');
            const digitalSpan = document.getElementById('digitalTime');
            const ampmSpan = document.getElementById('ampmLabel');
            const activeHandSpan = document.getElementById('activeHandLabel');
            const challengeTargetSpan = document.getElementById('challengeTarget');
            const feedbackDiv = document.getElementById('feedbackMsg');

            // --- clock state (24-hour format) ---
            let hour24 = 14; // 2:00 PM
            let minute = 0;
            let second = 0;

            // selection state (no drag)
            let selectedHand = null; // 'hour', 'minute', 'second' or null

            // challenge target
            let targetHour24 = null;
            let targetMinute = null;
            let targetSecond = null;

            // canvas dimensions
            let centerX = 200, centerY = 200, radius = 180;

            // --- angle helper (for tap detection) ---
            function getAngleFromEvent(e, canvasElem) {
                const rect = canvasElem.getBoundingClientRect();
                const scaleX = canvasElem.width / rect.width;
                const scaleY = canvasElem.height / rect.height;
                let clientX, clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else if (e.clientX !== undefined) {
                    clientX = e.clientX;
                    clientY = e.clientY;
                } else {
                    return null;
                }
                let canvasX = (clientX - rect.left) * scaleX;
                let canvasY = (clientY - rect.top) * scaleY;
                let dx = canvasX - centerX;
                let dy = canvasY - centerY;
                let angleRad = Math.atan2(dy, dx);
                let angleDeg = (angleRad * 180 / Math.PI) + 90; // 0° = 12 o'clock
                return (angleDeg + 360) % 360;
            }

            // --- get current hand angles ---
            function getCurrentHandAngles() {
                let hour12 = hour24 % 12;
                let hourAngle = (hour12 * 30) + (minute * 0.5);
                hourAngle = hourAngle % 360;
                let minuteAngle = minute * 6;
                let secondAngle = second * 6;
                return { hourAngle, minuteAngle, secondAngle };
            }

            // --- detect hand near angle (threshold 28°) ---
            function detectHandNearAngle(angleDeg) {
                const angles = getCurrentHandAngles();
                let hourDelta = angleDiff(angleDeg, angles.hourAngle);
                let minuteDelta = angleDiff(angleDeg, angles.minuteAngle);
                let secondDelta = angleDiff(angleDeg, angles.secondAngle);
                const THRESH = 28;
                if (hourDelta < THRESH && hourDelta <= minuteDelta && hourDelta <= secondDelta) return 'hour';
                if (minuteDelta < THRESH && minuteDelta <= hourDelta && minuteDelta <= secondDelta) return 'minute';
                if (secondDelta < THRESH && secondDelta <= hourDelta && secondDelta <= minuteDelta) return 'second';
                return null;
            }

            function angleDiff(a, b) {
                let diff = Math.abs(a - b);
                return Math.min(diff, 360 - diff);
            }

            // --- time update ---
            function setNewTime(h, m, s) {
                hour24 = ((Math.round(h) % 24) + 24) % 24;
                minute = Math.min(59, Math.max(0, Math.round(m)));
                second = Math.min(59, Math.max(0, Math.round(s)));
                refreshDisplayAndRedraw();
            }

            // --- move selected hand by one unit in direction (1 = clockwise, -1 = anti) ---
            function moveSelectedHand(direction) {
                if (!selectedHand) {
                    feedbackDiv.innerHTML = "👆 First tap on a hand (hour, minute or second) to select it.";
                    feedbackDiv.style.background = "#d9c5a0";
                    return;
                }
                let h = hour24, m = minute, s = second;
                if (selectedHand === 'hour') {
                    h = (h + direction + 24) % 24;
                } else if (selectedHand === 'minute') {
                    let totalMinutes = h * 60 + m + direction;
                    totalMinutes = ((totalMinutes % 1440) + 1440) % 1440;
                    h = Math.floor(totalMinutes / 60);
                    m = totalMinutes % 60;
                } else if (selectedHand === 'second') {
                    let totalSeconds = h * 3600 + m * 60 + s + direction;
                    totalSeconds = ((totalSeconds % 86400) + 86400) % 86400;
                    h = Math.floor(totalSeconds / 3600);
                    m = Math.floor((totalSeconds % 3600) / 60);
                    s = totalSeconds % 60;
                }
                setNewTime(h, m, s);
            }

            // --- UI refresh ---
            function refreshDisplayAndRedraw() {
                updateDigitalDisplay();
                drawClock();
                updateActiveHandMessage();
                checkChallengeMatchAuto();
            }

            function updateDigitalDisplay() {
                let hour12 = hour24 % 12;
                if (hour12 === 0) hour12 = 12;
                let ampm = hour24 >= 12 ? 'PM' : 'AM';
                digitalSpan.innerText = `${hour12.toString().padStart(2, ' ')}:${minute.toString().padStart(2, '0')}:${second.toString().padStart(2, '0')}`;
                ampmSpan.innerText = ampm;
            }

            function updateActiveHandMessage() {
                if (selectedHand) {
                    activeHandSpan.innerHTML = `🔴 Selected: ${selectedHand.toUpperCase()} HAND – use rotation buttons`;
                } else {
                    activeHandSpan.innerHTML = `✨ Tap a hand to select it`;
                }
            }

            // --- challenge logic ---
            function checkChallengeMatchAuto() {
                if (targetHour24 !== null && targetMinute !== null && targetSecond !== null) {
                    if (hour24 === targetHour24 && minute === targetMinute && second === targetSecond) {
                        feedbackDiv.innerHTML = "🎉 PERFECT! 🎉 You matched the challenge! Great job! 🎯";
                        feedbackDiv.style.background = "#b9f5a0";
                        feedbackDiv.style.color = "#1e4a1a";
                    } else {
                        feedbackDiv.innerHTML = `⏰ Keep moving! Target: ${formatTargetTime()}  |  Current: ${formatCurrentTime()}`;
                        feedbackDiv.style.background = "#d9c5a0";
                        feedbackDiv.style.color = "#2c471c";
                    }
                } else {
                    feedbackDiv.innerHTML = "✨ Try a 'New Time' challenge & match the clock!";
                    feedbackDiv.style.background = "#d9c5a0";
                }
            }

            function formatTargetTime() {
                if (targetHour24 === null) return "??:??:??";
                let h12 = targetHour24 % 12; if (h12 === 0) h12 = 12;
                let ampm = targetHour24 >= 12 ? "PM" : "AM";
                return `${h12}:${targetMinute.toString().padStart(2, '0')}:${targetSecond.toString().padStart(2, '0')} ${ampm}`;
            }
            function formatCurrentTime() {
                let h12 = hour24 % 12; if (h12 === 0) h12 = 12;
                let ampm = hour24 >= 12 ? "PM" : "AM";
                return `${h12}:${minute.toString().padStart(2, '0')}:${second.toString().padStart(2, '0')} ${ampm}`;
            }

            function generateRandomChallenge() {
                targetHour24 = Math.floor(Math.random() * 24);
                targetMinute = Math.floor(Math.random() * 60);
                targetSecond = Math.floor(Math.random() * 60);
                let h12 = targetHour24 % 12; if (h12 === 0) h12 = 12;
                let ampm = targetHour24 >= 12 ? "PM" : "AM";
                challengeTargetSpan.innerText = `${h12}:${targetMinute.toString().padStart(2, '0')}:${targetSecond.toString().padStart(2, '0')} ${ampm}`;
                feedbackDiv.innerHTML = `🎯 Challenge set! Move hands to match ${challengeTargetSpan.innerText}`;
                feedbackDiv.style.background = "#f7e5cc";
                checkChallengeMatchAuto();
            }

            function checkExplicitMatch() {
                if (targetHour24 === null) {
                    feedbackDiv.innerHTML = "❗ No active challenge. Press 'New Time' first!";
                    return;
                }
                if (hour24 === targetHour24 && minute === targetMinute && second === targetSecond) {
                    feedbackDiv.innerHTML = "✅ CORRECT! ✅ You nailed the time! Great reading! 🎓";
                    feedbackDiv.style.background = "#b9f5a0";
                } else {
                    feedbackDiv.innerHTML = `❌ Not yet! Target: ${formatTargetTime()}  |  Your clock: ${formatCurrentTime()}. Try moving the hands!`;
                    feedbackDiv.style.background = "#ffcfb0";
                }
            }

            function setToCurrentRealTime() {
                const now = new Date();
                setNewTime(now.getHours(), now.getMinutes(), now.getSeconds());
                feedbackDiv.innerHTML = "⏲️ Clock set to real time! Now try a challenge.";
                if (targetHour24 !== null) checkChallengeMatchAuto();
                else feedbackDiv.style.background = "#d9c5a0";
            }

            // ----- Drawing -----
            function drawClock() {
                ctx.clearRect(0, 0, 400, 400);
                // outer dial
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = "#fffbf0";
                ctx.fill();
                ctx.strokeStyle = "#b57c48";
                ctx.lineWidth = 5;
                ctx.stroke();
                // ticks
                for (let i = 0; i < 60; i++) {
                    let angle = (i * 6 - 90) * Math.PI / 180;
                    let startRad = radius - 12;
                    let endRad = radius - 4;
                    if (i % 5 === 0) {
                        startRad = radius - 20;
                        endRad = radius - 6;
                        ctx.lineWidth = 3;
                    } else {
                        ctx.lineWidth = 1.5;
                    }
                    ctx.beginPath();
                    ctx.moveTo(centerX + startRad * Math.cos(angle), centerY + startRad * Math.sin(angle));
                    ctx.lineTo(centerX + endRad * Math.cos(angle), centerY + endRad * Math.sin(angle));
                    ctx.strokeStyle = "#6b4c2c";
                    ctx.stroke();
                }
                // numbers
                ctx.font = "bold 22px 'Segoe UI', 'Quicksand'";
                ctx.fillStyle = "#3e2a1f";
                ctx.shadowBlur = 0;
                for (let i = 1; i <= 12; i++) {
                    let angle = (i * 30 - 90) * Math.PI / 180;
                    let x = centerX + (radius - 32) * Math.cos(angle) - 10;
                    let y = centerY + (radius - 32) * Math.sin(angle) + 8;
                    ctx.fillText(i.toString(), x, y);
                }
                // draw hands (normal colors)
                const angles = getCurrentHandAngles();
                drawHand(angles.hourAngle, radius - 55, 7, "#2C3E2B");
                drawHand(angles.minuteAngle, radius - 35, 5, "#2C5282");
                drawHand(angles.secondAngle, radius - 25, 2.5, "#C44536");
                // center dot
                ctx.beginPath();
                ctx.arc(centerX, centerY, 8, 0, 2 * Math.PI);
                ctx.fillStyle = "#b87333";
                ctx.fill();
                ctx.beginPath();
                ctx.arc(centerX, centerY, 3, 0, 2 * Math.PI);
                ctx.fillStyle = "#f9e0a0";
                ctx.fill();

                // highlight selected hand in red (drawn on top)
                if (selectedHand) {
                    const selAngles = getCurrentHandAngles();
                    if (selectedHand === 'hour') {
                        drawHand(selAngles.hourAngle, radius - 55, 8, "#d32f2f", true);
                    } else if (selectedHand === 'minute') {
                        drawHand(selAngles.minuteAngle, radius - 35, 6, "#d32f2f", true);
                    } else if (selectedHand === 'second') {
                        drawHand(selAngles.secondAngle, radius - 25, 3.5, "#d32f2f", true);
                    }
                }
            }

            function drawHand(angleDeg, length, width, color, isHighlight = false) {
                let angleRad = (angleDeg - 90) * Math.PI / 180;
                let x = centerX + length * Math.cos(angleRad);
                let y = centerY + length * Math.sin(angleRad);
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(x, y);
                ctx.lineWidth = width;
                ctx.strokeStyle = color;
                ctx.shadowBlur = isHighlight ? 6 : 2;
                ctx.shadowColor = isHighlight ? "#ff0000aa" : "transparent";
                ctx.stroke();
                // hand cap
                ctx.beginPath();
                ctx.arc(centerX + (length - 8) * Math.cos(angleRad) * 0.3,
                    centerY + (length - 8) * Math.sin(angleRad) * 0.3,
                    width - 1, 0, 2 * Math.PI);
                ctx.fillStyle = color;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.shadowColor = "transparent";
            }

            // ----- Tap-to-select interaction (no drag) -----
            function onCanvasTap(e) {
                e.preventDefault();
                let angle = getAngleFromEvent(e, canvas);
                if (angle === null) return;
                let hand = detectHandNearAngle(angle);
                if (hand) {
                    if (selectedHand === hand) {
                        // deselect
                        selectedHand = null;
                    } else {
                        selectedHand = hand;
                    }
                } else {
                    // tapped empty area – deselect
                    selectedHand = null;
                }
                updateActiveHandMessage();
                drawClock();
            }

            function attachEvents() {
                canvas.addEventListener('mousedown', onCanvasTap);
                canvas.addEventListener('touchstart', onCanvasTap, { passive: false });
                // prevent any drag behavior
                canvas.addEventListener('mousemove', (e) => e.preventDefault());
                canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
                canvas.style.cursor = 'pointer';
            }

            // ----- Button handlers -----
            function bindButtons() {
                document.getElementById('rotateClockwise').addEventListener('click', () => moveSelectedHand(1));
                document.getElementById('rotateCounterClockwise').addEventListener('click', () => moveSelectedHand(-1));
                document.getElementById('randomChallengeBtn').addEventListener('click', generateRandomChallenge);
                document.getElementById('checkMatchBtn').addEventListener('click', checkExplicitMatch);
                document.getElementById('resetCurrentBtn').addEventListener('click', setToCurrentRealTime);
            }

            // ----- Init -----
            function init() {
                const now = new Date();
                hour24 = now.getHours();
                minute = now.getMinutes();
                second = now.getSeconds();
                setNewTime(hour24, minute, second);
                attachEvents();
                bindButtons();
                drawClock();
                updateDigitalDisplay();
                updateActiveHandMessage();
                targetHour24 = null;
                challengeTargetSpan.innerText = "Press 🎲 New Time";
                feedbackDiv.innerHTML = "✨ Tap a hand, then rotate it with the buttons below.";
            }

            init();
        })();
    </script>
</body>
</html>
