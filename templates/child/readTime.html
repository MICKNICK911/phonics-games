<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Clock Lab: Precise Hand Movement</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #1a472a 0%, #0e2a1a 100%);
            font-family: 'Segoe UI', 'Roboto', 'Poppins', system-ui, -apple-system, 'Quicksand', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 8px;
            overflow: hidden;
        }

        .game-container {
            background: #fef5e7;
            border-radius: 36px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.6);
            padding: 12px;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            height: fit-content;
            max-height: 98vh;
            max-height: 98dvh;
        }

        .time-phrase {
            background: #f7e5cc;
            color: #2e241f;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 8px 16px;
            border-radius: 30px;
            text-align: center;
            width: 100%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.3px;
        }

        canvas {
            display: block;
            border-radius: 50%;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3), 0 0 0 6px #f3e1be, 0 0 0 10px #c9a87b;
            background: #fffef7;
            cursor: pointer;
            width: 100%;
            height: auto;
            max-width: 260px;
            aspect-ratio: 1/1;
        }

        .time-panel {
            background: #2e241f;
            color: #fae67a;
            padding: 10px 8px;
            border-radius: 40px;
            width: 100%;
            text-align: center;
            box-shadow: inset 0 2px 4px #1f1814, 0 4px 8px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .digital-clock {
            font-family: 'Fira Mono', 'Courier New', monospace;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 3px;
            background: #0a0a0a;
            padding: 6px 16px;
            border-radius: 36px;
            text-shadow: 0 0 5px #ffd966;
            box-shadow: inset 0 1px 3px #ffecb3, 0 2px 6px black;
        }

        .ampm {
            font-size: 1rem;
            background: #1f2a1b;
            border-radius: 20px;
            padding: 4px 12px;
            font-weight: bold;
            display: inline-block;
        }

        .challenge-area {
            background: #f7e5cc;
            border-radius: 28px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            width: 100%;
            transition: all 0.3s ease;
        }

        .challenge-text {
            font-size: 0.9rem;
            font-weight: bold;
            background: #2e2c2a;
            padding: 4px 12px;
            border-radius: 20px;
            color: #ffe1a0;
            white-space: nowrap;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            width: 100%;
        }

        .btn {
            background: #ffcd94;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 10px 14px;
            border-radius: 32px;
            font-family: inherit;
            color: #3d2b1a;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .btn:active {
            transform: scale(0.94);
            box-shadow: 0 1px 3px black;
        }

        .btn-rotate {
            background: #f6ae2d;
            color: #241f0f;
            font-size: 1.3rem;
            padding: 10px 18px;
        }

        .btn-small {
            font-size: 0.8rem;
            padding: 8px 12px;
        }

        .toggle-buttons {
            display: flex;
            gap: 6px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: #f3e1be;
            border-radius: 28px;
            padding: 6px 14px;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 0.8rem;
            font-weight: 600;
            color: #3d2b1a;
        }

        .toggle-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .toggle-switch {
            width: 36px;
            height: 20px;
            background: #b57c48;
            border-radius: 10px;
            position: relative;
            transition: background 0.2s;
            display: inline-block;
        }

        .toggle-switch::after {
            content: '';
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: left 0.2s;
        }

        input[type="checkbox"]:checked + .toggle-switch {
            background: #2c5e2b;
        }

        input[type="checkbox"]:checked + .toggle-switch::after {
            left: 18px;
        }

        input[type="checkbox"] {
            display: none;
        }

        /* Popup overlays */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(2px);
            animation: fadeIn 0.2s ease;
        }

        .popup-card {
            border-radius: 28px;
            padding: 20px;
            max-width: 280px;
            width: 85%;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: scaleIn 0.25s ease;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .popup-card.success {
            background: #b9f5a0;
            color: #1e4a1a;
        }

        .popup-card.fail {
            background: #ffcfb0;
            color: #a13020;
        }

        .popup-card h3 {
            margin: 0 0 10px 0;
            font-size: 1.3rem;
        }

        .popup-close {
            background: #ffffffaa;
            border: none;
            font-weight: bold;
            padding: 8px 18px;
            border-radius: 24px;
            margin-top: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            color: inherit;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="time-phrase" id="timePhrase">12 o'clock</div>
        <canvas id="clockCanvas" width="400" height="400"></canvas>

        <div class="time-panel">
            <span class="digital-clock" id="digitalTime">--:--:--</span>
            <span class="ampm" id="ampmLabel">--</span>
        </div>

        <div class="challenge-area" id="challengeArea" style="display: none;">
            <span class="challenge-text">🎯 <span id="challengeTarget">--:--</span></span>
            <button class="btn btn-small" id="randomChallengeBtn">🎲 New</button>
            <button class="btn btn-small" id="checkMatchBtn">✅ Check</button>
        </div>

        <div class="button-group">
            <button class="btn btn-rotate" id="rotateCounterClockwise" title="Move anti‑clockwise">⏪</button>
            <button class="btn btn-rotate" id="rotateClockwise" title="Move clockwise">⏩</button>
            <button class="btn btn-small" id="resetCurrentBtn" title="Current time">🕒 Now</button>
        </div>

        <div class="toggle-buttons">
            <button class="btn btn-small" id="challengeToggleBtn">🎯 Challenge</button>
            <button class="btn btn-small" id="instructionToggleBtn">❓ How to</button>
        </div>

        <div class="settings-row">
            <label class="toggle-label">
                <input type="checkbox" id="showSecondsToggle" checked>
                <span class="toggle-switch"></span> Second hand
            </label>
            <label class="toggle-label">
                <input type="checkbox" id="showAmPmToggle" checked>
                <span class="toggle-switch"></span> AM/PM
            </label>
        </div>
    </div>

    <script>
        (function() {
            // DOM
            const canvas = document.getElementById('clockCanvas');
            const ctx = canvas.getContext('2d');
            const digitalSpan = document.getElementById('digitalTime');
            const ampmSpan = document.getElementById('ampmLabel');
            const challengeTargetSpan = document.getElementById('challengeTarget');
            const challengeArea = document.getElementById('challengeArea');
            const timePhraseDiv = document.getElementById('timePhrase');
            const showSecondsCheck = document.getElementById('showSecondsToggle');
            const showAmPmCheck = document.getElementById('showAmPmToggle');

            // State
            let hour24 = 14, minute = 0, second = 0;
            let selectedHand = null;
            let targetHour24 = null, targetMinute = null, targetSecond = null;
            let showSeconds = true;
            let showAmPm = true;

            const centerX = 200, centerY = 200, radius = 180;

            // ---- helpers ----
            function getAngleFromEvent(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                let clientX, clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else if (e.clientX !== undefined) {
                    clientX = e.clientX;
                    clientY = e.clientY;
                } else return null;
                const canvasX = (clientX - rect.left) * scaleX;
                const canvasY = (clientY - rect.top) * scaleY;
                const dx = canvasX - centerX;
                const dy = canvasY - centerY;
                const angleRad = Math.atan2(dy, dx);
                let angleDeg = (angleRad * 180 / Math.PI) + 90;
                return (angleDeg + 360) % 360;
            }

            function getCurrentHandAngles() {
                const hour12 = hour24 % 12;
                const hourAngle = (hour12 * 30 + minute * 0.5) % 360;
                const minuteAngle = minute * 6;
                const secondAngle = second * 6;
                return { hourAngle, minuteAngle, secondAngle };
            }

            function angleDiff(a, b) {
                const diff = Math.abs(a - b);
                return Math.min(diff, 360 - diff);
            }

            function detectHandNearAngle(angleDeg) {
                const angles = getCurrentHandAngles();
                const hourDelta = angleDiff(angleDeg, angles.hourAngle);
                const minuteDelta = angleDiff(angleDeg, angles.minuteAngle);
                let secondDelta = 360;
                if (showSeconds) {
                    secondDelta = angleDiff(angleDeg, angles.secondAngle);
                }
                const THRESH = 28;
                if (hourDelta < THRESH && hourDelta <= minuteDelta && hourDelta <= secondDelta) return 'hour';
                if (minuteDelta < THRESH && minuteDelta <= hourDelta && minuteDelta <= secondDelta) return 'minute';
                if (showSeconds && secondDelta < THRESH && secondDelta <= hourDelta && secondDelta <= minuteDelta) return 'second';
                return null;
            }

            function setNewTime(h, m, s) {
                hour24 = ((Math.round(h) % 24) + 24) % 24;
                minute = Math.min(59, Math.max(0, Math.round(m)));
                if (!showSeconds) s = 0;
                second = Math.min(59, Math.max(0, Math.round(s)));
                refreshAll();
            }

            function moveSelectedHand(direction) {
                if (!selectedHand) return;
                let h = hour24, m = minute, s = second;
                if (selectedHand === 'hour') {
                    h = (h + direction + 24) % 24;
                } else if (selectedHand === 'minute') {
                    let totalMinutes = h * 60 + m + direction;
                    totalMinutes = ((totalMinutes % 1440) + 1440) % 1440;
                    h = Math.floor(totalMinutes / 60);
                    m = totalMinutes % 60;
                } else if (selectedHand === 'second' && showSeconds) {
                    let totalSeconds = h * 3600 + m * 60 + s + direction;
                    totalSeconds = ((totalSeconds % 86400) + 86400) % 86400;
                    h = Math.floor(totalSeconds / 3600);
                    m = Math.floor((totalSeconds % 3600) / 60);
                    s = totalSeconds % 60;
                }
                setNewTime(h, m, s);
            }

            function refreshAll() {
                updateDigitalDisplay();
                updateTimePhrase();
                drawClock();
                updateAmPmVisibility();
                if (challengeArea.style.display !== 'none') {
                    challengeTargetSpan.textContent = formatChallengeTarget();
                }
            }

            function updateDigitalDisplay() {
                let hour12 = hour24 % 12;
                if (hour12 === 0) hour12 = 12;
                let timeStr = `${hour12.toString().padStart(2, ' ')}:${minute.toString().padStart(2, '0')}`;
                if (showSeconds) {
                    timeStr += `:${second.toString().padStart(2, '0')}`;
                }
                digitalSpan.innerText = timeStr;
                ampmSpan.innerText = hour24 >= 12 ? 'PM' : 'AM';
            }

            function updateAmPmVisibility() {
                ampmSpan.style.display = showAmPm ? 'inline-block' : 'none';
            }

            function generateTimePhrase() {
                const hour12 = hour24 % 12 === 0 ? 12 : hour24 % 12;
                const nextHour12 = (hour12 % 12) + 1;
                const period = showAmPm ? (hour24 >= 12 ? ' PM' : ' AM') : '';

                if (minute === 0) {
                    return `${hour12} o'clock${period}`;
                } else if (minute === 15) {
                    return `Quarter past ${hour12}${period}`;
                } else if (minute === 30) {
                    return `Half past ${hour12}${period}`;
                } else if (minute === 45) {
                    return `Quarter to ${nextHour12}${period}`;
                } else if (minute < 30) {
                    return `${minute} minute${minute !== 1 ? 's' : ''} past ${hour12}${period}`;
                } else {
                    const toMin = 60 - minute;
                    return `${toMin} minute${toMin !== 1 ? 's' : ''} to ${nextHour12}${period}`;
                }
            }

            function updateTimePhrase() {
                timePhraseDiv.textContent = generateTimePhrase();
            }

            // ---- challenge ----
            function formatChallengeTarget() {
                if (targetHour24 === null) return "--:--";
                const h12 = targetHour24 % 12 || 12;
                const minStr = targetMinute.toString().padStart(2, '0');
                let str = `${h12}:${minStr}`;
                if (showSeconds) {
                    str += `:${targetSecond.toString().padStart(2, '0')}`;
                }
                if (showAmPm) {
                    str += ` ${targetHour24 >= 12 ? 'PM' : 'AM'}`;
                }
                return str;
            }

            function generateRandomChallenge() {
                targetHour24 = Math.floor(Math.random() * 24);
                targetMinute = Math.floor(Math.random() * 60);
                targetSecond = showSeconds ? Math.floor(Math.random() * 60) : 0;
                challengeTargetSpan.textContent = formatChallengeTarget();
            }

            function checkChallengeMatch() {
                if (targetHour24 === null) {
                    showResultPopup(false, 'Please generate a challenge first.');
                    return;
                }
                let match;
                if (!showAmPm) {
                    const currentHour12 = hour24 % 12 === 0 ? 12 : hour24 % 12;
                    const targetHour12 = targetHour24 % 12 === 0 ? 12 : targetHour24 % 12;
                    match = currentHour12 === targetHour12 && minute === targetMinute;
                } else {
                    match = hour24 === targetHour24 && minute === targetMinute;
                }
                if (showSeconds) match = match && second === targetSecond;

                showResultPopup(match, match ? '🎉 Well done! You matched the time!' : '⏰ Try again! Keep adjusting.');
            }

            // ---- popups ----
            function showResultPopup(success, message) {
                const overlay = document.createElement('div');
                overlay.className = 'popup-overlay';
                const card = document.createElement('div');
                card.className = `popup-card ${success ? 'success' : 'fail'}`;
                card.innerHTML = `
                    <div style="font-size: 2.5rem; margin-bottom: 10px;">${success ? '🎉' : '⏰'}</div>
                    <div>${message}</div>
                    <button class="popup-close">OK</button>
                `;
                overlay.appendChild(card);
                document.body.appendChild(overlay);

                const close = () => overlay.remove();
                card.querySelector('.popup-close').addEventListener('click', close);
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) close();
                });
                setTimeout(close, 2500);
            }

            function showInstructionPopup() {
                const overlay = document.createElement('div');
                overlay.className = 'popup-overlay';
                overlay.innerHTML = `
                    <div class="popup-card" style="background: #fff8e7; color: #3a2c1a; font-weight: normal; text-align: left;">
                        <h3 style="text-align:center;">📖 How to Use</h3>
                        <p><strong>1. Select:</strong> Tap an hour, minute or second hand. It turns <span style="color:#d32f2f;">red</span>.</p>
                        <p><strong>2. Move:</strong> Use ⏩ (clockwise) or ⏪ (anti‑clockwise). Each tap moves it by one unit.</p>
                        <p><strong>3. Challenge:</strong> Tap <em>🎯 Challenge</em> to see a target time. Match it and press <em>✅ Check</em>.</p>
                        <p><strong>4. Toggle:</strong> Use the switches to show/hide the second hand or AM/PM indicator.</p>
                        <p><strong>5. Tap again</strong> on the same red hand to deselect.</p>
                        <button class="popup-close" style="background:#c9a87b;">Got it</button>
                    </div>
                `;
                document.body.appendChild(overlay);
                const close = () => overlay.remove();
                overlay.querySelector('.popup-close').addEventListener('click', close);
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) close();
                });
            }

            // ---- drawing ----
            function drawClock() {
                ctx.clearRect(0, 0, 400, 400);
                // dial
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = "#fffbf0";
                ctx.fill();
                ctx.strokeStyle = "#b57c48";
                ctx.lineWidth = 5;
                ctx.stroke();
                // ticks
                for (let i = 0; i < 60; i++) {
                    const angle = (i * 6 - 90) * Math.PI / 180;
                    let startRad = radius - 12;
                    let endRad = radius - 4;
                    if (i % 5 === 0) {
                        startRad = radius - 20;
                        endRad = radius - 6;
                        ctx.lineWidth = 3;
                    } else {
                        ctx.lineWidth = 1.5;
                    }
                    ctx.beginPath();
                    ctx.moveTo(centerX + startRad * Math.cos(angle), centerY + startRad * Math.sin(angle));
                    ctx.lineTo(centerX + endRad * Math.cos(angle), centerY + endRad * Math.sin(angle));
                    ctx.strokeStyle = "#6b4c2c";
                    ctx.stroke();
                }
                // numbers
                ctx.font = "bold 22px 'Segoe UI', 'Quicksand'";
                ctx.fillStyle = "#3e2a1f";
                for (let i = 1; i <= 12; i++) {
                    const angle = (i * 30 - 90) * Math.PI / 180;
                    const x = centerX + (radius - 32) * Math.cos(angle) - 10;
                    const y = centerY + (radius - 32) * Math.sin(angle) + 8;
                    ctx.fillText(i.toString(), x, y);
                }
                // normal hands
                const angles = getCurrentHandAngles();
                drawHand(angles.hourAngle, radius - 55, 7, "#2C3E2B");
                drawHand(angles.minuteAngle, radius - 35, 5, "#2C5282");
                if (showSeconds) {
                    drawHand(angles.secondAngle, radius - 25, 2.5, "#C44536");
                }
                // center dot
                ctx.beginPath();
                ctx.arc(centerX, centerY, 8, 0, 2 * Math.PI);
                ctx.fillStyle = "#b87333";
                ctx.fill();
                ctx.beginPath();
                ctx.arc(centerX, centerY, 3, 0, 2 * Math.PI);
                ctx.fillStyle = "#f9e0a0";
                ctx.fill();
                // highlight selected hand
                if (selectedHand) {
                    if (selectedHand === 'hour') drawHand(angles.hourAngle, radius - 55, 8, "#d32f2f", true);
                    else if (selectedHand === 'minute') drawHand(angles.minuteAngle, radius - 35, 6, "#d32f2f", true);
                    else if (selectedHand === 'second' && showSeconds) drawHand(angles.secondAngle, radius - 25, 3.5, "#d32f2f", true);
                }
            }

            function drawHand(angleDeg, length, width, color, highlight = false) {
                const angleRad = (angleDeg - 90) * Math.PI / 180;
                const x = centerX + length * Math.cos(angleRad);
                const y = centerY + length * Math.sin(angleRad);
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(x, y);
                ctx.lineWidth = width;
                ctx.strokeStyle = color;
                ctx.shadowBlur = highlight ? 6 : 2;
                ctx.shadowColor = highlight ? "#ff0000aa" : "transparent";
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(centerX + (length - 8) * Math.cos(angleRad) * 0.3,
                        centerY + (length - 8) * Math.sin(angleRad) * 0.3,
                        width - 1, 0, 2 * Math.PI);
                ctx.fillStyle = color;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.shadowColor = "transparent";
            }

            // ---- interaction ----
            function onCanvasTap(e) {
                e.preventDefault();
                const angle = getAngleFromEvent(e);
                if (angle === null) return;
                const hand = detectHandNearAngle(angle);
                if (hand) {
                    selectedHand = (selectedHand === hand) ? null : hand;
                } else {
                    selectedHand = null;
                }
                drawClock();
            }

            // ---- event binding ----
            function attachEvents() {
                canvas.addEventListener('mousedown', onCanvasTap);
                canvas.addEventListener('touchstart', onCanvasTap, { passive: false });
                canvas.addEventListener('mousemove', (e) => e.preventDefault());
                canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
            }

            function bindControls() {
                document.getElementById('rotateClockwise').addEventListener('click', () => moveSelectedHand(1));
                document.getElementById('rotateCounterClockwise').addEventListener('click', () => moveSelectedHand(-1));
                document.getElementById('resetCurrentBtn').addEventListener('click', () => {
                    const now = new Date();
                    setNewTime(now.getHours(), now.getMinutes(), now.getSeconds());
                });
                document.getElementById('randomChallengeBtn').addEventListener('click', generateRandomChallenge);
                document.getElementById('checkMatchBtn').addEventListener('click', checkChallengeMatch);
                document.getElementById('challengeToggleBtn').addEventListener('click', () => {
                    const visible = challengeArea.style.display !== 'none';
                    challengeArea.style.display = visible ? 'none' : 'flex';
                    if (!visible && targetHour24 === null) {
                        generateRandomChallenge();
                    }
                });
                document.getElementById('instructionToggleBtn').addEventListener('click', showInstructionPopup);

                showSecondsCheck.addEventListener('change', (e) => {
                    showSeconds = e.target.checked;
                    if (!showSeconds) {
                        if (selectedHand === 'second') selectedHand = null;
                        second = 0;
                    }
                    refreshAll();
                });
                showAmPmCheck.addEventListener('change', (e) => {
                    showAmPm = e.target.checked;
                    refreshAll();
                });
            }

            // ---- init ----
            function init() {
                const now = new Date();
                hour24 = now.getHours();
                minute = now.getMinutes();
                second = now.getSeconds();
                showSeconds = showSecondsCheck.checked;
                showAmPm = showAmPmCheck.checked;
                setNewTime(hour24, minute, second);
                attachEvents();
                bindControls();
                drawClock();
                updateAmPmVisibility();
                challengeArea.style.display = 'none';
            }

            init();
        })();
    </script>
</body>
</html>
