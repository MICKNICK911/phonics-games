<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Math Grid Quest – Fixed Rounds</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      min-height: 100vh;
      color: #eee;
      -webkit-tap-highlight-color: transparent;
    }
    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 10px;
      font-weight: bold;
      flex-wrap: wrap;
      justify-content: center;
    }
    .stat {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      color: #ffd700;
      padding: 6px 18px;
      border-radius: 25px;
      font-size: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: transform 0.2s;
      border: 2px solid rgba(255,255,255,0.3);
    }
    .circle:active { transform: scale(0.9); }
    .yellow { background: #ffb300; }
    .equation {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      color: #ffeb3b;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      font-weight: bold;
      padding: 12px 25px;
      border-radius: 15px;
      min-width: 200px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(10, minmax(30px, 10vw));
      gap: 2px;
      background: #222;
      padding: 2px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      width: 100%;
      max-width: 600px;
      justify-content: center;
    }
    .cell {
      background: rgba(255,255,255,0.9);
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(0.8rem, 2.5vw, 1.2rem);
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s;
      color: #1a1a1a;
    }
    .cell:hover { background: #f0f0f0; }
    .cell.locked {
      cursor: not-allowed;
      pointer-events: none;
    }
    .cell.start-highlight {
      background: #64b5f6 !important;
      color: #0d47a1;
      transform: scale(1.1);
      box-shadow: 0 0 0 4px rgba(100, 181, 246, 0.7);
      border-radius: 50%;
      z-index: 2;
    }
    .selected {
      background: #4caf50 !important;
      color: white;
      transform: scale(1.15);
      box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.7);
      border-radius: 50%;
      z-index: 3;
    }
    .trail-green {
      background: #a5d6a7 !important;
      color: #1b5e20;
    }
    .trail-red {
      background: #ef9a9a !important;
      color: #c62828;
    }
    .controls {
      display: flex;
      gap: 30px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 20px;
    }
    .dpad {
      display: grid;
      grid-template-columns: auto auto auto;
      grid-template-rows: auto auto auto;
      gap: 6px;
      justify-content: center;
      align-items: center;
    }
    .dpad button {
      width: 55px;
      height: 55px;
      background: #e63946;
      border: none;
      border-radius: 12px;
      font-size: 1.5rem;
      color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: 0.15s;
      font-weight: bold;
    }
    .dpad button:active { transform: scale(0.85); }
    .dpad .up    { grid-column: 2; grid-row: 1; }
    .dpad .left  { grid-column: 1; grid-row: 2; }
    .dpad .right { grid-column: 3; grid-row: 2; }
    .dpad .down  { grid-column: 2; grid-row: 3; }
    .action-btn {
      padding: 14px 28px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: 0.2s;
    }
    .action-btn:active { transform: translateY(2px); }
    .check { background: #2ecc71; }
    .reset { background: #3498db; }
    .feedback-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .feedback-content {
      background: #2c3e50;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      max-width: 90%;
      width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      color: #ecf0f1;
    }
    .feedback-content h2 { font-size: 1.8rem; margin-bottom: 15px; }
    .success { color: #2ecc71; }
    .fail { color: #e74c3c; }
    .victory { color: #f1c40f; }
    .modal-stats { margin: 20px 0; font-size: 1.1rem; line-height: 1.6; }
    button.close, button.modal-btn {
      margin-top: 15px;
      padding: 12px 25px;
      font-size: 1.1rem;
      background: #e67e22;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .warning-message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(231, 76, 60, 0.95);
      color: white;
      padding: 15px 25px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      z-index: 2000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    .warning-message.show {
      opacity: 1;
      animation: shake 0.5s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
      25% { transform: translate(-50%, -50%) rotate(-3deg); }
      75% { transform: translate(-50%, -50%) rotate(3deg); }
    }
    @media (max-width: 500px) {
      .dpad button { width: 45px; height: 45px; font-size: 1.3rem; }
      .action-btn { padding: 12px 20px; font-size: 1rem; }
    }
  </style>
</head>
<body>

  <div class="stats">
    <div class="stat">⭐ <span id="scoreDisplay">0</span></div>
    <div class="stat">📊 <span id="levelDisplay">1</span></div>
    <div class="stat" id="modeDisplay">Round 1/15</div>
  </div>

  <div class="header">
    <div class="circle yellow" id="yellowBtn">❔</div>
    <div class="equation" id="equation">1 + 4 = ?</div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="controls">
    <div class="dpad">
      <button class="up" id="up">-10</button>
      <button class="left" id="left">-1</button>
      <button class="right" id="right">+1</button>
      <button class="down" id="down">+10</button>
    </div>
    <div>
      <button class="action-btn check" id="check">✓ CHECK</button>
      <button class="action-btn reset" id="reset" style="margin-top:10px;">↺ RESET</button>
    </div>
  </div>

  <!-- Warning toast -->
  <div class="warning-message" id="warningToast"></div>

  <!-- Feedback Modal (also used for victory) -->
  <div class="feedback-modal" id="feedbackModal">
    <div class="feedback-content">
      <h2 id="feedbackTitle"></h2>
      <div class="modal-stats" id="modalStats"></div>
      <button class="modal-btn" id="modalButton">Continue</button>
    </div>
  </div>

  <!-- How to Play Modal -->
  <div class="feedback-modal" id="howToPlayModal">
    <div class="feedback-content">
      <h2>How to Play</h2>
      <p style="text-align:left; margin:10px 0;">1. Tap the <strong>first number</strong> in the equation to start.</p>
      <p style="text-align:left; margin:10px 0;">2. Once started, <strong>grid taps are locked</strong> – only D‑pad works.</p>
      <p style="text-align:left; margin:10px 0;">3. Use D‑pad or arrow keys to <strong>navigate</strong> to the answer.</p>
      <p style="text-align:left; margin:10px 0;">4. Reach the correct answer and tap CHECK.</p>
      <button class="close" id="howToPlayCloseBtn">Got it!</button>
    </div>
  </div>

  <script>
    (function() {
      // ---------- Hard‑coded Rounds (the single source of truth) ----------
      const rounds = [
        { a: 1,  b: 2, op: '+', answer: 3 },
        { a: 5,  b: 3, op: '+', answer: 8 },
        { a: 9,  b: 3, op: '-', answer: 6 },
        { a: 4,  b: 4, op: '+', answer: 8 },
        { a: 10, b: 7, op: '-', answer: 3 },
        { a: 6,  b: 4, op: '-', answer: 2 },
        { a: 23, b: 9, op: '+', answer: 32 },
        { a: 45, b: 23, op: '-', answer: 22 },
        { a: 78, b: 35, op: '-', answer: 43 },
        { a: 12, b: 15, op: '+', answer: 27 },
        { a: 56, b: 14, op: '+', answer: 70 },
        { a: 91, b: 47, op: '-', answer: 44 },
        { a: 39, b: 42, op: '+', answer: 81 },
        { a: 63, b: 32, op: '+', answer: 95 },
        { a: 99, b: 55, op: '-', answer: 44 }
      ];

      const TOTAL_ROUNDS = rounds.length;

      // Game State
      let currentRow = null;
      let currentCol = null;
      let startRow = null;
      let startCol = null;
      let correctAnswer = 0;
      let operation = '+';
      let firstNumber = 0;
      let secondNumber = 0;
      let greenTrail = new Set();
      let redTrail = new Set();
      let gameStarted = false;
      let gridLocked = false;       // Grid taps locked after start
      let hasNavigated = false;
      let score = 0;
      let level = 1;
      let startTime = Date.now();
      let currentRoundIndex = 0;
      let modalAutoCloseTimer = null;
      let warningTimer = null;

      const gridEl = document.getElementById('grid');
      const equationEl = document.getElementById('equation');
      const scoreDisplay = document.getElementById('scoreDisplay');
      const levelDisplay = document.getElementById('levelDisplay');
      const modeDisplay = document.getElementById('modeDisplay');
      const feedbackModal = document.getElementById('feedbackModal');
      const feedbackTitle = document.getElementById('feedbackTitle');
      const modalStats = document.getElementById('modalStats');
      const modalButton = document.getElementById('modalButton');
      const howToPlayModal = document.getElementById('howToPlayModal');
      const warningToast = document.getElementById('warningToast');

      // Sound
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      document.addEventListener('click', () => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }, { once: true });

      function playSound(freq, duration, type = 'sine', volume = 0.3) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.value = volume;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        setTimeout(() => osc.stop(), duration);
      }
      function playSuccess() { playSound(800, 150); setTimeout(() => playSound(1000, 150), 150); setTimeout(() => playSound(1200, 300), 350); }
      function playFail() { playSound(400, 200, 'sawtooth', 0.5); setTimeout(() => playSound(300, 400, 'sawtooth', 0.5), 200); }
      function playMove() { playSound(600, 50, 'triangle', 0.2); }
      function playWarning() { playSound(300, 100, 'square', 0.3); setTimeout(() => playSound(250, 150, 'square', 0.3), 100); }

      function lockGrid() {
        gridLocked = true;
        const cells = getCellElements();
        cells.forEach(cell => cell.classList.add('locked'));
      }

      function unlockGrid() {
        gridLocked = false;
        const cells = getCellElements();
        cells.forEach(cell => cell.classList.remove('locked'));
      }

      function createGrid() {
        gridEl.innerHTML = '';
        for (let i = 1; i <= 100; i++) {
          const cell = document.createElement('div');
          cell.classList.add('cell');
          cell.textContent = i;
          cell.dataset.number = i;
          cell.addEventListener('click', () => handleCellClick(i));
          gridEl.appendChild(cell);
        }
      }

      const getCellElements = () => [...gridEl.children];

      function showWarning(message) {
        clearTimeout(warningTimer);
        playWarning();
        warningToast.textContent = message;
        warningToast.classList.add('show');
        warningTimer = setTimeout(() => {
          warningToast.classList.remove('show');
        }, 2000);
      }

      function handleCellClick(num) {
        // If grid is locked, reject all taps
        if (gridLocked) {
          showWarning('🔒 Grid locked! Use D‑pad or press RESET.');
          return;
        }

        const index = num - 1;
        const clickedRow = Math.floor(index / 10);
        const clickedCol = index % 10;

        if (!gameStarted) {
          // Must start on the first number
          if (num === firstNumber) {
            gameStarted = true;
            currentRow = clickedRow;
            currentCol = clickedCol;
            startRow = clickedRow;
            startCol = clickedCol;
            hasNavigated = false;
            greenTrail.clear();
            redTrail.clear();
            greenTrail.add(num);
            lockGrid();  // Lock immediately after start
            highlightCurrent();
            updateEquation();
          } else {
            showWarning(`⚠️ Start at ${firstNumber} first!`);
          }
        }
        // No else – grid is locked after game starts, so this path is unreachable
      }

      function highlightCurrent() {
        const cells = getCellElements();
        cells.forEach(cell => {
          cell.classList.remove('selected', 'start-highlight', 'trail-green', 'trail-red');
          const num = parseInt(cell.dataset.number);
          if (greenTrail.has(num)) cell.classList.add('trail-green');
          if (redTrail.has(num)) cell.classList.add('trail-red');
        });

        // Highlight starting cell if not covered by trail
        if (startRow !== null && startCol !== null) {
          const startIdx = startRow * 10 + startCol;
          const startNum = startRow * 10 + startCol + 1;
          if (cells[startIdx] && !greenTrail.has(startNum) && !redTrail.has(startNum)) {
            cells[startIdx].classList.add('start-highlight');
          }
        }

        // Highlight current position
        if (currentRow !== null) {
          const idx = currentRow * 10 + currentCol;
          if (cells[idx]) {
            cells[idx].classList.add('selected');
          }
        }
      }

      function generateEquation() {
        clearTimeout(modalAutoCloseTimer);
        if (currentRoundIndex >= TOTAL_ROUNDS) return;

        const round = rounds[currentRoundIndex];
        operation = round.op;
        firstNumber = round.a;
        secondNumber = round.b;
        correctAnswer = round.answer;
        equationEl.textContent = `${firstNumber} ${operation} ${secondNumber} = ?`;

        greenTrail.clear();
        redTrail.clear();
        currentRow = null;
        currentCol = null;
        startRow = null;
        startCol = null;
        hasNavigated = false;
        gameStarted = false;
        unlockGrid();  // Unlock for new round

        highlightCurrent();
        level = currentRoundIndex + 1;
        levelDisplay.textContent = level;
        modeDisplay.textContent = `Round ${level}/${TOTAL_ROUNDS}`;
      }

      function updateEquation() {
        if (currentRow === null || correctAnswer === 0) return;
        const currentNum = currentRow * 10 + currentCol + 1;
        const base = equationEl.textContent.split('=')[0].trim();
        equationEl.textContent = `${base} = ${currentNum}`;
      }

      function move(direction) {
        if (currentRow === null || correctAnswer === 0) return;
        playMove();
        hasNavigated = true;

        let isForwardOrDown = false;
        switch(direction) {
          case 'right':
            currentCol++;
            if (currentCol > 9) { currentCol = 0; currentRow = (currentRow + 1) % 10; }
            isForwardOrDown = true;
            break;
          case 'left':
            currentCol--;
            if (currentCol < 0) { currentCol = 9; currentRow = (currentRow - 1 + 10) % 10; }
            isForwardOrDown = false;
            break;
          case 'down':
            currentRow++;
            if (currentRow > 9) { currentRow = 0; currentCol = (currentCol + 1) % 10; }
            isForwardOrDown = true;
            break;
          case 'up':
            currentRow--;
            if (currentRow < 0) { currentRow = 9; currentCol = (currentCol - 1 + 10) % 10; }
            isForwardOrDown = false;
            break;
        }

        const currentNum = currentRow * 10 + currentCol + 1;
        if (isForwardOrDown) {
          greenTrail.add(currentNum);
        } else {
          redTrail.add(currentNum);
        }

        // Ensure start cell is green
        if (startRow !== null && startCol !== null) {
          const startNum = startRow * 10 + startCol + 1;
          if (!greenTrail.has(startNum) && !redTrail.has(startNum)) {
            greenTrail.add(startNum);
          }
        }

        highlightCurrent();
        updateEquation();
      }

      function gameWon() {
        playSuccess();
        const timeSpent = Math.floor((Date.now() - startTime) / 1000);
        feedbackTitle.innerHTML = '🏆 You Win!';
        feedbackTitle.className = 'victory';
        modalStats.innerHTML = `Final Score: <strong>${score}</strong><br>Rounds Completed: <strong>${TOTAL_ROUNDS}</strong><br>Time: ${timeSpent}s`;
        modalButton.textContent = 'Play Again';
        modalButton.onclick = resetGame;
        feedbackModal.style.display = 'flex';
      }

      function showFeedback(isCorrect) {
        clearTimeout(modalAutoCloseTimer);
        if (isCorrect) {
          playSuccess();
          const timeSpent = Math.floor((Date.now() - startTime) / 1000);
          feedbackTitle.innerHTML = `✅ Round ${level} Complete!`;
          feedbackTitle.className = 'success';
          modalStats.innerHTML = `Score: <strong>${score}</strong><br>Time: ${timeSpent}s`;
          modalButton.textContent = 'Next';

          let handled = false;
          const advance = () => {
            if (handled) return;
            handled = true;
            feedbackModal.style.display = 'none';
            currentRoundIndex++;
            if (currentRoundIndex >= TOTAL_ROUNDS) {
              gameWon();
            } else {
              generateEquation();
            }
          };

          modalButton.onclick = advance;
          modalAutoCloseTimer = setTimeout(advance, 2000);
          feedbackModal.style.display = 'flex';
        } else {
          playFail();
          const timeSpent = Math.floor((Date.now() - startTime) / 1000);
          feedbackTitle.innerHTML = `❌ Game Over`;
          feedbackTitle.className = 'fail';
          modalStats.innerHTML = `Final Score: <strong>${score}</strong><br>Round Reached: <strong>${level}</strong><br>Time Played: <strong>${timeSpent}s</strong>`;
          modalButton.textContent = 'Restart';
          modalButton.onclick = resetGame;
          feedbackModal.style.display = 'flex';
        }
      }

      function checkAnswer() {
        if (currentRow === null || correctAnswer === 0) {
          showWarning('⚠️ Tap the first number to start!');
          return;
        }

        if (!hasNavigated) {
          showWarning('⚠️ Use D‑pad to navigate from the starting number!');
          return;
        }

        const selectedNum = currentRow * 10 + currentCol + 1;
        if (selectedNum === correctAnswer) {
          score += 10 + Math.floor(level * 2);
          scoreDisplay.textContent = score;
          showFeedback(true);
        } else {
          showFeedback(false);
        }
      }

      function resetGame() {
        clearTimeout(modalAutoCloseTimer);
        clearTimeout(warningTimer);
        feedbackModal.style.display = 'none';
        warningToast.classList.remove('show');
        score = 0;
        level = 1;
        currentRoundIndex = 0;
        currentRow = null;
        currentCol = null;
        startRow = null;
        startCol = null;
        greenTrail.clear();
        redTrail.clear();
        gameStarted = false;
        hasNavigated = false;
        unlockGrid();
        startTime = Date.now();
        scoreDisplay.textContent = '0';
        levelDisplay.textContent = '1';
        modeDisplay.textContent = `Round 1/${TOTAL_ROUNDS}`;
        generateEquation();
      }

      function closeAllModals() {
        [feedbackModal, howToPlayModal].forEach(m => m.style.display = 'none');
        clearTimeout(modalAutoCloseTimer);
      }

      function initControls() {
        document.getElementById('yellowBtn').addEventListener('click', () => {
          closeAllModals();
          howToPlayModal.style.display = 'flex';
        });

        // D-pad
        document.getElementById('up').addEventListener('click', () => move('up'));
        document.getElementById('down').addEventListener('click', () => move('down'));
        document.getElementById('left').addEventListener('click', () => move('left'));
        document.getElementById('right').addEventListener('click', () => move('right'));

        document.getElementById('check').addEventListener('click', checkAnswer);
        document.getElementById('reset').addEventListener('click', resetGame);

        // Keyboard
        document.addEventListener('keydown', e => {
          if (e.key === 'ArrowUp') { e.preventDefault(); move('up'); }
          if (e.key === 'ArrowDown') { e.preventDefault(); move('down'); }
          if (e.key === 'ArrowLeft') { e.preventDefault(); move('left'); }
          if (e.key === 'ArrowRight') { e.preventDefault(); move('right'); }
          if (e.key === 'Enter') checkAnswer();
        });

        // Close modals on overlay click
        document.querySelectorAll('.feedback-modal').forEach(modal => {
          modal.addEventListener('click', (e) => {
            if (e.target === modal) {
              modal.style.display = 'none';
              clearTimeout(modalAutoCloseTimer);
            }
          });
        });

        document.getElementById('howToPlayCloseBtn').addEventListener('click', () => {
          howToPlayModal.style.display = 'none';
        });
      }

      function init() {
        createGrid();
        generateEquation();
        initControls();
        scoreDisplay.textContent = '0';
        levelDisplay.textContent = '1';
        modeDisplay.textContent = `Round 1/${TOTAL_ROUNDS}`;
        startTime = Date.now();
      }

      init();
    })();
  </script>
</body>
</html>
