<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Quiz Tug of War · Two‑Player</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg:#0b1120; --surface:#111b2e; --text:#f1f5f9; --text-dim:#94a3b8;
            --border:#1e293b; --radius:16px;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            height: 100dvh; display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: clamp(8px,2vh,20px);
            user-select: none; -webkit-tap-highlight-color: transparent;
        }
        .game-layout {
            display: flex; flex-direction: column; width:100%; height:100%;
            gap: clamp(8px,1.5vh,24px); max-width:1400px;
        }
        .top-area {
            display: flex; flex-direction: column; align-items: center;
            gap: clamp(6px,1.2vh,18px); width:100%;
        }
        .shared-question {
            font-size: clamp(1.5rem, 3vw, 2.5rem); font-weight:800;
            background: rgba(0,0,0,0.4); padding: clamp(0.6rem,1.5vw,1.5rem) clamp(1rem,2vw,2rem);
            border-radius:2rem; text-align:center; line-height:1.4; word-break:break-word;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border:2px solid var(--border); width:100%;
        }
        .war-bar-container {
            width:100%; height: clamp(45px, 8vh, 100px); position: relative;
            background: white; border-radius: 50px; overflow: hidden;
            box-shadow: 0 6px 25px rgba(0,0,0,0.7);
        }
        .war-bar-blue, .war-bar-red {
            position:absolute; top:0; height:100%;
            transition: width 0.6s cubic-bezier(0.2,0.9,0.4,1);
        }
        .war-bar-blue { left:0; border-radius:50px 0 0 50px; }
        .war-bar-red { right:0; border-radius:0 50px 50px 0; }
        .bar-divider {
            position:absolute; top:5%; height:90%; width:5px; background:white;
            box-shadow:0 0 20px white; border-radius:5px;
            transition: left 0.6s cubic-bezier(0.2,0.9,0.4,1); z-index:5;
        }
        .bar-scores {
            position:absolute; top:0; left:0; right:0; bottom:0;
            pointer-events:none; z-index:10; display:flex;
            justify-content:space-between; align-items:center; padding:0 20px;
        }
        .bar-score {
            font-weight:900; font-size: clamp(1.2rem, 2.5vw, 2.2rem); color:white;
            text-shadow:0 2px 10px black; line-height:1;
        }
        .players-row {
            display: flex; gap: clamp(8px,1.5vw,24px); width:100%;
            flex:1; min-height:0;
        }
        .player-panel {
            flex:1; background: var(--surface); border-radius: var(--radius);
            border:2px solid var(--border); padding: clamp(8px,1.5vh,24px);
            display: flex; flex-direction: column; align-items: center;
            gap: clamp(6px,1vh,14px); min-width:0;
        }
        .player-panel.p1 { border-top:4px solid #3b82f6; }
        .player-panel.p2 { border-top:4px solid #ef4444; }
        .player-name {
            font-weight:700; font-size: clamp(0.9rem,1.8vw,1.4rem); letter-spacing:1px;
            background: rgba(255,255,255,0.05); padding:0.3rem 0.9rem; border-radius:2rem;
            white-space: nowrap;
        }
        .score-badge {
            font-size:0.8rem; font-weight:600; color: var(--text-dim);
            background: rgba(255,255,255,0.05); padding:0.2rem 0.8rem; border-radius:1rem;
        }
        .answer-box {
            background: #0f172a; border:2px solid #334155; border-radius:1rem;
            padding:0.5rem 1rem; font-size: clamp(1rem,2vw,1.8rem);
            font-weight:700; text-align:center; min-width:120px;
            transition: border-color 0.2s, background 0.2s;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            max-width: 90%;
        }
        .answer-box.placeholder { color: #475569; font-weight:400; font-size:0.9rem; }
        .options-grid {
            display: grid; gap:8px; width:100%; max-width:400px;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        }
        .option-btn {
            font-size: clamp(0.8rem,1.6vw,1.3rem); font-weight:600;
            background:#1e293b; border:2px solid #334155; border-radius:0.8rem;
            color:white; cursor:pointer; transition: all 0.1s;
            padding:0.6rem; min-height:48px;
            display:flex; align-items:center; justify-content:center;
            word-break:break-word; text-align:center; line-height:1.3;
            touch-action:manipulation;
        }
        .option-btn:active { transform:scale(0.92); background:#0f172a; }
        .option-btn:disabled { opacity:0.4; pointer-events:none; }
        .option-btn.selected { border-color:#fbbf24; background:#1e3a2f; box-shadow:0 0 14px rgba(251,191,36,0.45); }
        .action-row { display:flex; gap:8px; width:100%; max-width:400px; }
        .action-btn {
            flex:1; padding:0.6rem; font-weight:700; font-size:0.9rem;
            border:none; border-radius:2rem; cursor:pointer; text-transform:uppercase;
            letter-spacing:0.5px; transition:0.15s; display:flex;
            align-items:center; justify-content:center; gap:0.3rem;
        }
        .undo-btn { background:#f59e0b; color:#0f172a; }
        .undo-btn:active { background:#b45309; }
        .check-btn { background:#22c55e; color:white; }
        .check-btn:active { background:#15803d; }
        .action-btn:disabled { opacity:0.5; pointer-events:none; }
        .feedback-flash { animation: flashBorder 0.5s ease-out; }
        @keyframes flashBorder {
            0% { border-color:#22c55e; box-shadow:0 0 20px #22c55e; }
            100% { border-color:#334155; box-shadow:none; }
        }
        .wrong-flash { animation: shake 0.4s ease; }
        @keyframes shake {
            0%,100%{ transform:translateX(0); }
            20%{ transform:translateX(-6px); }
            40%{ transform:translateX(6px); }
            60%{ transform:translateX(-4px); }
            80%{ transform:translateX(4px); }
        }
        .center-column {
            flex: 0 0 clamp(200px, 28vw, 340px);
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 0.8rem;
        }
        .settings-toggle {
            background:none; border:2px solid #334155; color:#cbd5e1;
            border-radius:2rem; padding:0.3rem 1rem; font-weight:600;
            font-size:0.8rem; cursor:pointer; transition:0.2s;
            display:flex; align-items:center; gap:0.4rem;
        }
        .settings-toggle:hover { background:#1e293b; }
        .settings-panel {
            display:none; background:#1e293b; border-radius:1rem;
            padding:0.8rem; width:100%; flex-direction:column; gap:0.6rem;
            border:1px solid #334155; max-height:50vh; overflow-y:auto;
        }
        .settings-panel.open { display:flex; }
        .setting-row {
            display:flex; justify-content:space-between; align-items:center;
            flex-wrap:wrap; gap:0.3rem;
        }
        .setting-row label { font-size:0.75rem; font-weight:500; color:#cbd5e1; }
        .setting-row input[type="text"],
        .setting-row input[type="number"] {
            background:#0f172a; border:1px solid #334155; color:white;
            padding:0.3rem 0.5rem; border-radius:0.5rem; font-weight:600; text-align:center;
        }
        .setting-row input[type="text"] { width:80px; }
        .setting-row input[type="number"] { width:55px; }
        .color-selector {
            display:flex; align-items:center; gap:0.4rem;
        }
        .color-selector select {
            background:#0f172a; border:1px solid #334155; color:white;
            padding:0.3rem 0.5rem; border-radius:0.5rem; font-weight:600;
            font-size:0.75rem; max-width:120px;
        }
        .color-preview {
            width:20px; height:20px; border-radius:50%;
            border:2px solid white; box-shadow:0 0 6px rgba(0,0,0,0.6);
            display:inline-block; transition: background 0.2s;
        }
        .radio-group {
            display:flex; gap:0.4rem; flex-wrap:wrap; align-items:center;
        }
        .radio-group label {
            display:flex; align-items:center; gap:0.2rem; font-size:0.7rem;
            cursor:pointer; color:#cbd5e1; background:#0f172a;
            padding:0.25rem 0.6rem; border-radius:1.5rem; border:1px solid #334155;
            transition:0.2s; white-space:nowrap;
        }
        .radio-group label:has(input:checked) {
            border-color:#6366f1; background:#1a1f3a; color:#a5b4fc;
        }
        .radio-group input[type="radio"] { accent-color:#6366f1; width:auto; margin:0; }
        .apply-settings-btn {
            background:#6366f1; color:white; border:none; border-radius:2rem;
            padding:0.5rem; font-weight:700; cursor:pointer; font-size:0.9rem;
            letter-spacing:0.5px; margin-top:0.2rem;
        }
        .overlay {
            position:fixed; inset:0; background:rgba(0,0,0,0.85);
            backdrop-filter:blur(8px); display:flex; align-items:center;
            justify-content:center; z-index:50; opacity:0; pointer-events:none;
            transition:opacity 0.4s;
        }
        .overlay.active { opacity:1; pointer-events:auto; }
        .result-card {
            background:#1e293b; border-radius:2rem; padding:1.5rem;
            text-align:center; box-shadow:0 20px 40px black;
            max-width:400px; width:90%;
        }
        .result-icon { font-size:3.5rem; margin-bottom:0.5rem; }
        .result-title { font-size:1.8rem; font-weight:900; }
        .result-scores { display:flex; justify-content:center; gap:1.5rem; margin:1rem 0; }
        .play-again-btn {
            background:#6366f1; border:none; color:white; padding:0.7rem 2rem;
            border-radius:3rem; font-weight:700; font-size:1rem; cursor:pointer;
        }
        @media (max-width:750px) {
            .players-row { flex-direction:column; }
            .center-column { flex: 0 0 auto; width:100%; order:-1; }
            .shared-question { font-size:1.2rem; padding:0.6rem 1rem; }
            .war-bar-container { height:50px; }
            .options-grid { max-width:300px; }
            .option-btn { font-size:0.85rem; padding:0.5rem; }
            .answer-box { font-size:1rem; min-width:100px; }
        }
        @media (max-height:500px) and (orientation: landscape) {
            body { padding: 4px; }
            .game-layout { gap: 4px; }
            .top-area { gap: 4px; }
            .shared-question { font-size: 1rem; padding: 0.4rem 1rem; border-radius: 1rem; }
            .war-bar-container { height: 36px; border-radius: 30px; }
            .bar-scores { padding: 0 10px; }
            .bar-score { font-size: 1rem; }
            .players-row { gap: 4px; }
            .player-panel { padding: 4px 8px; gap: 4px; border-radius: 12px; }
            .player-name { font-size: 0.8rem; padding: 0.2rem 0.6rem; }
            .score-badge { font-size: 0.65rem; padding: 0.1rem 0.5rem; }
            .answer-box { font-size: 0.9rem; padding: 0.3rem 0.6rem; min-width: 80px; }
            .options-grid { gap: 4px; max-width: 100%; }
            .option-btn { font-size: 0.75rem; padding: 0.4rem; min-height: 38px; border-radius: 0.6rem; }
            .action-row { gap: 4px; }
            .action-btn { padding: 0.4rem; font-size: 0.75rem; }
            .center-column { flex: 0 0 auto; width: 80px; gap: 0.3rem; }
            .settings-toggle { font-size: 0.65rem; padding: 0.2rem 0.5rem; }
            .settings-panel { padding: 0.4rem; gap: 0.3rem; max-height: 40vh; font-size: 0.65rem; }
            .setting-row label { font-size: 0.65rem; }
            .setting-row input[type="text"] { width: 60px; }
            .setting-row input[type="number"] { width: 45px; }
            .radio-group label { font-size: 0.6rem; padding: 0.2rem 0.4rem; }
            .apply-settings-btn { padding: 0.3rem; font-size: 0.7rem; }
        }
    </style>
</head>
<body>
<div class="game-layout">
    <div class="top-area">
        <div class="shared-question" id="sharedQuestion">Loading...</div>
        <div class="war-bar-container">
            <div class="war-bar-blue" id="blueBar"></div>
            <div class="war-bar-red" id="redBar"></div>
            <div class="bar-divider" id="barDivider"></div>
            <div class="bar-scores">
                <span class="bar-score" id="blueScore">0</span>
                <span class="bar-score" id="redScore">0</span>
            </div>
        </div>
    </div>
    <div class="players-row">
        <div class="player-panel p1" id="p1Panel">
            <div class="player-name" id="p1NameDisplay">🔵 PLAYER 1</div>
            <div class="score-badge" id="p1ScoreBadge">Score: 0 / 10</div>
            <div class="answer-box placeholder" id="p1Answer">Your answer</div>
            <div class="options-grid" id="p1OptionsGrid"></div>
            <div class="action-row">
                <button class="action-btn undo-btn" id="p1Undo">↩ Undo</button>
                <button class="action-btn check-btn" id="p1Check" disabled>✓ Check</button>
            </div>
        </div>
        <div class="center-column">
            <button class="settings-toggle" id="settingsToggle">⚙️ Settings</button>
            <div class="settings-panel" id="settingsPanel">
                <div class="setting-row">
                    <label>Player 1 Name</label>
                    <input type="text" id="p1NameInput" value="Player 1" maxlength="12">
                </div>
                <div class="setting-row">
                    <label>Player 2 Name</label>
                    <input type="text" id="p2NameInput" value="Player 2" maxlength="12">
                </div>
                <div class="setting-row">
                    <label>Points to Win</label>
                    <input type="number" id="roundsInput" value="10" min="1" max="20" step="1">
                </div>
                <div class="setting-row">
                    <label>Question Bank</label>
                    <div class="radio-group" id="bankGroup"></div>
                </div>
                <div class="setting-row">
                    <label>🔵 P1 Color</label>
                    <div class="color-selector">
                        <div class="color-preview" id="p1ColorPreview"></div>
                        <select id="p1ColorSelect"></select>
                    </div>
                </div>
                <div class="setting-row">
                    <label>🔴 P2 Color</label>
                    <div class="color-selector">
                        <div class="color-preview" id="p2ColorPreview"></div>
                        <select id="p2ColorSelect"></select>
                    </div>
                </div>
                <button class="apply-settings-btn" id="applySettingsBtn">Apply & Restart</button>
            </div>
        </div>
        <div class="player-panel p2" id="p2Panel">
            <div class="player-name" id="p2NameDisplay">🔴 PLAYER 2</div>
            <div class="score-badge" id="p2ScoreBadge">Score: 0 / 10</div>
            <div class="answer-box placeholder" id="p2Answer">Your answer</div>
            <div class="options-grid" id="p2OptionsGrid"></div>
            <div class="action-row">
                <button class="action-btn undo-btn" id="p2Undo">↩ Undo</button>
                <button class="action-btn check-btn" id="p2Check" disabled>✓ Check</button>
            </div>
        </div>
    </div>
</div>
<div class="overlay" id="overlay">
    <div class="result-card">
        <div class="result-icon" id="resultIcon">🏆</div>
        <div class="result-title" id="resultTitle"></div>
        <div class="result-scores">
            <div><div style="color:var(--blue-light);" id="finalP1Label">🔵 P1</div><div style="font-size:2.5rem; font-weight:900;" id="finalP1">0</div></div>
            <div><div style="color:var(--red-light);" id="finalP2Label">🔴 P2</div><div style="font-size:2.5rem; font-weight:900;" id="finalP2">0</div></div>
        </div>
        <button class="play-again-btn" id="playAgainBtn">🔄 Play Again</button>
    </div>
</div>
<script>
(function() {
    // ──────────────────────── QUESTION BANKS ────────────────────────
    const QUESTION_BANKS = [
        {
            name: 'Science',
            questions: [
                { question: 'Which is a living thing?', options: ['Fish', 'Stone', 'Pen', 'Table'], answer: 'Fish' },
                { question: 'What do plants need for photosynthesis?', options: ['Oxygen', 'Carbon dioxide', 'Nitrogen', 'Hydrogen'], answer: 'Carbon dioxide' },
                { question: 'How many legs does a spider have?', options: ['6', '8', '10', '12'], answer: '8' },
                { question: 'Which planet is known as the Red Planet?', options: ['Venus', 'Mars', 'Jupiter', 'Saturn'], answer: 'Mars' },
                { question: 'What is the boiling point of water in Celsius?', options: ['90°', '100°', '110°', '120°'], answer: '100°' },
                { question: 'Which gas makes up most of the air?', options: ['Oxygen', 'Nitrogen', 'Carbon dioxide', 'Argon'], answer: 'Nitrogen' },
                { question: 'What is the hardest natural substance?', options: ['Gold', 'Iron', 'Diamond', 'Quartz'], answer: 'Diamond' },
                { question: 'Which animal is a mammal?', options: ['Shark', 'Eagle', 'Whale', 'Crocodile'], answer: 'Whale' },
                { question: 'What force keeps us on the ground?', options: ['Magnetism', 'Friction', 'Gravity', 'Inertia'], answer: 'Gravity' },
                { question: 'Which vitamin does the sun give us?', options: ['Vitamin A', 'Vitamin B', 'Vitamin C', 'Vitamin D'], answer: 'Vitamin D' },
            ]
        },
        {
            name: 'General Knowledge',
            questions: [
                { question: 'What is the capital of France?', options: ['London', 'Berlin', 'Paris', 'Madrid'], answer: 'Paris' },
                { question: 'How many continents are there?', options: ['5', '6', '7', '8'], answer: '7' },
                { question: 'Which language has the most native speakers?', options: ['English', 'Mandarin', 'Spanish', 'Hindi'], answer: 'Mandarin' },
                { question: 'What is the largest ocean?', options: ['Atlantic', 'Indian', 'Arctic', 'Pacific'], answer: 'Pacific' },
                { question: 'Which country is known as the Land of the Rising Sun?', options: ['China', 'Japan', 'South Korea', 'Thailand'], answer: 'Japan' },
                { question: 'What is the currency of the United Kingdom?', options: ['Euro', 'Dollar', 'Pound', 'Yen'], answer: 'Pound' },
                { question: 'Who painted the Mona Lisa?', options: ['Van Gogh', 'Picasso', 'Da Vinci', 'Rembrandt'], answer: 'Da Vinci' },
                { question: 'What is the longest river in the world?', options: ['Amazon', 'Nile', 'Mississippi', 'Yangtze'], answer: 'Nile' },
                { question: 'What year did the Titanic sink?', options: ['1910', '1912', '1914', '1916'], answer: '1912' },
                { question: 'What is the chemical symbol for gold?', options: ['Ag', 'Au', 'Pb', 'Fe'], answer: 'Au' },
            ]
        }
    ];

    // ──────────────────────── COLOR PALETTE (10 rainbow-rich colors) ────────────────────────
    const COLOR_PALETTE = [
        { name: 'Red',    light: '#EF4444', dark: '#B91C1C' },
        { name: 'Orange', light: '#F97316', dark: '#C2410C' },
        { name: 'Yellow', light: '#EAB308', dark: '#A16207' },
        { name: 'Green',  light: '#22C55E', dark: '#15803D' },
        { name: 'Blue',   light: '#3B82F6', dark: '#1E40AF' },
        { name: 'Indigo', light: '#6366F1', dark: '#4338CA' },
        { name: 'Violet', light: '#8B5CF6', dark: '#6D28D9' },
        { name: 'Pink',   light: '#EC4899', dark: '#BE185D' },
        { name: 'Cyan',   light: '#06B6D4', dark: '#0E7490' },
        { name: 'Lime',   light: '#84CC16', dark: '#4D7C0F' }
    ];

    // ──────────────────────── DOM REFERENCES ────────────────────────
    const $ = id => document.getElementById(id);
    const sharedQuestion = $('sharedQuestion');
    const p1Panel = $('p1Panel'), p2Panel = $('p2Panel');
    const p1NameDisplay = $('p1NameDisplay'), p2NameDisplay = $('p2NameDisplay');
    const p1ScoreBadge = $('p1ScoreBadge'), p2ScoreBadge = $('p2ScoreBadge');
    const p1Answer = $('p1Answer'), p2Answer = $('p2Answer');
    const p1OptionsGrid = $('p1OptionsGrid'), p2OptionsGrid = $('p2OptionsGrid');
    const p1Undo = $('p1Undo'), p2Undo = $('p2Undo');
    const p1Check = $('p1Check'), p2Check = $('p2Check');
    const blueBar = $('blueBar'), redBar = $('redBar'), barDivider = $('barDivider');
    const blueScoreEl = $('blueScore'), redScoreEl = $('redScore');
    const settingsToggle = $('settingsToggle'), settingsPanel = $('settingsPanel');
    const p1NameInput = $('p1NameInput'), p2NameInput = $('p2NameInput');
    const roundsInput = $('roundsInput'), applySettingsBtn = $('applySettingsBtn');
    const bankGroup = $('bankGroup');
    const p1ColorSelect = $('p1ColorSelect'), p2ColorSelect = $('p2ColorSelect');
    const p1ColorPreview = $('p1ColorPreview'), p2ColorPreview = $('p2ColorPreview');
    const overlay = $('overlay'), resultIcon = $('resultIcon'), resultTitle = $('resultTitle');
    const finalP1Label = $('finalP1Label'), finalP2Label = $('finalP2Label');
    const finalP1 = $('finalP1'), finalP2 = $('finalP2');
    const playAgainBtn = $('playAgainBtn');

    // ──────────────────────── GAME STATE ────────────────────────
    let TOTAL_ROUNDS = 10;
    let SELECTED_BANK = 0;
    let PLAYER1 = 'Player 1', PLAYER2 = 'Player 2';
    let p1ColorIdx = 4; // default Blue
    let p2ColorIdx = 0; // default Red
    let gameActive = true, roundActive = true;
    let barPosition = 50;
    let player1 = { score: 0, answer: '', locked: false };
    let player2 = { score: 0, answer: '', locked: false };
    let currentQuestion = { question: '', answer: '', options: [] };
    let questionQueue = [], queueIndex = 0, lastIdx = -1;

    // ──────────────────────── UTILITIES ────────────────────────
    const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);
    const currentBank = () => QUESTION_BANKS[SELECTED_BANK] || QUESTION_BANKS[0];

    function buildQueue() {
        return shuffle(currentBank().questions.map((_, i) => i));
    }

    function getNextQuestion() {
        const bank = currentBank();
        if (!bank.questions.length) {
            currentQuestion = { question: 'No questions', answer: '', options: [] };
            return;
        }
        if (!questionQueue.length || queueIndex >= questionQueue.length) {
            questionQueue = buildQueue();
            queueIndex = 0;
            if (questionQueue.length > 1 && lastIdx >= 0 && questionQueue[0] === lastIdx) {
                [questionQueue[0], questionQueue[1]] = [questionQueue[1], questionQueue[0]];
            }
        }
        const idx = questionQueue[queueIndex++];
        lastIdx = idx;
        const q = bank.questions[idx];
        currentQuestion = {
            question: q.question,
            answer: String(q.answer),
            options: shuffle(q.options)
        };
    }

    // ──────────────────────── COLOR APPLICATION ────────────────────────
    function getPlayerColor(idx) {
        return COLOR_PALETTE[idx] || COLOR_PALETTE[0];
    }

    function applyPlayerColors() {
        const c1 = getPlayerColor(p1ColorIdx);
        const c2 = getPlayerColor(p2ColorIdx);

        // Player panels: top border and name color
        p1Panel.style.borderTopColor = c1.light;
        p2Panel.style.borderTopColor = c2.light;
        p1NameDisplay.style.color = c1.light;
        p2NameDisplay.style.color = c2.light;

        // Final overlay labels
        finalP1Label.style.color = c1.light;
        finalP2Label.style.color = c2.light;

        // Bar gradients
        blueBar.style.background = `linear-gradient(180deg, ${c1.light}, ${c1.dark})`;
        redBar.style.background = `linear-gradient(180deg, ${c2.light}, ${c2.dark})`;

        // Update color previews in settings
        p1ColorPreview.style.background = c1.light;
        p2ColorPreview.style.background = c2.light;
    }

    // ──────────────────────── UI UPDATES ────────────────────────
    function updateSharedQuestion() {
        sharedQuestion.textContent = currentQuestion.question;
    }

    function renderOptions(grid) {
        grid.innerHTML = '';
        currentQuestion.options.forEach(val => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = val;
            btn.dataset.value = val;
            grid.appendChild(btn);
        });
    }

    function highlightSelected(grid, answer) {
        grid.querySelectorAll('.option-btn').forEach(btn => {
            btn.classList.toggle('selected', btn.dataset.value === answer);
        });
    }

    function updateAnswerBox(grid, answerBox, answer) {
        if (answer === '') {
            answerBox.textContent = 'Your answer';
            answerBox.classList.add('placeholder');
        } else {
            answerBox.textContent = answer;
            answerBox.classList.remove('placeholder');
        }
    }

    function updateScoreBadges() {
        p1ScoreBadge.textContent = `Score: ${player1.score} / ${TOTAL_ROUNDS}`;
        p2ScoreBadge.textContent = `Score: ${player2.score} / ${TOTAL_ROUNDS}`;
    }

    function updateBar() {
        blueBar.style.width = barPosition + '%';
        redBar.style.width = (100 - barPosition) + '%';
        barDivider.style.left = barPosition + '%';
        blueScoreEl.textContent = player1.score;
        redScoreEl.textContent = player2.score;
    }

    function updateNames() {
        p1NameDisplay.textContent = `🔵 ${PLAYER1}`;
        p2NameDisplay.textContent = `🔴 ${PLAYER2}`;
        finalP1Label.textContent = `🔵 ${PLAYER1}`;
        finalP2Label.textContent = `🔴 ${PLAYER2}`;
    }

    function shiftBar(towardBlue) {
        barPosition = towardBlue ? Math.min(95, barPosition + 5) : Math.max(5, barPosition - 5);
        updateBar();
    }

    function lockPlayer(playerId, disable) {
        const grid = playerId === 'p1' ? p1OptionsGrid : p2OptionsGrid;
        const undo = playerId === 'p1' ? p1Undo : p2Undo;
        const check = playerId === 'p1' ? p1Check : p2Check;
        const player = playerId === 'p1' ? player1 : player2;
        grid.querySelectorAll('.option-btn').forEach(b => b.disabled = disable);
        undo.disabled = disable;
        check.disabled = disable || (player.answer === '' && !disable);
    }

    function lockAll(disable) {
        lockPlayer('p1', disable);
        lockPlayer('p2', disable);
    }

    function resetRoundUI() {
        player1.answer = ''; player1.locked = false;
        player2.answer = ''; player2.locked = false;
        updateAnswerBox(p1OptionsGrid, p1Answer, '');
        updateAnswerBox(p2OptionsGrid, p2Answer, '');
        highlightSelected(p1OptionsGrid, '');
        highlightSelected(p2OptionsGrid, '');
        p1Check.disabled = true;
        p2Check.disabled = true;
        lockAll(false);
        roundActive = true;
    }

    function startNextQuestion() {
        getNextQuestion();
        updateSharedQuestion();
        renderOptions(p1OptionsGrid);
        renderOptions(p2OptionsGrid);
        resetRoundUI();
    }

    // ──────────────────────── GAME LOGIC ────────────────────────
    function handleCorrect(playerId) {
        if (!gameActive || !roundActive) return;
        roundActive = false;
        lockAll(true);
        const player = playerId === 'p1' ? player1 : player2;
        player.score++;
        shiftBar(playerId === 'p1');
        updateScoreBadges();
        updateBar();

        const panel = playerId === 'p1' ? p1Panel : p2Panel;
        const answerBox = playerId === 'p1' ? p1Answer : p2Answer;
        answerBox.classList.add('feedback-flash');
        panel.style.boxShadow = '0 0 30px #22c55e';
        setTimeout(() => {
            answerBox.classList.remove('feedback-flash');
            panel.style.boxShadow = '';
        }, 500);

        if (player.score >= TOTAL_ROUNDS) {
            setTimeout(() => endGame(), 600);
            return;
        }
        setTimeout(() => {
            if (!gameActive) return;
            startNextQuestion();
        }, 600);
    }

    function handleBothWrong() {
        if (!gameActive || !roundActive) return;
        roundActive = false;
        lockAll(true);
        setTimeout(() => {
            if (!gameActive) return;
            startNextQuestion();
        }, 800);
    }

    function handleIncorrect(playerId) {
        if (!gameActive || !roundActive) return;
        const answerBox = playerId === 'p1' ? p1Answer : p2Answer;
        const player = playerId === 'p1' ? player1 : player2;
        answerBox.classList.add('wrong-flash');
        setTimeout(() => answerBox.classList.remove('wrong-flash'), 400);
        player.locked = true;
        lockPlayer(playerId, true);
        if (player1.locked && player2.locked) {
            handleBothWrong();
        }
    }

    function playerCheck(playerId) {
        if (!gameActive || !roundActive) return;
        const player = playerId === 'p1' ? player1 : player2;
        if (player.locked) return;
        if (player.answer === '') {
            const answerBox = playerId === 'p1' ? p1Answer : p2Answer;
            answerBox.classList.add('wrong-flash');
            setTimeout(() => answerBox.classList.remove('wrong-flash'), 400);
            return;
        }
        if (player.answer === currentQuestion.answer) {
            handleCorrect(playerId);
        } else {
            handleIncorrect(playerId);
        }
    }

    function playerUndo(playerId) {
        if (!gameActive || !roundActive) return;
        const player = playerId === 'p1' ? player1 : player2;
        if (player.locked || player.answer === '') return;
        const grid = playerId === 'p1' ? p1OptionsGrid : p2OptionsGrid;
        const answerBox = playerId === 'p1' ? p1Answer : p2Answer;
        const checkBtn = playerId === 'p1' ? p1Check : p2Check;
        player.answer = '';
        updateAnswerBox(grid, answerBox, '');
        highlightSelected(grid, '');
        checkBtn.disabled = true;
    }

    function endGame() {
        gameActive = false;
        lockAll(true);
        if (player1.score > player2.score) {
            resultIcon.textContent = '🏆';
            resultTitle.textContent = `🔵 ${PLAYER1} Wins!`;
            resultTitle.style.color = getPlayerColor(p1ColorIdx).light;
        } else if (player2.score > player1.score) {
            resultIcon.textContent = '🏆';
            resultTitle.textContent = `🔴 ${PLAYER2} Wins!`;
            resultTitle.style.color = getPlayerColor(p2ColorIdx).light;
        } else {
            resultIcon.textContent = '🤝';
            resultTitle.textContent = "It's a Tie!";
            resultTitle.style.color = '#fbbf24';
        }
        finalP1.textContent = player1.score;
        finalP2.textContent = player2.score;
        overlay.classList.add('active');
    }

    function fullReset() {
        gameActive = true;
        roundActive = true;
        barPosition = 50;
        player1 = { score: 0, answer: '', locked: false };
        player2 = { score: 0, answer: '', locked: false };
        questionQueue = []; queueIndex = 0; lastIdx = -1;
        updateNames();
        updateScoreBadges();
        updateBar();
        applyPlayerColors(); // apply current colors to UI
        startNextQuestion();
        overlay.classList.remove('active');
        buildBankRadios();
        populateColorDropdowns();
    }

    // ──────────────────────── SETTINGS & COLOR HANDLING ────────────────────────
    function buildBankRadios() {
        bankGroup.innerHTML = '';
        QUESTION_BANKS.forEach((bank, idx) => {
            const label = document.createElement('label');
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = 'bank';
            radio.value = idx;
            if (idx === SELECTED_BANK) radio.checked = true;
            label.appendChild(radio);
            label.appendChild(document.createTextNode(' ' + bank.name));
            bankGroup.appendChild(label);
        });
    }

    function populateColorDropdowns() {
        // Fill dropdowns with color names, preselect current indices
        [p1ColorSelect, p2ColorSelect].forEach(select => {
            select.innerHTML = '';
            COLOR_PALETTE.forEach((color, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = color.name;
                select.appendChild(opt);
            });
        });
        p1ColorSelect.value = p1ColorIdx;
        p2ColorSelect.value = p2ColorIdx;
        updateColorPreviews();

        // Attach change handlers for conflict prevention
        p1ColorSelect.onchange = () => handleColorChange('p1');
        p2ColorSelect.onchange = () => handleColorChange('p2');
    }

    function updateColorPreviews() {
        p1ColorPreview.style.background = getPlayerColor(parseInt(p1ColorSelect.value, 10)).light;
        p2ColorPreview.style.background = getPlayerColor(parseInt(p2ColorSelect.value, 10)).light;
    }

    function handleColorChange(changingPlayer) {
        const select = changingPlayer === 'p1' ? p1ColorSelect : p2ColorSelect;
        const otherSelect = changingPlayer === 'p1' ? p2ColorSelect : p1ColorSelect;
        const newIdx = parseInt(select.value, 10);

        if (newIdx === parseInt(otherSelect.value, 10)) {
            // Conflict: revert to previous stored index
            const previousIdx = changingPlayer === 'p1' ? p1ColorIdx : p2ColorIdx;
            select.value = previousIdx;
            alert('Players cannot share the same color. Please pick a different one.');
        } else {
            // Update stored index
            if (changingPlayer === 'p1') {
                p1ColorIdx = newIdx;
            } else {
                p2ColorIdx = newIdx;
            }
            updateColorPreviews();
            // Immediately apply colors to UI so they see live preview
            applyPlayerColors();
        }
    }

    function readSettings() {
        const p1name = p1NameInput.value.trim() || 'Player 1';
        const p2name = p2NameInput.value.trim() || 'Player 2';
        let rounds = parseInt(roundsInput.value, 10);
        if (isNaN(rounds) || rounds < 1) rounds = 1;
        if (rounds > 20) rounds = 20;
        roundsInput.value = rounds;

        let bank = 0;
        document.getElementsByName('bank').forEach(r => { if (r.checked) bank = parseInt(r.value, 10); });
        if (isNaN(bank) || bank < 0 || bank >= QUESTION_BANKS.length) bank = 0;

        // Read colors and resolve conflicts
        let newP1Idx = parseInt(p1ColorSelect.value, 10);
        let newP2Idx = parseInt(p2ColorSelect.value, 10);
        if (isNaN(newP1Idx) || newP1Idx < 0 || newP1Idx >= COLOR_PALETTE.length) newP1Idx = 4;
        if (isNaN(newP2Idx) || newP2Idx < 0 || newP2Idx >= COLOR_PALETTE.length) newP2Idx = 0;

        // If still identical (edge case), force p2 to next different color
        if (newP1Idx === newP2Idx) {
            newP2Idx = (newP1Idx + 1) % COLOR_PALETTE.length;
            p2ColorSelect.value = newP2Idx;
            updateColorPreviews();
        }

        return { p1name, p2name, rounds, bank, newP1Idx, newP2Idx };
    }

    function applySettings() {
        const s = readSettings();
        PLAYER1 = s.p1name;
        PLAYER2 = s.p2name;
        TOTAL_ROUNDS = s.rounds;
        SELECTED_BANK = s.bank;
        p1ColorIdx = s.newP1Idx;
        p2ColorIdx = s.newP2Idx;
        settingsPanel.classList.remove('open');
        fullReset();
    }

    // ──────────────────────── EVENT HANDLERS ────────────────────────
    p1OptionsGrid.addEventListener('pointerdown', e => {
        const btn = e.target.closest('.option-btn');
        if (!btn || btn.disabled || !roundActive || !gameActive || player1.locked) return;
        e.preventDefault();
        player1.answer = btn.dataset.value;
        updateAnswerBox(p1OptionsGrid, p1Answer, player1.answer);
        p1Check.disabled = false;
        highlightSelected(p1OptionsGrid, player1.answer);
    });

    p2OptionsGrid.addEventListener('pointerdown', e => {
        const btn = e.target.closest('.option-btn');
        if (!btn || btn.disabled || !roundActive || !gameActive || player2.locked) return;
        e.preventDefault();
        player2.answer = btn.dataset.value;
        updateAnswerBox(p2OptionsGrid, p2Answer, player2.answer);
        p2Check.disabled = false;
        highlightSelected(p2OptionsGrid, player2.answer);
    });

    p1Undo.addEventListener('click', () => playerUndo('p1'));
    p2Undo.addEventListener('click', () => playerUndo('p2'));
    p1Check.addEventListener('click', () => playerCheck('p1'));
    p2Check.addEventListener('click', () => playerCheck('p2'));
    settingsToggle.addEventListener('click', () => settingsPanel.classList.toggle('open'));
    applySettingsBtn.addEventListener('click', applySettings);
    playAgainBtn.addEventListener('click', applySettings);

    // ──────────────────────── INIT ────────────────────────
    buildBankRadios();
    populateColorDropdowns();
    updateNames();
    fullReset();
})();
</script>
</body>
</html>
