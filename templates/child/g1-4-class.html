  objectives:[
    "Identify equivalent fractions.",
    "Simplify fractions to their lowest terms.",
    "Compare fractions with different denominators."
  ],
  vocab:[
    {term:"Equivalent", def:"Equal in value."},
    {term:"Simplify", def:"To write a fraction in its lowest terms."},
    {term:"Common denominator", def:"Same denominator for two or more fractions."},
    {term:"Lowest terms", def:"When the numerator and denominator have no common factor except 1."}
  ],
  content:[
    {type:"h", text:"5.1 What Are Equivalent Fractions?"},
    {type:"p", text:"<b>Equivalent fractions</b> look different but have the same value. If you multiply or divide the numerator and denominator of a fraction by the same number, you get an equivalent fraction."},
    {type:"callout", variant:"tip", title:"Example",
      text:"<b>½ = ²⁄₄ = ³⁄₆ = ⁴⁄₈ = ⁵⁄₁₀</b><br><br>Each is the same amount. If you cut a cake in half and cut each half in half again, you have quarters — 2 of them equal a half."},
    {type:"h", text:"5.2 Simplifying Fractions"},
    {type:"p", text:"To <b>simplify</b> a fraction, divide both the numerator and denominator by their highest common factor."},
    {type:"ul", items:[
      "⁴⁄₈ — divide both by 4 → ½",
      "⁶⁄₉ — divide both by 3 → ⅔",
      "¹⁰⁄₁₅ — divide both by 5 → ⅔"
    ]},
    {type:"h", text:"5.3 Comparing Fractions"},
    {type:"p", text:"To compare fractions with different denominators, first find a <b>common denominator</b>."},
    {type:"callout", variant:"tip", title:"Example: compare ⅔ and ¾",
      text:"Common denominator is 12.<br>⅔ = ⁸⁄₁₂<br>¾ = ⁹⁄₁₂<br>Since ⁹⁄₁₂ &gt; ⁸⁄₁₂, we see that <b>¾ &gt; ⅔</b>."},
    {type:"example", label:"Example from Ghana",
      text:"A trader sells rice in ½ kg and ¼ kg bags. Three ¼ kg bags contain the same amount as one ½ kg bag (since ¾ kg is more than ½ kg)."}
  ],
  think:"Why is it useful to simplify fractions? When might it be easier to work with ½ than with ⁵⁰⁄₁₀₀?",
  try:"Write three equivalent fractions for each of: ½, ⅓, ¾.",
  summary:"Equivalent fractions have the same value but different numerators and denominators. Simplify by dividing by the highest common factor. To compare, find a common denominator.",
  exercises:[],
  quiz:[
    {q:"Which is equivalent to ½?", options:{a:"⅓",b:"²⁄₄",c:"¾",d:"⅕"}, correct:"b"},
    {q:"Which is equivalent to ⅓?", options:{a:"²⁄₆",b:"²⁄₃",c:"³⁄₄",d:"½"}, correct:"a"},
    {q:"Simplify ⁴⁄₈.", options:{a:"¼",b:"½",c:"⅔",d:"¾"}, correct:"b"},
    {q:"Simplify ⁶⁄₉.", options:{a:"½",b:"⅔",c:"¾",d:"⅓"}, correct:"b"},
    {q:"Simplify ¹⁰⁄₁₅.", options:{a:"½",b:"⅔",c:"¾",d:"⅕"}, correct:"b"},
    {q:"Which is bigger, ⅔ or ¾?", options:{a:"⅔",b:"¾",c:"Equal",d:"Cannot tell"}, correct:"b"},
    {q:"What is a common denominator for ½ and ⅓?", options:{a:"2",b:"3",c:"6",d:"12"}, correct:"c"},
    {q:"Which is equivalent to ¾?", options:{a:"⁶⁄₈",b:"³⁄₈",c:"⁴⁄₆",d:"⅔"}, correct:"a"}
  ]
},

      "<b>0.5</b> means 5 tenths = ½",

{ id:"u9", number:9, term:2,
  strand:"Geometry and Measurement", substrand:"Time",

  objectives:[
    "Read time from 12-hour and 24-hour clocks.",

    "Solve time problems including duration."
  ],
  vocab:[
    {term:"24-hour clock", def:"A system that runs from 00:00 to 23:59."},
    {term:"12-hour clock", def:"A system using am and pm."},
    {term:"am", def:"Before noon (midnight to midday)."},
    {term:"pm", def:"After noon (midday to midnight)."},
    {term:"Duration", def:"The amount of time something takes."}
  ],
  content:[
    {type:"h", text:"9.1 The 12-Hour Clock"},
    {type:"p", text:"The <b>12-hour clock</b> uses <b>am</b> and <b>pm</b>. am runs from midnight to midday; pm runs from midday to midnight."},
    {type:"ul", items:[
      "8:00 am = 8 o'clock in the morning",
      "12:00 noon = midday",
      "3:30 pm = half past three in the afternoon",
      "9:15 pm = quarter past nine at night"
    ]},
    {type:"h", text:"9.2 The 24-Hour Clock"},
    {type:"p", text:"The <b>24-hour clock</b> uses four digits and runs from <b>00:00</b> to <b>23:59</b>. It is used in timetables, at airports and in the army."},
    {type:"table", headers:["12-hour","24-hour"],
      rows:[
        ["12:00 midnight","00:00"],
        ["1:00 am","01:00"],
        ["6:00 am","06:00"],
        ["12:00 noon","12:00"],
        ["1:00 pm","13:00"],
        ["3:30 pm","15:30"],
        ["6:00 pm","18:00"],
        ["11:59 pm","23:59"]
      ], caption:"Comparing 12-hour and 24-hour times."},
    {type:"h", text:"9.3 Converting Times"},
    {type:"ul", items:[
      "For am times (except 12 am), the 24-hour time is the same: 6:00 am = 06:00.",
      "For pm times, add 12 to the hour: 3:00 pm = 15:00.",
      "For 12:00 noon, use 12:00.",
      "For 12:00 midnight, use 00:00."
    ]},
    {type:"h", text:"9.4 Duration"},
    {type:"p", text:"To find the <b>duration</b> (how long something takes), subtract the start time from the end time."},
    {type:"callout", variant:"tip", title:"Example",
      text:"A film starts at <b>14:30</b> and ends at <b>16:45</b>.<br>16:45 − 14:30 = <b>2 hours 15 minutes</b>."},

  summary:"The 12-hour clock uses am and pm. The 24-hour clock runs from 00:00 to 23:59. Convert by adding 12 to pm hours (except noon). Duration is the time between start and end.",

    {type:"p", text:"<b>Weather</b> is what the atmosphere is doing right now — today it may be sunny; tomorrow it may rain. <b>Climate</b> is the average weather pattern over many years. Ghana's climate is tropical — warm with a rainy season and a dry season."},
    {type:"h", text:"5.2 The Greenhouse Effect"},
    {type:"p", text:"Gases like carbon dioxide (CO₂) and methane (CH₄) trap heat in the atmosphere. This is the <b>greenhouse effect</b> and it is natural — without it, Earth would be too cold for life. But human activity has added extra greenhouse gases, trapping too much heat."},
    {type:"h", text:"5.3 Causes of Climate Change"},
    {type:"ul", items:[
      "Burning fossil fuels (petrol, diesel, coal) — releases CO₂.",
      "Cutting down forests — trees absorb CO₂, so fewer trees means more CO₂.",
      "Burning bush and waste — releases CO₂ and methane.",
      "Farming animals — cows and goats release methane.",
      "Industry and factories — release many greenhouse gases."
    ]},
    {type:"h", text:"5.4 Effects on Ghana"},
    {type:"ul", items:[

      "<b>Flooding</b> — heavy rains in Accra cause floods.",
      "<b>Drought</b> — dry spells in the north lead to crop failure.",
      "<b>Rising sea levels</b> — coastal towns like Keta and Ada face erosion.",
      "<b>Hotter days</b> — health risks for children and the elderly."

    {type:"h", text:"5.5 What We Can Do"},
    {type:"ul", items:[

      "Use less electricity and fuel.",
      "Ride bicycles or walk short distances.",
      "Reduce, reuse and recycle.",
      "Use solar energy instead of generators."

    {type:"example", label:"Example from Ghana",

    {q:"What is climate?", options:{a:"Today's weather",b:"The average weather pattern over many years",c:"A single storm",d:"A type of plant"}, correct:"b"},
    {q:"Which gas is a greenhouse gas?", options:{a:"Oxygen",b:"Nitrogen",c:"Carbon dioxide",d:"Helium"}, correct:"c"},
    {q:"What causes climate change?", options:{a:"Burning fossil fuels",b:"Planting trees",c:"Riding bicycles",d:"Using solar energy"}, correct:"a"},
    {q:"Which of these is a likely effect of climate change in Ghana?", options:{a:"More snow",b:"Irregular rainfall and flooding",c:"Longer nights",d:"Fewer stars"}, correct:"b"},
    {q:"How do trees help against climate change?", options:{a:"They make rain",b:"They absorb carbon dioxide",c:"They produce petrol",d:"They create wind"}, correct:"b"},
    {q:"Why is the greenhouse effect natural?", options:{a:"It has always existed and keeps Earth warm",b:"It started recently",c:"It is only caused by factories",d:"It only affects Ghana"}, correct:"a"},
    {q:"Which activity releases methane?", options:{a:"Walking",b:"Rearing cows and goats",c:"Reading a book",d:"Riding a bicycle"}, correct:"b"}
  ]
},

/* ---------------- UNIT 6 ---------------- */
{ id:"u6", number:6, term:2,
  strand:"Cycles", substrand:"Life Cycles of Organisms",
  code:"B5.2.2.1.1",
  title:"Reproduction in Plants and Animals",
  objectives:[
    "Explain how plants reproduce.",
    "Describe how animals reproduce.",
    "Compare sexual and asexual reproduction."
  ],
  vocab:[
    {term:"Reproduction", def:"The process by which living things produce young ones."},
    {term:"Sexual reproduction", def:"Reproduction that requires two parents."},
    {term:"Asexual reproduction", def:"Reproduction with only one parent."},
    {term:"Pollination", def:"The transfer of pollen from one flower to another."},
    {term:"Fertilisation", def:"When male and female cells join."}
  ],
  content:[
    {type:"h", text:"6.1 Reproduction in Flowering Plants"},
    {type:"p", text:"Flowering plants reproduce <b>sexually</b>. The flower has male parts (stamens, which make pollen) and female parts (the pistil, which contains ovules). For reproduction to take place:"},
    {type:"ol", items:[
      "<b>Pollination</b> — pollen is carried from the male part of one flower to the female part. This is done by insects, birds, wind or water.",
      "<b>Fertilisation</b> — the male cell joins with the female cell inside the ovule.",
      "<b>Seed formation</b> — the fertilised ovule becomes a seed; the flower becomes a fruit.",
      "<b>Seed dispersal</b> — seeds are carried away by wind, water, animals or explosion.",
      "<b>Germination</b> — when conditions are right, the seed grows into a new plant."
    ]},
    {type:"img", src:"img/g5s-u6-fig1.png",
      alt:"Diagram of a flower showing stamen, pistil, pollen and ovule",
      caption:"Figure 6.1: The parts of a flower."},
    {type:"h", text:"6.2 Asexual Reproduction in Plants"},
    {type:"p", text:"Some plants reproduce without seeds. The new plant is a clone of the parent. Examples:"},
    {type:"ul", items:[
      "Sweet potato — grows from the root (tuber).",
      "Cassava — grows from stem cuttings.",
      "Banana — grows from suckers.",
      "Onion — grows from bulbs."
    ]},
    {type:"h", text:"6.3 Reproduction in Animals"},
    {type:"ul", items:[
      "<b>Sexual</b> — most animals (including humans) reproduce sexually. Male and female parents produce sex cells which join in fertilisation.",
      "<b>Egg-laying</b> — birds, reptiles, amphibians, fish and insects lay eggs.",
      "<b>Live-bearing</b> — mammals give birth to live young (except a few unusual ones)."
    ]},
    {type:"example", label:"Example from Ghana",
      text:"Cocoa is pollinated by tiny midges (small flies). Without the midges, there would be no cocoa pods — and no chocolate! Farmers protect these insects by avoiding harmful pesticides during flowering."}
  ],
  think:"Why do you think most flowering plants produce so many seeds, when only a few will grow into adult plants?",
  try:"Examine a flower from a garden. Identify the stamens and the pistil. Draw and label them.",
  summary:"Flowering plants reproduce sexually via pollination, fertilisation, seed formation and dispersal. Some plants reproduce asexually (from tubers, cuttings or suckers). Animals reproduce sexually, either by laying eggs or giving birth to live young.",
  exercises:[],
  quiz:[
    {q:"What is pollination?", options:{a:"When seeds fall to the ground",b:"The transfer of pollen from one flower to another",c:"When a plant dies",d:"When a leaf drops"}, correct:"b"},
    {q:"What is fertilisation?", options:{a:"When seeds grow",b:"When male and female cells join",c:"When a flower opens",d:"When leaves fall"}, correct:"b"},
    {q:"Which part of a flower makes pollen?", options:{a:"Pistil",b:"Stamen",c:"Petal",d:"Leaf"}, correct:"b"},
    {q:"Which is an example of asexual reproduction?", options:{a:"Cassava from stem cuttings",b:"Maize from seeds",c:"Mango from seeds",d:"Beans from seeds"}, correct:"a"},
    {q:"How do birds reproduce?", options:{a:"Live young",b:"Laying eggs",c:"Splitting in two",d:"From cuttings"}, correct:"b"},
    {q:"Which animal group gives birth to live young?", options:{a:"Birds",b:"Fish",c:"Mammals",d:"Insects"}, correct:"c"},
    {q:"What comes right after fertilisation in a flowering plant?", options:{a:"Germination",b:"Seed formation",c:"Dispersal",d:"Pollination"}, correct:"b"},
    {q:"Who pollinates cocoa flowers?", options:{a:"Bees",b:"Midges",c:"Butterflies",d:"Birds"}, correct:"b"}
  ]
},

/* ---------------- UNIT 7 ---------------- */
{ id:"u7", number:7, term:2,
  strand:"Systems", substrand:"The Human Body Systems",
  code:"B5.3.1.1.1",
  title:"The Digestive System",
  objectives:[
    "Name the main organs of the digestive system.",
    "Describe what happens to food as it travels through the body.",
    "Explain why a balanced diet is important."
  ],
  vocab:[
    {term:"Digestion", def:"The process of breaking food into small pieces the body can use."},
    {term:"Oesophagus", def:"The tube that carries food from the mouth to the stomach."},
    {term:"Stomach", def:"The organ that churns and mixes food with juices."},
    {term:"Small intestine", def:"Where nutrients are absorbed into the blood."},
    {term:"Balanced diet", def:"Eating the right amounts of different food types."}
  ],
  content:[
    {type:"h", text:"7.1 The Digestive Journey"},
    {type:"p", text:"When you eat, food passes through a long tube called the <b>digestive system</b>. Along the way it is broken down so that the body can use it for energy and growth."},
    {type:"img", src:"img/g5s-u7-fig1.png",
      alt:"The human digestive system: mouth, oesophagus, stomach, small intestine, large intestine",
      caption:"Figure 7.1: The human digestive system."},
    {type:"h", text:"7.2 Steps of Digestion"},
    {type:"ol", items:[
      "<b>Mouth</b> — teeth chew food; saliva begins to break it down.",
      "<b>Oesophagus</b> — muscular tube pushes food down to the stomach.",
      "<b>Stomach</b> — food is churned and mixed with digestive juices.",
      "<b>Small intestine</b> — nutrients are absorbed into the blood.",
      "<b>Large intestine</b> — water is absorbed; what remains becomes waste.",
      "<b>Anus</b> — waste leaves the body."
    ]},
    {type:"h", text:"7.3 A Balanced Diet"},
    {type:"p", text:"Our bodies need different nutrients. A <b>balanced diet</b> includes:"},
    {type:"table", headers:["Nutrient","Function","Ghanaian examples"],
      rows:[
        ["Carbohydrates","Energy","Banku, kenkey, rice, yam, fufu"],
        ["Proteins","Growth and repair","Beans, eggs, fish, meat, groundnuts"],
        ["Fats","Stored energy","Palm oil, groundnut oil, shea butter"],
        ["Vitamins","Health and immunity","Fruits, vegetables"],
        ["Minerals","Strong bones, blood","Milk, small dried fish, green leaves"],
        ["Water","Many body functions","Clean drinking water"]
      ], caption:"Nutrients and their sources."},
    {type:"h", text:"7.4 Healthy Eating Habits"},
    {type:"ul", items:[
      "Eat a variety of foods daily.",
      "Eat fruit and vegetables with meals.",
      "Drink plenty of clean water.",
      "Limit sugary drinks and sweets.",
      "Eat at regular times.",
      "Wash hands before eating."
    ]},
    {type:"example", label:"Example from Ghana",
      text:"A typical balanced Ghanaian meal: <b>kenkey</b> (carbohydrate) with <b>grilled tilapia</b> (protein and fat), <b>pepper sauce</b> (vitamins), and a slice of <b>pawpaw</b> for dessert (vitamins). Add clean water and you have all you need."}
  ],
  think:"Why is it important to eat fibre (like from vegetables and whole grains)? What does it help the large intestine do?",
  try:"Make a food diary for one day. Write down everything you eat and drink. Then check: did you have carbohydrates, proteins, vitamins and water?",
  summary:"Digestion breaks food down so the body can absorb nutrients. Food travels through the mouth, oesophagus, stomach, small intestine, large intestine and out. A balanced diet includes carbohydrates, proteins, fats, vitamins, minerals and water.",
  exercises:[],
  quiz:[
    {q:"What is digestion?", options:{a:"Eating food",b:"Breaking food into small pieces the body can use",c:"Cooking food",d:"Selling food"}, correct:"b"},
    {q:"Where does digestion begin?", options:{a:"Stomach",b:"Mouth",c:"Small intestine",d:"Large intestine"}, correct:"b"},
    {q:"What does the oesophagus do?", options:{a:"Absorbs nutrients",b:"Carries food from mouth to stomach",c:"Produces saliva",d:"Removes waste"}, correct:"b"},
    {q:"Where are most nutrients absorbed?", options:{a:"Mouth",b:"Stomach",c:"Small intestine",d:"Large intestine"}, correct:"c"},
    {q:"Which nutrient gives energy?", options:{a:"Carbohydrate",b:"Protein",c:"Vitamin",d:"Mineral"}, correct:"a"},
    {q:"Which nutrient helps growth and repair?", options:{a:"Carbohydrate",b:"Protein",c:"Fat",d:"Water"}, correct:"b"},
    {q:"Which food is a good source of protein?", options:{a:"Rice",b:"Beans",c:"Yam",d:"Sugar"}, correct:"b"},
    {q:"What happens in the large intestine?", options:{a:"Nutrients are absorbed",b:"Water is absorbed",c:"Food is chewed",d:"Saliva is made"}, correct:"b"}
  ]
},

/* ---------------- UNIT 8 ---------------- */
{ id:"u8", number:8, term:2,
  strand:"Systems", substrand:"The Human Body Systems",
  code:"B5.3.1.2.1",
  title:"The Circulatory System",
  objectives:[
    "Describe the parts of the circulatory system.",
    "Explain the function of the heart and blood.",
    "List ways to keep the heart healthy."
  ],
  vocab:[
    {term:"Circulatory system", def:"The system that carries blood around the body."},
    {term:"Heart", def:"A muscular organ that pumps blood."},
    {term:"Blood vessels", def:"Tubes that carry blood (arteries, veins, capillaries)."},
    {term:"Artery", def:"A blood vessel that carries blood away from the heart."},
    {term:"Vein", def:"A blood vessel that carries blood back to the heart."}
  ],
  content:[
    {type:"h", text:"8.1 The Circulatory System"},
    {type:"p", text:"The <b>circulatory system</b> carries blood, oxygen and nutrients to every part of the body, and carries waste away. It has three main parts:"},
    {type:"ul", items:[
      "<b>Heart</b> — pumps blood.",
      "<b>Blood vessels</b> — arteries, veins and capillaries carry the blood.",
      "<b>Blood</b> — the fluid that carries oxygen, nutrients and waste."
    ]},
    {type:"img", src:"img/g5s-u8-fig1.png",
      alt:"The human heart and blood circulation diagram",
      caption:"Figure 8.1: The heart pumps blood around the body."},
    {type:"h", text:"8.2 The Heart"},
    {type:"p", text:"The heart is a muscular organ about the size of your fist. It beats about <b>70 times every minute</b>. Each beat pumps blood to the lungs to pick up oxygen, then around the body to deliver it to every cell."},
    {type:"h", text:"8.3 Blood Vessels"},
    {type:"table", headers:["Vessel","Direction","Feature"],
      rows:[
        ["Artery","Away from heart","Thick walls, carries oxygen-rich blood"],
        ["Vein","Back to heart","Thinner walls, carries oxygen-poor blood"],
        ["Capillary","Between cells","Very thin, allows exchange of gases"]
      ], caption:"Three types of blood vessels."},
    {type:"h", text:"8.4 Functions of Blood"},
    {type:"ul", items:[
      "Carries <b>oxygen</b> from the lungs to the cells.",
      "Carries <b>nutrients</b> from the small intestine to the cells.",
      "Carries <b>carbon dioxide</b> from the cells back to the lungs.",
      "Carries <b>waste</b> to the kidneys.",
      "Fights infection with white blood cells."
    ]},
    {type:"h", text:"8.5 Keeping the Heart Healthy"},
    {type:"ul", items:[
      "Exercise every day.",
      "Eat fruits and vegetables.",
      "Reduce salt and sugary drinks.",
      "Avoid smoking.",
      "Get enough sleep.",
      "Drink plenty of clean water."
    ]},
    {type:"example", label:"Example from Ghana",
      text:"Many Ghanaian schools have weekly sports days where pupils run, jump and play football. Regular exercise strengthens the heart and keeps blood pressure low — a habit that lasts a lifetime."}
  ],
  think:"Why do you think the heart has to keep beating all day and night without rest?",
  try:"Place two fingers on the side of your neck. Count the beats for 15 seconds. Multiply by 4 to get your heart rate per minute. Do this before and after running for one minute.",
  summary:"The circulatory system carries blood around the body. The heart pumps blood. Arteries carry blood away from the heart; veins carry it back. Exercise and healthy eating keep the heart strong.",
  exercises:[],
  quiz:[
    {q:"What does the circulatory system do?", options:{a:"Digests food",b:"Carries blood around the body",c:"Breathes air",d:"Moves bones"}, correct:"b"},
    {q:"What does the heart do?", options:{a:"Digests food",b:"Pumps blood",c:"Filters air",d:"Stores water"}, correct:"b"},
    {q:"Which vessel carries blood away from the heart?", options:{a:"Artery",b:"Vein",c:"Capillary",d:"Nerve"}, correct:"a"},
    {q:"Which vessel carries blood back to the heart?", options:{a:"Artery",b:"Vein",c:"Capillary",d:"Muscle"}, correct:"b"},
    {q:"About how many times does the heart beat per minute?", options:{a:"20",b:"70",c:"150",d:"300"}, correct:"b"},
    {q:"What does blood carry from the lungs to the cells?", options:{a:"Carbon dioxide",b:"Oxygen",c:"Waste",d:"Food"}, correct:"b"},
    {q:"Which is good for heart health?", options:{a:"Smoking",b:"Regular exercise",c:"Eating only sugar",d:"Never sleeping"}, correct:"b"},
    {q:"What is the size of the heart about?", options:{a:"A football",b:"Your fist",c:"Your head",d:"Your thumb"}, correct:"b"}
  ]
},

/* ---------------- UNIT 9 ---------------- */
{ id:"u9", number:9, term:2,
  strand:"Systems", substrand:"The Human Body Systems",
  code:"B5.3.1.3.1",
  title:"The Respiratory System",
  objectives:[
    "Name the main organs of the respiratory system.",
    "Describe how breathing works.",
    "Explain the dangers of smoking."
  ],
  vocab:[
    {term:"Respiratory system", def:"The system that takes air into and out of the body."},
    {term:"Lungs", def:"The main organs of breathing."},
    {term:"Trachea", def:"The windpipe that carries air to the lungs."},
    {term:"Diaphragm", def:"A muscle below the lungs that helps us breathe."},
    {term:"Inhale", def:"To breathe in."},
    {term:"Exhale", def:"To breathe out."}
  ],
  content:[
    {type:"h", text:"9.1 Parts of the Respiratory System"},
    {type:"ul", items:[
      "<b>Nose</b> — air enters; hairs and mucus filter dust.",
      "<b>Trachea (windpipe)</b> — carries air down to the lungs.",
      "<b>Bronchi</b> — two tubes that branch into each lung.",
      "<b>Lungs</b> — two spongy organs where gas exchange happens.",
      "<b>Diaphragm</b> — a muscle below the lungs that helps air move in and out."
    ]},
    {type:"img", src:"img/g5s-u9-fig1.png",
      alt:"The human respiratory system: nose, trachea, bronchi, lungs, diaphragm",
      caption:"Figure 9.1: The human respiratory system."},
    {type:"h", text:"9.2 How Breathing Works"},
    {type:"ol", items:[
      "We <b>inhale</b> — the diaphragm moves down, the chest expands, and air rushes in.",
      "In the lungs, oxygen passes into the blood and carbon dioxide passes out.",
      "We <b>exhale</b> — the diaphragm moves up, the chest relaxes, and air rushes out."
    ]},
    {type:"h", text:"9.3 Gas Exchange"},
    {type:"p", text:"Inside the lungs are millions of tiny air sacs called <b>alveoli</b>. Here, oxygen from the air passes into the blood, and carbon dioxide from the blood passes into the air we breathe out. This is called <b>gas exchange</b>."},
    {type:"h", text:"9.4 The Dangers of Smoking"},
    {type:"ul", items:[
      "Smoking damages the lungs and can cause lung cancer.",
      "It narrows blood vessels and damages the heart.",
      "It causes a cough, shortness of breath and yellow teeth.",
      "Second-hand smoke harms others nearby.",
      "It costs a lot of money that could be spent on food, education or health."
    ]},
    {type:"h", text:"9.5 Keeping Lungs Healthy"},
    {type:"ul", items:[
      "Avoid smoking and second-hand smoke.",
      "Exercise regularly.",
      "Breathe clean air — avoid dusty or smoky areas.",
      "Keep indoor cooking areas well ventilated.",
      "Cover your mouth when coughing or sneezing."
    ]},
    {type:"example", label:"Example from Ghana",
      text:"Many Ghanaian homes cook with firewood or charcoal. If the kitchen is not well-ventilated, the smoke can damage the lungs — especially for women and children. Using clean cookstoves or opening windows reduces this risk."}
  ],
  think:"Why do you think the lungs are described as 'spongy'? What does their structure allow them to do?",
  try:"Count your breaths for one minute while sitting. Then run in place for one minute and count again. Why do you breathe faster after exercise?",
  summary:"The respiratory system takes air into the body. The nose filters air; the trachea carries it to the lungs; gas exchange happens in the alveoli. Smoking damages the lungs and heart.",
  exercises:[],
  quiz:[
    {q:"What does the respiratory system do?", options:{a:"Digests food",b:"Takes air into and out of the body",c:"Pumps blood",d:"Moves bones"}, correct:"b"},
    {q:"Where does air enter the body?", options:{a:"Mouth only",b:"Nose",c:"Ears",d:"Eyes"}, correct:"b"},
    {q:"What is the windpipe called?", options:{a:"Oesophagus",b:"Trachea",c:"Bronchi",d:"Lung"}, correct:"b"},
    {q:"What happens when we inhale?", options:{a:"Diaphragm moves down, chest expands",b:"Diaphragm moves up, chest relaxes",c:"Nothing changes",d:"Air is pushed out"}, correct:"a"},
    {q:"Where does gas exchange happen?", options:{a:"Nose",b:"Trachea",c:"Alveoli in the lungs",d:"Bronchi"}, correct:"c"},
    {q:"What does the blood take from the lungs?", options:{a:"Carbon dioxide",b:"Oxygen",c:"Waste",d:"Food"}, correct:"b"},
    {q:"Which is a danger of smoking?", options:{a:"Strong bones",b:"Better eyesight",c:"Lung cancer",d:"More energy"}, correct:"c"},
    {q:"Why do we breathe faster after running?", options:{a:"To cool down",b:"To take in more oxygen",c:"To make noise",d:"To drink water"}, correct:"b"}
  ]
},

/* ---------------- UNIT 10 ---------------- */
{ id:"u10", number:10, term:2,
  strand:"Systems", substrand:"Ecosystems",
  code:"B5.3.3.1.1",
  title:"Energy Flow in Ecosystems",
  objectives:[
    "Explain how energy flows from the sun through living things.",
    "Describe the role of decomposers.",
    "Explain what happens when a food web is disturbed."
  ],
  vocab:[
    {term:"Ecosystem", def:"A community of living things and their non-living surroundings."},
    {term:"Trophic level", def:"A feeding level in a food chain."},
    {term:"Energy pyramid", def:"A diagram showing energy decreasing at each level."},
    {term:"Biodiversity", def:"The variety of living things in an ecosystem."}
  ],
  content:[
    {type:"h", text:"10.1 Energy Comes from the Sun"},
    {type:"p", text:"Almost all energy in an ecosystem comes from the <b>sun</b>. Green plants (producers) capture sunlight and use it to make food. Every other living thing gets its energy either directly or indirectly from plants."},
    {type:"h", text:"10.2 Energy Flow"},
    {type:"p", text:"Energy flows from one trophic level to the next:"},
    {type:"callout", variant:"note", title:"Sun → Producer → Consumer → Consumer → Decomposer",
      text:"Sunlight → Grass → Grasshopper → Lizard → Fungi<br>Each arrow means <i>is eaten by</i>."},
    {type:"h", text:"10.3 Energy Pyramid"},
    {type:"p", text:"At every step in a food chain, some energy is <b>lost as heat</b>. That is why an <b>energy pyramid</b> narrows towards the top — there are fewer animals at the top than at the bottom. A single lion needs a huge area of grass and many antelopes to survive."},
    {type:"h", text:"10.4 The Role of Decomposers"},
    {type:"p", text:"<b>Decomposers</b> (bacteria, fungi, termites, earthworms) break down dead plants and animals. They release nutrients back into the soil, where plants can use them again. Without decomposers, nutrients would be locked up in dead matter, and life on Earth would stop."},
    {type:"h", text:"10.5 When Food Webs Are Disturbed"},
    {type:"p", text:"If one type of living thing disappears, the whole web is affected. For example, if all the bees died:"},
    {type:"ul", items:[
      "Many plants would not be pollinated.",
      "Fruit and seed production would drop.",
      "Animals that eat those fruits would go hungry.",
      "The whole ecosystem would suffer."
    ]},
    {type:"example", label:"Example from Ghana",
      text:"On a cocoa farm, microorganisms and earthworms break down fallen leaves and cocoa pods, returning nutrients to the soil. Without these decomposers, the soil would lose fertility and the cocoa trees would become weak."}
  ],
  think:"Why is it that there are always fewer lions than antelopes, and fewer antelopes than grass, in a savanna? Use energy in your answer.",
  try:"Draw an energy pyramid with grass at the bottom, grasshoppers above, lizards above that, and hawks at the top. Explain why it narrows.",
  summary:"Energy comes from the sun and flows through producers, consumers and decomposers. Energy is lost as heat at each level, which is why food pyramids narrow at the top. Removing one species affects the whole ecosystem.",
  exercises:[],
  quiz:[
    {q:"Where does most energy in an ecosystem come from?", options:{a:"The moon",b:"The sun",c:"Water",d:"Wind"}, correct:"b"},
    {q:"What do we call an organism that makes its own food?", options:{a:"Consumer",b:"Decomposer",c:"Producer",d:"Predator"}, correct:"c"},
    {q:"What happens to energy at each trophic level?", options:{a:"It increases",b:"Some is lost as heat",c:"It stays the same",d:"It becomes food"}, correct:"b"},
    {q:"What does an energy pyramid show?", options:{a:"The weight of animals",b:"Energy decreasing at each level",c:"The size of plants",d:"The age of organisms"}, correct:"b"},
    {q:"What do decomposers do?", options:{a:"Make food from sunlight",b:"Break down dead matter and return nutrients to the soil",c:"Hunt other animals",d:"Produce oxygen"}, correct:"b"},
    {q:"Which of these is a decomposer?", options:{a:"Lion",b:"Earthworm",c:"Grass",d:"Goat"}, correct:"b"},
    {q:"If bees disappeared, what would happen?", options:{a:"More fruit",b:"Fewer pollinated plants and less fruit",c:"Nothing",d:"More honey"}, correct:"b"},
    {q:"Why does an energy pyramid narrow at the top?", options:{a:"Larger animals",b:"Energy is lost as heat at each level",c:"There is more space",d:"Top animals eat more"}, correct:"b"}
  ]
},

/* ---------------- UNIT 11 ---------------- */
{ id:"u11", number:11, term:3,
  strand:"Forces and Energy", substrand:"Sources and Forms of Energy",
  code:"B5.4.1.1.1",
  title:"Renewable and Non-Renewable Energy",
  objectives:[
    "Distinguish between renewable and non-renewable energy.",
    "Describe renewable energy sources used in Ghana.",
    "Explain why we should use more renewable energy."
  ],
  vocab:[
    {term:"Renewable", def:"Can be replaced naturally and will not run out."},
    {term:"Non-renewable", def:"Will run out one day."},
    {term:"Fossil fuel", def:"Fuel formed from dead plants and animals millions of years ago."},
    {term:"Solar energy", def:"Energy from the sun."},
    {term:"Hydro energy", def:"Energy from falling or flowing water."}
  ],
  content:[
    {type:"h", text:"11.1 Two Types of Energy Source"},
    {type:"table", headers:["Renewable","Non-renewable"],
      rows:[
        ["Sun (solar)","Petrol"],
        ["Wind","Diesel"],
        ["Water (hydro)","Coal"],
        ["Biomass (wood, waste)","Natural gas"],
        ["Geothermal","Kerosene"]
      ], caption:"Renewable sources do not run out; non-renewable sources do."},
    {type:"h", text:"11.2 Renewable Energy in Ghana"},
    {type:"ul", items:[
      "<b>Hydro</b> — the Akosombo, Kpong and Bui dams generate electricity from water.",
      "<b>Solar</b> — panels on rooftops produce electricity, especially in the north.",
      "<b>Biomass</b> — firewood, charcoal and agricultural waste.",
      "<b>Wind</b> — some coastal areas have potential for wind power."
    ]},
    {type:"h", text:"11.3 Non-Renewable Energy"},
    {type:"p", text:"Fossil fuels — petrol, diesel, kerosene, natural gas, coal — were formed over millions of years from dead plants and animals. Once they are burned, they are gone forever. They also release carbon dioxide, which contributes to climate change."},
    {type:"h", text:"11.4 Why We Should Use More Renewable Energy"},
    {type:"ol", items:[

      "They are cleaner — less pollution.",
      "They reduce climate change.",
      "They save money in the long run.",
      "They create new jobs in solar and wind industries."
    ]},
    {type:"example", label:"Example from Ghana",
      text:"The Bui Dam on the Black Volta generates hydro-electric power. Many health centres and schools in rural Ghana now use solar panels to keep lights on and to power fridges for vaccines — no need for petrol generators."}
  ],
  think:"Even though renewable energy is cleaner, why do you think many countries still use fossil fuels?",
  try:"List all the electrical appliances in your home. For each, note whether the electricity comes from renewable or non-renewable sources.",
  summary:"Renewable energy (sun, wind, water, biomass) will not run out. Non-renewable energy (petrol, diesel, coal) will run out and causes pollution. Ghana uses hydro, solar and biomass energy.",
  exercises:[],
  quiz:[
    {q:"What is a renewable energy source?", options:{a:"One that will run out",b:"One that can be replaced naturally",c:"One that comes from coal",d:"One that is rare"}, correct:"b"},
    {q:"Which is a fossil fuel?", options:{a:"Sun",b:"Wind",c:"Petrol",d:"Water"}, correct:"c"},
    {q:"Where does hydro energy come from?", options:{a:"Wind",b:"Sunlight",c:"Falling or flowing water",d:"Coal"}, correct:"c"},
    {q:"Which dam in Ghana produces hydro-electric power?", options:{a:"Akosombo",b:"Keta",c:"Ada",d:"Kumasi"}, correct:"a"},
    {q:"Which of these is a renewable source?", options:{a:"Diesel",b:"Coal",c:"Solar",d:"Kerosene"}, correct:"c"},

      "Like poles repel (N-N or S-S push away).",

      "A freely hanging magnet always points north-south.",

/* ---------------- UNIT 13 ---------------- */
{ id:"u13", number:13, term:3,
  strand:"Forces and Energy", substrand:"Forces and Movement",
  code:"B5.4.3.1.1",
  title:"Pressure and Motion",
  objectives:[
    "Explain pressure and give examples.",
    "Describe how forces affect motion.",
    "Measure speed and use the speed formula."
  ],
  vocab:[
    {term:"Pressure", def:"Force spread over a surface."},
    {term:"Speed", def:"How fast something moves — distance divided by time."},
    {term:"Air resistance", def:"A force that slows objects moving through air."},
    {term:"Streamlined", def:"Shaped to reduce resistance from air or water."}
  ],
  content:[
    {type:"h", text:"13.1 What Is Pressure?"},
    {type:"p", text:"<b>Pressure</b> is how much force is spread over a surface. If the same force acts on a smaller area, the pressure is greater."},
    {type:"ul", items:[
      "A sharp knife cuts better than a blunt one — the same force acts on a much smaller area.",
      "A nail has a sharp point so that the force on it creates huge pressure.",
      "A tractor has wide tyres so it does not sink into soft soil — the same weight is spread over a larger area."
    ]},
    {type:"h", text:"13.2 Motion and Forces"},
    {type:"p", text:"Forces change the way things move:"},
    {type:"ul", items:[
      "A force can make a still object start moving.",
      "A force can speed up a moving object.",
      "A force can slow down a moving object.",
      "A force can change the direction of movement.",
      "A force can stop a moving object."
    ]},
    {type:"h", text:"13.3 Speed"},
    {type:"p", text:"<b>Speed</b> tells us how fast something moves."},
    {type:"callout", variant:"tip", title:"Formula",
      text:"<b>Speed = Distance ÷ Time</b><br><br>Example: A car travels 120 km in 2 hours.<br>Speed = 120 ÷ 2 = <b>60 km/h</b>."},
    {type:"h", text:"13.4 Resistance and Streamlining"},
    {type:"p", text:"Moving objects push against <b>air resistance</b> (in air) or <b>water resistance</b> (in water). Streamlined shapes reduce this resistance."},
    {type:"ul", items:[
      "Fish are streamlined to swim fast.",
      "Birds are streamlined to fly.",
      "Cars and aeroplanes are streamlined to save fuel.",
      "Cyclists bend low to reduce air resistance."
    ]},
    {type:"example", label:"Example from Ghana",
      text:"A trotro driver on the Accra–Kumasi road travels about 250 km. If the journey takes 4 hours, the average speed is 250 ÷ 4 = <b>62.5 km/h</b>."}
  ],
  think:"Why does a sharp needle pierce your skin easily, but a blunt one does not, even when pushed with the same force?",
  try:"Measure how long it takes you to walk 20 metres. Calculate your walking speed in m/s.",
  summary:"Pressure is force over area. Forces can start, stop, speed up or change the direction of motion. Speed = distance ÷ time. Streamlined shapes reduce resistance.",
  exercises:[],
  quiz:[
    {q:"What is pressure?", options:{a:"Force spread over a surface",b:"Speed",c:"Weight",d:"Height"}, correct:"a"},
    {q:"Why does a sharp knife cut better than a blunt one?", options:{a:"It is heavier",b:"It has less area, so more pressure",c:"It is colder",d:"It is shinier"}, correct:"b"},
    {q:"Why do tractors have wide tyres?", options:{a:"To look nice",b:"To spread weight and reduce pressure",c:"To go faster",d:"To use more fuel"}, correct:"b"},
    {q:"What is the formula for speed?", options:{a:"Distance + Time",b:"Distance × Time",c:"Distance ÷ Time",d:"Time ÷ Distance"}, correct:"c"},
    {q:"A car travels 180 km in 3 hours. What is its speed?", options:{a:"40 km/h",b:"50 km/h",c:"60 km/h",d:"70 km/h"}, correct:"c"},
    {q:"What slows a moving object in air?", options:{a:"Gravity",b:"Air resistance",c:"Magnetism",d:"Friction only"}, correct:"b"},
    {q:"What is a streamlined shape?", options:{a:"Square and flat",b:"Shaped to reduce resistance",c:"Very heavy",d:"Very wide"}, correct:"b"},
    {q:"Which of these is streamlined?", options:{a:"A brick",b:"A cube",c:"A fish",d:"A table"}, correct:"c"}
  ]
},

/* ---------------- UNIT 14 ---------------- */
{ id:"u14", number:14, term:3,
  strand:"Forces and Energy", substrand:"Forces and Movement",
  code:"B5.4.3.2.1",
  title:"Levers and Pulleys",
  objectives:[
    "Explain how levers work.",
    "Explain how pulleys reduce effort.",
    "Identify levers and pulleys in daily life."
  ],
  vocab:[
    {term:"Lever", def:"A bar that turns around a fixed point called a fulcrum."},
    {term:"Fulcrum", def:"The fixed point a lever turns around."},
    {term:"Effort", def:"The force you apply to a machine."},
    {term:"Load", def:"The object being moved or lifted."},
    {term:"Pulley", def:"A wheel with a grooved rim used with a rope to lift loads."}
  ],
  content:[
    {type:"h", text:"14.1 Levers"},
    {type:"p", text:"A <b>lever</b> is a bar that turns around a fixed point called the <b>fulcrum</b>. When you push down on one end, the other end lifts the load. Levers make work easier by increasing the effect of your effort."},
    {type:"ul", items:[
      "A crowbar lifting a heavy stone — fulcrum near the stone.",
      "A see-saw — fulcrum in the middle.",
      "Scissors — the joint is the fulcrum.",
      "A wheelbarrow — the wheel is the fulcrum."
    ]},
    {type:"h", text:"14.2 Classes of Levers"},
    {type:"table", headers:["Class","Where is fulcrum?","Example"],
      rows:[
        ["First class","Between effort and load","See-saw, scissors"],
        ["Second class","At one end, load in middle","Wheelbarrow"],
        ["Third class","At one end, effort in middle","Tweezers, fishing rod"]
      ], caption:"Three classes of levers."},
    {type:"h", text:"14.3 Pulleys"},
    {type:"p", text:"A <b>pulley</b> is a wheel with a rope around it. It changes the direction of the force so you can pull <b>down</b> to lift something <b>up</b>. With two or more pulleys, you also need less effort to lift a heavy load."},
    {type:"ul", items:[
      "A single fixed pulley — changes direction (like a flagpole).",
      "A single movable pulley — reduces effort.",
      "A block and tackle (combined pulleys) — greatly reduces effort, used in cranes."
    ]},
    {type:"h", text:"14.4 Levers and Pulleys in Ghana"},
    {type:"ul", items:[
      "Well ropes over a pulley at the top of the well.",
      "Cranes at Tema Harbour lifting cargo.",
      "Farmers using crowbars to lift heavy rocks.",
      "Mechanics lifting engines with pulley hoists."
    ]},
    {type:"example", label:"Example from Ghana",
      text:"At Tema Harbour, huge cranes use pulleys to lift containers that weigh many tonnes. The crane operator pulls a small rope, and the pulleys multiply the force to lift the heavy container."}
  ],
  think:"Why is a wheelbarrow easier to use than carrying the same load in your hands?",
  try:"Make a simple lever using a ruler and a small block (the fulcrum). Balance a heavy book on one end and push down with your finger on the other end. Where does the fulcrum need to be for least effort?",
  summary:"Levers use a fulcrum to lift loads with less effort. There are three classes of levers. Pulleys change the direction of force and, when combined, reduce the effort needed to lift heavy loads.",
  exercises:[],
  quiz:[
    {q:"What is a lever?", options:{a:"A wheel with a rope",b:"A bar that turns around a fulcrum",c:"A type of magnet",d:"A kind of screw"}, correct:"b"},
    {q:"What is the fulcrum?", options:{a:"The load",b:"The effort",c:"The fixed point a lever turns around",d:"A pulley"}, correct:"c"},
    {q:"Which is a lever?", options:{a:"A wheelbarrow",b:"A coin",c:"A pencil",d:"A cup"}, correct:"a"},
    {q:"What does a pulley change?", options:{a:"The load's weight",b:"The direction of the force",c:"The colour of the rope",d:"The shape of the load"}, correct:"b"},
    {q:"How does a pulley help you lift a heavy bucket from a well?", options:{a:"It makes the bucket lighter",b:"It lets you pull down to lift up",c:"It removes gravity",d:"It uses magnets"}, correct:"b"},
    {q:"Which is a first-class lever?", options:{a:"See-saw",b:"Wheelbarrow",c:"Tweezers",d:"Fishing rod"}, correct:"a"},
    {q:"Why is a wheelbarrow easier than carrying a load by hand?", options:{a:"It reduces gravity",b:"It uses a lever to lift with less effort",c:"It is bigger",d:"It is faster"}, correct:"b"},
    {q:"Where would you see a pulley in Ghana?", options:{a:"On a flagpole",b:"On a plate",c:"In a book",d:"In a shoe"}, correct:"a"}
  ]
},

    {q:"Which of these is an inference?", options:{a:"Ama is smiling.",b:"Ama is happy.",c:"Ama has ten fingers.",d:"Ama is in Basic 5."}, correct:"b"},
    {q:"What supports an inference?", options:{a:"A guess",b:"Evidence from the text",c:"The title only",d:"The reader's name"}, correct:"b"},
    {q:"What does <i>imply</i> mean?", options:{a:"To say directly",b:"To suggest without saying directly",c:"To shout",d:"To write"}, correct:"b"},
    {q:"Which question helps you infer?", options:{a:"What is my name?",b:"What clues are hidden?",c:"How old am I?",d:"Where am I?"}, correct:"b"},
    {q:"Why is inference important in reading?", options:{a:"It helps you understand what is not directly stated",b:"It gives you answers",c:"It makes reading easier",d:"It teaches spelling"}, correct:"a"}
  ]
},

{ id:"u3", number:3, term:1,
  strand:"Reading", substrand:"Vocabulary",
  code:"B5.2.1.2.1",
  title:"Idioms and Proverbs",
  objectives:[
    "Identify common idioms and their meanings.",
    "Understand common Ghanaian proverbs.",
    "Use idioms correctly in sentences."
  ],
  vocab:[
    {term:"Idiom", def:"A phrase with a meaning different from the words in it."},
    {term:"Proverb", def:"A short, wise saying that teaches a lesson."},
    {term:"Figurative", def:"Not literal — meaning is symbolic."},
    {term:"Literal", def:"Meaning exactly what the words say."}
  ],
  content:[
    {type:"h", text:"3.1 What Is an Idiom?"},
    {type:"p", text:"An <b>idiom</b> is a phrase that means something different from the literal meaning of its words. You cannot understand an idiom just from the words — you must learn it."},
    {type:"table", headers:["Idiom","Meaning"],
      rows:[
        ["It's raining cats and dogs","It's raining very heavily"],
        ["A piece of cake","Something very easy"],
        ["Break the ice","To start a conversation"],
        ["Hit the nail on the head","To say exactly the right thing"],
        ["Under the weather","Feeling unwell"],
        ["Once in a blue moon","Very rarely"]
      ], caption:"Common English idioms."},
    {type:"h", text:"3.2 Proverbs"},
    {type:"p", text:"A <b>proverb</b> is a short, wise saying. Proverbs pass down wisdom from generation to generation."},
    {type:"table", headers:["Proverb","Meaning"],
      rows:[
        ["The early bird catches the worm","Wake up early and you will succeed"],
        ["A stitch in time saves nine","Fix problems early before they grow"],
        ["You cannot eat your cake and have it","You cannot have two things at once"],
        ["Where there is a will, there is a way","Determination overcomes obstacles"]
      ], caption:"Common English proverbs."},
    {type:"h", text:"3.3 Ghanaian Proverbs"},
    {type:"p", text:"Ghana has thousands of proverbs in Twi, Ewe, Ga, Dagbani and other languages. Here are some translated into English:"},
    {type:"ul", items:[
      "<b>“The lizard that jumped from the high iroko tree said he would praise himself if no one else did.”</b> (Chinua Achebe — Igbo) — Do not wait for others to praise you; sometimes you must recognise your own achievement.",
      "<b>“When the cock crows, the hen listens.”</b> — Elders should set an example for the young.",
      "<b>“If you want to go quickly, go alone; if you want to go far, go together.”</b> — Teamwork is important."
    ]},
    {type:"example", label:"Example from Ghana",
      text:"A teacher might say, <i>“You've hit the nail on the head!”</i> when a pupil gives exactly the right answer. It does not mean the pupil actually hammered a nail."}
  ],
  think:"Why do you think idioms and proverbs exist in every culture? What do they add to language that plain words cannot?",
  try:"Ask a grandparent or elder for three proverbs from your local language. Write them down with their meanings in English.",
  summary:"Idioms are phrases with non-literal meanings. Proverbs are short, wise sayings that teach lessons. Both are found in every culture and enrich language.",
  exercises:[],
  quiz:[
    {q:"What is an idiom?", options:{a:"A scientific term",b:"A phrase with a meaning different from the words",c:"A type of noun",d:"A punctuation mark"}, correct:"b"},
    {q:"What does <i>It's raining cats and dogs</i> mean?", options:{a:"Animals are falling from the sky",b:"It is raining very heavily",c:"It is sunny",d:"It is snowing"}, correct:"b"},
    {q:"What does <i>a piece of cake</i> mean?", options:{a:"A dessert",b:"Something very easy",c:"A small cake",d:"A large meal"}, correct:"b"},
    {q:"What is a proverb?", options:{a:"A long story",b:"A short, wise saying",c:"A type of poem",d:"A riddle"}, correct:"b"},
    {q:"What does <i>The early bird catches the worm</i> mean?", options:{a:"Birds eat worms",b:"Waking up early brings success",c:"Worms are dangerous",d:"Birds are fast"}, correct:"b"},
    {q:"What does <i>break the ice</i> mean?", options:{a:"To smash ice",b:"To start a conversation",c:"To be cold",d:"To end a party"}, correct:"b"},
    {q:"What does <i>once in a blue moon</i> mean?", options:{a:"Once a month",b:"Very rarely",c:"Very often",d:"Never"}, correct:"b"},
    {q:"Why are proverbs useful?", options:{a:"They are long",b:"They teach wisdom in a short form",c:"They are modern",d:"They are secret"}, correct:"b"}
  ]
},

/* ---------------- UNIT 4 ---------------- */
{ id:"u4", number:4, term:1,
  strand:"Writing", substrand:"Composition",
  code:"B5.3.1.1.1",
  title:"Writing Reports",
  objectives:[
    "Explain the purpose and structure of a report.",
    "Write a simple report on an event or visit.",
    "Use headings and subheadings."
  ],
  vocab:[
    {term:"Report", def:"A factual account of an event or situation."},
    {term:"Heading", def:"The title of a section."},
    {term:"Subheading", def:"A smaller heading within a section."},
    {term:"Objective", def:"Based on facts, not personal feelings."}
  ],
  content:[
    {type:"h", text:"4.1 What Is a Report?"},
    {type:"p", text:"A <b>report</b> is a factual account of something that happened. It gives information clearly. Reports are used in schools, businesses, governments and newspapers."},
    {type:"h", text:"4.2 Features of a Report"},
    {type:"ul", items:[
      "<b>Title</b> — short and clear.",
      "<b>Introduction</b> — what the report is about.",
      "<b>Body</b> — the facts, often in order of time or importance.",
      "<b>Conclusion</b> — a summary or recommendation.",
      "Uses <b>headings</b> and <b>subheadings</b> to guide the reader.",
      "Written in <b>past tense</b> because the event already happened."
    ]},
    {type:"h", text:"4.3 Structure of a Report"},
    {type:"table", headers:["Section","Purpose"],
      rows:[
        ["Title","Tells the reader what the report is about"],
        ["Introduction","Sets the scene — who, what, when, where"],
        ["Body","Details of what happened"],
        ["Conclusion","Summary and any recommendations"]
      ], caption:"Sections of a report."},
    {type:"h", text:"4.4 Sample Report"},
    {type:"callout", variant:"note", title:"REPORT ON THE BASIC 5 CLASS VISIT TO KAKUM NATIONAL PARK",
      text:"<b>Introduction</b><br>On Friday, 15th March, the Basic 5 class of Ama Basic School visited Kakum National Park in the Central Region. Twenty-eight pupils and three teachers took part. The purpose of the visit was to learn about the rainforest and its biodiversity.<br><br><b>The Journey</b><br>We left school at 6:30 am and arrived at 9:00 am. The journey was comfortable, and we sang songs on the bus.<br><br><b>The Canopy Walkway</b><br>We climbed the famous canopy walkway, which is 40 metres above the forest floor. From there we saw tall trees, butterflies, birds and even a monkey. Our guide explained how the forest gives us medicine, food and clean air.<br><br><b>Conclusion</b><br>The visit was both educational and enjoyable. We recommend that future classes also take this trip, as it brings science lessons to life."},
    {type:"example", label:"Example from Ghana",
      text:"School prefects write weekly reports for their head teachers. Sports captains report on matches. Class monitors report on attendance. Learning to write clear reports is a useful life skill."}
  ],
  think:"Why do you think reports must be written in the past tense and in a factual, objective tone?",
  try:"Write a short report on a recent school event — a sports day, a quiz competition or a visit. Use headings and past tense.",
  summary:"A report is a factual account. It has a title, introduction, body and conclusion. Headings and subheadings help the reader. Reports are written in past tense and stay objective.",
  exercises:[],
  quiz:[
    {q:"What is a report?", options:{a:"A story",b:"A factual account of an event",c:"A poem",d:"A greeting"}, correct:"b"},
    {q:"What tense is used in a report?", options:{a:"Present",b:"Future",c:"Past",d:"Any"}, correct:"c"},
    {q:"What is the purpose of a heading?", options:{a:"To decorate",b:"To guide the reader",c:"To fill space",d:"To count words"}, correct:"b"},
    {q:"Which section sets the scene?", options:{a:"Title",b:"Introduction",c:"Body",d:"Conclusion"}, correct:"b"},
    {q:"Which section gives details of what happened?", options:{a:"Title",b:"Introduction",c:"Body",d:"Conclusion"}, correct:"c"},
    {q:"What should a report be?", options:{a:"Emotional",b:"Objective and factual",c:"Fictional",d:"Poetic"}, correct:"b"},
    {q:"Which is a good title for a report?", options:{a:"I feel happy",b:"Report on the Class Visit to Kakum",c:"Once upon a time",d:"The End"}, correct:"b"},
    {q:"Why does a report use subheadings?", options:{a:"To break up the body into clear sections",b:"To look nice",c:"To confuse the reader",d:"To save paper"}, correct:"a"}
  ]
},

/* ---------------- UNIT 5 ---------------- */
{ id:"u5", number:5, term:2,
  strand:"Reading", substrand:"Comprehension",
  code:"B5.2.1.3.1",
  title:"Comparing and Contrasting Texts",
  objectives:[
    "Compare two texts on the same topic.",
    "Identify similarities and differences.",
    "Use a Venn diagram to organise ideas."
  ],
  vocab:[
    {term:"Compare", def:"To find similarities."},
    {term:"Contrast", def:"To find differences."},
    {term:"Venn diagram", def:"Two overlapping circles for comparing."},
    {term:"Similarity", def:"Something that is the same."},
    {term:"Difference", def:"Something that is not the same."}
  ],
  content:[
    {type:"h", text:"5.1 Comparing and Contrasting"},
    {type:"p", text:"When we <b>compare</b>, we look for what is the same. When we <b>contrast</b>, we look for what is different. Comparing texts helps us understand each one better."},
    {type:"h", text:"5.2 Venn Diagrams"},
    {type:"p", text:"A <b>Venn diagram</b> uses two overlapping circles. The shared middle shows the similarities; the outer parts show the differences."},
    {type:"callout", variant:"tip", title:"Example",
      text:"<b>Text A:</b> A newspaper article about cocoa farming.<br><b>Text B:</b> A story about a cocoa farmer.<br><br><b>Similarities (middle):</b> Both are about cocoa. Both mention hard work.<br><b>Text A only:</b> Facts, statistics, quotes from officials.<br><b>Text B only:</b> Named characters, dialogue, feelings."},
    {type:"h", text:"5.3 Useful Comparison Phrases"},
    {type:"ul", items:[
      "<b>Similarities:</b> Both… / Similarly… / Also… / In the same way…",
      "<b>Differences:</b> However… / On the other hand… / Unlike… / Whereas…"
    ]},
    {type:"h", text:"5.4 Two Passages to Compare"},
    {type:"callout", variant:"note", title:"Passage A — Facts",
      text:"Cocoa is Ghana's largest export crop. It is grown mainly in the Ashanti, Eastern and Western Regions. Ghana is the second-largest cocoa producer in the world after Côte d'Ivoire."},
    {type:"callout", variant:"note", title:"Passage B — Story",
      text:"Kwaku walked through his cocoa farm at dawn. He touched the yellow pods gently, checking them for ripeness. “This year will be good,” he whispered to himself. His father had planted these trees, and now they fed his family."},
    {type:"example", label:"Example from Ghana",
      text:"Comparing a news report about a football match with a fan's blog post on the same match shows very different writing styles — one formal and factual, the other personal and emotional."}
  ],
  think:"Why is it useful to compare two texts on the same topic rather than just reading one?",
  try:"Read two short articles on any topic (for example, from a newspaper and a website). Use a Venn diagram to show what they share and how they differ.",
  summary:"Comparing finds similarities; contrasting finds differences. A Venn diagram organises these. Comparison phrases help us write about texts clearly.",
  exercises:[],
  quiz:[
    {q:"What does <i>compare</i> mean?", options:{a:"To find differences",b:"To find similarities",c:"To summarise",d:"To criticise"}, correct:"b"},
    {q:"What does <i>contrast</i> mean?", options:{a:"To find similarities",b:"To find differences",c:"To write",d:"To argue"}, correct:"b"},
    {q:"What does a Venn diagram use?", options:{a:"Squares",b:"Two overlapping circles",c:"Triangles",d:"A single line"}, correct:"b"},
    {q:"Which phrase shows similarity?", options:{a:"However",b:"Both",c:"On the other hand",d:"Unlike"}, correct:"b"},
    {q:"Which phrase shows difference?", options:{a:"Similarly",b:"Also",c:"However",d:"In the same way"}, correct:"c"},
    {q:"In the example, what do both texts have in common?", options:{a:"Statistics",b:"Subject — cocoa",c:"Dialogue",d:"Named characters"}, correct:"b"},
    {q:"Which text uses facts and statistics?", options:{a:"Passage A",b:"Passage B",c:"Both",d:"Neither"}, correct:"a"},
    {q:"Why compare texts?", options:{a:"To understand each one better",b:"To count words",c:"To copy them",d:"To add pages"}, correct:"a"}
  ]
},

/* ---------------- UNIT 6 ---------------- */
{ id:"u6", number:6, term:2,
  strand:"Writing", substrand:"Grammar Usage",
  code:"B5.3.1.2.1",
  title:"Prepositions and Conjunctions",
  objectives:[
    "Identify prepositions and use them correctly.",
    "Identify conjunctions and use them to join ideas.",
    "Write compound and complex sentences."
  ],
  vocab:[
    {term:"Preposition", def:"A word showing position or direction."},
    {term:"Conjunction", def:"A word that joins words or clauses."},
    {term:"Clause", def:"A group of words with a subject and a verb."},
    {term:"Compound sentence", def:"Two simple sentences joined by a conjunction."}
  ],
  content:[
    {type:"h", text:"6.1 Prepositions"},
    {type:"p", text:"A <b>preposition</b> shows the position, direction or time of a noun. Common prepositions include: <i>in, on, under, over, above, below, between, beside, behind, through, with, at, by</i>."},
    {type:"ul", items:[
      "The book is <b>on</b> the table.",
      "The cat sat <b>under</b> the chair.",
      "We walked <b>through</b> the forest.",
      "The ball rolled <b>between</b> the two stones."
    ]},
    {type:"h", text:"6.2 Conjunctions"},
    {type:"p", text:"A <b>conjunction</b> joins words, phrases or clauses. Common conjunctions: <i>and, but, or, so, because, although, if, while, since</i>."},
    {type:"table", headers:["Conjunction","Use","Example"],
      rows:[
        ["and","Joins similar ideas","I like rice and beans."],
        ["but","Shows contrast","I was tired but I finished the work."],
        ["or","Shows a choice","We can walk or take a taxi."],
        ["because","Gives a reason","She ran because she was late."],
        ["so","Shows result","It rained, so we stayed inside."],
        ["although","Shows contrast","Although it was late, he kept reading."]
      ], caption:"Common conjunctions and their uses."},
    {type:"h", text:"6.3 Compound Sentences"},
    {type:"p", text:"A <b>compound sentence</b> is two simple sentences joined by a conjunction."},
    {type:"ul", items:[
      "I like rice. + I like beans. → I like rice <b>and</b> beans.",
      "It rained. + We stayed inside. → It rained, <b>so</b> we stayed inside."
    ]},
    {type:"h", text:"6.4 Complex Sentences"},
    {type:"p", text:"A <b>complex sentence</b> has one main idea and one or more supporting clauses. The supporting clause begins with a conjunction."},
    {type:"ul", items:[
      "<b>Because</b> it rained, we stayed inside.",
      "<b>Although</b> she was tired, she finished her homework.",
      "<b>When</b> the bell rang, the pupils ran outside."
    ]},
    {type:"example", label:"Example from Ghana",
      text:"Compare: <i>“The trotro stopped. A goat crossed the road.”</i> Joined with a conjunction: <i>“The trotro stopped <b>because</b> a goat crossed the road.”</i>"}
  ],
  think:"Why do you think prepositions and conjunctions are called 'connecting words'? What would writing sound like without them?",
  try:"Write five sentences using different prepositions and five using different conjunctions. Underline each connecting word.",
  summary:"Prepositions show position or direction. Conjunctions join words and clauses. Compound sentences are two simple sentences joined by a conjunction. Complex sentences have a main clause and a supporting clause.",
  exercises:[],
  quiz:[
    {q:"What is a preposition?", options:{a:"A joining word",b:"A word showing position or direction",c:"A type of noun",d:"An adjective"}, correct:"b"},
    {q:"Which of these is a preposition?", options:{a:"And",b:"But",c:"Under",d:"Because"}, correct:"c"},
    {q:"Which of these is a conjunction?", options:{a:"Under",b:"On",c:"Because",d:"Above"}, correct:"c"},
    {q:"In <i>The book is on the table</i>, what is the preposition?", options:{a:"Book",b:"Is",c:"On",d:"Table"}, correct:"c"},
    {q:"What does <i>but</i> show?", options:{a:"Addition",b:"Contrast",c:"Reason",d:"Time"}, correct:"b"},
    {q:"What does <i>because</i> show?", options:{a:"Contrast",b:"Reason",c:"Choice",d:"Time"}, correct:"b"},
    {q:"Which is a compound sentence?", options:{a:"I ran.",b:"I ran and jumped.",c:"Running fast.",d:"Runs."}, correct:"b"},
    {q:"Which is a complex sentence?", options:{a:"I ran.",b:"The cat sat.",c:"Although it was late, he kept reading.",d:"Run!"}, correct:"c"}
  ]
},

{ id:"u7", number:7, term:2,
  strand:"Reading", substrand:"Fluency",
  code:"B5.2.1.4.1",
  title:"Reading Poetry and Reciting",
  objectives:[
    "Read a poem with correct rhythm and expression.",
    "Identify figurative language in a poem.",
    "Recite a poem from memory with feeling."
  ],
  vocab:[
    {term:"Stanza", def:"A group of lines in a poem."},
    {term:"Metaphor", def:"A comparison without using 'like' or 'as'."},
    {term:"Personification", def:"Giving human qualities to non-human things."},
    {term:"Alliteration", def:"Repetition of the same sound at the start of words."}
  ],
  content:[
    {type:"h", text:"7.1 Figurative Language in Poetry"},
    {type:"p", text:"Poets use special language to create pictures and feelings in the reader's mind."},
    {type:"ul", items:[
      "<b>Simile</b> — a comparison using 'like' or 'as'. <i>“Her voice was like a gentle breeze.”</i>",
      "<b>Metaphor</b> — a direct comparison. <i>“The classroom was a beehive of activity.”</i>",
      "<b>Personification</b> — giving human qualities to non-human things. <i>“The wind whispered through the trees.”</i>",
      "<b>Alliteration</b> — repetition of sounds. <i>“The sun sank slowly in the silent sky.”</i>"
    ]},
    {type:"h", text:"7.2 Reading a Poem with Feeling"},
    {type:"p", text:"When reading a poem aloud:"},
    {type:"ul", items:[
      "Follow the rhythm — let the words flow.",
      "Pause at the end of each line if the meaning allows it.",
      "Change your voice to show feelings — happy, sad, excited, thoughtful.",
      "Read slowly — do not rush."
    ]},
    {type:"h", text:"7.3 Poem to Recite"},
    {type:"callout", variant:"note", title:"Harmattan",
      text:"The wind comes down from desert lands,<br>It cracks our lips, it dries our hands.<br>It swirls the dust across the street,<br>And stings our faces with its heat.<br><br>But still the children laugh and play,<br>And farmers hope for rain some day.<br>The harmattan will pass in time,<br>Then rain will fall and all will shine."},
    {type:"h", text:"7.4 Identify the Devices"},
    {type:"ul", items:[
      "“It cracks our lips, it dries our hands” — <b>personification</b> (the wind is doing human actions).",
      "“The harmattan will pass in time” — <b>metaphor of seasons as a visitor</b>.",
      "The rhyme <b>street / heat</b> and <b>time / shine</b>."
    ]},
    {type:"example", label:"Example from Ghana",
      text:"Ghanaian poetry is rich with imagery from our land — harmattan wind, cocoa farms, market sounds, the drumbeat and the sea. Reading these poems aloud brings them to life."}
  ],
  think:"Why do you think poets use figurative language instead of just plain descriptions?",
  try:"Write a four-line poem about your favourite weather. Include at least one simile or metaphor.",
  summary:"Poets use similes, metaphors, personification and alliteration to create pictures and feelings. Reading aloud with rhythm, pause and feeling brings a poem to life.",
  exercises:[],
  quiz:[
    {q:"What is a simile?", options:{a:"A comparison using 'like' or 'as'",b:"A direct comparison",c:"A repetition of sound",d:"A type of noun"}, correct:"a"},
    {q:"What is a metaphor?", options:{a:"A comparison using 'like' or 'as'",b:"A direct comparison without 'like' or 'as'",c:"A rhyme",d:"A stanza"}, correct:"b"},
    {q:"What is personification?", options:{a:"Giving human qualities to non-human things",b:"A comparison",c:"A rhyme",d:"A syllable"}, correct:"a"},
    {q:"What is alliteration?", options:{a:"Repetition of the same sound at word starts",b:"A rhyme",c:"A metaphor",d:"A stanza"}, correct:"a"},
    {q:"Which is a simile?", options:{a:"Her voice was like a gentle breeze",b:"The classroom was a beehive",c:"The wind whispered",d:"The sun sank slowly"}, correct:"a"},
    {q:"Which is personification?", options:{a:"The wind whispered through the trees",b:"The tree was tall",c:"The sun is hot",d:"The tree is green"}, correct:"a"},
    {q:"What is a group of lines in a poem called?", options:{a:"Paragraph",b:"Stanza",c:"Chapter",d:"Sentence"}, correct:"b"},
    {q:"How should a poem be read aloud?", options:{a:"Fast and flat",b:"Slowly, with feeling and rhythm",c:"In a whisper",d:"All on one tone"}, correct:"b"}
  ]
},

/* ---------------- UNIT 8 ---------------- */
{ id:"u8", number:8, term:2,
  strand:"Writing", substrand:"Composition",
  code:"B5.3.1.3.1",
  title:"Persuasive Writing",
  objectives:[
    "Identify the features of persuasive writing.",
    "Write a persuasive paragraph with clear reasons.",
    "Use persuasive techniques appropriately."
  ],
  vocab:[
    {term:"Persuade", def:"To convince someone to agree or act."},
    {term:"Argument", def:"A reason given in support of a position."},
    {term:"Counter-argument", def:"An argument against your position."},
    {term:"Call to action", def:"A request for the reader to do something."}
  ],
  content:[
    {type:"h", text:"8.1 What Is Persuasive Writing?"},
    {type:"p", text:"<b>Persuasive writing</b> tries to convince the reader to think or act in a certain way. It is used in advertisements, letters to the editor, speeches, and essays on controversial topics."},
    {type:"h", text:"8.2 Features of Persuasive Writing"},
    {type:"ul", items:[
      "A clear <b>position</b> — what you believe.",
      "Strong <b>reasons</b> — why you believe it.",
      "<b>Evidence</b> — facts, examples, statistics.",
      "<b>Emotional appeal</b> — stories or images that stir feelings.",
      "<b>Counter-argument</b> — acknowledging the other side, then rebutting it.",
      "A <b>call to action</b> — what you want the reader to do."
    ]},
    {type:"h", text:"8.3 Persuasive Techniques"},
    {type:"table", headers:["Technique","Example"],
      rows:[
        ["Rhetorical question","Do you want your children to grow up in a polluted city?"],
        ["Repetition","Clean water matters. Clean air matters. Our future matters."],
        ["Statistics","Over 70% of pupils walk to school every day."],
        ["Emotional appeal","Think of the children who cannot swim in our rivers any more."]
      ], caption:"Common persuasive techniques."},
    {type:"h", text:"8.4 Sample Persuasive Paragraph"},
    {type:"callout", variant:"note", title:"Why We Must Stop Galamsey",
      text:"Galamsey is destroying our rivers. Just last year, three major rivers turned brown from illegal mining. Fish are dying. Villagers who once fetched clean drinking water now walk miles to find any. Is this the Ghana we want for our children?<br><br>Some say galamsey brings money. But what good is money if we have no water to drink? What good is gold if we have no rivers to swim in?<br><br>We must act now. Report illegal mining. Support laws that protect our rivers. Our future depends on it."},
    {type:"example", label:"Example from Ghana",
      text:"Newspaper opinion pieces in Ghana often use persuasive writing to argue for or against government policies — for example, on taxes, education or the environment."}
  ],
  think:"Why do you think a good persuasive writer should also acknowledge the opposing view? Does this weaken or strengthen the argument?",
  try:"Write a persuasive paragraph arguing that <i>“School gardens should be compulsory in all basic schools.”</i> Use at least two persuasive techniques.",
  summary:"Persuasive writing aims to convince the reader. Features include a clear position, reasons, evidence, emotional appeal and a call to action. Techniques include rhetorical questions, repetition and statistics.",
  exercises:[],
  quiz:[
    {q:"What is the aim of persuasive writing?", options:{a:"To entertain",b:"To convince the reader",c:"To inform",d:"To describe"}, correct:"b"},
    {q:"Which is a persuasive technique?", options:{a:"Rhetorical question",b:"Dialogue",c:"Rhyme",d:"Metaphor"}, correct:"a"},
    {q:"What is a call to action?", options:{a:"A greeting",b:"A request for the reader to do something",c:"A type of noun",d:"A rhyme"}, correct:"b"},
    {q:"Why include evidence?", options:{a:"To lengthen the text",b:"To make the argument stronger",c:"To confuse readers",d:"To sound clever"}, correct:"b"},
    {q:"What is a counter-argument?", options:{a:"A reason for your side",b:"An argument against your position",c:"A greeting",d:"A rhyme"}, correct:"b"},
    {q:"Which example is a rhetorical question?", options:{a:"Where are you going?",b:"Do you want your children to grow up in a polluted city?",c:"Is it raining?",d:"What is your name?"}, correct:"b"},
    {q:"Which of these is NOT a feature of persuasive writing?", options:{a:"Clear position",b:"Strong reasons",c:"Long, confusing words",d:"Call to action"}, correct:"c"},
    {q:"Which technique repeats for emphasis?", options:{a:"Repetition",b:"Metaphor",c:"Alliteration",d:"Rhyme"}, correct:"a"}
  ]

{ id:"u10", number:10, term:3,
  strand:"Writing", substrand:"Grammar Usage",
  code:"B5.3.1.4.1",
  title:"Direct and Indirect Speech",
  objectives:[
    "Identify direct and indirect speech.",
    "Convert direct speech to indirect speech.",
    "Use correct punctuation for direct speech."
  ],
  vocab:[
    {term:"Direct speech", def:"Exactly what someone said, in quotation marks."},
    {term:"Indirect speech", def:"Reporting what someone said without quoting them."},
    {term:"Reporting verb", def:"Words like 'said', 'asked', 'replied'."},
    {term:"Quotation marks", def:"Punctuation marks “ ” used for direct speech."}
  ],
  content:[
    {type:"h", text:"10.1 Direct Speech"},
    {type:"p", text:"<b>Direct speech</b> gives the exact words someone said. We use quotation marks (“ ”) and a reporting verb."},
    {type:"ul", items:[
      "Ama said, <b>“I am going to the market.”</b>",
      "Kofi asked, <b>“Where is my bag?”</b>",
      "<b>“Please be quiet,”</b> said the teacher."
    ]},
    {type:"h", text:"10.2 Indirect (Reported) Speech"},
    {type:"p", text:"<b>Indirect speech</b> reports what someone said without using their exact words. We remove quotation marks and change the tense and pronouns."},
    {type:"table", headers:["Direct speech","Indirect speech"],
      rows:[
        ["Ama said, “I am tired.”","Ama said that she was tired."],
        ["Kofi said, “I will come tomorrow.”","Kofi said he would come the next day."],
        ["The teacher said, “You are late.”","The teacher said that we were late."],
        ["Mum said, “I am cooking.”","Mum said she was cooking."]
      ], caption:"Converting direct to indirect speech."},
    {type:"h", text:"10.3 Rules for Converting"},
    {type:"ol", items:[
      "Remove the quotation marks.",
      "Change the reporting verb if needed (said → told when a person is named).",
      "Change pronouns (I → he/she, we → they).",
      "Change tense: present → past; will → would; can → could.",
      "Change time words: today → that day; tomorrow → the next day; yesterday → the day before."
    ]},
    {type:"h", text:"10.4 Punctuating Direct Speech"},
    {type:"ul", items:[
      "Use quotation marks around the speaker's exact words.",
      "Use a comma before the quotation.",
      "Capitalise the first word inside the quotation marks.",
      "Put the full stop, question mark or exclamation inside the quotation."
    ]},
    {type:"example", label:"Example from Ghana",
      text:"A news reporter might use indirect speech: <i>“The Minister said that the new road would be completed by December.”</i> Or direct speech: <i>“The road will be completed by December,” the Minister said.</i>"}
  ],
  think:"Why is indirect speech often used in news reports, while direct speech is used in stories?",
  try:"Convert these to indirect speech: (a) “I like kenkey,” said Kofi. (b) “Where are you going?” asked Ama. (c) “We will come tomorrow,” they said.",
  summary:"Direct speech uses quotation marks to show the exact words. Indirect speech reports the words without quotation marks, changing tense, pronouns and time words.",
  exercises:[],
  quiz:[

    {q:"Which sentence is direct speech?", options:{a:"Ama said that she was tired.",b:"Ama said, “I am tired.”",c:"Ama was tired.",d:"Ama said she was going."}, correct:"b"},
    {q:"Which sentence is indirect speech?", options:{a:"Kofi said, “I am coming.”",b:"Kofi said that he was coming.",c:"Kofi is coming.",d:"Kofi came."}, correct:"b"},
    {q:"In indirect speech, present tense usually changes to ______.", options:{a:"Future",b:"Past",c:"Present continuous",d:"Perfect"}, correct:"b"},
    {q:"In indirect speech, <i>tomorrow</i> changes to ______.", options:{a:"Today",b:"The next day",c:"Yesterday",d:"Now"}, correct:"b"},
    {q:"Which pronoun does <i>I</i> change to in indirect speech?", options:{a:"You",b:"He/She",c:"We",d:"They"}, correct:"b"},
    {q:"Change to indirect: <i>Kofi said, “I am going home.”</i>", options:{a:"Kofi said I am going home.",b:"Kofi said he was going home.",c:"Kofi said he is going home.",d:"Kofi said, he was going home."}, correct:"b"},
    {q:"Change to direct: <i>She said that she was tired.</i>", options:{a:"She said, “I am tired.”",b:"She said I am tired.",c:"She is tired.",d:"Tired, she said."}, correct:"a"}

{ id:"u11", number:11, term:3,

  objectives:[

  vocab:[

    {term:"Perspective", def:"A way of looking at something."}
  ],
  content:[
    {type:"h", text:"11.1 The Three Main Purposes"},
    {type:"ul", items:[
      "<b>To inform</b> — gives facts and information (newspapers, textbooks, encyclopedias).",
      "<b>To persuade</b> — tries to change your mind (advertisements, opinion pieces, speeches).",
      "<b>To entertain</b> — makes you enjoy the reading (stories, poems, plays)."
    ]},
    {type:"p", text:"Many texts do more than one of these. A newspaper article might inform and persuade."},
    {type:"h", text:"11.2 Author's Point of View"},
    {type:"p", text:"Two authors can write about the same topic from very different points of view. An example about cocoa farming:"},
    {type:"callout", variant:"note", title:"Author A — a large company",
      text:"Cocoa farming is a growing industry. Modern techniques have increased yields, and Ghana's exports have risen steadily over the last decade."},
    {type:"callout", variant:"note", title:"Author B — a small farmer",
      text:"Farming cocoa is hard work. The prices we get for our beans keep dropping, while the cost of fertiliser keeps rising. My children may leave the farm for the city."},
    {type:"p", text:"Both are about cocoa, but each shows a different <b>perspective</b>. Noticing this helps us read critically."},
    {type:"h", text:"11.3 Detecting Bias"},
    {type:"p", text:"A writer is <b>biased</b> when they present only one side. Signs of bias include:"},
    {type:"ul", items:[
      "Only one point of view is given.",
      "Emotional language is used.",
      "Facts are twisted or left out.",
      "The other side is mocked or ignored."
    ]},
    {type:"h", text:"11.4 Reading Critically"},
    {type:"p", text:"When reading any text, ask yourself:"},
    {type:"ol", items:[
      "Who wrote this?",
      "Why did they write it?",
      "Whose voice is missing?",
      "Is it fact or opinion?"
    ]},
    {type:"example", label:"Example from Ghana",
      text:"Two Ghanaian newspapers might report the same political event from very different angles. Reading more than one source helps you see the full picture."}
  ],

  try:"Find two articles about the same topic. Identify each author's purpose and point of view. Write down any signs of bias.",

  exercises:[],

    {q:"A textbook is written mainly to ______.", options:{a:"Entertain",b:"Persuade",c:"Inform",d:"Confuse"}, correct:"c"},
    {q:"An advertisement is written mainly to ______.", options:{a:"Entertain",b:"Persuade",c:"Inform",d:"Report"}, correct:"b"},
    {q:"A story is written mainly to ______.", options:{a:"Inform",b:"Persuade",c:"Entertain",d:"Warn"}, correct:"c"},
    {q:"What is bias?", options:{a:"A balanced view",b:"A one-sided view that favours one side",c:"A fact",d:"An opinion"}, correct:"b"},
    {q:"What is the author's point of view?", options:{a:"The author's address",b:"The author's perspective",c:"The title",d:"The first word"}, correct:"b"},
    {q:"Which is a sign of bias?", options:{a:"Giving both sides",b:"Using facts",c:"Only presenting one side",d:"Quoting both sides"}, correct:"c"},
    {q:"Why read more than one source?", options:{a:"To see the full picture",b:"To waste time",c:"To be confused",d:"To memorise"}, correct:"a"}

    {type:"h", text:"12.2 Steps to Summarise"},
    {type:"ol", items:[
      "Read the passage carefully.",
      "Identify the main point in each paragraph.",
      "Underline key ideas.",
      "Write down the main points in your own words.",
      "Combine the points into a short paragraph."
    ]},
    {type:"h", text:"12.3 What to Keep and What to Drop"},
    {type:"table", headers:["Keep","Drop"],
      rows:[
        ["Main ideas","Examples"],
        ["Important facts","Repeated information"],
        ["Names if essential","Descriptive details"],
        ["Key numbers","Opinions of the writer"]

    {type:"h", text:"12.4 Sample Passage and Summary"},
    {type:"callout", variant:"note", title:"Passage",
      text:"Cocoa is one of Ghana's most important crops. It is grown in the forest regions of the country. Cocoa trees need plenty of rain and shade. Farmers harvest the pods twice a year and dry the beans in the sun. The beans are then sold to buyers and exported to other countries. Cocoa provides income for millions of Ghanaians and supports schools, roads and health centres in farming communities."},
    {type:"callout", variant:"tip", title:"Summary (30 words)",
      text:"<b>Cocoa is a major crop in Ghana, grown in forest regions. It needs rain and shade, is harvested twice yearly, and exports provide income that supports communities.</b>"},
    {type:"h", text:"12.5 Rules for a Good Summary"},
    {type:"ul", items:[
      "Use your own words — do not copy whole sentences.",
      "Keep it short — about 1/4 of the original length.",
      "Keep the original meaning — do not add opinions.",
      "Use linking words to join ideas smoothly."
