<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghana Basic 3–5 Textbook Library</title>
<style>
:root{
  --matter:#2e7d32; --matter-bg:#e8f5e9;
  --cycles:#1565c0; --cycles-bg:#e3f2fd;
  --systems:#6a1b9a; --systems-bg:#f3e5f5;
  --forces:#e65100; --forces-bg:#fff3e0;
  --english:#c62828; --english-bg:#ffebee;
  --maths:#00838f;   --maths-bg:#e0f7fa;
  --ink:#1a2027; --muted:#5a6b7b; --line:#d8e0e8;
  --paper:#fff; --bg:#f4f7fa; --accent:#0d47a1;
  --side-w:300px; --top-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Segoe UI",Roboto,-apple-system,system-ui,sans-serif;
  font-size:17px;line-height:1.7;color:var(--ink);background:var(--bg);
  overflow-x:hidden;}

/* ---------- Top bar ---------- */
#topbar{position:fixed;top:0;left:0;right:0;height:var(--top-h);
  background:#0d2b45;color:#fff;display:flex;align-items:center;
  gap:14px;padding:0 16px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15);}
#topbar h1{font-size:16px;font-weight:600;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#topbar button{background:transparent;border:0;color:#fff;font-size:20px;
  cursor:pointer;padding:8px 10px;border-radius:6px;transition:.15s;}
#topbar button:hover{background:rgba(255,255,255,.12);}
#hamburger{display:none;}
.crumb{font-size:14px;opacity:.85;}

/* ---------- Sidebar ---------- */
#sidebar{position:fixed;top:var(--top-h);left:0;bottom:0;width:var(--side-w);
  background:#fff;border-right:1px solid var(--line);overflow-y:auto;
  padding:16px 0 60px;z-index:90;transition:transform .25s;}
#sidebar .side-title{font-size:12px;text-transform:uppercase;
  letter-spacing:1.5px;color:var(--muted);padding:10px 18px 4px;}
.book-group{border-bottom:1px solid var(--line);}
.book-head{display:flex;align-items:center;gap:10px;padding:11px 16px;
  cursor:pointer;font-weight:600;font-size:15px;transition:.15s;user-select:none;}
.book-head:hover{background:#f0f6fc;}
.book-head .chev{margin-left:auto;font-size:11px;color:var(--muted);
  transition:transform .2s;}
.book-group.open .chev{transform:rotate(90deg);}
.book-head .icon{width:26px;height:26px;border-radius:6px;display:flex;
  align-items:center;justify-content:center;font-size:14px;color:#fff;}
.book-body{display:none;padding:2px 0 8px;}
.book-group.open .book-body{display:block;}
.term-head{padding:6px 16px 4px 30px;font-size:12px;
  text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:6px;}
.unit-link{display:flex;align-items:center;gap:8px;padding:7px 16px 7px 30px;
  font-size:14.5px;color:var(--ink);text-decoration:none;
  border-left:3px solid transparent;transition:.12s;cursor:pointer;}
.unit-link:hover{background:#f0f6fc;color:var(--accent);}
.unit-link.active{background:#e8f1fb;border-left-color:var(--accent);
  color:var(--accent);font-weight:600;}
.unit-link .done{margin-left:auto;color:#2e7d32;font-size:13px;display:none;}
.unit-link.is-done .done{display:inline;}
.book-empty{padding:8px 16px 12px 30px;font-size:13px;
  color:var(--muted);font-style:italic;}

/* ---------- Main content ---------- */
#main{margin-left:var(--side-w);padding-top:var(--top-h);min-height:100vh;}
.page{max-width:900px;margin:0 auto;background:var(--paper);
  padding:34px 42px 60px;min-height:calc(100vh - var(--top-h));}
@media(min-width:1200px){.page{margin:0 auto;}}

/* ---------- Cover / home ---------- */
.cover{background:linear-gradient(140deg,#0d47a1,#2e7d32 60%,#e65100);
  color:#fff;padding:60px 40px 80px;text-align:center;position:relative;
  overflow:hidden;border-radius:0 0 20px 20px;}
.cover::after{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.18),
  transparent 55%);pointer-events:none;}
.cover.theme-matter{background:linear-gradient(140deg,#1b5e20,#2e7d32);}
.cover.theme-cycles{background:linear-gradient(140deg,#0d47a1,#1565c0);}
.cover.theme-systems{background:linear-gradient(140deg,#4a148c,#6a1b9a);}
.cover.theme-forces{background:linear-gradient(140deg,#bf360c,#e65100);}
.cover.theme-english{background:linear-gradient(140deg,#8e0000,#c62828);}
.cover.theme-maths{background:linear-gradient(140deg,#004d56,#00838f);}
.cover .cover-badge{display:inline-block;background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.5);padding:6px 18px;border-radius:40px;
  font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-bottom:22px;}
.cover h1{font-size:46px;font-weight:800;line-height:1.1;letter-spacing:-1px;}
.cover h2{font-size:20px;font-weight:400;margin-top:12px;opacity:.95;}
.cover p.tag{margin-top:24px;font-size:14px;opacity:.9;max-width:520px;
  margin-left:auto;margin-right:auto;}

/* ---------- Library home ---------- */
.lib-intro{padding:40px 0 10px;text-align:center;}
.lib-intro h2{font-size:32px;color:var(--accent);margin-bottom:8px;}
.lib-intro p{color:var(--muted);max-width:600px;margin:0 auto 30px;}
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:18px;margin-top:20px;}
.book-card{border:1px solid var(--line);border-radius:12px;padding:20px;
  cursor:pointer;transition:.18s;background:#fff;
  display:flex;flex-direction:column;gap:8px;}
.book-card:hover{transform:translateY(-3px);
  box-shadow:0 8px 24px rgba(0,0,0,.08);border-color:var(--accent);}
.book-card .bc-icon{width:44px;height:44px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:20px;font-weight:700;}
.book-card .bc-title{font-weight:700;font-size:16px;color:var(--ink);}
.book-card .bc-meta{font-size:13px;color:var(--muted);}
.book-card .bc-status{font-size:12.5px;color:#2e7d32;font-weight:600;
  margin-top:auto;}

/* ---------- Unit page ---------- */
.unit-header{color:#fff;padding:26px 30px;border-radius:14px;
  margin-bottom:24px;}
.unit-header.matter{background:linear-gradient(120deg,var(--matter),#1b5e20);}
.unit-header.cycles{background:linear-gradient(120deg,var(--cycles),#0d47a1);}
.unit-header.systems{background:linear-gradient(120deg,var(--systems),#4a148c);}
.unit-header.forces{background:linear-gradient(120deg,var(--forces),#bf360c);}
.unit-header.english{background:linear-gradient(120deg,var(--english),#8e0000);}
.unit-header.maths{background:linear-gradient(120deg,var(--maths),#004d56);}
.unit-header .strand-tag{font-size:12.5px;text-transform:uppercase;
  letter-spacing:2px;opacity:.9;}
.unit-header h2{font-size:28px;font-weight:800;margin:6px 0 4px;}
.unit-header .substrand{font-size:15px;opacity:.92;}
.unit-header .code{font-size:13px;opacity:.8;margin-top:6px;
  font-family:monospace;letter-spacing:1px;}

/* ---------- Boxes ---------- */
.box{border-radius:10px;padding:18px 22px;margin:20px 0;}
.box h4{font-size:15px;text-transform:uppercase;letter-spacing:1px;
  margin-bottom:10px;}
.objectives{background:#e8f5e9;border-left:5px solid var(--matter);}
.objectives h4{color:var(--matter);}
.objectives ul{margin-left:20px;}
.vocab{background:#fff8e1;border-left:5px solid #f9a825;}
.vocab h4{color:#b26a00;}
.vocab dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;
  font-size:15.5px;}
.vocab dt{font-weight:700;color:#8a4b00;}
.vocab dd{margin:0;}
.think{background:#e3f2fd;border-left:5px solid var(--cycles);}
.think h4{color:var(--cycles);}
.try{background:#f3e5f5;border-left:5px solid var(--systems);}
.try h4{color:var(--systems);}
.summary{background:#f1f8e9;border:1px dashed #8bc34a;}
.summary h4{color:#33691e;}

/* ---------- Content blocks ---------- */
.content h3{font-size:20px;color:var(--accent);margin:28px 0 10px;
  padding-bottom:6px;border-bottom:2px solid var(--line);}
.content p{margin:12px 0;}
.content ul,.content ol{margin:12px 0 12px 26px;}
.content li{margin:6px 0;}
.content strong{color:#0d2b45;}
.example{background:#fafafa;border-left:4px solid #90a4ae;
  padding:12px 16px;border-radius:0 6px 6px 0;font-size:15.5px;margin:14px 0;}
.example b{color:#37474f;}
.callout{padding:14px 18px;border-radius:8px;margin:14px 0;
  font-size:15.5px;border-left:5px solid;}
.callout.note{background:#e3f2fd;border-color:#1565c0;}
.callout.tip{background:#e8f5e9;border-color:#2e7d32;}
.callout.warn{background:#fff3e0;border-color:#e65100;}
.callout b{display:block;margin-bottom:4px;}
.quote{border-left:4px solid #90a4ae;padding:8px 18px;margin:16px 0;
  font-style:italic;color:#37474f;font-size:15.5px;}
.quote cite{display:block;font-size:13.5px;color:var(--muted);
  font-style:normal;margin-top:6px;}
table.data-table{width:100%;border-collapse:collapse;margin:16px 0;
  font-size:15px;}
table.data-table th,table.data-table td{border:1px solid var(--line);
  padding:9px 12px;text-align:left;}
table.data-table th{background:#eef4fa;font-weight:600;}
table.data-table caption{caption-side:bottom;font-size:14px;
  color:var(--muted);margin-top:6px;font-style:italic;}

/* ---------- Figures ---------- */
figure{margin:22px 0;text-align:center;}
.fig-img{max-width:100%;border-radius:10px;display:block;margin:0 auto;}
.img-placeholder{background:linear-gradient(135deg,#eef4fa,#e1ecf6);
  border:2px dashed #a7c0d6;border-radius:10px;min-height:180px;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:24px;color:#456;text-align:center;gap:6px;}
.img-placeholder .ph-icon{font-size:32px;opacity:.7;}
.img-placeholder .ph-title{font-weight:700;font-size:14.5px;color:#33506b;}
.img-placeholder .ph-hint{font-size:12px;color:#6b8299;
  font-family:monospace;word-break:break-all;max-width:100%;}
figcaption{font-size:14px;color:var(--muted);margin-top:8px;
  font-style:italic;}

/* ---------- Quiz ---------- */
.quiz{background:#f8fbff;border:1px solid #cfe1f2;border-radius:12px;
  padding:22px 24px;margin-top:28px;}
.quiz h4{color:var(--accent);font-size:18px;margin-bottom:6px;}
.quiz .quiz-intro{font-size:14.5px;color:var(--muted);margin-bottom:16px;}
.quiz-q{background:#fff;border:1px solid var(--line);border-radius:8px;
  padding:14px 16px;margin-bottom:14px;}
.q-text{font-weight:600;margin-bottom:10px;}
.quiz-q label{display:block;padding:7px 10px;border-radius:6px;
  cursor:pointer;font-size:15.5px;transition:background .15s;}
.quiz-q label:hover{background:#eef4fa;}
.quiz-q input{margin-right:9px;transform:scale(1.15);accent-color:var(--accent);}
.feedback{font-size:14.5px;margin-top:8px;font-weight:600;min-height:0;}
.feedback.right{color:#1b7a2b;}
.feedback.wrong{color:#c62828;}
.feedback.notanswered{color:#b26a00;}
.quiz-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;}
.quiz button{background:var(--accent);color:#fff;border:0;padding:11px 22px;
  border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;
  transition:.15s;}
.quiz button:hover{background:#0a3a80;}
.quiz button.secondary{background:#fff;color:var(--accent);
  border:2px solid var(--accent);}
.quiz button.secondary:hover{background:#eef4fa;}
.score-panel{margin-top:16px;padding:16px 18px;border-radius:8px;
  background:#fff;border:1px solid var(--line);display:none;}
.score-panel.show{display:block;}
.score-panel .score-num{font-size:30px;font-weight:800;color:var(--accent);}
.score-panel .score-msg{font-size:15.5px;margin-top:4px;}

/* ---------- Misc ---------- */
.mark-read{display:inline-flex;align-items:center;gap:8px;
  background:#e8f5e9;color:#1b5e20;border:1px solid #8bc34a;
  padding:9px 16px;border-radius:8px;font-size:14.5px;font-weight:600;
  cursor:pointer;margin-top:24px;transition:.15s;}
.mark-read:hover{background:#d4eccf;}
.mark-read.done{background:#2e7d32;color:#fff;border-color:#2e7d32;}
.page-nav{display:flex;justify-content:space-between;gap:12px;margin-top:30px;
  padding-top:20px;border-top:1px solid var(--line);}
.page-nav a{color:var(--accent);font-size:14.5px;text-decoration:none;
  font-weight:600;cursor:pointer;}
.page-nav a:hover{text-decoration:underline;}
.page-nav a.disabled{color:var(--muted);pointer-events:none;opacity:.5;}
.toc-list{list-style:none;margin:12px 0;}
.toc-list li{border-bottom:1px dashed var(--line);padding:10px 4px;
  display:flex;justify-content:space-between;gap:12px;font-size:15.5px;
  align-items:center;}
.toc-list li a{color:var(--ink);text-decoration:none;font-weight:500;
  cursor:pointer;flex:1;}
.toc-list li a:hover{color:var(--accent);text-decoration:underline;}
.toc-list li .strand{font-size:12.5px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;}
.term-block{margin-bottom:22px;}
.term-block h4{font-size:16px;color:#fff;background:var(--accent);
  display:inline-block;padding:5px 14px;border-radius:6px;margin-bottom:10px;}
.glossary-entry{padding:10px 0;border-bottom:1px dashed var(--line);
  font-size:15.5px;}
.glossary-entry b{color:var(--accent);}
.index-list{list-style:none;column-count:2;column-gap:32px;font-size:15px;}
.index-list li{padding:4px 0;break-inside:avoid;
  border-bottom:1px dotted var(--line);}
.index-list li b{color:var(--accent);}
footer.site{background:#0d2b45;color:#cdd9e5;text-align:center;
  padding:22px 20px;font-size:13.5px;}

/* ---------- Mobile ---------- */
@media(max-width:880px){
  #hamburger{display:block;}
  #sidebar{transform:translateX(-100%);box-shadow:4px 0 20px rgba(0,0,0,.15);}
  #sidebar.open{transform:translateX(0);}
  #main{margin-left:0;}
  .page{padding:20px 16px 60px;}
  .cover{padding:40px 20px 60px;}
  .cover h1{font-size:30px;}
  .cover h2{font-size:16px;}
  .unit-header h2{font-size:21px;}
  .vocab dl{grid-template-columns:1fr;gap:2px 0;}
  .vocab dt{margin-top:8px;}
  .index-list{column-count:1;}
  #backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:85;
    display:none;}
  #backdrop.show{display:block;}
}
@media print{
  #topbar,#sidebar,#backdrop,.mark-read,.page-nav{display:none!important;}
  #main{margin:0;padding:0;}
  .page{box-shadow:none;padding:0 20px;}
  .quiz{page-break-inside:avoid;}
  .unit-header{color:#000;border:1px solid #000;background:#fff!important;}
}
</style>
</head>
<body>

<header id="topbar">
  <button id="hamburger" aria-label="Menu">☰</button>
  <h1 id="crumb">Ghana Textbook Library</h1>
  <button id="print-btn" title="Print" aria-label="Print">🖨️</button>
  <button id="home-btn" title="Home" aria-label="Home">🏠</button>
</header>

<aside id="sidebar">
  <div class="side-title">Library</div>
  <div id="sidebar-tree"></div>
</aside>
<div id="backdrop"></div>

<main id="main">
  <div class="page" id="page"></div>
</main>

<script>
/* ==================================================================
   ENGINE  —  do not edit. The engine reads window.CURRICULUM and
   renders everything. All content lives in the DATA blocks below.
   ================================================================== */
(function(){
"use strict";

/* ---------- storage (safe for file://) ---------- */
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }
            catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
const PROGRESS_KEY = "tb.progress";
const LAST_KEY     = "tb.last";
const getProgress  = ()=> store.get(PROGRESS_KEY,{});
const setProgress  = (p)=> store.set(PROGRESS_KEY,p);
const markDone     = (key,done)=>{
  const p=getProgress();
  p[key]=Object.assign({},p[key]||{},{done:!!done,ts:Date.now()});
  setProgress(p);
};
const saveScore    = (key,score,total)=>{
  const p=getProgress();
  p[key]=Object.assign({},p[key]||{},{score,total,ts:Date.now(),done:true});
  setProgress(p);
};

/* ---------- helpers ---------- */
const $  = (s,r=document)=> r.querySelector(s);
const $$ = (s,r=document)=> Array.from(r.querySelectorAll(s));
const esc = (s='')=> String(s).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DATA = ()=> window.CURRICULUM || {};
const ALL_BOOKS = ()=> Object.values(DATA());
const BOOK = id=> DATA()[id] || null;
const UNIT = (bid,uid)=>{ const b=BOOK(bid); if(!b) return null;
  return (b.units||[]).find(u=>u.id===uid) || null; };
const unitKey = (bid,uid)=> bid + "/" + uid;

/* ---------- sidebar ---------- */
function renderSidebar(){
  const tree = $("#sidebar-tree"); tree.innerHTML="";
  ALL_BOOKS().forEach(book=>{
    const theme = book.meta.theme || "matter";
    const g = document.createElement("div");
    g.className = "book-group"; g.dataset.book = book.meta.id;
    const icon = { science:"🔬", english:"📖", maths:"🔢" }[book.meta.subject.toLowerCase()] || "📘";
    const terms = {};
    (book.units||[]).forEach(u=>{ (terms[u.term]=terms[u.term]||[]).push(u); });
    const unitsHTML = (book.units||[]).length
      ? Object.keys(terms).sort().map(t=>`
          <div class="term-head">Term ${t}</div>
          ${terms[t].map(u=>`
            <a class="unit-link" data-book="${book.meta.id}" data-unit="${u.id}"
               href="#/${book.meta.id}/${u.id}">
              <span>Unit ${u.number} · ${esc(u.title)}</span>
              <span class="done">✓</span>
            </a>`).join("")}
        `).join("")
      : `<div class="book-empty">Content coming soon</div>`;
    g.innerHTML = `
      <div class="book-head" data-toggle="${book.meta.id}">
        <div class="icon" style="background:var(--${theme})">${icon}</div>
        <span>${esc(book.meta.title)}</span>
        <span class="chev">▸</span>
      </div>
      <div class="book-body">${unitsHTML}</div>`;
    tree.appendChild(g);
  });
  refreshSidebarState();
}

function refreshSidebarState(){
  const p = getProgress();
  $$(".unit-link").forEach(a=>{
    const key = a.dataset.book + "/" + a.dataset.unit;
    a.classList.toggle("is-done", !!(p[key] && p[key].done));
  });
}

function openBookInSidebar(bid){
  $$(".book-group").forEach(g=>{
    g.classList.toggle("open", g.dataset.book === bid);
  });
}

function highlightSidebarUnit(bid,uid){
  $$(".unit-link").forEach(a=>{
    a.classList.toggle("active",
      a.dataset.book===bid && a.dataset.unit===uid);
  });
}

/* ---------- sidebar interactions ---------- */
$("#sidebar-tree").addEventListener("click", e=>{
  const head = e.target.closest(".book-head");
  if(head){
    const bid = head.dataset.toggle;
    const grp = head.parentElement;
    const wasOpen = grp.classList.contains("open");
    $$(".book-group").forEach(g=> g.classList.remove("open"));
    if(!wasOpen) grp.classList.add("open");
    else grp.classList.add("open");
    location.hash = "#/" + bid;
    return;
  }
});

/* ---------- backdrops ---------- */
function closeSidebar(){ $("#sidebar").classList.remove("open");
  $("#backdrop").classList.remove("show"); }
$("#hamburger").addEventListener("click",()=>{
  $("#sidebar").classList.toggle("open");
  $("#backdrop").classList.toggle("show");
});
$("#backdrop").addEventListener("click", closeSidebar);

/* ---------- top bar buttons ---------- */
$("#home-btn").addEventListener("click",()=> location.hash="#/");
$("#print-btn").addEventListener("click",()=> window.print());

/* ==================================================================
   BLOCK RENDERERS
   ================================================================== */
const RENDER = {
  p:  b => `<p>${b.text||""}</p>`,
  h:  b => `<h3>${esc(b.text||"")}</h3>`,
  h2: b => `<h2 style="font-size:23px;color:var(--accent);margin:24px 0 8px">${esc(b.text||"")}</h2>`,
  ul: b => `<ul>${(b.items||[]).map(i=>`<li>${i}</li>`).join("")}</ul>`,
  ol: b => `<ol>${(b.items||[]).map(i=>`<li>${i}</li>`).join("")}</ol>`,
  quote: b => `<div class="quote">${b.text||""}${b.cite?`<cite>— ${esc(b.cite)}</cite>`:""}</div>`,
  example: b => `<div class="example"><b>${esc(b.label||"Example")}:</b> ${b.text||""}</div>`,
  callout: b => `<div class="callout ${b.variant||'note'}">${b.title?`<b>${esc(b.title)}</b>`:""}<div>${b.text||""}</div></div>`,
  img: b => `<figure>
      <img class="fig-img" src="${esc(b.src||'')}" alt="${esc(b.alt||'')}" onerror="imgFallback(this)">
      ${b.caption?`<figcaption>${esc(b.caption)}</figcaption>`:""}
    </figure>`,
  svg: b => `<figure>${b.svg||''}${b.caption?`<figcaption>${esc(b.caption)}</figcaption>`:""}</figure>`,
  audio: b => `<figure><audio controls src="${esc(b.src||'')}" style="width:100%"></audio>${b.caption?`<figcaption>${esc(b.caption)}</figcaption>`:""}</figure>`,
  video: b => `<figure><video controls src="${esc(b.src||'')}" style="max-width:100%;border-radius:8px"></video>${b.caption?`<figcaption>${esc(b.caption)}</figcaption>`:""}</figure>`,

      ${b.headers?`<thead><tr>${b.headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>`:""}

      ${b.caption?`<caption>${esc(b.caption)}</caption>`:""}

function renderContent(blocks){
  if(!blocks || !blocks.length) return "";
  return `<div class="content">${blocks.map(b=>{
    const fn = RENDER[b.type];
    return fn ? fn(b) : "";
  }).join("")}</div>`;
}

window.imgFallback = function(img){
  const alt = img.getAttribute("alt") || "Illustration";
  const src = img.getAttribute("src") || "";
  const ph = document.createElement("div");
  ph.className = "img-placeholder";
  ph.innerHTML = `<div class="ph-icon">🖼️</div>
    <div class="ph-title">${esc(alt)}</div>
    <div class="ph-hint">img src: ${esc(src)}</div>`;
  img.replaceWith(ph);
};

/* ==================================================================
   QUIZ
   ================================================================== */
function renderQuiz(quiz, key){
  if(!quiz || !quiz.length) return "";
  const qsHTML = quiz.map((q,i)=>{
    const qid = `${key}-q${i}`;
    const opts = q.options||{};
    const labels = Object.keys(opts).map(k=>`
      <label><input type="radio" name="${qid}" value="${k}"> ${k.toUpperCase()}. ${esc(opts[k])}</label>
    `).join("");
    return `<div class="quiz-q" data-correct="${esc(q.correct)}" data-explain="${esc(q.explain||'')}">
      <p class="q-text">${i+1}. ${q.q}</p>${labels}
      <div class="feedback"></div>
    </div>`;
  }).join("");
  return `<div class="quiz" data-quiz data-unit-key="${key}">
    <h4>Review Quiz</h4>
    <p class="quiz-intro">Choose the best answer for each question, then click <b>Check My Answers</b>.</p>
    ${qsHTML}
    <div class="quiz-actions">
      <button onclick="checkQuiz(this)">Check My Answers</button>
      <button class="secondary" onclick="resetQuiz(this)">Try Again</button>
    </div>
    <div class="score-panel"></div>
  </div>`;
}

window.checkQuiz = function(btn){
  const quiz = btn.closest(".quiz");
  const key = quiz.dataset.unitKey;
  const questions = $$(".quiz-q", quiz);
  let score=0, total=questions.length, unanswered=0;
  questions.forEach(q=>{
    const correct = q.dataset.correct;
    const sel = q.querySelector("input:checked");
    const fb = q.querySelector(".feedback");
    if(!sel){ unanswered++;
      fb.textContent = `Not answered. Correct: ${correct.toUpperCase()}.`;
      fb.className = "feedback notanswered";
    } else if(sel.value===correct){ score++;
      fb.textContent = "✓ Correct!";
      fb.className = "feedback right";
    } else { fb.textContent = `✗ Correct answer is ${correct.toUpperCase()}.`;
      fb.className = "feedback wrong";
    }
    if(q.dataset.explain && (sel && sel.value!==correct)){
      fb.textContent += " " + q.dataset.explain;
    }
  });
  const pct = total? Math.round(score/total*100):0;
  const msg = pct===100?"Excellent! You are a star. 🌟"
            : pct>=75 ?"Very good work! Keep it up. 👍"
            : pct>=50 ?"Good try. Review the unit and retake."
            :          "Keep practising. Read the unit and try again.";
  const panel = $(".score-panel", quiz);
  panel.innerHTML = `<div class="score-num">${score} / ${total}</div>
    <div class="score-msg">${msg}${unanswered?` You left ${unanswered} unanswered.`:""}</div>`;
  panel.classList.add("show");
  panel.scrollIntoView({behavior:"smooth",block:"nearest"});
  if(key) saveScore(key,score,total);
  refreshSidebarState();
};

window.resetQuiz = function(btn){
  const quiz = btn.closest(".quiz");
  $$("input[type=radio]", quiz).forEach(i=>i.checked=false);
  $$(".feedback", quiz).forEach(f=>{ f.textContent=""; f.className="feedback"; });
  const panel = $(".score-panel", quiz);
  panel.classList.remove("show"); panel.innerHTML="";
};

/* ==================================================================

function renderHome(){
  const books = ALL_BOOKS();
  const cards = books.map(b=>{
    const theme = b.meta.theme||"matter";
    const icon = {science:"🔬",english:"📖",maths:"🔢"}[b.meta.subject.toLowerCase()]||"📘";
    const unitCount = (b.units||[]).length;
    const done = (b.units||[]).filter(u=>(getProgress()[b.meta.id+"/"+u.id]||{}).done).length;
    return `<div class="book-card" onclick="location.hash='#/${b.meta.id}'">
      <div class="bc-icon" style="background:var(--${theme})">${icon}</div>
      <div class="bc-title">${esc(b.meta.title)}</div>
      <div class="bc-meta">${esc(b.meta.subtitle||'')}</div>
      <div class="bc-status">${unitCount?`${done}/${unitCount} units complete`:'Content coming soon'}</div>

  $("#page").innerHTML = `
    <div class="lib-intro">
      <h2>📚 Ghana Textbook Library</h2>
      <p>Standards-Based Curriculum (NaCCA) · Basic 3–5 · Works offline</p>

      <p>Aligned with the National Council for Curriculum and Assessment, Ghana</p>
    </footer>`;

}

function renderBook(bid){
  const b = BOOK(bid);
  if(!b){ renderHome(); return; }
  openBookInSidebar(bid);
  const theme = b.meta.theme||"matter";
  const terms = {};
  (b.units||[]).forEach(u=>{ (terms[u.term]=terms[u.term]||[]).push(u); });
  const toc = Object.keys(terms).sort().map(t=>`
    <div class="term-block">
      <h4>Term ${t}</h4>
      <ul class="toc-list">
        ${terms[t].map(u=>`
          <li>
            <a onclick="location.hash='#/${bid}/${u.id}'">
              Unit ${u.number} · ${esc(u.title)}
            </a>
            <span class="strand">${esc(u.strand)}</span>
          </li>`).join("")}
      </ul>
    </div>`).join("") || `<p style="color:var(--muted)">Units for this book are being authored. Check back soon.</p>`;

  $("#crumb").textContent = b.meta.title;
  $("#page").innerHTML = `
    <header class="cover theme-${theme}">
      <div class="cover-badge">${esc(b.meta.badge||'NaCCA Aligned')}</div>
      <h1>${esc(b.meta.title)}</h1>
      <h2>${esc(b.meta.subtitle||'')}</h2>
      <p class="tag">${esc(b.meta.edition||'')}</p>
    </header>
    <div style="padding-top:30px">
      <h3 style="font-size:24px;border-left:6px solid var(--accent);padding-left:14px;
        color:var(--accent);margin-bottom:20px">Table of Contents</h3>
      ${toc}
    </div>`;
  window.scrollTo(0,0);
  closeSidebar();
}

function renderUnit(bid, uid){
  const b = BOOK(bid), u = UNIT(bid,uid);
  if(!b || !u){ renderHome(); return; }
  openBookInSidebar(bid);
  highlightSidebarUnit(bid, uid);
  const key = unitKey(bid,uid);
  const theme = b.meta.theme||"matter";
  const p = getProgress()[key]||{};
  const done = !!p.done;

  const objectives = (u.objectives||[]).length
    ? `<div class="box objectives"><h4>Learning Objectives</h4>
        <ul>${u.objectives.map(o=>`<li>${o}</li>`).join("")}</ul></div>` : "";

  const vocab = (u.vocab||[]).length
    ? `<div class="box vocab"><h4>Key Words</h4>
        <dl>${u.vocab.map(v=>`<dt>${esc(v.term)}</dt><dd>${v.def}</dd>`).join("")}</dl></div>` : "";

  const think = u.think ? `<div class="box think"><h4>Think About It</h4><p>${u.think}</p></div>` : "";
  const tryit = u.try   ? `<div class="box try"><h4>Try This</h4><p>${u.try}</p></div>` : "";
  const sum   = u.summary ? `<div class="box summary"><h4>Unit Summary</h4><p>${u.summary}</p></div>` : "";

  const extras = (u.exercises||[]).length
    ? `<h3 style="color:var(--accent);margin:26px 0 10px">Exercises</h3>
       <ol>${u.exercises.map(e=>`<li>${e}</li>`).join("")}</ol>` : "";

  const quiz = renderQuiz(u.quiz, key);

  const unitIndex = (b.units||[]).findIndex(x=>x.id===uid);
  const prev = unitIndex>0 ? b.units[unitIndex-1] : null;
  const next = unitIndex<b.units.length-1 ? b.units[unitIndex+1] : null;

  $("#crumb").textContent = `${b.meta.title} › Unit ${u.number}`;
  $("#page").innerHTML = `
    <div class="unit-header ${theme}">
      <div class="strand-tag">Strand · ${esc(u.strand||'')}</div>
      <h2>Unit ${u.number} · ${esc(u.title)}</h2>
      <div class="substrand">Sub-strand: ${esc(u.substrand||'')}</div>
      ${u.code?`<div class="code">${esc(u.code)}</div>`:""}
    </div>
    ${objectives}
    ${vocab}
    ${renderContent(u.content)}
    ${think}
    ${tryit}
    ${sum}
    ${extras}
    ${quiz}
    <button class="mark-read ${done?'done':''}" data-key="${key}">
      ${done?'✓ Marked as read':'○ Mark this unit as read'}
    </button>
    <div class="page-nav">
      <a class="${prev?'':'disabled'}" ${prev?`onclick="location.hash='#/${bid}/${prev.id}'"`:''}>
        ← ${prev?`Unit ${prev.number}`:'Start'}
      </a>
      <a class="${next?'':'disabled'}" ${next?`onclick="location.hash='#/${bid}/${next.id}'"`:''}>
        ${next?`Unit ${next.number} →`:'End of book'}
      </a>
    </div>
    <footer class="site" style="margin-top:30px;border-radius:10px">
      <p>${esc(b.meta.title)} · ${esc(b.meta.edition||'')}</p>
    </footer>`;
  window.scrollTo(0,0);
  closeSidebar();
}

/* ---------- mark-read button ---------- */
$("#page").addEventListener("click", e=>{
  const btn = e.target.closest(".mark-read");
  if(!btn) return;
  const key = btn.dataset.key;
  const p = getProgress();
  const now = !((p[key]||{}).done);
  markDone(key, now);
  btn.classList.toggle("done", now);
  btn.textContent = now ? "✓ Marked as read" : "○ Mark this unit as read";
  refreshSidebarState();
});

/* ==================================================================
   ROUTER
   ================================================================== */
function router(){
  const h = (location.hash||"").replace(/^#\/?/,"");
  const parts = h.split("/").filter(Boolean);
  if(parts.length===0){ renderHome(); return; }
  if(parts.length===1){ renderBook(parts[0]); return; }
  renderUnit(parts[0], parts[1]);
}
window.addEventListener("hashchange", router);
window.addEventListener("DOMContentLoaded", ()=>{
  renderSidebar();
  router();
  const last = store.get(LAST_KEY);
  if(last && !location.hash) location.hash = "#/" + last;
});
window.addEventListener("beforeunload",()=>{
  const h = (location.hash||"").replace(/^#\/?/,"");
  if(h) store.set(LAST_KEY, h);
});

})();
</script>

    {term:"Melting", def:"Solid changing to liquid."},
    {term:"Freezing", def:"Liquid changing to solid."},
    {term:"Condensation", def:"Gas changing to liquid."}
  ],
  content:[
    {type:"h", text:"4.1 The Three States of Matter"},
    {type:"p", text:"Everything around you is in one of three states — <b>solid</b>, <b>liquid</b> or <b>gas</b>. Water is the best example because you can see all three states of water in Ghana:"},
    {type:"ul", items:[
      "<b>Ice (solid):</b> seen in freezers, or when you buy ice kenkey on a hot day.",
      "<b>Water (liquid):</b> in rivers, wells and taps.",
      "<b>Steam (gas):</b> rises from a boiling pot or from a kettle."
    ]},
    {type:"img", src:"img/u4-fig1.png",
      alt:"Ice, water and steam showing the three states of matter",
      caption:"Figure 4.1: Water in its three states — ice, liquid water and steam."},
    {type:"h", text:"4.2 How Matter Changes State"},
    {type:"ul", items:[
      "Heating a solid turns it into a liquid → <b>melting</b>.",
      "Cooling a liquid turns it into a solid → <b>freezing</b>.",
      "Heating a liquid turns it into a gas → <b>evaporation</b>.",
      "Cooling a gas turns it into a liquid → <b>condensation</b>."
    ]},
    {type:"example", label:"Example from Ghana",
      text:"During harmattan, wet clothes dry very quickly because the dry air helps water evaporate fast. In the rainy season, drying takes longer because the air is already full of water vapour."}
  ],
  think:"Why does a cold bottle of water become wet on the outside on a hot day? Where does the water come from?",
  try:"Put three ice cubes in a cup and leave them in the sun. Observe what happens every five minutes. Explain which change of state took place.",
  summary:"Matter exists as solid, liquid or gas. Heating or cooling causes a change of state: melting, freezing, evaporation and condensation. Water is the commonest example of a substance that changes state easily.",
  exercises:[],
  quiz:[
    {q:"Ice is an example of which state of matter?", options:{a:"Liquid",b:"Solid",c:"Gas",d:"Plasma"}, correct:"b"},
    {q:"Steam is an example of which state of matter?", options:{a:"Solid",b:"Liquid",c:"Gas",d:"Crystal"}, correct:"c"},
    {q:"Changing a solid into a liquid is called ______.", options:{a:"melting",b:"freezing",c:"evaporation",d:"condensation"}, correct:"a"},
    {q:"Changing a gas into a liquid is called ______.", options:{a:"melting",b:"boiling",c:"freezing",d:"condensation"}, correct:"d"},
    {q:"Which of these takes the shape of its container?", options:{a:"Stone",b:"Water",c:"Wood",d:"Iron"}, correct:"b"},
    {q:"Water changing to steam is called ______.", options:{a:"evaporation",b:"freezing",c:"melting",d:"condensation"}, correct:"a"},
    {q:"Water changing to ice is called ______.", options:{a:"melting",b:"evaporation",c:"freezing",d:"condensation"}, correct:"c"},
    {q:"Which of these is NOT a state of matter?", options:{a:"Solid",b:"Liquid",c:"Gas",d:"Energy"}, correct:"d"}
  ]
},

/* ---------------- UNIT 5 ---------------- */
{ id:"u5", number:5, term:1,
  strand:"Cycles", substrand:"Earth Science",
  code:"B3.2.1.1.1",
  title:"Cyclic Events: Day, Night and Seasons",
  objectives:[
    "Explain why we have day and night.",
    "Describe the two main seasons in Ghana and their effects.",
    "Give examples of activities that depend on daily and seasonal cycles."
  ],
  vocab:[
    {term:"Cycle", def:"Something that repeats in the same order again and again."},
    {term:"Rotate", def:"To turn around like a spinning top."},
    {term:"Day", def:"The time when the sun is shining and it is bright."},
    {term:"Night", def:"The time when it is dark and the moon and stars appear."},
    {term:"Harmattan", def:"Dry, dusty wind that blows across Ghana in the dry season."}
  ],
  content:[
    {type:"h", text:"5.1 Day and Night"},
    {type:"p", text:"Every day the sun appears in the morning, moves across the sky, and disappears in the evening. This happens because the <b>Earth rotates</b> — it spins around like a top. The side of the Earth that faces the sun has day; the side turned away has night."},
    {type:"img", src:"img/u5-fig1.png",
      alt:"Earth rotating with sun on one side, showing day and night",
      caption:"Figure 5.1: The Earth rotating causes day and night."},
    {type:"h", text:"5.2 Seasons in Ghana"},
    {type:"p", text:"Ghana has two main seasons:"},
    {type:"ul", items:[
      "<b>Rainy season</b> — usually from April to October. Farmers plant maize, cassava, yam and cocoa.",
      "<b>Dry season (harmattan)</b> — usually from November to March. The air is dry and dusty, especially in the north."
    ]},
    {type:"example", label:"Example from Ghana",
      text:"Farmers in the Ashanti Region plant cocoa at the beginning of the rainy season so the young seedlings get enough water to grow."}
  ],
  think:"If the Earth did not rotate, would we still have day and night? Explain what would happen.",
  try:"Keep a weather diary for one week. Each day write: (i) what time the sun rises, (ii) what time it sets, (iii) whether it rained or was dry.",
  summary:"The Earth rotates once every 24 hours, giving us day and night. Ghana has a rainy season and a dry harmattan season. Many daily and farming activities follow these cycles.",
  exercises:[],
  quiz:[
    {q:"What causes day and night?", options:{a:"The moon moving",b:"The Earth rotating",c:"The stars shining",d:"Clouds moving"}, correct:"b"},
    {q:"About how long does it take the Earth to rotate once?", options:{a:"1 hour",b:"12 hours",c:"24 hours",d:"1 week"}, correct:"c"},
    {q:"What is harmattan?", options:{a:"Dry, dusty wind in the dry season",b:"A heavy rainstorm",c:"A type of cloud",d:"A kind of tree"}, correct:"a"},
    {q:"In which season do farmers mostly plant their crops?", options:{a:"Dry season",b:"Harmattan",c:"Winter",d:"Rainy season"}, correct:"d"},
    {q:"Which of these is a cyclic event?", options:{a:"An earthquake",b:"Sunrise and sunset",c:"A car accident",d:"A football match"}, correct:"b"},
    {q:"When one side of the Earth faces the sun, that side has ______.", options:{a:"night",b:"harmattan",c:"day",d:"rain"}, correct:"c"},
    {q:"Which activity would you expect in the harmattan season?", options:{a:"Dry lips and dusty air",b:"Heavy floods",c:"Planting cocoa",d:"Filling rivers"}, correct:"a"},
    {q:"How many main seasons does Ghana have?", options:{a:"Four",b:"Three",c:"One",d:"Two"}, correct:"d"}
  ]
},

    {term:"Star", def:"A huge ball of hot, glowing gas that gives out its own light."},

/* ---------------- UNIT 7 ---------------- */
{ id:"u7", number:7, term:2,
  strand:"Cycles", substrand:"Earth Science",
  code:"B3.2.1.3.1",
  title:"The Water Cycle",
  objectives:[
    "Describe the four stages of the water cycle.",
    "Explain how rain is formed.",
    "Recognise the water cycle in everyday examples in Ghana."
  ],
  vocab:[
    {term:"Water cycle", def:"The continuous movement of water between the earth and the sky."},
    {term:"Evaporation", def:"Water changing into vapour."},
    {term:"Condensation", def:"Vapour changing back into tiny water drops."},
    {term:"Precipitation", def:"Rain, hail or snow falling from clouds."},
    {term:"Collection", def:"Water gathering in rivers, lakes and the sea."}
  ],
  content:[
    {type:"h", text:"7.1 The Four Stages"},
    {type:"p", text:"Water on earth is always moving in a <b>cycle</b>. The four main stages are:"},
    {type:"ol", items:[
      "<b>Evaporation</b> — the sun heats water in rivers, lakes and the sea. The water turns into vapour and rises into the air.",
      "<b>Condensation</b> — high in the sky, the vapour cools and forms tiny water drops. These form clouds.",
      "<b>Precipitation</b> — when the drops become heavy, they fall as rain.",
      "<b>Collection</b> — the rain water collects in rivers, lakes and the sea, and the cycle starts again."
    ]},
    {type:"img", src:"img/u7-fig1.png",
      alt:"Diagram of the water cycle: evaporation, condensation, precipitation, collection",
      caption:"Figure 7.1: The water cycle."},
    {type:"example", label:"Example from Ghana",
      text:"Water from Lake Volta evaporates under the hot sun. It rises, condenses into clouds, and later falls as rain on the Volta Region, feeding the lake again."}
  ],
  think:"Is the rain that falls today the same water that fell a hundred years ago? Explain your answer.",
  try:"Half fill a clear bottle with warm water, then place a cold lid on top. Watch the underside of the lid. What do you see? This is condensation.",
  summary:"The water cycle moves water through four stages — evaporation, condensation, precipitation and collection. This cycle brings rain and keeps our rivers and lakes filled.",
  exercises:[],
  quiz:[
    {q:"Which stage of the water cycle happens first?", options:{a:"Evaporation",b:"Condensation",c:"Precipitation",d:"Collection"}, correct:"a"},
    {q:"What causes water to evaporate?", options:{a:"Cold wind",b:"The moon",c:"Heat from the sun",d:"Ice"}, correct:"c"},
    {q:"What are clouds made of?", options:{a:"Smoke",b:"Tiny water drops",c:"Dust only",d:"Sand"}, correct:"b"},
    {q:"Rain falling from clouds is called ______.", options:{a:"evaporation",b:"condensation",c:"collection",d:"precipitation"}, correct:"d"},
    {q:"What is formed when vapour cools in the sky?", options:{a:"Smoke",b:"Clouds",c:"Sand",d:"Stones"}, correct:"b"},
    {q:"Which natural feature collects rain water?", options:{a:"Lake",b:"Desert",c:"Hill top",d:"Rock"}, correct:"a"},
    {q:"The water cycle is important because it ______.", options:{a:"makes the sun shine",b:"stops rain",c:"brings rain and refills rivers",d:"makes wind"}, correct:"c"},
    {q:"Which stage is water changing from liquid to gas?", options:{a:"Collection",b:"Precipitation",c:"Condensation",d:"Evaporation"}, correct:"d"}
  ]
},

/* ---------------- UNIT 8 ---------------- */
{ id:"u8", number:8, term:2,
  strand:"Cycles", substrand:"Earth Science",
  code:"B3.2.1.4.1 · B3.2.1.4.2",
  title:"Water and Air as Natural Resources",
  objectives:[
    "State the importance of water and air to living things.",
    "List simple ways of keeping water and air clean.",
    "Describe what happens when water or air becomes polluted."
  ],
  vocab:[
    {term:"Natural resource", def:"Something found in nature that living things use."},
    {term:"Pollution", def:"Making water, air or land dirty and unsafe."},
    {term:"Conserve", def:"To protect and use something carefully so it lasts."},
    {term:"Clean", def:"Free from dirt or germs."}
  ],
  content:[
    {type:"h", text:"8.1 Water — A Precious Resource"},
    {type:"p", text:"We use water for drinking, cooking, bathing, washing, farming and for animals. Without water, no living thing can survive for more than a few days. Even though most of the Earth is covered by water, only a very small part is fresh water that we can drink."},
    {type:"h", text:"8.2 Air — The Breath of Life"},
    {type:"p", text:"Air is all around us, even though we cannot see it. All animals and plants need air to live. Humans and animals breathe in <b>oxygen</b>. Plants take in carbon dioxide and give out oxygen — this keeps the air balanced."},
    {type:"img", src:"img/u8-fig1.png",
      alt:"Children collecting water from a borehole; trees giving fresh air",
      caption:"Figure 8.1: Water and air are natural resources we must protect."},
    {type:"h", text:"8.3 Keeping Water and Air Clean"},
    {type:"ul", items:[
      "Do not throw rubbish into rivers, streams or gutters.",
      "Do not defecate near water sources.",
      "Boil or filter drinking water if it is not from a safe source.",
      "Plant trees — they clean the air.",
      "Avoid burning rubbish in the open.",
      "Use clean cooking fuels instead of charcoal where possible."
    ]},
    {type:"example", label:"Example from Ghana",
      text:"<i>Galamsey</i> (small-scale illegal mining) pollutes rivers such as the Pra and the Ankobra with mercury and mud. This makes it hard for communities to get clean drinking water and harms the fish in the rivers."}
  ],
  think:"Why do you think the government and chiefs work hard to stop galamsey? List two reasons connected to water.",
  try:"Draw two pictures: one showing a clean river with fish and plants, and one showing a polluted river. Write two sentences about each.",
  summary:"Water and air are natural resources that all living things need. We must keep them clean by not polluting rivers and by protecting the air we breathe.",
  exercises:[],
  quiz:[
    {q:"Which gas do humans breathe in from the air?", options:{a:"Carbon dioxide",b:"Oxygen",c:"Nitrogen",d:"Steam"}, correct:"b"},
    {q:"Which gas do plants take in from the air?", options:{a:"Carbon dioxide",b:"Oxygen",c:"Hydrogen",d:"Helium"}, correct:"a"},
    {q:"Which of these pollutes rivers?", options:{a:"Planting trees",b:"Boiling water",c:"Galamsey",d:"Rain"}, correct:"c"},
    {q:"Why should we not defecate near a river?", options:{a:"It makes the river flow faster",b:"It pollutes the water and causes disease",c:"It kills fish immediately",d:"It makes the water warm"}, correct:"b"},
    {q:"Which of these helps to clean the air?", options:{a:"Burning rubbish",b:"Driving more cars",c:"Cutting down trees",d:"Planting trees"}, correct:"d"},
    {q:"Which of these is a natural resource?", options:{a:"Water",b:"Plastic bag",c:"Football",d:"Pencil"}, correct:"a"},
    {q:"What does <i>conserve</i> mean?", options:{a:"To waste",b:"To burn",c:"To protect and use carefully",d:"To throw away"}, correct:"c"},
    {q:"Why is water called precious?", options:{a:"Because it is red",b:"Because living things cannot survive without it",c:"Because it is heavy",d:"Because it is rare"}, correct:"b"}
  ]
},

/* ---------------- UNIT 9 ---------------- */
{ id:"u9", number:9, term:2,
  strand:"Cycles", substrand:"Life Cycles of Organisms",
  code:"B3.2.2.1",
  title:"Life Cycle of a Plant",
  objectives:[
    "Describe the stages in the life cycle of a flowering plant.",
    "Identify the conditions a seed needs to germinate.",
    "Give examples from common Ghanaian crops."
  ],
  vocab:[
    {term:"Life cycle", def:"The stages a living thing passes through from birth to when it produces young ones."},
    {term:"Seed", def:"The part of a plant from which a new plant grows."},
    {term:"Germination", def:"When a seed begins to grow into a seedling."},
    {term:"Seedling", def:"A young plant that has just grown from a seed."},
    {term:"Pollination", def:"When pollen is carried from one flower to another."}
  ],
  content:[
    {type:"h", text:"9.1 The Stages"},
    {type:"p", text:"All flowering plants follow the same basic life cycle:"},
    {type:"ol", items:[
      "<b>Seed</b> — the resting stage, containing a tiny plant inside.",
      "<b>Germination</b> — the seed takes in water and the tiny plant begins to grow.",
      "<b>Seedling</b> — a young green shoot with small leaves appears.",
      "<b>Adult plant</b> — the plant grows bigger with more leaves, roots and a stem.",
      "<b>Flowering</b> — the plant produces flowers.",
      "<b>Fruit and seeds</b> — after pollination, flowers form fruit containing new seeds."
    ]},
    {type:"img", src:"img/u9-fig1.png",
      alt:"Life cycle of a maize plant",
      caption:"Figure 9.1: Life cycle of a maize plant."},
    {type:"h", text:"9.2 What a Seed Needs to Germinate"},
    {type:"ul", items:[
      "<b>Water</b> — to soften the seed coat.",
      "<b>Air</b> — the seed needs oxygen to grow.",
      "<b>Warmth</b> — most seeds germinate faster in warm conditions."
    ]},
    {type:"p", text:"Seeds do not need light to germinate, but once the seedling appears, it needs sunlight to make its own food."},
    {type:"example", label:"Example from Ghana",
      text:"A maize farmer in Techiman plants maize at the start of the rainy season. Within about a week the seeds germinate. In three months the maize is ready for harvest, giving new seeds for the next season."}
  ],
  think:"Why do you think some seeds can remain in the ground for many months before they germinate?",
  try:"Place five maize seeds on wet cotton wool in a clear cup near a window. Check daily and record when the first shoot appears.",
  summary:"Flowering plants go through a life cycle: seed, germination, seedling, adult plant, flower, fruit and new seeds. Seeds need water, air and warmth to germinate.",
  exercises:[],
  quiz:[
    {q:"Which of these is the first stage of a plant's life cycle?", options:{a:"Seedling",b:"Seed",c:"Flower",d:"Fruit"}, correct:"b"},
    {q:"When a seed begins to grow, we say it ______.", options:{a:"flowers",b:"ripens",c:"germinates",d:"falls"}, correct:"c"},
    {q:"Which of these is NOT needed for germination?", options:{a:"Light",b:"Water",c:"Air",d:"Warmth"}, correct:"a"},
    {q:"Where does a new plant come from?", options:{a:"The leaf",b:"The stem",c:"The root",d:"The seed"}, correct:"d"},
    {q:"Which of these is a young plant just grown from a seed?", options:{a:"Fruit",b:"Seedling",c:"Flower",d:"Root"}, correct:"b"},
    {q:"A maize plant is ready for harvest in about how many months?", options:{a:"One week",b:"One year",c:"Three months",d:"Five years"}, correct:"c"},
    {q:"After pollination, a flower develops into a ______.", options:{a:"fruit",b:"stone",c:"cloud",d:"river"}, correct:"a"},
    {q:"Once a seedling appears, what does it need to make food?", options:{a:"Ice",b:"Salt",c:"Plastic",d:"Sunlight"}, correct:"d"}
  ]
},

/* ---------------- UNIT 10 ---------------- */

  strand:"Systems", substrand:"The Human Body Systems",
  code:"B3.3.1.1.1",
  title:"The Human Body",
  objectives:[
    "Name the main parts of the human body.",
    "Identify the five sense organs and their functions.",
    "List simple habits that keep the body healthy."
  ],
  vocab:[
    {term:"Sense organ", def:"A part of the body that helps us detect the world around us."},
    {term:"Head", def:"The top part of the body containing the brain and sense organs."},
    {term:"Trunk", def:"The middle part of the body — the chest and abdomen."},
    {term:"Limbs", def:"The arms and legs."},
    {term:"Hygiene", def:"Habits that keep the body clean and healthy."}
  ],
  content:[
    {type:"h", text:"10.1 Main Parts of the Body"},
    {type:"p", text:"The human body is divided into three main parts:"},
    {type:"ul", items:[
      "<b>Head</b> — contains the brain, eyes, ears, nose, tongue and mouth.",
      "<b>Trunk</b> — contains the chest (heart, lungs) and abdomen (stomach, intestines).",
      "<b>Limbs</b> — the arms and legs, which help us move and do work."
    ]},
    {type:"img", src:"img/u10-fig1.png",
      alt:"Labelled diagram of the human body: head, trunk, limbs, and five sense organs",
      caption:"Figure 10.1: The main parts of the human body."},
    {type:"h", text:"10.2 The Five Sense Organs"},
    {type:"ul", items:[
      "<b>Eyes</b> — for seeing.",
      "<b>Ears</b> — for hearing.",
      "<b>Nose</b> — for smelling.",
      "<b>Tongue</b> — for tasting.",
      "<b>Skin</b> — for feeling (touch, heat, cold, pain)."
    ]},
    {type:"h", text:"10.3 Keeping the Body Healthy"},
    {type:"ul", items:[
      "Bathe at least once a day.",
      "Brush your teeth twice a day.",
      "Wash your hands with soap before eating and after using the toilet.",
      "Eat a balanced diet with fruits and vegetables.",
      "Drink clean water and get enough rest.",
      "Exercise every day by running, playing or walking."

      text:"Washing your hands with soap under running water after using the toilet can prevent diseases like cholera and diarrhoea, which are common during the rainy season."}

  think:"Which sense organ would you miss the most if you lost it? Explain your choice with two reasons.",
  try:"With a partner, take turns closing your eyes and identifying objects by touch, smell or sound. Which sense organ did you use for each?",
  summary:"The human body has three main parts — head, trunk and limbs. We have five sense organs: eyes, ears, nose, tongue and skin. Good hygiene keeps the body healthy and prevents disease.",
  exercises:[],
  quiz:[
    {q:"Which sense organ is used for seeing?", options:{a:"Ear",b:"Eye",c:"Nose",d:"Skin"}, correct:"b"},
    {q:"Which sense organ is used for hearing?", options:{a:"Eye",b:"Nose",c:"Ear",d:"Tongue"}, correct:"c"},
    {q:"Which sense organ helps you feel pain or heat?", options:{a:"Eye",b:"Ear",c:"Nose",d:"Skin"}, correct:"d"},
    {q:"Which part of the body contains the brain?", options:{a:"Head",b:"Trunk",c:"Limbs",d:"Foot"}, correct:"a"},
    {q:"How many sense organs do we have?", options:{a:"Three",b:"Four",c:"Five",d:"Six"}, correct:"c"},
    {q:"Which of these is a good hygiene habit?", options:{a:"Eating without washing hands",b:"Brushing teeth twice a day",c:"Sharing a toothbrush",d:"Skipping baths"}, correct:"b"},
    {q:"Which sense organ is used for tasting?", options:{a:"Eye",b:"Ear",c:"Nose",d:"Tongue"}, correct:"d"},
    {q:"Arms and legs are examples of ______.", options:{a:"limbs",b:"sense organs",c:"teeth",d:"lungs"}, correct:"a"}
  ]
},

/* ---------------- UNIT 11 ---------------- */
{ id:"u11", number:11, term:3,
  strand:"Systems", substrand:"The Solar System",
  code:"B3.3.2.1.1",
  title:"Sun, Earth and Moon",
  objectives:[
    "Describe the sun, Earth and moon.",
    "Explain the relationship between the Earth and the moon.",
    "Recognise that the moon does not produce its own light."
  ],
  vocab:[
    {term:"Sun", def:"A star — a ball of hot glowing gas that gives out light and heat."},
    {term:"Earth", def:"The planet we live on — it goes around the sun."},
    {term:"Moon", def:"A natural satellite that goes around the Earth."},
    {term:"Orbit", def:"The path one object takes around another in space."}
  ],
  content:[
    {type:"h", text:"11.1 Three Bodies in Space"},
    {type:"p", text:"The <b>sun</b>, the <b>Earth</b> and the <b>moon</b> are three of the most important objects for us."},
    {type:"ul", items:[
      "The <b>sun</b> is a star. It is very hot and gives out its own light.",
      "The <b>Earth</b> is a planet. It moves around the sun and takes about 365 days to make one orbit.",
      "The <b>moon</b> is a natural satellite. It moves around the Earth and takes about 28 days to do so."
    ]},
    {type:"img", src:"img/u11-fig1.png",
      alt:"Sun, Earth and Moon showing the moon orbiting the Earth",
      caption:"Figure 11.1: The moon orbits the Earth, and the Earth orbits the sun."},
    {type:"h", text:"11.2 Light from the Moon"},
    {type:"p", text:"The moon does not produce its own light. We can see it because it reflects light from the sun, like a mirror. As the moon orbits the Earth, we see different parts of its lit side — these are called the <b>phases of the moon</b>."},
    {type:"example", label:"Example from Ghana",
      text:"Fishermen along the coast of Ghana often plan their fishing trips around the phases of the moon. On full-moon nights, they can see well; on new-moon nights, it is darker."}
  ],
  think:"If the moon does not give out light, why can we see it at night?",
  try:"Look at the moon every night for one week. Draw what you see each night. Do the shapes change?",
  summary:"The sun is a star, the Earth is a planet that orbits the sun, and the moon is a satellite that orbits the Earth. The moon reflects sunlight — it does not make its own light.",
  exercises:[],
  quiz:[
    {q:"Which of the three is a star?", options:{a:"Sun",b:"Earth",c:"Moon",d:"Cloud"}, correct:"a"},
    {q:"Which one is a planet?", options:{a:"Sun",b:"Earth",c:"Moon",d:"Star"}, correct:"b"},
    {q:"Which one orbits the Earth?", options:{a:"Sun",b:"Mars",c:"Moon",d:"Venus"}, correct:"c"},
    {q:"Does the moon produce its own light?", options:{a:"Yes, like the sun",b:"Yes, at night only",c:"Only on full-moon nights",d:"No, it reflects sunlight"}, correct:"d"},
    {q:"About how long does the moon take to orbit the Earth?", options:{a:"1 day",b:"28 days",c:"365 days",d:"7 years"}, correct:"b"},
    {q:"About how long does the Earth take to orbit the sun?", options:{a:"365 days",b:"28 days",c:"24 hours",d:"100 days"}, correct:"a"},
    {q:"The path of an object around another in space is called its ______.", options:{a:"cycle",b:"axis",c:"orbit",d:"shadow"}, correct:"c"},
    {q:"Which of these is NOT in our solar system?", options:{a:"Sun",b:"Earth",c:"Moon",d:"A distant galaxy"}, correct:"d"}
  ]
},

/* ---------------- UNIT 12 ---------------- */
{ id:"u12", number:12, term:3,
  strand:"Systems", substrand:"Ecosystems",
  code:"B3.3.3.1.1",
  title:"Organisms and Their Habitats",
  objectives:[
    "Explain what a habitat is.",
    "Name the main habitats in Ghana and give examples of organisms living there.",
    "Describe how organisms are suited to their habitats."
  ],
  vocab:[
    {term:"Habitat", def:"The natural home of a plant or an animal."},
    {term:"Organism", def:"Any living thing — plant, animal or microbe."},
    {term:"Ecosystem", def:"A community of living things and their surroundings."},
    {term:"Adapt", def:"To have features that help an organism survive in its habitat."}
  ],
  content:[
    {type:"h", text:"12.1 What is a Habitat?"},
    {type:"p", text:"A <b>habitat</b> is the natural home of a living thing. It provides food, water, shelter and space. Different organisms live in different habitats because each has its own conditions — how wet, dry, hot or cold it is."},
    {type:"img", src:"img/u12-fig1.png",
      alt:"A forest habitat, a savanna habitat and a river habitat",
      caption:"Figure 12.1: Different habitats in Ghana — forest, savanna and river."},
    {type:"h", text:"12.2 Habitats in Ghana"},
    {type:"ul", items:[
      "<b>Forest</b> — tall trees, plenty of rain. Examples: monkeys, parrots, cocoa trees, ferns.",
      "<b>Savanna</b> — grassland with scattered trees, drier. Examples: antelopes, guinea fowl, baobab trees, shea trees.",
      "<b>Rivers and ponds</b> — fresh water. Examples: tilapia, water lilies, dragonflies, frogs.",
      "<b>Sea</b> — salty water. Examples: sardines, crabs, seaweed."
    ]},
    {type:"h", text:"12.3 Adaptation to Habitats"},
    {type:"p", text:"Living things have features that help them survive where they live. This is called <b>adaptation</b>. A baobab tree stores water in its thick trunk to survive the dry savanna. A tilapia has fins and gills that help it swim and breathe in water. A monkey has long arms and a tail for climbing trees in the forest."},
    {type:"example", label:"Example from Ghana",
      text:"The mole cricket lives underground and digs tunnels with its strong front legs. Its body colour matches the soil, helping it hide from birds that eat it."}
  ],
  think:"What would happen to a fish if you took it out of water? What does this tell you about its habitat?",
  try:"Choose one habitat near your school (forest, garden or pond). List three plants and three animals that live there.",
  summary:"A habitat is the natural home of living things. Ghana has several habitats including forests, savannas, rivers and the sea. Organisms have adaptations that help them survive.",
  exercises:[],
  quiz:[
    {q:"What is a habitat?", options:{a:"A kind of food",b:"The natural home of a living thing",c:"A type of soil",d:"A science tool"}, correct:"b"},
    {q:"Where does a tilapia live?", options:{a:"Forest",b:"Savanna",c:"Water",d:"Desert"}, correct:"c"},
    {q:"Where does a monkey mostly live?", options:{a:"Forest",b:"Sea",c:"Desert",d:"Underground"}, correct:"a"},
    {q:"Which feature helps a baobab tree survive in the savanna?", options:{a:"Bright flowers",b:"Thin leaves",c:"Waterproof skin",d:"Thick trunk that stores water"}, correct:"d"},
    {q:"What does <i>adaptation</i> mean?", options:{a:"Moving to another country",b:"Features that help an organism survive in its habitat",c:"Being eaten by another animal",d:"Being non-living"}, correct:"b"},
    {q:"A mole cricket lives ______.", options:{a:"in the sky",b:"on the sea",c:"underground",d:"on tree tops only"}, correct:"c"},
    {q:"Which of these is a freshwater habitat?", options:{a:"River",b:"Sea",c:"Desert",d:"Cloud"}, correct:"a"},
    {q:"Which habitat has tall trees and plenty of rain?", options:{a:"Savanna",b:"Sea",c:"Desert",d:"Forest"}, correct:"d"}
  ]
},

/* ---------------- UNIT 13 ---------------- */
{ id:"u13", number:13, term:3,
  strand:"Forces and Energy", substrand:"Sources and Forms of Energy",
  code:"B3.4.1.1.1",
  title:"Energy Around Us",
  objectives:[
    "Name the main forms of energy we see around us.",
    "Identify sources of energy at home and in school.",
    "Explain why energy is important in daily life."
  ],
  vocab:[
    {term:"Energy", def:"The ability to do work or make things happen."},
    {term:"Source", def:"Where something comes from."},
    {term:"Light", def:"A form of energy that lets us see."},
    {term:"Heat", def:"A form of energy that makes things warm."},
    {term:"Sound", def:"A form of energy we can hear."}
  ],
  content:[
    {type:"h", text:"13.1 Forms of Energy"},
    {type:"p", text:"Energy is everywhere. We can see and feel its effects every day:"},
    {type:"ul", items:[
      "<b>Light energy</b> — from the sun, torches, candles, bulbs.",
      "<b>Heat energy</b> — from fire, the sun, a boiling pot.",
      "<b>Sound energy</b> — from drums, radio, people talking.",
      "<b>Movement (kinetic) energy</b> — from a moving car, a running child, wind."
    ]},
    {type:"img", src:"img/u13-fig1.png",
      alt:"Sources of energy: sun, fire, torch, radio, drum, moving car",
      caption:"Figure 13.1: Sources and forms of energy around us."},
    {type:"h", text:"13.2 Sources of Energy"},
    {type:"p", text:"The main sources of energy we use in Ghana include:"},
    {type:"ul", items:[
      "<b>The sun</b> — gives light and heat.",
      "<b>Firewood and charcoal</b> — used for cooking.",
      "<b>Electricity</b> — from the Akosombo Dam and other power stations.",
      "<b>Food</b> — gives our bodies the energy to work and play."
    ]},
    {type:"example", label:"Example from Ghana",
      text:"The Akosombo Dam on the Volta River uses the energy of falling water to turn big machines called turbines. These turbines generate electricity that lights homes, schools and hospitals across the country."}
  ],
  think:"List three things you did today that needed energy. Where did that energy come from?",
  try:"Walk through your home and list everything that gives out light, heat, sound or movement. Sort them into the four forms of energy.",
  summary:"Energy is the ability to do work. It comes in different forms — light, heat, sound and movement — and has many sources including the sun, fire, electricity and food.",
  exercises:[],
  quiz:[
    {q:"What is energy?", options:{a:"A kind of food",b:"A type of metal",c:"The ability to do work",d:"A colour"}, correct:"c"},
    {q:"Which form of energy comes from the sun?", options:{a:"Light and heat",b:"Sound",c:"Wind",d:"Water"}, correct:"a"},
    {q:"Which of these gives sound energy?", options:{a:"A stone",b:"A drum",c:"A shoe",d:"A cup"}, correct:"b"},
    {q:"Where does our body get energy to work and play?", options:{a:"From stones",b:"From water alone",c:"From paper",d:"From food"}, correct:"d"},
    {q:"The Akosombo Dam is used mainly to make ______.", options:{a:"electricity",b:"food",c:"wood",d:"stones"}, correct:"a"},
    {q:"Which of these is NOT a form of energy?", options:{a:"Light",b:"Heat",c:"Stone",d:"Sound"}, correct:"c"},
    {q:"A moving car has which form of energy?", options:{a:"Only sound",b:"Movement energy",c:"No energy",d:"Only heat"}, correct:"b"},
    {q:"Which source of energy do we use for cooking in most Ghanaian homes?", options:{a:"Wind",b:"Stones",c:"Glass",d:"Firewood or gas"}, correct:"d"}
  ]
},

/* ---------------- UNIT 14 ---------------- */
{ id:"u14", number:14, term:3,
  strand:"Forces and Energy", substrand:"Electricity and Electronics",
  code:"B3.4.2.1.1",
  title:"Simple Electric Circuits",
  objectives:[
    "Identify the parts of a simple electric circuit.",
    "Explain the difference between conductors and insulators.",
    "State simple rules for using electricity safely."
  ],
  vocab:[
    {term:"Circuit", def:"A complete path that electricity flows through."},
    {term:"Battery", def:"A store of electric energy."},
    {term:"Bulb", def:"A lamp that lights up when electricity passes through it."},
    {term:"Switch", def:"A device that opens or closes a circuit."},
    {term:"Conductor", def:"A material that lets electricity pass through it."},
    {term:"Insulator", def:"A material that does not let electricity pass through it."}
  ],
  content:[
    {type:"h", text:"14.1 Parts of a Simple Circuit"},
    {type:"p", text:"A simple electric circuit needs three main parts:"},
    {type:"ul", items:[
      "A <b>battery</b> — to supply the electricity.",
      "<b>Wires</b> — to carry the electricity.",
      "A <b>bulb</b> (or buzzer) — to show that electricity is flowing."
    ]},
    {type:"p", text:"A <b>switch</b> can be added to turn the circuit on and off. When the switch is closed, the circuit is complete and the bulb lights up. When the switch is open, the circuit is broken and the bulb goes off."},
    {type:"img", src:"img/u14-fig1.png",
      alt:"Simple electric circuit: battery, wires, switch and bulb",
      caption:"Figure 14.1: A simple electric circuit."},
    {type:"h", text:"14.2 Conductors and Insulators"},
    {type:"ul", items:[
      "<b>Conductors</b> let electricity pass through them: metals like copper, iron and aluminium; also water and the human body.",
      "<b>Insulators</b> do not let electricity pass through them: rubber, plastic, wood, dry cloth and glass."
    ]},
    {type:"p", text:"Wires are made of copper (a conductor) covered with plastic (an insulator) for safety."},
    {type:"h", text:"14.3 Using Electricity Safely"},
    {type:"ul", items:[
      "Never touch electric sockets with wet hands.",
      "Do not put metal objects into sockets.",
      "Do not play near broken electric poles or fallen wires.",
      "Ask an adult to fix faulty wires or sockets."
    ]},
    {type:"example", label:"Example from Ghana",
      text:"Many homes use rechargeable lamps charged from the mains or solar panels. The lamp has a battery inside — when it is turned on, the circuit is closed and the bulb lights up."}
  ],
  think:"Why is the outside of an electric wire covered with plastic and not with copper?",
  try:"With an adult's help, make a simple circuit using a battery, two wires and a small bulb. Test which materials (a coin, a pencil, a plastic ruler) let the bulb light up.",
  summary:"A simple circuit has a battery, wires and a bulb, with a switch to control it. Conductors let electricity pass through; insulators do not. Electricity must be used safely.",
  exercises:[],
  quiz:[
    {q:"What does a battery do in a circuit?", options:{a:"Supplies electricity",b:"Lights up by itself",c:"Blocks electricity",d:"Makes sound only"}, correct:"a"},
    {q:"Which of these is a conductor of electricity?", options:{a:"Rubber",b:"Plastic",c:"Copper",d:"Dry wood"}, correct:"c"},
    {q:"Which of these is an insulator?", options:{a:"Iron nail",b:"Plastic ruler",c:"Copper wire",d:"Water"}, correct:"b"},
    {q:"What happens when the switch is closed in a working circuit?", options:{a:"The battery empties",b:"The bulb goes off",c:"Nothing happens",d:"The bulb lights up"}, correct:"d"},
    {q:"Why is copper wire covered with plastic?", options:{a:"To stop electricity from escaping or shocking people",b:"To make it pretty",c:"To make it heavier",d:"To make it hot"}, correct:"a"},
    {q:"Which of these is a safe rule for electricity?", options:{a:"Touch sockets with wet hands",b:"Put metal into sockets",c:"Keep away from broken poles and wires",d:"Play with live wires"}, correct:"c"},
    {q:"A circuit is ______.", options:{a:"a kind of food",b:"a complete path for electricity",c:"a type of music",d:"a game"}, correct:"b"},
    {q:"What happens if the circuit is broken?", options:{a:"The bulb becomes brighter",b:"The battery charges",c:"Nothing changes",d:"The bulb goes off"}, correct:"d"}
  ]
},

/* ---------------- UNIT 15 ---------------- */
{ id:"u15", number:15, term:3,
  strand:"Forces and Energy", substrand:"Forces and Movement",
  code:"B3.4.3.1.1",
  title:"Pushes and Pulls",
  objectives:[
    "Explain what a force is.",
    "Give examples of pushes and pulls in daily life.",
    "Describe how friction affects movement."
  ],
  vocab:[
    {term:"Force", def:"A push or a pull on an object."},
    {term:"Push", def:"A force that moves an object away from you."},
    {term:"Pull", def:"A force that moves an object towards you."},
    {term:"Friction", def:"A force that slows things down when they rub against each other."}
  ],
  content:[
    {type:"h", text:"15.1 What is a Force?"},
    {type:"p", text:"A <b>force</b> is a push or a pull that acts on an object. Forces can:"},
    {type:"ul", items:[
      "Make a still object move — e.g. kicking a ball.",
      "Make a moving object stop — e.g. catching a ball.",
      "Change the direction of a moving object — e.g. bouncing a ball.",
      "Change the shape of an object — e.g. squeezing a tomato."
    ]},
    {type:"img", src:"img/u15-fig1.png",
      alt:"Examples of push (opening a door) and pull (pulling a cart)",
      caption:"Figure 15.1: Examples of pushes and pulls in everyday life."},
    {type:"h", text:"15.2 Pushes and Pulls Around Us"},
    {type:"ul", items:[
      "<b>Push</b> — pushing a wheelbarrow, opening a door away from you, kicking a football.",
      "<b>Pull</b> — pulling a bucket from a well, dragging a bag, opening a door towards you."
    ]},
    {type:"h", text:"15.3 Friction"},
    {type:"p", text:"<b>Friction</b> is the force that slows things down when two surfaces rub against each other. Friction is useful — it helps our shoes grip the ground so we don't slip. It also helps bicycle brakes work. But sometimes friction is a problem — it wears out the soles of our shoes and makes machines hot."},
    {type:"example", label:"Example from Ghana",
      text:"When a trotro's tyres are worn smooth, they cannot grip the road well, especially in the rain. That is why drivers must change old tyres — friction keeps the vehicle safe."}
  ],
  think:"Why is it harder to walk on a slippery floor than on a rough one? Use the word friction in your answer.",
  try:"Push a small toy car across a smooth table, then across a rough mat. Which surface slows the car more? This shows the effect of friction.",
  summary:"A force is a push or a pull. Forces can make objects start, stop, change direction or change shape. Friction is a force that slows movement when surfaces rub together.",
  exercises:[],
  quiz:[
    {q:"A force is a ______.", options:{a:"kind of food",b:"push or pull",c:"type of metal",d:"colour"}, correct:"b"},
    {q:"Kicking a football is an example of a ______.", options:{a:"push",b:"pull",c:"heat",d:"sound"}, correct:"a"},
    {q:"Pulling water from a well is an example of a ______.", options:{a:"push",b:"friction",c:"pull",d:"sound"}, correct:"c"},
    {q:"What is friction?", options:{a:"A type of light",b:"A gas",c:"A type of food",d:"A force that slows movement when surfaces rub together"}, correct:"d"},
    {q:"Which of these is helped by friction?", options:{a:"Slipping on wet ground",b:"Bicycle brakes stopping the bike",c:"Flying a kite",d:"Floating on water"}, correct:"b"},
    {q:"A force can change an object's ______.", options:{a:"colour",b:"taste",c:"direction of movement",d:"sound"}, correct:"c"},
    {q:"Why must worn trotro tyres be changed?", options:{a:"They cannot grip the road well",b:"They are too heavy",c:"They use too much fuel",d:"They make a noise"}, correct:"a"},
    {q:"Which of these is a pull?", options:{a:"Kicking a ball",b:"Pushing a wheelbarrow",c:"Pressing a button",d:"Dragging a bag behind you"}, correct:"d"}
  ]
}
],
