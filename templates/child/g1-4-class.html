      text:"½ + ⅓<br>Common denominator is 6.<br>½ = ³⁄₆; ⅓ = ²⁄₆<br>³⁄₆ + ²⁄₆ = <b>⁵⁄₆</b>"},
    {type:"h", text:"3.3 Subtracting Fractions"},
    {type:"callout", variant:"tip", title:"Example",
      text:"¾ − ½<br>Common denominator is 4.<br>¾ = ¾; ½ = ²⁄₄<br>¾ − ²⁄₄ = <b>¼</b>"},
    {type:"h", text:"3.4 Multiplying a Fraction by a Whole Number"},
    {type:"p", text:"Multiply the numerator by the whole number. The denominator stays the same."},
    {type:"callout", variant:"tip", title:"Example",
      text:"³⁄₅ × 4 = ¹²⁄₅ = <b>2 ²⁄₅</b> (as a mixed number)"},
    {type:"example", label:"Example from Ghana",
      text:"A trader sells ¾ of a bag of rice in the morning and ½ in the afternoon. Total sold: ¾ + ½ = ¾ + ²⁄₄ = <b>⁵⁄₄ = 1¼ bags</b>."}
  ],
  think:"Why do we need a common denominator before adding or subtracting fractions?",
  try:"Work out: (a) ⅓ + ¼, (b) ⅚ − ⅓, (c) ⅖ × 5.",
  summary:"Add and subtract fractions by finding a common denominator. Multiply a fraction by a whole number by multiplying the numerator only.",
  exercises:[],
  quiz:[
    {q:"¹⁄₅ + ²⁄₅ = ?", options:{a:"³⁄₁₀",b:"³⁄₅",c:"²⁄₅",d:"⅕"}, correct:"b"},
    {q:"½ + ⅓ = ?", options:{a:"⅚",b:"⅖",c:"⅔",d:"²⁄₅"}, correct:"a"},
    {q:"¾ − ½ = ?", options:{a:"¼",b:"½",c:"⅛",d:"¾"}, correct:"a"},
    {q:"⅔ + ¼ = ?", options:{a:"¹¹⁄₁₂",b:"¹⁰⁄₁₂",c:"⁹⁄₁₂",d:"⅞"}, correct:"a"},
    {q:"⅚ − ⅓ = ?", options:{a:"½",b:"⅓",c:"¼",d:"⅙"}, correct:"a"},
    {q:"³⁄₅ × 4 = ?", options:{a:"¹²⁄₅ = 2²⁄₅",b:"⁷⁄₅",c:"³⁄₂₀",d:"¹²⁄₂₀"}, correct:"a"},
    {q:"⅖ × 5 = ?", options:{a:"1",b:"2",c:"3",d:"2.5"}, correct:"b"},
    {q:"⅓ + ⅙ = ?", options:{a:"½",b:"⅔",c:"¼",d:"⅓"}, correct:"a"}
  ]
},

/* ---------------- UNIT 4 ---------------- */
{ id:"u4", number:4, term:1,
  strand:"Number", substrand:"Percentages",
  code:"B5.1.4.1.1",
  title:"Percentages",
  objectives:[
    "Understand that percent means 'out of 100'.",
    "Convert fractions and decimals to percentages.",
    "Find percentages of quantities."
  ],
  vocab:[
    {term:"Percent", def:"Out of 100 — symbol %."},
    {term:"Percentage", def:"A fraction or ratio expressed out of 100."},
    {term:"Discount", def:"Money taken off the original price."},
    {term:"Increase", def:"When the amount goes up."}
  ],
  content:[
    {type:"h", text:"4.1 What Percent Means"},
    {type:"p", text:"<b>Percent</b> means <i>out of 100</i>. So 50% means 50 out of every 100, or ½."},
    {type:"table", headers:["Fraction","Decimal","Percent"],
      rows:[
        ["½","0.5","50%"],
        ["¼","0.25","25%"],
        ["¾","0.75","75%"],
        ["⅕","0.2","20%"],
        ["⅒","0.1","10%"],
        ["1 (whole)","1.0","100%"]
      ], caption:"Common equivalents."},
    {type:"h", text:"4.2 Converting"},
    {type:"ul", items:[
      "<b>Fraction → Percent:</b> multiply by 100. ⅗ × 100 = 60%.",
      "<b>Decimal → Percent:</b> multiply by 100. 0.35 = 35%.",
      "<b>Percent → Decimal:</b> divide by 100. 75% = 0.75."
    ]},
    {type:"h", text:"4.3 Finding a Percentage of a Quantity"},
    {type:"callout", variant:"tip", title:"Example: 25% of 80",
      text:"25% = ¼. So 25% of 80 = 80 ÷ 4 = <b>20</b>."},
    {type:"callout", variant:"tip", title:"Example: 15% of 60",
      text:"15% of 60 = (15 ÷ 100) × 60 = 0.15 × 60 = <b>9</b>."},
    {type:"h", text:"4.4 Discounts in Real Life"},
    {type:"p", text:"When an item is on sale with a discount, you pay less. If a shirt costs GH₵80 and it is discounted by 25%, you save 25% of 80 = GH₵20. The final price is 80 − 20 = <b>GH₵60</b>."},
    {type:"example", label:"Example from Ghana",
      text:"Many shops in Accra and Kumasi offer end-of-year sales with 10% to 50% off. Understanding percentages helps you spot a good deal and calculate savings quickly."}
  ],
  think:"Why is it useful to know percentages when shopping? Give one example where a discount might be misleading.",
  try:"Convert to percentages: ⅗, ⅞, 0.6, 0.45. Find 20% of 150, 30% of 250 and 15% of 80.",
  summary:"Percent means 'out of 100'. Convert fractions and decimals to percentages by multiplying by 100. Find percentages of quantities using fractions or decimals.",
  exercises:[],
  quiz:[
    {q:"What does 50% mean?", options:{a:"50 out of 100 = ½",b:"5 out of 100",c:"5 out of 10",d:"100 out of 50"}, correct:"a"},
    {q:"What is ¼ as a percentage?", options:{a:"14%",b:"25%",c:"40%",d:"50%"}, correct:"b"},
    {q:"What is 0.6 as a percentage?", options:{a:"6%",b:"16%",c:"60%",d:"66%"}, correct:"c"},
    {q:"What is 20% of 80?", options:{a:"8",b:"16",c:"20",d:"40"}, correct:"b"},
    {q:"What is 25% of 100?", options:{a:"20",b:"25",c:"40",d:"50"}, correct:"b"},
    {q:"What is 10% of 250?", options:{a:"10",b:"25",c:"50",d:"100"}, correct:"b"},
    {q:"A shirt costs GH₵80 with 25% off. What is the new price?", options:{a:"GH₵40",b:"GH₵55",c:"GH₵60",d:"GH₵75"}, correct:"c"},
    {q:"⅗ as a percentage is ______.", options:{a:"35%",b:"53%",c:"60%",d:"65%"}, correct:"c"}
  ]
},

/* ---------------- UNIT 5 ---------------- */
{ id:"u5", number:5, term:2,
  strand:"Number", substrand:"Ratio and Proportion",
  code:"B5.1.5.1.1",
  title:"Ratio and Proportion",
  objectives:[
    "Understand ratio as a way of comparing quantities.",
    "Simplify ratios.",
    "Solve simple ratio problems."
  ],
  vocab:[
    {term:"Ratio", def:"A comparison of two or more quantities."},
    {term:"Simplify a ratio", def:"Divide all parts by their common factor."},
    {term:"Proportion", def:"An equation showing two ratios are equal."},
    {term:"Sharing in a ratio", def:"Dividing a total according to the ratio."}
  ],
  content:[
    {type:"h", text:"5.1 What Is a Ratio?"},
    {type:"p", text:"A <b>ratio</b> compares two or more amounts. We write it with a colon (:). If a class has 12 boys and 18 girls, the ratio of boys to girls is <b>12:18</b>."},
    {type:"h", text:"5.2 Simplifying Ratios"},
    {type:"p", text:"To simplify, divide all parts by their highest common factor."},
    {type:"ul", items:[
      "12:18 — divide both by 6 → <b>2:3</b>",
      "10:20:30 — divide all by 10 → <b>1:2:3</b>",
      "15:25 — divide both by 5 → <b>3:5</b>"
    ]},
    {type:"h", text:"5.3 Sharing in a Ratio"},
    {type:"p", text:"To share a total in a ratio, add the parts, find one share, then multiply."},
    {type:"callout", variant:"tip", title:"Example: Share GH₵60 in ratio 2:3",
      text:"Total parts = 2 + 3 = 5.<br>One part = 60 ÷ 5 = GH₵12.<br>2 parts = 2 × 12 = <b>GH₵24</b>.<br>3 parts = 3 × 12 = <b>GH₵36</b>.<br>Check: 24 + 36 = GH₵60. ✓"},
    {type:"h", text:"5.4 Proportion"},
    {type:"p", text:"Two ratios are in <b>proportion</b> if they are equal."},
    {type:"ul", items:[
      "1:2 = 3:6 (both simplify to 1:2)",
      "2:5 = 4:10 (both simplify to 2:5)"
    ]},
    {type:"example", label:"Example from Ghana",
      text:"On a cocoa farm, the farmer mixes fertiliser and water in a ratio of <b>1:10</b>. For 2 cups of fertiliser, he uses 20 cups of water. For 5 cups of fertiliser, he uses 50 cups of water."}
  ],
  think:"Why are ratios useful when mixing things like paint, cement or fertiliser?",
  try:"Share GH₵120 in the ratio 3:5. Share 60 books between two classes in the ratio 2:3.",
  summary:"A ratio compares quantities. Simplify by dividing by the highest common factor. To share a total, add the parts, find one part, then multiply. Ratios in proportion are equal.",
  exercises:[],
  quiz:[
    {q:"Simplify 12:18.", options:{a:"2:3",b:"3:4",c:"4:6",d:"1:2"}, correct:"a"},
    {q:"Simplify 15:25.", options:{a:"1:2",b:"3:5",c:"2:3",d:"3:4"}, correct:"b"},
    {q:"Simplify 10:20:30.", options:{a:"1:2:3",b:"2:3:4",c:"5:10:15",d:"1:1:1"}, correct:"a"},
    {q:"Share GH₵60 in ratio 2:3. What is the smaller share?", options:{a:"GH₵20",b:"GH₵24",c:"GH₵30",d:"GH₵36"}, correct:"b"},
    {q:"Share GH₵100 in ratio 1:4. What is the larger share?", options:{a:"GH₵20",b:"GH₵40",c:"GH₵60",d:"GH₵80"}, correct:"d"},
    {q:"Are 2:5 and 4:10 in proportion?", options:{a:"Yes",b:"No",c:"Only sometimes",d:"Cannot tell"}, correct:"a"},
    {q:"If cement:sand is 1:3, and you use 4 bags of cement, how many sand?", options:{a:"7",b:"8",c:"12",d:"16"}, correct:"c"},
    {q:"Simplify 20:30:40.", options:{a:"2:3:4",b:"1:2:3",c:"2:4:6",d:"4:6:8"}, correct:"a"}
  ]
},

{ id:"u6", number:6, term:2,
  strand:"Number", substrand:"Money",
  code:"B5.1.6.1.1",
  title:"Money Problems",
  objectives:[
    "Solve problems involving profit and loss.",
    "Calculate simple interest.",
    "Work out discounts and totals."
  ],
  vocab:[
    {term:"Cost price", def:"The price a trader pays to buy goods."},
    {term:"Selling price", def:"The price a trader sells goods for."},
    {term:"Profit", def:"Money made when selling above cost."},
    {term:"Loss", def:"Money lost when selling below cost."},
    {term:"Interest", def:"Extra money paid for saving or borrowing."}
  ],
  content:[
    {type:"h", text:"6.1 Profit and Loss"},
    {type:"ul", items:[
      "<b>Profit = Selling price − Cost price</b> (when selling price is higher).",
      "<b>Loss = Cost price − Selling price</b> (when cost price is higher)."
    ]},
    {type:"callout", variant:"tip", title:"Example",
      text:"A trader buys a crate of eggs for GH₵40 and sells it for GH₵52.<br>Profit = 52 − 40 = <b>GH₵12</b>."},
    {type:"h", text:"6.2 Simple Interest"},
    {type:"p", text:"When you save money in a bank, the bank pays you <b>interest</b>. The amount you start with is called the <b>principal</b>. Simple interest is calculated as:"},
    {type:"callout", variant:"tip", title:"Formula",
      text:"<b>Simple interest = (Principal × Rate × Time) ÷ 100</b><br><br>Example: GH₵500 saved at 10% for 2 years.<br>Interest = (500 × 10 × 2) ÷ 100 = <b>GH₵100</b>.<br>Total = 500 + 100 = <b>GH₵600</b>."},
    {type:"h", text:"6.3 Discounts"},
    {type:"callout", variant:"tip", title:"Example",
      text:"A bag costs GH₵120. There is a 20% discount.<br>Discount = 20% of 120 = 24.<br>Final price = 120 − 24 = <b>GH₵96</b>."},
    {type:"h", text:"6.4 Multi-step Money Problems"},
    {type:"callout", variant:"tip", title:"Example",
      text:"A trader buys 5 crates of tomatoes at GH₵35 each. She sells them at GH₵50 each.<br>Total cost = 5 × 35 = 175.<br>Total sales = 5 × 50 = 250.<br>Profit = 250 − 175 = <b>GH₵75</b>."},
    {type:"example", label:"Example from Ghana",
      text:"Market traders in Ghana often calculate profit daily. Susu collectors offer savings services where small daily savings earn interest over time."}
  ],
  think:"Why is it important for a trader to know the cost price as well as the selling price?",
  try:"A trader buys 12 loaves at GH₵5 each and sells them at GH₵7 each. What is her total profit?",
  summary:"Profit = selling price − cost price; loss is the opposite. Simple interest = (P × R × T) ÷ 100. Discount reduces the price. Multi-step money problems combine several calculations.",
  exercises:[],
  quiz:[
    {q:"Buying price GH₵40, selling price GH₵52. What is the profit?", options:{a:"GH₵10",b:"GH₵12",c:"GH₵14",d:"GH₵92"}, correct:"b"},
    {q:"Cost price GH₵80, selling price GH₵60. What is the loss?", options:{a:"GH₵10",b:"GH₵15",c:"GH₵20",d:"GH₵40"}, correct:"c"},
    {q:"Simple interest on GH₵500 at 10% for 2 years?", options:{a:"GH₵50",b:"GH₵75",c:"GH₵100",d:"GH₵150"}, correct:"c"},
    {q:"Simple interest on GH₵400 at 5% for 3 years?", options:{a:"GH₵50",b:"GH₵60",c:"GH₵80",d:"GH₵100"}, correct:"b"},
    {q:"Discount of 20% on GH₵120. Final price?", options:{a:"GH₵80",b:"GH₵96",c:"GH₵100",d:"GH₵110"}, correct:"b"},
    {q:"5 crates at GH₵35 each, sold at GH₵50 each. Profit?", options:{a:"GH₵50",b:"GH₵65",c:"GH₵75",d:"GH₵85"}, correct:"c"},
    {q:"What is the principal in interest problems?", options:{a:"Interest earned",b:"The starting amount",c:"The rate",d:"The time"}, correct:"b"},
    {q:"Buys 10 items at GH₵8, sells at GH₵10. Total profit?", options:{a:"GH₵10",b:"GH₵15",c:"GH₵20",d:"GH₵100"}, correct:"c"}
  ]
},

{ id:"u7", number:7, term:2,
  strand:"Geometry and Measurement", substrand:"Perimeter and Area",
  code:"B5.2.1.1.1",
  title:"Perimeter and Area of Composite Shapes",
  objectives:[
    "Calculate perimeter of composite shapes.",
    "Calculate area of compound shapes (rectangles only).",
    "Solve real-world problems involving area and perimeter."
  ],
  vocab:[
    {term:"Composite shape", def:"A shape made of two or more simple shapes."},
    {term:"Perimeter", def:"Total distance around a shape."},
    {term:"Area", def:"Space inside a shape."},
    {term:"Square unit", def:"A square of side 1 unit."}
  ],
  content:[
    {type:"h", text:"7.1 Perimeter"},
    {type:"p", text:"Perimeter is the total length around the outside of a shape. For rectangles, P = 2 × (l + w). For squares, P = 4 × side."},
    {type:"callout", variant:"tip", title:"Composite shape",
      text:"An L-shaped compound can be broken into two rectangles. Just add up all the outside lengths — do not include the inner line."},
    {type:"h", text:"7.2 Area of Composite Shapes"},
    {type:"p", text:"To find the area of a composite shape, split it into rectangles. Find each rectangle's area, then add them together."},
    {type:"callout", variant:"tip", title:"Example: L-shape",
      text:"An L-shape made of two rectangles: one is 8 cm × 4 cm, the other is 4 cm × 3 cm.<br>Area 1 = 8 × 4 = 32 cm².<br>Area 2 = 4 × 3 = 12 cm².<br>Total = 32 + 12 = <b>44 cm²</b>."},
    {type:"h", text:"7.3 Real-World Problems"},
    {type:"callout", variant:"tip", title:"Example",
      text:"A classroom floor is <b>8 m × 6 m</b>. How many square metres of tiles are needed?<br>Area = 8 × 6 = <b>48 m²</b>."},
    {type:"callout", variant:"tip", title:"Fencing",
      text:"A farm is <b>20 m × 15 m</b>. How much fencing is needed to go all around it?<br>P = 2 × (20 + 15) = <b>70 m</b>."},
    {type:"example", label:"Example from Ghana",
      text:"A farmer wants to fence a rectangular plot. She needs the perimeter. To know how much seed to buy for the same plot, she needs the area."}
  ],
  think:"Why would a farmer need the perimeter for some tasks and the area for others? Give examples of each.",
  try:"Draw an L-shaped compound (two rectangles joined). Label the dimensions and calculate both perimeter and area.",
  summary:"Perimeter is the distance around; area is the space inside. For composite shapes, split into rectangles. Use P = 2(l + w) and A = l × w.",
  exercises:[],
  quiz:[
    {q:"Perimeter of a rectangle 12 cm × 8 cm?", options:{a:"20 cm",b:"40 cm",c:"96 cm",d:"32 cm"}, correct:"b"},
    {q:"Area of a rectangle 12 cm × 8 cm?", options:{a:"20 cm²",b:"40 cm²",c:"96 cm²",d:"60 cm²"}, correct:"c"},
    {q:"Area of a classroom floor 8 m × 6 m?", options:{a:"14 m²",b:"28 m²",c:"48 m²",d:"56 m²"}, correct:"c"},
    {q:"Fencing a farm 20 m × 15 m — how much fencing?", options:{a:"35 m",b:"60 m",c:"70 m",d:"300 m"}, correct:"c"},
    {q:"Area of L-shape: rectangles 8×4 and 4×3 (cm²)?", options:{a:"44 cm²",b:"60 cm²",c:"32 cm²",d:"12 cm²"}, correct:"a"},
    {q:"Perimeter of a square with side 9 m?", options:{a:"18 m",b:"27 m",c:"36 m",d:"81 m"}, correct:"c"},
    {q:"Area of a square with side 9 m?", options:{a:"18 m²",b:"36 m²",c:"81 m²",d:"90 m²"}, correct:"c"},
    {q:"If a rectangle's length is 15 m and width 10 m, what is the perimeter?", options:{a:"25 m",b:"50 m",c:"150 m",d:"100 m"}, correct:"b"}

    "Solve real-world volume problems."

    {term:"Capacity", def:"How much a container holds."}
  ],
  content:[

    {type:"p", text:"<b>Volume</b> is the amount of space a solid takes up. It is measured in cubic units — cm³, m³, mm³."},
    {type:"h", text:"8.2 Volume of a Cube"},
    {type:"callout", variant:"tip", title:"Formula",
      text:"<b>Volume of cube = side × side × side</b><br><br>For a cube with side 4 cm:<br>V = 4 × 4 × 4 = <b>64 cm³</b>."},
    {type:"h", text:"8.3 Volume of a Cuboid"},
    {type:"callout", variant:"tip", title:"Formula",
      text:"<b>Volume of cuboid = length × width × height</b><br><br>For a box 10 cm × 5 cm × 3 cm:<br>V = 10 × 5 × 3 = <b>150 cm³</b>."},
    {type:"h", text:"8.4 Volume and Capacity"},
    {type:"p", text:"For water and other liquids, we say <b>capacity</b>. The link is:"},
    {type:"ul", items:[
      "<b>1 cm³ = 1 ml</b>",
      "<b>1,000 cm³ = 1 litre</b>",
      "<b>1 m³ = 1,000 litres</b>"

    {type:"h", text:"8.5 Real-World Problems"},
    {type:"callout", variant:"tip", title:"Example",
      text:"A water tank is <b>2 m × 1.5 m × 1 m</b>. How much water can it hold?<br>V = 2 × 1.5 × 1 = <b>3 m³</b>.<br>Since 1 m³ = 1,000 litres, the tank holds <b>3,000 litres</b>."},
    {type:"example", label:"Example from Ghana",
      text:"A trader packs goods into cartons that are <b>40 cm × 30 cm × 25 cm</b>. Volume = 40 × 30 × 25 = 30,000 cm³ = <b>30 litres</b>."}

      text:"The <b>n</b>th term of a pattern starting at 2 and adding 3 each time is:<br><b>nth term = 3n − 1</b>.<br><br>Check: n=1 → 2, n=2 → 5, n=3 → 8. ✓"},
