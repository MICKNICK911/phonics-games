{ id:"u8", number:8, term:2,
  strand:"Writing", substrand:"Composition",
  code:"B3.3.1.3.1",
  title:"Writing Paragraphs",
  objectives:[
    "Explain what a paragraph is.",
    "Write a paragraph with a topic sentence.",
    "Keep sentences in a paragraph connected to one idea."
  ],
  vocab:[
    {term:"Paragraph", def:"A group of sentences about one idea."},
    {term:"Topic sentence", def:"The first sentence that tells the main idea."},
    {term:"Indent", def:"To leave space at the start of a paragraph."}
  ],
  content:[
    {type:"h", text:"8.1 What Is a Paragraph?"},
    {type:"p", text:"A <b>paragraph</b> is a group of sentences that all talk about one main idea. When we start a new idea, we start a new paragraph. The first line of a paragraph is usually <b>indented</b> — the first word is pushed in a little."},
    {type:"h", text:"8.2 The Topic Sentence"},
    {type:"p", text:"The first sentence of a paragraph is called the <b>topic sentence</b>. It tells the reader what the paragraph is about."},
    {type:"callout", variant:"tip", title:"Example paragraph",
      text:"<b>My village is a wonderful place to live.</b> It is surrounded by green cocoa farms. A cool river flows behind the school. In the evening, the children play football on the field. Everyone knows each other by name."},
    {type:"p", text:"Notice how the first sentence (“My village is a wonderful place to live.”) tells the reader what the rest of the paragraph is about. The other sentences give details."},
    {type:"h", text:"8.3 Writing Your Own Paragraph"},
    {type:"ol", items:[
      "Choose one main idea.",
      "Write a topic sentence that states your idea.",
      "Add three or four sentences that give more detail.",
      "Check that every sentence is about your main idea.",
      "Indent the first line."
    ]},
    {type:"example", label:"Example from Ghana",
      text:"If your topic is <i>my school</i>, your topic sentence might be: “My school is called Ama Basic School.” Then add details: “It has six classrooms and a big field. My teacher's name is Mr. Boateng. We play football every Friday.”"}
  ],
  think:"Why do you think paragraphs have topic sentences? How do they help the reader?",
  try:"Write a paragraph about your favourite food. Start with a topic sentence, then add three more sentences with details.",
  summary:"A paragraph is a group of sentences about one main idea. The topic sentence tells the reader what the paragraph is about. All other sentences must support the topic sentence.",
  exercises:[],
  quiz:[
    {q:"What is a paragraph?", options:{a:"One long sentence",b:"A group of sentences about one idea",c:"A single word",d:"A list"}, correct:"b"},
    {q:"What is a topic sentence?", options:{a:"The last sentence",b:"Any sentence",c:"The first sentence that tells the main idea",d:"A question"}, correct:"c"},
    {q:"What does <i>indent</i> mean?", options:{a:"To underline",b:"To leave space at the start of a paragraph",c:"To write in capital letters",d:"To skip a line"}, correct:"b"},
    {q:"How many main ideas should a paragraph have?", options:{a:"Many",b:"Two",c:"One",d:"None"}, correct:"c"},
    {q:"Which sentence is a good topic sentence for <i>my school</i>?", options:{a:"The cat is sleeping.",b:"My school is called Ama Basic School.",c:"I like rice.",d:"Yesterday it rained."}, correct:"b"},
    {q:"How many sentences usually make up a good paragraph?", options:{a:"Just one",b:"Two or three",c:"Three to five or more",d:"Twenty"}, correct:"c"},
    {q:"All sentences in a paragraph should be about ______.", options:{a:"different topics",b:"the same main idea",c:"the weather",d:"you"}, correct:"b"},
    {q:"The first line of a paragraph is usually ______.", options:{a:"in bold",b:"in capital letters",c:"indented",d:"in colour"}, correct:"c"}
  ]
},

/* ---------------- UNIT 9 ---------------- */
{ id:"u9", number:9, term:3,
  strand:"Oral Language and Communication",
  substrand:"Listening and Speaking",
  code:"B3.1.1.2.1",
  title:"Giving Instructions",
  objectives:[
    "Give clear, simple instructions.",
    "Follow spoken instructions correctly.",
    "Use words like <i>first</i>, <i>next</i> and <i>then</i>."
  ],
  vocab:[
    {term:"Instruction", def:"Words that tell someone what to do."},
    {term:"Sequence", def:"The order in which things happen."},
    {term:"Direction", def:"Information about where to go or what to do."}
  ],
  content:[
    {type:"h", text:"9.1 What Are Instructions?"},
    {type:"p", text:"<b>Instructions</b> are words that tell someone what to do. Giving clear instructions is an important skill. If the instructions are unclear, the person may do the wrong thing."},
    {type:"h", text:"9.2 Order Words"},
    {type:"p", text:"We use special words to show the <b>order</b> of the steps:"},
    {type:"ul", items:[
      "<b>First</b> — the beginning",
      "<b>Next</b> or <b>Then</b> — the middle steps",
      "<b>After that</b> — later steps",
      "<b>Finally</b> — the last step"
    ]},
    {type:"h", text:"9.3 Examples of Instructions"},
    {type:"callout", variant:"tip", title:"How to wash your hands",
      text:"<b>First</b>, turn on the tap. <b>Next</b>, wet your hands. <b>Then</b>, rub soap on your hands for twenty seconds. <b>After that</b>, rinse off the soap. <b>Finally</b>, turn off the tap and dry your hands with a clean towel."},
    {type:"callout", variant:"tip", title:"How to find the library",
      text:"<b>First</b>, walk out of the classroom. <b>Next</b>, turn right and walk past the assembly hall. <b>Then</b>, cross the courtyard. <b>Finally</b>, the library is the blue building on your left."},
    {type:"example", label:"Example from Ghana",
      text:"When a farmer plants maize, he follows instructions: <i>First</i>, clear the land. <i>Next</i>, dig small holes. <i>Then</i>, drop two seeds in each hole. <i>Finally</i>, cover the seeds with soil and water them."}
  ],
  think:"Why is it important to give instructions in the right order? What could go wrong if the order is wrong?",
  try:"Give your friend instructions on how to draw a simple house. Use words like <i>first</i>, <i>next</i> and <i>finally</i>.",
  summary:"Instructions tell someone what to do. We use order words — first, next, then, finally — to make instructions clear and easy to follow.",
  exercises:[],
  quiz:[
    {q:"What are instructions?", options:{a:"Words that tell a story",b:"Words that tell someone what to do",c:"Words that ask questions",d:"Words that describe things"}, correct:"b"},
    {q:"Which word shows the first step?", options:{a:"Finally",b:"Next",c:"First",d:"After"}, correct:"c"},
    {q:"Which word shows the last step?", options:{a:"First",b:"Next",c:"Then",d:"Finally"}, correct:"d"},
    {q:"Why do we use order words?", options:{a:"To make sentences shorter",b:"To show the order of steps",c:"To add colour",d:"To make noise"}, correct:"b"},
    {q:"What comes after <i>first</i> in a set of instructions?", options:{a:"Last",b:"Next",c:"End",d:"Stop"}, correct:"b"},
    {q:"Which of these is a good instruction?", options:{a:"Do it.",b:"First, wash your hands with soap.",c:"Maybe...",d:"If you want."}, correct:"b"},
    {q:"What could happen if instructions are unclear?", options:{a:"Nothing",b:"The person may do the wrong thing",c:"The person will stop",d:"The person will be happy"}, correct:"b"},
    {q:"In the hand-washing example, what comes after <i>after that</i>?", options:{a:"First",b:"Next",c:"Finally",d:"Then"}, correct:"c"}
  ]
},

/* ---------------- UNIT 10 ---------------- */
{ id:"u10", number:10, term:3,
  strand:"Reading", substrand:"Fluency",
  code:"B3.2.1.5.1",
  title:"Poems and Rhymes",
  objectives:[
    "Read a poem aloud with rhythm.",
    "Identify rhyming words in a poem.",
    "Say a short poem from memory."
  ],
  vocab:[
    {term:"Poem", def:"A piece of writing with rhythm and feeling."},
    {term:"Rhyme", def:"Words that end with the same sound."},
    {term:"Rhythm", def:"The beat or flow of a poem."},
    {term:"Stanza", def:"A group of lines in a poem."}
  ],
  content:[
    {type:"h", text:"10.1 What Is a Poem?"},
    {type:"p", text:"A <b>poem</b> is a special kind of writing. Poems have <b>rhythm</b> (a beat) and often have <b>rhymes</b> — words that end with the same sound. Poems are grouped in <b>stanzas</b>, like paragraphs in a story."},
    {type:"h", text:"10.2 Read This Poem"},
    {type:"callout", variant:"note", title:"The Rain",
      text:"The rain comes down on Ghana's land,<br>It falls on every roof and sand.<br>It fills the river, cools the air,<br>And waters plants and trees with care.<br><br>The children dance and laugh and play,<br>They splash in puddles all the day.<br>The farmers smile and raise their voice,<br>For rain has made the land rejoice."},

      "<b>¾</b> — three quarters (3 of 4 equal parts)"
    ]},
    {type:"h", text:"5.2 Naming Fractions"},
    {type:"callout", variant:"tip", title:"The two parts of a fraction",
      text:"<b>1</b> ← numerator (how many parts we take)<br>———<br><b>4</b> ← denominator (how many equal parts in the whole)"},
    {type:"h", text:"5.3 Finding Fractions of Amounts"},
    {type:"p", text:"To find a half of a number, divide by 2. To find a quarter, divide by 4."},
    {type:"ul", items:[
      "½ of 8 = 8 ÷ 2 = <b>4</b>",
      "¼ of 12 = 12 ÷ 4 = <b>3</b>",
      "⅓ of 9 = 9 ÷ 3 = <b>3</b>"
    ]},
    {type:"h", text:"5.4 Comparing Fractions"},
    {type:"p", text:"The bigger the denominator, the smaller the piece. So ½ &gt; ¼ because half of a cake is more than a quarter."},
    {type:"example", label:"Example from Ghana",
      text:"A mother divides a watermelon into 8 equal slices. She gives 2 slices to Kofi. Kofi has <b>²⁄₈</b> (two-eighths) of the watermelon, which is the same as <b>¼</b>."}
  ],
  think:"Would you rather have ½ of a small cake or ¼ of a big cake? Does the size of the cake matter? Explain.",
  try:"Fold a piece of paper in half, then in half again. Open it out. How many equal parts do you have? What fraction is each part?",
  summary:"A fraction is a part of a whole divided into equal parts. Common fractions are halves, thirds and quarters. To find a fraction of an amount, divide by the denominator.",
  exercises:[],
  quiz:[
    {q:"What is ½ of 10?", options:{a:"3",b:"4",c:"5",d:"10"}, correct:"c"},
    {q:"What is ¼ of 16?", options:{a:"2",b:"4",c:"6",d:"8"}, correct:"b"},
    {q:"What is ⅓ of 12?", options:{a:"3",b:"4",c:"6",d:"9"}, correct:"b"},
    {q:"If you cut a cake into 4 equal pieces and eat 3, what fraction did you eat?", options:{a:"⅓",b:"½",c:"¼",d:"¾"}, correct:"d"},
    {q:"Which fraction is larger?", options:{a:"½",b:"¼",c:"They are equal",d:"Cannot tell"}, correct:"a"},
    {q:"In the fraction ⅔, what is the denominator?", options:{a:"2",b:"3",c:"5",d:"1"}, correct:"b"},
    {q:"What is ½ of 20?", options:{a:"5",b:"10",c:"15",d:"20"}, correct:"b"},
    {q:"A mother cuts an orange into 8 slices. Ama eats 4. What fraction did she eat?", options:{a:"¼",b:"⅓",c:"½",d:"⅛"}, correct:"c"}
  ]
},

{ id:"u6", number:6, term:2,

  substrand:"Money",

  title:"Money — Cedis and Pesewas",

    "Identify Ghanaian coins and notes.",
    "Add and subtract amounts of money.",
    "Calculate change from a purchase."
  ],
  vocab:[
    {term:"Cedi", def:"The main unit of Ghanaian money."},
    {term:"Pesewa", def:"The smaller unit of Ghanaian money."},
    {term:"Change", def:"Money returned after paying more than the price."},
    {term:"Price", def:"How much something costs."}
  ],
  content:[
    {type:"h", text:"6.1 Ghanaian Money"},
    {type:"p", text:"The money of Ghana is the <b>cedi (GH₵)</b>. It is divided into 100 <b>pesewas (Gp)</b>. So:"},
    {type:"ul", items:[
      "GH₵1 = 100 pesewas",
      "GH₵5 = 500 pesewas",
      "GH₵10 = 1000 pesewas"
    ]},
    {type:"p", text:"Ghana uses coins (1p, 5p, 10p, 20p, 50p, GH₵1, GH₵2) and notes (GH₵1, GH₵2, GH₵5, GH₵10, GH₵20, GH₵50, GH₵100, GH₵200)."},
    {type:"h", text:"6.2 Adding Money"},
    {type:"callout", variant:"tip", title:"Example",
      text:"Akosua buys a pencil for <b>GH₵2.50</b> and a book for <b>GH₵5.00</b>.<br>Total: GH₵2.50 + GH₵5.00 = <b>GH₵7.50</b>."},
    {type:"h", text:"6.3 Calculating Change"},
    {type:"p", text:"When you pay more than the price, the seller gives you <b>change</b>."},
    {type:"callout", variant:"tip", title:"Example",
      text:"Kofi buys bread for <b>GH₵4.00</b> and pays with a <b>GH₵10</b> note.<br>Change = GH₵10.00 − GH₵4.00 = <b>GH₵6.00</b>."},
    {type:"example", label:"Example from Ghana",
      text:"At a market in Accra, a bowl of gari costs GH₵3.50 and a tin of sardines costs GH₵8.00. If you buy both and pay with GH₵20, your change is GH₵20.00 − GH₵11.50 = <b>GH₵8.50</b>."}
  ],
  think:"Why does the price of the same item sometimes differ from one market to another?",
  try:"Ask an adult to help you make a shopping list of three items with their prices. Add them up. Work out the change from GH₵50.",
  summary:"Ghana uses the cedi and pesewa. GH₵1 = 100 pesewas. We add and subtract money to find totals and change. Always check your change carefully.",
  exercises:[],
  quiz:[
    {q:"How many pesewas are in GH₵1?", options:{a:"10",b:"50",c:"100",d:"1000"}, correct:"c"},
    {q:"What is GH₵2.50 + GH₵3.50?", options:{a:"GH₵5.00",b:"GH₵6.00",c:"GH₵5.50",d:"GH₵6.50"}, correct:"b"},
    {q:"An item costs GH₵7.00. You pay GH₵10.00. What is the change?", options:{a:"GH₵2.00",b:"GH₵3.00",c:"GH₵4.00",d:"GH₵17.00"}, correct:"b"},
    {q:"What is GH₵15.00 − GH₵8.50?", options:{a:"GH₵6.50",b:"GH₵7.50",c:"GH₵6.00",d:"GH₵7.00"}, correct:"a"},
    {q:"Which of these is the money of Ghana?", options:{a:"Naira",b:"Cedi",c:"Dollar",d:"Shilling"}, correct:"b"},
    {q:"What is GH₵4.00 + GH₵3.75 + GH₵2.25?", options:{a:"GH₵9.00",b:"GH₵10.00",c:"GH₵10.50",d:"GH₵11.00"}, correct:"b"},
    {q:"A bottle of water costs GH₵1.50. How much for 4 bottles?", options:{a:"GH₵4.50",b:"GH₵5.00",c:"GH₵6.00",d:"GH₵6.50"}, correct:"c"},
    {q:"You buy a book for GH₵12.50 and pay GH₵20. Change?", options:{a:"GH₵7.00",b:"GH₵7.50",c:"GH₵8.00",d:"GH₵8.50"}, correct:"b"}
  ]
},

{ id:"u7", number:7, term:2,
  strand:"Geometry and Measurement",
  substrand:"Length",
  code:"B3.1.5.1.1",
  title:"Measuring Length",
  objectives:[
    "Estimate and measure length using centimetres and metres.",
    "Convert between metres and centimetres.",
    "Choose the right unit for measuring different things."
  ],
  vocab:[
    {term:"Length", def:"How long something is from end to end."},
    {term:"Centimetre (cm)", def:"A small unit of length."},
    {term:"Metre (m)", def:"A larger unit of length — 100 centimetres."},
    {term:"Estimate", def:"To make a careful guess."},
    {term:"Ruler", def:"A tool for measuring length."}
  ],
  content:[
    {type:"h", text:"7.1 Units of Length"},
    {type:"p", text:"We use different units to measure different lengths."},
    {type:"ul", items:[
      "<b>Millimetre (mm)</b> — for very small things, like the thickness of a coin.",
      "<b>Centimetre (cm)</b> — for small things, like a pencil or a book.",
      "<b>Metre (m)</b> — for bigger things, like a room or a football field.",
      "<b>Kilometre (km)</b> — for long distances between towns."
    ]},
    {type:"h", text:"7.2 Converting Units"},
    {type:"callout", variant:"tip", title:"Remember",
      text:"<b>1 metre = 100 centimetres</b><br><b>1 kilometre = 1000 metres</b>"},
    {type:"ul", items:[
      "2 m = 2 × 100 = 200 cm",
      "350 cm = 350 ÷ 100 = 3.5 m (3 metres 50 centimetres)",
      "5 m 40 cm = 500 + 40 = 540 cm"
    ]},
    {type:"h", text:"7.3 Estimating Length"},
    {type:"p", text:"Before measuring, we can <b>estimate</b> — make a careful guess. Then we measure to see how close we were."},
    {type:"table", headers:["Object","Best unit"],
      rows:[
        ["A pencil","cm"],
        ["A classroom","m"],
        ["A football pitch","m"],
        ["Distance from Accra to Kumasi","km"],
        ["A grain of rice","mm"]
      ], caption:"Choosing the right unit."},
    {type:"example", label:"Example from Ghana",
      text:"A pupil's desk is about <b>60 cm</b> wide. The classroom door is about <b>2 m</b> high. The distance from Accra to Cape Coast is about <b>145 km</b>."}
  ],
  think:"Why do we need different units for different things? What would it be like to measure the distance to Kumasi in centimetres?",
  try:"Use a ruler to measure the length of five objects in your home. Write each measurement in centimetres.",
  summary:"Length is measured in mm, cm, m and km. 1 metre = 100 centimetres. We choose the right unit depending on the size of the object being measured.",
  exercises:[],
  quiz:[
    {q:"How many centimetres are in 1 metre?", options:{a:"10",b:"50",c:"100",d:"1000"}, correct:"c"},
    {q:"Which unit would you use to measure a pencil?", options:{a:"Kilometre",b:"Metre",c:"Centimetre",d:"Kilogram"}, correct:"c"},
    {q:"Which unit would you use for distance between two towns?", options:{a:"Centimetre",b:"Kilometre",c:"Millimetre",d:"Gram"}, correct:"b"},
    {q:"How many centimetres are in 3 metres?", options:{a:"30",b:"100",c:"300",d:"3000"}, correct:"c"},
    {q:"What is 250 cm in metres?", options:{a:"2.5 m",b:"25 m",c:"0.25 m",d:"250 m"}, correct:"a"},
    {q:"Which unit is best for the thickness of a coin?", options:{a:"Kilometre",b:"Metre",c:"Centimetre",d:"Millimetre"}, correct:"d"},
    {q:"What is 5 m 20 cm in centimetres?", options:{a:"520 cm",b:"5020 cm",c:"52 cm",d:"5200 cm"}, correct:"a"},
    {q:"What does <i>estimate</i> mean?", options:{a:"To measure exactly",b:"To make a careful guess",c:"To write a number",d:"To count"}, correct:"b"}
  ]
},

      "When the long hand points to <b>12</b>, we read the hour exactly — <i>3 o'clock</i>.",
      "When the long hand points to <b>6</b>, we read <i>half past</i> — <i>half past 3</i>.",
      "When the long hand points to <b>3</b>, we read <i>quarter past</i>.",
      "When the long hand points to <b>9</b>, we read <i>quarter to</i>."

    {type:"h", text:"8.2 Days and Months"},
    {type:"p", text:"A week has 7 days. A month has 28, 29, 30 or 31 days. A year has 12 months."},

        ["Monday"],
        ["Tuesday"],
        ["Wednesday"],
        ["Thursday"],
        ["Friday"],
        ["Saturday"],
        ["Sunday"]
      ], caption:"Days of the week."},
    {type:"table", headers:["Months of the year (in order)"],
      rows:[
        ["January, February, March, April"],

    {q:"How many minutes are in an hour?", options:{a:"30",b:"45",c:"60",d:"100"}, correct:"c"},

    {type:"callout", variant:"tip", title:"Remember",

    {q:"Which unit measures mass?", options:{a:"Litre",b:"Kilogram",c:"Metre",d:"Hour"}, correct:"b"},

  code:"B4.2.1.2.1",
  title:"The Water Cycle in Depth",
  objectives:[
    "Explain the processes in the water cycle.",
    "Describe how human activity affects the water cycle.",
    "Describe ways to protect our water sources."
  ],
  vocab:[
    {term:"Transpiration", def:"Water vapour given off by plant leaves."},
    {term:"Runoff", def:"Water that flows over the land into rivers."},
    {term:"Groundwater", def:"Water stored under the ground."},
    {term:"Aquifer", def:"A layer of rock that stores groundwater."},
    {term:"Deforestation", def:"Cutting down large numbers of trees."}
  ],
  content:[
    {type:"h", text:"6.1 The Water Cycle in Detail"},
    {type:"p", text:"The <b>water cycle</b> is the continuous movement of water between the earth and the sky. In Basic 3 you learned four stages. Now we add two more:"},
    {type:"ol", items:[
      "<b>Evaporation</b> — the sun heats water in rivers, lakes and the sea, turning it into vapour.",
      "<b>Transpiration</b> — plants give off water vapour through their leaves.",
      "<b>Condensation</b> — vapour rises, cools and forms clouds.",
      "<b>Precipitation</b> — the water falls as rain.",
      "<b>Runoff</b> — water flows over the land into rivers.",
      "<b>Infiltration / Groundwater</b> — some water soaks into the ground and is stored in aquifers."
    ]},
    {type:"img", src:"img/g4s-u6-fig1.png",
      alt:"The water cycle diagram showing evaporation, transpiration, condensation, precipitation, runoff and groundwater",
      caption:"Figure 6.1: The complete water cycle."},
    {type:"h", text:"6.2 How Humans Affect the Water Cycle"},
    {type:"ul", items:[
      "<b>Deforestation</b> reduces transpiration and causes more runoff and erosion.",
      "<b>Pollution</b> makes the water unsafe for drinking.",
      "<b>Galamsey</b> disturbs riverbeds and muddies the water.",
      "<b>Building on land</b> stops water from soaking into the ground."
    ]},
    {type:"h", text:"6.3 Protecting Our Water Sources"},
    {type:"ul", items:[
      "Plant trees along riverbanks.",
      "Do not dump waste in rivers.",
      "Use water wisely — close taps when not in use.",
      "Support community efforts to stop galamsey.",
      "Harvest rainwater for gardens."
    ]},
    {type:"example", label:"Example from Ghana",
      text:"The Volta River Authority manages the water of Lake Volta carefully so that the Akosombo Dam can keep producing electricity. If the lake level drops too low, power supply is affected — showing how important the water cycle is to our lives."}
  ],
  think:"If all the trees around a river were cut down, what would happen to the river during the rainy season? Why?",
  try:"Draw the water cycle with all six stages. Label each stage and write one sentence about it.",
  summary:"The water cycle moves water through evaporation, transpiration, condensation, precipitation, runoff and infiltration. Human activity can damage the cycle. We must protect our water sources.",
  exercises:[],
  quiz:[
    {q:"What is transpiration?", options:{a:"Water flowing over land",b:"Water vapour given off by plants",c:"Water freezing",d:"Water boiling"}, correct:"b"},
    {q:"What is groundwater?", options:{a:"Water in the sky",b:"Water stored under the ground",c:"Water in a bottle",d:"Water in the sea"}, correct:"b"},
    {q:"What is an aquifer?", options:{a:"A type of cloud",b:"A layer of rock that stores groundwater",c:"A rain gauge",d:"A kind of tree"}, correct:"b"},
    {q:"Which process follows condensation?", options:{a:"Evaporation",b:"Precipitation",c:"Transpiration",d:"Infiltration"}, correct:"b"},
    {q:"How does deforestation affect the water cycle?", options:{a:"It increases rain",b:"It reduces transpiration and increases runoff",c:"It stops evaporation",d:"It has no effect"}, correct:"b"},
    {q:"What is runoff?", options:{a:"Water in clouds",b:"Water flowing over land into rivers",c:"Water in taps",d:"Rain from clouds"}, correct:"b"},
    {q:"Which of these protects water sources?", options:{a:"Dumping waste in rivers",b:"Planting trees along riverbanks",c:"Building on riverbanks",d:"Galamsey"}, correct:"b"},
    {q:"Why is the water cycle important to the Akosombo Dam?", options:{a:"It makes the dam beautiful",b:"It refills Lake Volta so the dam can produce electricity",c:"It stops flooding",d:"It makes fish"}, correct:"b"}
  ]
},

/* ---------------- UNIT 7 ---------------- */
{ id:"u7", number:7, term:2,
  strand:"Cycles", substrand:"Life Cycles of Organisms",
  code:"B4.2.2.1.1",
  title:"Life Cycles of Animals",
  objectives:[
    "Describe the life cycle of insects such as butterflies and mosquitoes.",
    "Compare complete and incomplete metamorphosis.",
    "Explain why understanding life cycles helps us control pests."
  ],
  vocab:[
    {term:"Metamorphosis", def:"A change in form during an animal's life cycle."},
    {term:"Larva", def:"The young form of an insect after hatching."},
    {term:"Pupa", def:"The resting stage between larva and adult."},
    {term:"Complete metamorphosis", def:"Four stages: egg, larva, pupa, adult."},
    {term:"Incomplete metamorphosis", def:"Three stages: egg, nymph, adult."}
  ],
  content:[
    {type:"h", text:"7.1 Complete Metamorphosis"},
    {type:"p", text:"Some insects go through <b>four</b> stages as they grow. This is called <b>complete metamorphosis</b>:"},
    {type:"ol", items:[
      "<b>Egg</b> — laid by the adult.",
      "<b>Larva</b> — hatches from the egg; looks completely different from the adult (like a caterpillar).",
      "<b>Pupa</b> — the resting stage; the larva changes into an adult inside a case.",
      "<b>Adult</b> — the fully grown insect, able to reproduce."
    ]},
    {type:"img", src:"img/g4s-u7-fig1.png",
      alt:"Butterfly life cycle: egg, caterpillar, pupa, adult butterfly",
      caption:"Figure 7.1: Complete metamorphosis — the butterfly."},
    {type:"h", text:"7.2 Incomplete Metamorphosis"},
    {type:"p", text:"Other insects go through only <b>three</b> stages. There is no pupa stage. This is called <b>incomplete metamorphosis</b>:"},
    {type:"ol", items:[
      "<b>Egg</b>",
      "<b>Nymph</b> — looks like a small version of the adult.",
      "<b>Adult</b> — fully grown."
    ]},
    {type:"p", text:"Examples of insects with incomplete metamorphosis: grasshoppers, cockroaches and termites."},
    {type:"h", text:"7.3 Why This Matters"},
    {type:"p", text:"Understanding life cycles helps farmers and health workers <b>control pests</b>. For example, mosquitoes lay eggs in standing water. If communities remove standing water, the mosquito life cycle is broken and malaria is reduced."},
    {type:"table", headers:["Insect","Type of metamorphosis"],
      rows:[
        ["Butterfly","Complete (4 stages)"],
        ["Mosquito","Complete (4 stages)"],
        ["Housefly","Complete (4 stages)"],
        ["Grasshopper","Incomplete (3 stages)"],
        ["Cockroach","Incomplete (3 stages)"]
      ], caption:"Insects and their life cycles."},
    {type:"example", label:"Example from Ghana",
      text:"Malaria is one of Ghana's biggest health problems. The female <i>Anopheles</i> mosquito lays eggs in standing water. By draining puddles and covering water containers, communities break the life cycle and reduce malaria."}
  ],
  think:"Why do you think the pupa stage is important for the butterfly? What would happen if the butterfly skipped it?",
  try:"Find a caterpillar on a leaf. Put it in a jar with fresh leaves. Watch it every day for two weeks. Record what you see in a notebook.",
  summary:"Some insects go through complete metamorphosis (egg, larva, pupa, adult). Others go through incomplete metamorphosis (egg, nymph, adult). Understanding life cycles helps us control pests and disease.",
  exercises:[],
  quiz:[
    {q:"What is metamorphosis?", options:{a:"A kind of food",b:"A change in form during life",c:"A weather event",d:"A type of rock"}, correct:"b"},
    {q:"How many stages are in complete metamorphosis?", options:{a:"Two",b:"Three",c:"Four",d:"Five"}, correct:"c"},
    {q:"Which stage comes after the larva in complete metamorphosis?", options:{a:"Egg",b:"Pupa",c:"Adult",d:"Nymph"}, correct:"b"},
    {q:"How many stages are in incomplete metamorphosis?", options:{a:"Two",b:"Three",c:"Four",d:"Five"}, correct:"b"},
    {q:"Which insect has incomplete metamorphosis?", options:{a:"Butterfly",b:"Mosquito",c:"Grasshopper",d:"Housefly"}, correct:"c"},
    {q:"What is a nymph?", options:{a:"An adult insect",b:"A young insect that looks like the adult",c:"A butterfly",d:"An egg"}, correct:"b"},
    {q:"How can we reduce malaria by understanding the mosquito life cycle?", options:{a:"Plant more trees",b:"Remove standing water",c:"Use more electricity",d:"Feed the mosquitoes"}, correct:"b"},
    {q:"What stage is the resting stage in complete metamorphosis?", options:{a:"Egg",b:"Larva",c:"Pupa",d:"Adult"}, correct:"c"}
  ]
},

/* ---------------- UNIT 8 ---------------- */
{ id:"u8", number:8, term:2,
  strand:"Systems", substrand:"The Human Body Systems",
  code:"B4.3.1.1.1",
  title:"The Skeletal System",
  objectives:[
    "Identify the main bones of the human skeleton.",
    "Explain the functions of the skeleton.",
    "List ways of keeping bones healthy."
  ],
  vocab:[
    {term:"Skeleton", def:"The framework of bones in the body."},
    {term:"Bone", def:"A hard, strong part of the skeleton."},
    {term:"Joint", def:"Where two bones meet."},
    {term:"Skull", def:"The bones of the head that protect the brain."},
    {term:"Ribcage", def:"The bones that protect the heart and lungs."}
  ],
  content:[
    {type:"h", text:"8.1 What is the Skeleton?"},
    {type:"p", text:"The <b>skeleton</b> is the framework of bones that gives our body its shape. An adult human has about 206 bones. A baby is born with about 300 bones — some join together as we grow."},
    {type:"img", src:"img/g4s-u8-fig1.png",
      alt:"The human skeleton with labelled skull, ribcage, spine, arms and legs",
      caption:"Figure 8.1: The human skeleton."},
    {type:"h", text:"8.2 Main Bones of the Body"},
    {type:"ul", items:[
      "<b>Skull</b> — protects the brain.",
      "<b>Ribcage</b> — protects the heart and lungs.",
      "<b>Spine (backbone)</b> — supports the body and protects the spinal cord.",
      "<b>Pelvis</b> — supports the lower body.",
      "<b>Humerus</b> — the upper arm bone.",
      "<b>Femur</b> — the thigh bone; the longest bone in the body.",
      "<b>Patella</b> — the kneecap."
    ]},
    {type:"h", text:"8.3 Functions of the Skeleton"},
    {type:"ul", items:[
      "<b>Support</b> — holds the body up and gives it shape.",
      "<b>Protection</b> — protects vital organs like the brain, heart and lungs.",
      "<b>Movement</b> — works with muscles to help us move.",
      "<b>Blood cell production</b> — bone marrow makes blood cells.",
      "<b>Storage</b> — stores minerals like calcium."
    ]},
    {type:"h", text:"8.4 Joints"},
    {type:"p", text:"A <b>joint</b> is where two bones meet. Some joints move a lot, like the shoulder. Others move only a little, like the bones of the skull."},
    {type:"h", text:"8.5 Keeping Bones Healthy"},
    {type:"ul", items:[
      "Eat foods rich in calcium — milk, cheese, small fish with bones.",
      "Get vitamin D from sunlight.",
      "Exercise regularly.",
      "Avoid heavy smoking and alcohol.",
      "Wear protective gear when playing sports."
    ]},
    {type:"example", label:"Example from Ghana",
      text:"Small dried fish like <i>koobi</i> and <i>momoni</i> are excellent sources of calcium. Eating them with meals helps growing children build strong bones."}
  ],
  think:"Why is the femur (thigh bone) the longest and strongest bone in the body? What does it have to support?",
  try:"Gently feel the bones in your arm and leg. Point to where your joints are. Try bending at each joint and describe the movement.",
  summary:"The skeleton supports the body, protects organs and helps us move. The main bones include the skull, ribcage, spine, pelvis, humerus and femur. Joints are where bones meet.",
  exercises:[],
  quiz:[
    {q:"Which bone protects the brain?", options:{a:"Ribcage",b:"Skull",c:"Femur",d:"Spine"}, correct:"b"},
    {q:"Which bone protects the heart and lungs?", options:{a:"Skull",b:"Pelvis",c:"Ribcage",d:"Femur"}, correct:"c"},
    {q:"What is the longest bone in the body?", options:{a:"Humerus",b:"Femur",c:"Skull",d:"Pelvis"}, correct:"b"},
    {q:"What is a joint?", options:{a:"A muscle",b:"Where two bones meet",c:"A type of bone",d:"A nerve"}, correct:"b"},
    {q:"About how many bones does an adult have?", options:{a:"106",b:"206",c:"306",d:"406"}, correct:"b"},
    {q:"Which of these is NOT a function of the skeleton?", options:{a:"Support",b:"Protection",c:"Digestion",d:"Blood cell production"}, correct:"c"},
    {q:"Which food helps build strong bones?", options:{a:"Sweets",b:"Dried fish",c:"Sugar cane",d:"Fizzy drinks"}, correct:"b"},
    {q:"Which bone supports the lower body?", options:{a:"Skull",b:"Ribcage",c:"Pelvis",d:"Humerus"}, correct:"c"}
  ]
},

/* ---------------- UNIT 9 ---------------- */
{ id:"u9", number:9, term:2,
  strand:"Systems", substrand:"The Solar System",
  code:"B4.3.2.1.1",
  title:"The Planets of Our Solar System",
  objectives:[
    "Name the eight planets in order from the sun.",
    "Distinguish between inner and outer planets.",
    "Describe key features of each planet."
  ],
  vocab:[
    {term:"Solar system", def:"The sun and everything that orbits it."},
    {term:"Planet", def:"A large body that orbits a star."},
    {term:"Inner planet", def:"A planet close to the sun, made mostly of rock."},
    {term:"Outer planet", def:"A planet far from the sun, made mostly of gas."},
    {term:"Asteroid", def:"A small rocky object that orbits the sun."}
  ],
  content:[
    {type:"h", text:"9.1 Our Solar System"},
    {type:"p", text:"The <b>solar system</b> is made of the sun and everything that orbits it — eight planets, moons, asteroids and comets. The sun is at the centre and contains over 99% of all the mass in the solar system."},
    {type:"img", src:"img/g4s-u9-fig1.png",
      alt:"The eight planets of the solar system in order from the sun",
      caption:"Figure 9.1: The eight planets in order from the sun."},
    {type:"h", text:"9.2 The Eight Planets"},
    {type:"p", text:"A helpful way to remember the planets in order is: <b>M</b>y <b>V</b>ery <b>E</b>ducated <b>M</b>other <b>J</b>ust <b>S</b>erved <b>U</b>s <b>N</b>oodles."},
    {type:"table", headers:["#","Planet","Special feature"],
      rows:[
        ["1","Mercury","Smallest planet; closest to the sun"],
        ["2","Venus","Hottest planet"],
        ["3","Earth","Only planet known to have life"],
        ["4","Mars","The red planet"],
        ["5","Jupiter","Largest planet"],
        ["6","Saturn","Famous for its rings"],
        ["7","Uranus","Tilted on its side"],
        ["8","Neptune","Farthest from the sun; very cold"]
      ], caption:"The eight planets in order."},
    {type:"h", text:"9.3 Inner and Outer Planets"},
    {type:"ul", items:[
      "<b>Inner planets</b> (Mercury, Venus, Earth, Mars) — small, rocky, close to the sun.",
      "<b>Outer planets</b> (Jupiter, Saturn, Uranus, Neptune) — large, made of gas, far from the sun."
    ]},
    {type:"h", text:"9.4 The Asteroid Belt"},
    {type:"p", text:"Between Mars and Jupiter is the <b>asteroid belt</b> — a ring of thousands of rocky objects. These are leftovers from the formation of the solar system."},
    {type:"example", label:"Example from Ghana",
      text:"The best time to see planets from Ghana is on a clear harmattan night. Venus can often be seen in the early evening as the 'Evening Star', and Jupiter appears as a bright dot in the sky."}
  ],
  think:"Why do you think the outer planets are made of gas while the inner planets are made of rock? What does distance from the sun have to do with it?",
  try:"Draw the solar system on a large sheet of paper. Place the sun on the left and draw the planets in order, getting bigger for the outer planets.",
  summary:"Our solar system has eight planets orbiting the sun. The inner four are rocky; the outer four are gas giants. The asteroid belt sits between Mars and Jupiter.",
  exercises:[],
  quiz:[
    {q:"How many planets are in our solar system?", options:{a:"Seven",b:"Eight",c:"Nine",d:"Ten"}, correct:"b"},
    {q:"Which planet is closest to the sun?", options:{a:"Venus",b:"Mercury",c:"Earth",d:"Mars"}, correct:"b"},
    {q:"Which is the largest planet?", options:{a:"Earth",b:"Saturn",c:"Jupiter",d:"Neptune"}, correct:"c"},
    {q:"Which planet is famous for its rings?", options:{a:"Jupiter",b:"Mars",c:"Saturn",d:"Venus"}, correct:"c"},
    {q:"Which planet is called the Red Planet?", options:{a:"Venus",b:"Mars",c:"Mercury",d:"Uranus"}, correct:"b"},
    {q:"Which of these is an inner planet?", options:{a:"Jupiter",b:"Saturn",c:"Earth",d:"Neptune"}, correct:"c"},
    {q:"What is between Mars and Jupiter?", options:{a:"The moon",b:"The asteroid belt",c:"The sun",d:"The Milky Way"}, correct:"b"},
    {q:"Which planet is farthest from the sun?", options:{a:"Saturn",b:"Uranus",c:"Neptune",d:"Jupiter"}, correct:"c"}
  ]
},

/* ---------------- UNIT 10 ---------------- */
{ id:"u10", number:10, term:2,
  strand:"Systems", substrand:"Ecosystems",
  code:"B4.3.3.1.1",
  title:"Food Chains and Food Webs",
  objectives:[
    "Explain what a food chain is.",
    "Identify producers, consumers and decomposers.",
    "Draw and interpret a simple food web."
  ],
  vocab:[
    {term:"Producer", def:"A living thing that makes its own food (plants)."},
    {term:"Consumer", def:"A living thing that eats other living things."},
    {term:"Decomposer", def:"A living thing that breaks down dead matter."},
    {term:"Food chain", def:"The path of energy from one living thing to another."},
    {term:"Food web", def:"Many food chains joined together."}
  ],
  content:[
    {type:"h", text:"10.1 Producers"},
    {type:"p", text:"<b>Producers</b> are living things that make their own food using sunlight. Green plants, algae and some bacteria are producers. They are always at the start of every food chain."},
    {type:"h", text:"10.2 Consumers"},
    {type:"p", text:"<b>Consumers</b> eat other living things. There are three types:"},
    {type:"ul", items:[
      "<b>Primary consumers</b> (herbivores) — eat plants. Example: goat, grasshopper.",
      "<b>Secondary consumers</b> (carnivores or omnivores) — eat primary consumers. Example: lizard, bird.",
      "<b>Tertiary consumers</b> — eat secondary consumers. Example: hawk, snake."
    ]},
    {type:"h", text:"10.3 Decomposers"},
    {type:"p", text:"<b>Decomposers</b> break down dead plants and animals and return nutrients to the soil. Examples: bacteria, fungi, earthworms, termites."},
    {type:"h", text:"10.4 Food Chains"},
    {type:"p", text:"A <b>food chain</b> shows the path of energy from one living thing to another. The arrow means 'is eaten by'."},
    {type:"callout", variant:"tip", title:"Example food chain",
      text:"<b>Maize plant → Grasshopper → Lizard → Hawk</b><br>The maize is eaten by the grasshopper, the grasshopper is eaten by the lizard, and the lizard is eaten by the hawk."},
    {type:"h", text:"10.5 Food Webs"},
    {type:"p", text:"In nature, living things eat more than one kind of food. When we join several food chains together, we get a <b>food web</b>. A food web is more realistic than a single food chain."},
    {type:"example", label:"Example from Ghana",
      text:"On a cocoa farm: cocoa leaves are eaten by caterpillars. Caterpillars are eaten by birds. Birds are eaten by hawks. When the cocoa pods fall, fungi and bacteria break them down and return nutrients to the soil — which feeds the cocoa tree again."}
  ],
  think:"What would happen to the food chain if all the grasshoppers in a field died? How would this affect the lizards and the hawks?",
  try:"Draw a food chain with at least four living things found in your community. Label each as producer or consumer.",
  summary:"Food chains show the flow of energy from producers to consumers to decomposers. Producers are plants. Consumers eat other living things. Decomposers break down dead matter. Food webs are many food chains joined together.",
  exercises:[],
  quiz:[
    {q:"Which of these is a producer?", options:{a:"Goat",b:"Grass",c:"Lizard",d:"Hawk"}, correct:"b"},
    {q:"What does a food chain show?", options:{a:"Where animals live",b:"The path of energy from one living thing to another",c:"The weather",d:"How tall plants grow"}, correct:"b"},
    {q:"What is a decomposer?", options:{a:"A plant that makes food",b:"An animal that eats meat",c:"A living thing that breaks down dead matter",d:"A type of rock"}, correct:"c"},
    {q:"In a food chain, what does the arrow mean?", options:{a:"Is bigger than",b:"Is eaten by",c:"Lives near",d:"Looks like"}, correct:"b"},
    {q:"Which is an example of a primary consumer?", options:{a:"Maize",b:"Grasshopper",c:"Hawk",d:"Fungi"}, correct:"b"},
    {q:"What is a food web?", options:{a:"A spider web",b:"Many food chains joined together",c:"A single food chain",c:"A kind of plant"}, correct:"b"},
    {q:"Which of these is a decomposer?", options:{a:"Goat",b:"Earthworm",c:"Hawk",d:"Maize"}, correct:"b"},
    {q:"In the chain <i>Maize → Grasshopper → Lizard → Hawk</i>, which is the secondary consumer?", options:{a:"Maize",b:"Grasshopper",c:"Lizard",d:"Hawk"}, correct:"c"}
  ]
},

/* ---------------- UNIT 11 ---------------- */
{ id:"u11", number:11, term:3,
  strand:"Forces and Energy", substrand:"Sources and Forms of Energy",
  code:"B4.4.1.1.1",
  title:"Energy Transformation",
  objectives:[
    "Explain that energy can change from one form to another.",
    "Give examples of energy transformation in daily life.",
    "Recognise that energy is conserved — it is never destroyed."
  ],
  vocab:[
    {term:"Energy transformation", def:"Changing energy from one form to another."},
    {term:"Conservation of energy", def:"Energy cannot be created or destroyed, only changed."},
    {term:"Electrical energy", def:"Energy carried by electric current."},
    {term:"Chemical energy", def:"Energy stored in food and fuel."},
    {term:"Mechanical energy", def:"Energy of movement or position."}
  ],
  content:[
    {type:"h", text:"11.1 Energy Can Change Form"},
    {type:"p", text:"Energy is never created or destroyed. It only <b>changes from one form to another</b>. This is called the <b>law of conservation of energy</b>."},
    {type:"h", text:"11.2 Common Transformations"},
    {type:"table", headers:["Device","Energy change"],
      rows:[
        ["Torch","Chemical (battery) → Light + Heat"],
        ["Electric fan","Electrical → Mechanical (movement)"],
        ["Radio","Electrical → Sound"],
        ["Car engine","Chemical (petrol) → Mechanical + Heat + Sound"],
        ["Solar panel","Light → Electrical"],
        ["Body","Chemical (food) → Mechanical + Heat"]
      ], caption:"Everyday energy transformations."},
    {type:"h", text:"11.3 Energy Chains"},
    {type:"p", text:"When several transformations happen one after the other, we call it an <b>energy chain</b>."},
    {type:"callout", variant:"tip", title:"Example energy chain",
      text:"Sun → Light energy → Solar panel → Electrical energy → Fan → Mechanical energy (moving air)"},
    {type:"h", text:"11.4 Why This Matters"},
    {type:"p", text:"Understanding energy transformation helps us use energy efficiently. For example, knowing that a bulb changes electricity mostly into <b>heat</b> rather than light tells us that LED bulbs (which give more light) are more efficient than filament bulbs."},
    {type:"example", label:"Example from Ghana",
      text:"At Akosombo Dam, the falling water has mechanical energy. This turns the turbines, which are connected to generators that transform mechanical energy into electrical energy. The electricity travels through power lines to homes, where it becomes light, heat or sound."}
  ],
  think:"When you clap your hands, what energy changes are happening? Where does the sound go?",
  try:"List five devices in your home. For each, write the energy change that happens when it is switched on.",
  summary:"Energy can change from one form to another. The law of conservation of energy says energy cannot be created or destroyed. Common transformations include chemical → light, electrical → sound, and light → electrical.",
  exercises:[],
  quiz:[
    {q:"What is the law of conservation of energy?", options:{a:"Energy is used up",b:"Energy cannot be created or destroyed",c:"Energy is always lost",d:"Energy is made from nothing"}, correct:"b"},
    {q:"What energy change happens in a torch?", options:{a:"Light → Chemical",b:"Chemical → Light + Heat",c:"Sound → Light",d:"Electrical → Chemical"}, correct:"b"},
    {q:"What energy change happens in an electric fan?", options:{a:"Electrical → Sound",b:"Electrical → Mechanical",c:"Mechanical → Chemical",d:"Heat → Light"}, correct:"b"},
    {q:"What energy change happens in a solar panel?", options:{a:"Light → Electrical",b:"Electrical → Light",c:"Heat → Sound",d:"Chemical → Light"}, correct:"a"},
    {q:"What energy change happens in the human body?", options:{a:"Light → Chemical",b:"Chemical → Mechanical + Heat",c:"Sound → Heat",d:"Electrical → Light"}, correct:"b"},
    {q:"Which is more efficient — a filament bulb or an LED bulb?", options:{a:"Filament bulb",b:"LED bulb",c:"Both equal",d:"Neither"}, correct:"b"},
    {q:"What does an energy chain show?", options:{a:"A single transformation",b:"Several transformations in a row",c:"A food chain",d:"A type of fuel"}, correct:"b"},
    {q:"What energy change happens in a radio?", options:{a:"Electrical → Sound",b:"Sound → Electrical",c:"Heat → Sound",d:"Light → Sound"}, correct:"a"}
  ]
},

/* ---------------- UNIT 12 ---------------- */
{ id:"u12", number:12, term:3,
  strand:"Forces and Energy", substrand:"Electricity and Electronics",
  code:"B4.4.2.1.1",
  title:"Electricity and Circuits",
  objectives:[
    "Draw and label simple series and parallel circuits.",
    "Explain the difference between series and parallel circuits.",
    "State the dangers of electricity and how to stay safe."
  ],
  vocab:[
    {term:"Series circuit", def:"A circuit with one path for electricity."},
    {term:"Parallel circuit", def:"A circuit with more than one path for electricity."},
    {term:"Short circuit", def:"When electricity takes an unintended shorter path."},
    {term:"Fuse", def:"A safety device that melts and breaks the circuit if too much current flows."},
    {term:"Current", def:"The flow of electricity."}
  ],
  content:[

/* ---------------- UNIT 13 ---------------- */
{ id:"u13", number:13, term:3,
  strand:"Forces and Energy", substrand:"Forces and Movement",
  code:"B4.4.3.1.1 · B4.4.3.1.2",
  title:"Types of Forces",
  objectives:[
    "Identify different types of forces.",
    "Explain the difference between contact and non-contact forces.",
    "Describe the effects of gravity and friction."
  ],
  vocab:[
    {term:"Contact force", def:"A force that acts when objects touch."},
    {term:"Non-contact force", def:"A force that acts without objects touching."},
    {term:"Gravity", def:"The force that pulls objects towards the Earth."},
    {term:"Magnetism", def:"A force that attracts or repels magnetic materials."},
    {term:"Friction", def:"A force that resists motion between two surfaces."}
  ],
  content:[
    {type:"h", text:"13.1 Contact Forces"},
    {type:"p", text:"<b>Contact forces</b> act when two objects touch each other."},
    {type:"ul", items:[
      "<b>Friction</b> — when two surfaces rub together.",
      "<b>Air resistance</b> — when a moving object pushes against the air.",
      "<b>Water resistance</b> — when a moving object pushes against water.",
      "<b>Push and pull</b> — direct contact forces."
    ]},
    {type:"h", text:"13.2 Non-Contact Forces"},
    {type:"p", text:"<b>Non-contact forces</b> act without the objects touching each other."},
    {type:"ul", items:[
      "<b>Gravity</b> — the force that pulls everything towards the Earth.",
      "<b>Magnetism</b> — the force that attracts iron and attracts or repels other magnets.",
      "<b>Electrostatic force</b> — the force from static electricity (like a balloon that attracts hair)."
    ]},
    {type:"h", text:"13.3 Gravity"},
    {type:"p", text:"<b>Gravity</b> is the force that pulls objects towards the centre of the Earth. It is why things fall down and why we stay on the ground."},
    {type:"p", text:"The Moon has less gravity than Earth. That is why astronauts can jump very high on the Moon."},
    {type:"h", text:"13.4 Friction in Everyday Life"},
    {type:"ul", items:[
      "Useful friction: brakes on a bicycle, shoes gripping the ground, tyres on the road.",
      "Harmful friction: wearing out shoe soles, overheating machines."
    ]},
    {type:"example", label:"Example from Ghana",
      text:"When it rains on a laterite (red earth) road in Ghana, the surface becomes slippery because there is less friction. This is why trotro drivers must slow down in the rain."}
  ],
  think:"The Moon has less gravity than the Earth. What would change about your daily life if you lived on the Moon?",
  try:"Rub your hands together for ten seconds. What do you feel? This is friction turning movement energy into heat.",
  summary:"Forces can be contact (like friction) or non-contact (like gravity and magnetism). Gravity pulls objects to the Earth. Friction can be useful or harmful.",
  exercises:[],
  quiz:[
    {q:"What is a contact force?", options:{a:"A force that acts without touching",b:"A force that acts when objects touch",c:"A type of energy",d:"A kind of rock"}, correct:"b"},
    {q:"Which of these is a non-contact force?", options:{a:"Friction",b:"Push",c:"Gravity",d:"Air resistance"}, correct:"c"},
    {q:"What does gravity do?", options:{a:"Pushes objects up",b:"Pulls objects towards the Earth",c:"Makes objects float",d:"Turns objects sideways"}, correct:"b"},
    {q:"Why can astronauts jump higher on the Moon?", options:{a:"The Moon is small",b:"The Moon has less gravity",c:"The Moon has more air",d:"They wear special shoes"}, correct:"b"},
    {q:"Which is an example of useful friction?", options:{a:"Worn-out tyres",b:"Bicycle brakes",c:"Slippery roads",d:"Overheating machines"}, correct:"b"},
    {q:"What type of force is magnetism?", options:{a:"Contact",b:"Non-contact",c:"Only in water",d:"Only in air"}, correct:"b"},
    {q:"What happens when you rub your hands together?", options:{a:"Nothing",b:"Friction makes them warm",c:"They get cold",d:"They change colour"}, correct:"b"},
    {q:"Which of these is a contact force?", options:{a:"Gravity",b:"Magnetism",c:"Air resistance",d:"Electrostatic force"}, correct:"c"}
  ]
},

  content:[

    {type:"p", text:"A <b>simple machine</b> is a tool that helps us do work more easily. It does not reduce the amount of work — it just makes it easier by changing the size or direction of the force we need."},
    {type:"h", text:"14.2 Six Simple Machines"},
    {type:"table", headers:["Machine","Example in daily life"],
      rows:[
        ["Lever","Crowbar, seesaw, scissors"],
        ["Pulley","Well rope, flag pole"],
        ["Inclined plane","Ramp, sloping road"],
        ["Wedge","Knife, axe, nail"],
        ["Screw","Bolt, bottle cap, screw"],
        ["Wheel and axle","Bicycle, car, wheelbarrow"]

    {type:"h", text:"14.3 How They Help"},
    {type:"ul", items:[
      "A <b>lever</b> lets you lift heavy loads with less effort.",
      "A <b>pulley</b> changes the direction of the force so you can pull down to lift up.",
      "An <b>inclined plane</b> spreads the work over a longer distance, making it easier.",
      "A <b>wedge</b> splits or cuts things apart with less force.",
      "A <b>screw</b> holds things together strongly.",
      "A <b>wheel and axle</b> moves loads easily over the ground."

  summary:"Simple machines make work easier. The six types are lever, pulley, inclined plane, wedge, screw, and wheel and axle. We use simple machines every day in Ghana.",
  exercises:[],
  quiz:[
    {q:"What is a simple machine?", options:{a:"A computer",b:"A tool that makes work easier",c:"A type of food",d:"A kind of rock"}, correct:"b"},
    {q:"Which simple machine is used to fetch water from a well?", options:{a:"Lever",b:"Pulley",c:"Screw",d:"Wedge"}, correct:"b"},
    {q:"Which simple machine is a knife?", options:{a:"Lever",b:"Wedge",c:"Pulley",d:"Screw"}, correct:"b"},
    {q:"Which simple machine is a see-saw?", options:{a:"Lever",b:"Pulley",c:"Inclined plane",d:"Wheel and axle"}, correct:"a"},
    {q:"Which simple machine is a ramp?", options:{a:"Lever",b:"Pulley",c:"Inclined plane",d:"Screw"}, correct:"c"},
    {q:"Which simple machine is a wheelbarrow?", options:{a:"Lever",b:"Wheel and axle",c:"Wedge",d:"Pulley"}, correct:"b"},
    {q:"How does a pulley help?", options:{a:"It reduces work",b:"It changes the direction of the force",c:"It makes things heavier",d:"It looks nice"}, correct:"b"},
    {q:"Which of these is NOT a simple machine?", options:{a:"Screw",b:"Wedge",c:"Pulley",d:"Bicycle bell"}, correct:"d"}
  ]

/* ---------------- UNIT 15 ---------------- */
{ id:"u15", number:15, term:3,
  strand:"Systems", substrand:"Ecosystems",
  code:"B4.3.3.2.1",
  title:"Conservation of the Environment",
  objectives:[
    "Explain what conservation means.",
    "Identify threats to the environment in Ghana.",
    "Suggest ways to protect the environment."
  ],
  vocab:[
    {term:"Conservation", def:"Protecting and using natural resources wisely."},
    {term:"Pollution", def:"Making the environment dirty and unsafe."},
    {term:"Recycling", def:"Reusing materials to make new things."},
    {term:"Sustainable", def:"Using resources so they last for the future."},
    {term:"Biodiversity", def:"The variety of living things in a place."}
  ],
  content:[
    {type:"h", text:"15.1 What Is Conservation?"},
    {type:"p", text:"<b>Conservation</b> means protecting and using natural resources wisely so that they last for the future. We conserve plants, animals, water, air and soil."},
    {type:"h", text:"15.2 Threats to the Environment in Ghana"},
    {type:"ul", items:[
      "<b>Galamsey</b> — illegal mining pollutes rivers and destroys farmland.",
      "<b>Deforestation</b> — cutting trees for timber and fuel causes erosion.",
      "<b>Bush burning</b> — kills soil organisms and destroys habitat.",
      "<b>Plastic pollution</b> — chokes drains and harms wildlife.",
      "<b>Overfishing</b> — reduces fish stocks in our waters.",
      "<b>Bushmeat hunting</b> — reduces wildlife populations."
    ]},
    {type:"h", text:"15.3 Ways to Conserve"},
    {type:"ul", items:[
      "<b>Reduce, Reuse, Recycle</b> — use less, use again, recycle materials.",
      "Plant trees — each person can plant at least one tree a year.",
      "Use water wisely — do not waste water.",
      "Sort rubbish — separate plastics from food waste.",
      "Support laws against galamsey and illegal logging.",
      "Protect community forests and sacred groves."
    ]},
    {type:"h", text:"15.4 Why This Matters"},
    {type:"p", text:"Ghana's biodiversity — its rich variety of plants and animals — is one of our greatest treasures. Conserving it protects our food supply, our health, our water and our future. Every small action counts."},
    {type:"example", label:"Example from Ghana",
      text:"The <b>Kakum National Park</b> is a conservation success story. Its canopy walkway lets visitors see the rainforest without damaging it. The park protects hundreds of species of birds, butterflies and trees that might otherwise be lost."}
  ],
  think:"What can a class of pupils in your school do to help conserve the environment? List three practical actions.",
  try:"Start a class garden or tree-planting project. Each pupil brings one seedling. Plant them around the school and take care of them.",
  summary:"Conservation means protecting natural resources for the future. Threats include galamsey, deforestation, pollution and overfishing. We can conserve by reducing, reusing, recycling, planting trees and supporting laws that protect the environment.",
  exercises:[],
  quiz:[
    {q:"What is conservation?", options:{a:"Wasting resources",b:"Protecting and using resources wisely",c:"Burning forests",d:"Mining rivers"}, correct:"b"},
    {q:"Which activity harms rivers in Ghana?", options:{a:"Planting trees",b:"Galamsey",c:"Recycling",d:"Using water wisely"}, correct:"b"},
    {q:"What does <i>recycling</i> mean?", options:{a:"Throwing away",b:"Reusing materials to make new things",c:"Burning",d:"Burying"}, correct:"b"},
    {q:"Which of these protects the environment?", options:{a:"Deforestation",b:"Bush burning",c:"Planting trees",d:"Overfishing"}, correct:"c"},
    {q:"What is biodiversity?", options:{a:"The number of people",b:"The variety of living things in a place",c:"The size of a forest",d:"The height of trees"}, correct:"b"},
    {q:"Which is a conservation success in Ghana?", options:{a:"Kakum National Park",b:"Makola Market",c:"Tema Harbour",d:"Kotoka Airport"}, correct:"a"},
    {q:"What does <i>sustainable</i> mean?", options:{a:"Lasting for the future",b:"Very fast",c:"Very expensive",d:"Dangerous"}, correct:"a"},
    {q:"Which of these is a good habit?", options:{a:"Littering",b:"Wasting water",c:"Sorting rubbish for recycling",d:"Burning bush"}, correct:"c"}
  ]
}

    {q:"What type of clue is <i>“Many citrus fruits, such as oranges and lemons”</i>?", options:{a:"Definition",b:"Example",c:"Contrast",d:"Opposite"}, correct:"b"},
    {q:"Why do we keep a word bank?", options:{a:"To count words",b:"To remember new words and their meanings",c:"To write stories",d:"To check spelling"}, correct:"b"},
    {q:"Which of these is a context clue type?", options:{a:"Picture",b:"Contrast",c:"Colour",d:"Number"}, correct:"b"},
    {q:"Which of these is a synonym for <i>speedy</i>?", options:{a:"Slow",b:"Fast",c:"Heavy",d:"Quiet"}, correct:"b"}
  ]
},

    "Use the five senses to make writing vivid."

    {term:"Vivid", def:"Clear and full of detail, like a picture in the mind."},

    {term:"Simile", def:"Comparing two things using 'like' or 'as'."}
  ],
  content:[

    {type:"h", text:"4.2 Using the Five Senses"},
    {type:"table", headers:["Sense","Sensory words"],

    {q:"How many senses are used in descriptive writing?", options:{a:"Three",b:"Four",c:"Five",d:"Six"}, correct:"c"},
    {q:"What is a simile?", options:{a:"A comparison using 'like' or 'as'",b:"A type of noun",c:"A question",d:"A greeting"}, correct:"a"},
    {q:"Which word is a sensory word for sound?", options:{a:"Bright",b:"Smooth",c:"Rumbling",d:"Sweet"}, correct:"c"},
    {q:"Which is a simile?", options:{a:"The sun is hot",b:"Her smile was as bright as the sun",c:"The sun shines",d:"The bright sun"}, correct:"b"},
    {q:"How should a descriptive paragraph start?", options:{a:"With a question",b:"With a topic sentence",c:"With a simile",d:"With a full stop"}, correct:"b"},
    {q:"Which word describes something you can smell?", options:{a:"Fragrant",b:"Rough",c:"Loud",d:"Bright"}, correct:"a"},
    {q:"What is a vivid description?", options:{a:"A very short one",b:"A clear and detailed one",c:"A confusing one",d:"An accurate one"}, correct:"b"}
  ]
},

  strand:"Reading", substrand:"Comprehension",
  code:"B4.2.1.3.1",

    "Identify the features of a play.",

    {term:"Play", def:"A story acted on stage."},
    {term:"Dialogue", def:"Conversation between characters in a play."},
    {term:"Stage direction", def:"Instructions that tell actors what to do."},
    {term:"Scene", def:"A part of a play."},
    {term:"Act", def:"A bigger section of a play, made of scenes."}
  ],
  content:[
    {type:"h", text:"5.1 What Is a Play?"},
    {type:"p", text:"A <b>play</b> is a story that is acted out on a stage. Plays use <b>dialogue</b> (what the characters say) and <b>stage directions</b> (what the actors should do)."},
    {type:"h", text:"5.2 Features of a Play"},
    {type:"ul", items:[

      "What they say appears on the right side.",
      "Stage directions are usually in brackets or italics.",
      "A play is divided into acts and scenes."

      text:"<b>KWAME:</b> (running into the compound) Father! Father! The goat is missing!<br><br><b>FATHER:</b> (looking up from his stool) Which goat, Kwame?<br><br><b>KWAME:</b> The brown one. She was not in the pen this morning.<br><br><b>FATHER:</b> (standing up slowly) Then we must search for her together.<br><br><b>KWAME:</b> (nodding) Yes, Father. Let us start with the cocoa farm."},

        ["Told by a narrator","Acted by characters"],

      text:"At school concerts and <i>durbars</i>, Ghanaian pupils often perform short plays about Ananse, honesty or the environment. These plays use dialogue and stage directions just like the one above."}

  think:"Which do you prefer reading — a play or a story? Give reasons.",
  try:"With three friends, read the play above aloud. One person plays Kwame, another plays Father and the third reads the stage directions.",

    {q:"What is a play?", options:{a:"A story acted on a stage",b:"A kind of song",c:"A type of poem",d:"A letter"}, correct:"a"},
    {q:"What are stage directions?", options:{a:"The title",b:"Instructions that tell actors what to do",c:"A type of dialogue",d:"The last line"}, correct:"b"},
    {q:"What is dialogue?", options:{a:"Conversation between characters",b:"A stage direction",c:"A type of play",d:"A scene heading"}, correct:"a"},
    {q:"A group of scenes makes up an ______.", options:{a:"act",b:"audience",c:"author",d:"actor"}, correct:"a"},
    {q:"How is a play different from a story?", options:{a:"A play has no characters",b:"A play is acted, a story is told",c:"A story has no plot",d:"Plays have no endings"}, correct:"b"},
    {q:"What are stage directions usually shown in?", options:{a:"Bold only",b:"Brackets or italics",c:"Red colour",d:"A table"}, correct:"b"},
    {q:"In the play above, who is looking for the goat?", options:{a:"Mother",b:"Kwame and Father",c:"The neighbour",d:"The goat herself"}, correct:"b"},
    {q:"Where do plays often get performed in Ghana?", options:{a:"At school durbars",b:"In banks",c:"In hospitals",d:"In airports"}, correct:"a"}
  ]
},

{ id:"u6", number:6, term:2,
  strand:"Writing", substrand:"Grammar Usage",
  code:"B4.3.1.2.1",
  title:"Tenses — Past, Present and Future",
  objectives:[
    "Identify the three main tenses.",
    "Change sentences from one tense to another.",
    "Use tenses correctly in writing."
  ],
  vocab:[
    {term:"Tense", def:"The time a verb shows — past, present or future."},
    {term:"Past tense", def:"Shows action that has already happened."},
    {term:"Present tense", def:"Shows action happening now."},
    {term:"Future tense", def:"Shows action that will happen."}
  ],
  content:[
    {type:"h", text:"6.1 What Is Tense?"},
    {type:"p", text:"<b>Tense</b> shows when an action happens — in the past, present or future."},
    {type:"table", headers:["Tense","Example"],
      rows:[
        ["Past","I walked to school."],
        ["Present","I walk to school."],
        ["Future","I will walk to school."]
      ], caption:"The three simple tenses."},
    {type:"h", text:"6.2 Forming the Past Tense"},
    {type:"ul", items:[
      "<b>Regular verbs:</b> add <i>-ed</i>. walk → walked, play → played, jump → jumped.",
      "<b>Irregular verbs:</b> change the word completely. go → went, eat → ate, see → saw, run → ran."
    ]},
    {type:"h", text:"6.3 Forming the Future Tense"},
    {type:"p", text:"For the future, we use <b>will</b> or <b>shall</b> + the base verb."},
    {type:"ul", items:[
      "I <b>will go</b> to the market tomorrow.",
      "We <b>shall meet</b> at the assembly hall.",
      "She <b>will sing</b> at the concert."
    ]},
    {type:"h", text:"6.4 Changing Tense"},
    {type:"p", text:"To change a sentence from present to past, change the verb form."},
    {type:"ul", items:[
      "Present: <i>The boy <b>runs</b> to school.</i>",
      "Past: <i>The boy <b>ran</b> to school.</i>",
      "Future: <i>The boy <b>will run</b> to school.</i>"
    ]},
    {type:"example", label:"Example from Ghana",
      text:"In a story about a visit to Cape Coast Castle, all the events would be told in the <b>past tense</b>: <i>“We travelled to Cape Coast. We saw the castle. We learned about its history.”</i>"}
  ],
  think:"When writing a report of something that has already happened, why is it important to keep the same tense all the way through?",
  try:"Write three sentences about what you did yesterday (past), what you are doing now (present) and what you will do tomorrow (future).",
  summary:"Tense shows when an action happens. The three main tenses are past, present and future. Regular verbs form the past tense by adding -ed; irregular verbs change completely.",
  exercises:[],
  quiz:[
    {q:"What does tense show?", options:{a:"Who did it",b:"When an action happens",c:"How it happened",d:"Why it happened"}, correct:"b"},
    {q:"What is the past tense of <i>walk</i>?", options:{a:"Walked",b:"Walking",c:"Will walk",d:"Walks"}, correct:"a"},
    {q:"What is the past tense of <i>go</i>?", options:{a:"Goed",b:"Went",c:"Going",d:"Gone"}, correct:"b"},
    {q:"What is the future tense of <i>eat</i>?", options:{a:"Ate",b:"Eaten",c:"Will eat",d:"Eating"}, correct:"c"},
    {q:"Which sentence is in the present tense?", options:{a:"She ran home",b:"She runs home",c:"She will run home",d:"She has run home"}, correct:"b"},
    {q:"How do we usually form the past tense of regular verbs?", options:{a:"Add -ing",b:"Add -ed",c:"Add -s",d:"Change the whole word"}, correct:"b"},
    {q:"Which sentence is in the future tense?", options:{a:"I eat rice",b:"I ate rice",c:"I will eat rice",d:"I am eating rice"}, correct:"c"},
    {q:"Which is an irregular verb?", options:{a:"Play",b:"Jump",c:"See",d:"Walk"}, correct:"c"}
  ]
},

{ id:"u7", number:7, term:2,
  strand:"Reading", substrand:"Fluency",
  code:"B4.2.1.4.1",
  title:"Reading Aloud with Expression",
  objectives:[
    "Read aloud with correct pronunciation.",
    "Use punctuation to guide expression.",
    "Read at a steady pace with understanding."
  ],
  vocab:[
    {term:"Expression", def:"Reading with feeling and appropriate tone."},
    {term:"Punctuation", def:"Marks like full stops, commas, question marks."},
    {term:"Pace", def:"The speed of reading."},
    {term:"Pause", def:"A short stop in reading."}
  ],
  content:[
    {type:"h", text:"7.1 Reading with Feeling"},
    {type:"p", text:"Reading aloud well is not just about saying the words. It is about showing the meaning and feeling through your voice. This is called <b>expression</b>."},
    {type:"h", text:"7.2 Punctuation Guides Expression"},
    {type:"table", headers:["Mark","What to do"],
      rows:[
        ["Full stop (.)","Pause briefly, voice drops"],
        ["Comma (,)","Short pause"],
        ["Question mark (?)","Voice rises at the end"],
        ["Exclamation mark (!)","Strong feeling, louder voice"],
        ["Quotation marks (“ ”)","Change voice for the speaker"]
      ], caption:"How punctuation guides expression."},
    {type:"h", text:"7.3 Practice Passage"},
    {type:"callout", variant:"note", title:"Read this aloud",
      text:"“Have you seen the sea?” asked Adjoa.<br>“Yes!” shouted Kwame. “It is the biggest thing I have ever seen. The waves are as tall as houses, and the sand is soft and warm.”<br>“I cannot wait to see it,” said Adjoa quietly. “It must be beautiful.”"},
    {type:"p", text:"Notice how Adjoa's first line is a question (voice rises), Kwame's line is an exclamation (strong voice), and Adjoa's last line is quiet and thoughtful."},
    {type:"h", text:"7.4 Pace and Pausing"},
    {type:"p", text:"Reading too fast makes it hard for listeners to understand. Reading too slowly makes them bored. The best pace is somewhere in between, with small pauses at commas and full stops."},
    {type:"example", label:"Example from Ghana",
      text:"Radio presenters in Ghana train for years to read the news clearly. Their expression, pace and pauses make every word easy to follow — even in traffic jams!"}
  ],
  think:"Why do actors need to read with expression? What would a play sound like if everyone read in a flat, lifeless voice?",
  try:"Read the passage above aloud twice. The first time read it flat. The second time read with expression. Ask a friend which was better.",
  summary:"Reading aloud with expression uses punctuation as a guide. Full stops, commas and question marks tell us when to pause and how our voice should change.",
  exercises:[],
  quiz:[
    {q:"What is expression in reading?", options:{a:"Reading fast",b:"Reading with feeling and appropriate tone",c:"Reading silently",d:"Reading loudly"}, correct:"b"},
    {q:"Which punctuation mark shows a question?", options:{a:"Full stop (.)",b:"Comma (,)",c:"Question mark (?)",d:"Exclamation mark (!)"}, correct:"c"},
    {q:"What does a comma tell us to do?", options:{a:"Stop completely",b:"Take a short pause",c:"Shout",d:"Read faster"}, correct:"b"},
    {q:"What does an exclamation mark show?", options:{a:"Strong feeling",b:"A question",c:"A list",d:"The end of a paragraph"}, correct:"a"},
    {q:"Why is pace important in reading?", options:{a:"It makes reading boring",b:"It helps listeners follow the meaning",c:"It is not important",d:"It shows off skills"}, correct:"b"},
    {q:"What is a pause?", options:{a:"A loud shout",b:"A short stop in reading",c:"A type of sentence",d:"A capital letter"}, correct:"b"},
    {q:"When reading a question, what does the voice do?", options:{a:"Drops at the end",b:"Rises at the end",c:"Stays flat",d:"Stops suddenly"}, correct:"b"},
    {q:"Why do radio presenters practise reading aloud?", options:{a:"To read faster",b:"To read clearly and with expression",c:"To sing",d:"To whisper"}, correct:"b"}
  ]
},

{ id:"u8", number:8, term:2,
  strand:"Writing", substrand:"Composition",
  code:"B4.3.1.3.1",
  title:"Writing Narrative Essays",
  objectives:[
    "Identify the parts of a narrative essay.",
    "Write a short narrative with a clear beginning, middle and end.",
    "Use description and dialogue to make the narrative interesting."
  ],
  vocab:[
    {term:"Narrative", def:"A story or account of events."},
    {term:"Plot", def:"The sequence of events in a story."},
    {term:"Climax", def:"The most exciting moment of the story."},
    {term:"Resolution", def:"How the story ends."}
  ],
  content:[
    {type:"h", text:"8.1 What Is a Narrative Essay?"},
    {type:"p", text:"A <b>narrative essay</b> tells a story. It could be about something that happened to you, an imagined event or a story you heard. A good narrative has a clear <b>beginning</b>, <b>middle</b> and <b>end</b>."},
    {type:"h", text:"8.2 Structure of a Narrative"},
    {type:"ol", items:[
      "<b>Beginning</b> — introduces the characters and setting.",
      "<b>Middle</b> — describes the events and the problem.",
      "<b>Climax</b> — the most exciting moment.",
      "<b>Ending (Resolution)</b> — how everything is sorted out."
    ]},
    {type:"h", text:"8.3 Using Description and Dialogue"},
    {type:"p", text:"To make your narrative interesting:"},
    {type:"ul", items:[
      "Use descriptive words — <i>the dusty road, the sweet smell of jollof</i>.",
      "Include dialogue — <i>“Kwame!” shouted his mother.</i>",
      "Use action verbs — <i>raced, leapt, whispered</i>.",
      "Show feelings — <i>my heart pounded, my eyes filled with tears</i>."
    ]},
    {type:"h", text:"8.4 Example Narrative"},
    {type:"callout", variant:"note", title:"A Day I Will Never Forget",
      text:"Last December, my family travelled to Cape Coast to see the castle. The morning air was cool and fresh. As we drove along the coast road, I could already smell the sea.<br><br>When we arrived, I stood on the wall and looked down at the waves. They crashed against the rocks like thunder. My little sister held my hand tightly.<br><br>“Look!” she whispered. A fishing boat was returning to shore, its sails white against the blue sky.<br><br>That day, I learned that history is not just in books. It is in the walls, the stones and the sea itself."},
    {type:"example", label:"Example from Ghana",
      text:"When writing narratives about your own life, remember to include sensory words. What did you see, hear, smell, taste and feel during the events you are describing?"}
  ],
  think:"Why do you think narratives are more interesting when they include dialogue?",
  try:"Write a short narrative titled <i>“The Day I Got Lost”</i>. Include a beginning, middle, climax and ending. Add at least one line of dialogue.",
  summary:"A narrative essay tells a story with a beginning, middle, climax and ending. Good narratives use description, dialogue and strong verbs to keep the reader interested.",
  exercises:[],
  quiz:[
    {q:"What is a narrative?", options:{a:"A list",b:"A story or account of events",c:"A letter",d:"A recipe"}, correct:"b"},
    {q:"What is the climax of a story?", options:{a:"The beginning",b:"The ending",c:"The most exciting moment",d:"The characters"}, correct:"c"},
    {q:"What does a good narrative include?", options:{a:"Only a beginning",b:"Beginning, middle and ending",c:"Only dialogue",d:"Only description"}, correct:"b"},
    {q:"Which of these makes a narrative more interesting?", options:{a:"Long words only",b:"Dialogue and description",c:"No characters",d:"No events"}, correct:"b"},
    {q:"What is a resolution in a story?", options:{a:"The beginning",b:"How the story ends",c:"A character",d:"The setting"}, correct:"b"},
    {q:"Which is an action verb?", options:{a:"Beautiful",b:"Raced",c:"Quietly",d:"Blue"}, correct:"b"},
    {q:"Why do writers use sensory words?", options:{a:"To make writing longer",b:"To make writing vivid and interesting",c:"To use big words",d:"To confuse readers"}, correct:"b"},
    {q:"What is the setting of a story?", options:{a:"The characters",b:"Where and when the story happens",c:"The problem",d:"The ending"}, correct:"b"}
  ]
},

{ id:"u9", number:9, term:3,
  strand:"Oral Language", substrand:"Listening and Speaking",
  code:"B4.1.1.2.1",
  title:"Giving a Short Speech",
  objectives:[
    "Plan and deliver a short speech.",
    "Use a clear voice and appropriate gestures.",
    "Speak confidently in front of others."
  ],
  vocab:[
    {term:"Speech", def:"A talk given to an audience."},
    {term:"Audience", def:"The people listening to a speech."},
    {term:"Gesture", def:"Movement of the hands or body to support speech."},
    {term:"Confident", def:"Sure of yourself and not nervous."}
  ],
  content:[
    {type:"h", text:"9.1 What Is a Speech?"},
    {type:"p", text:"A <b>speech</b> is a talk given to an <b>audience</b>. It can be short or long, formal or informal. Even a two-minute talk in class is a speech."},
    {type:"h", text:"9.2 Planning a Speech"},
    {type:"ol", items:[
      "<b>Choose your topic</b> — something you know well and care about.",
      "<b>Plan three main points</b> — do not try to say too much.",
      "<b>Write a beginning</b> — greet the audience and introduce your topic.",
      "<b>Write the middle</b> — explain each of your three points.",
      "<b>Write an ending</b> — thank the audience and give a final thought."
    ]},
    {type:"h", text:"9.3 Delivering Your Speech"},
    {type:"ul", items:[
      "Stand up straight and face your audience.",
      "Speak slowly and clearly — do not mumble.",
      "Make eye contact with different people.",
      "Use gestures to add meaning — but do not overdo it.",
      "Pause at important points to let your words sink in."
    ]},
    {type:"h", text:"9.4 Example Speech Outline"},
    {type:"callout", variant:"note", title:"Topic: Why We Should Keep Our School Clean",
      text:"<b>Beginning:</b> “Good morning, teachers and fellow pupils.”<br><b>Point 1:</b> “A clean school keeps us healthy — no flies, no sickness.”<br><b>Point 2:</b> “A clean school makes us proud of our learning place.”<br><b>Point 3:</b> “Everyone can help — pick up litter, use bins, keep your desk tidy.”<br><b>Ending:</b> “Let us all work together to make our school the cleanest in Ghana. Thank you.”"},
    {type:"example", label:"Example from Ghana",
      text:"At school assemblies, prefects and head teachers give short speeches every morning. Learning to speak clearly and confidently is a skill you will use all your life."}
  ],
  think:"Why is making eye contact with your audience important when giving a speech?",
  try:"Prepare a two-minute speech on <i>“My favourite place in Ghana”</i>. Practise it in front of a mirror, then deliver it to a family member.",
  summary:"A speech is a talk given to an audience. Plan by choosing a topic, three main points, a beginning and an ending. Deliver with a clear voice, eye contact and gestures.",
  exercises:[],
  quiz:[
    {q:"What is a speech?", options:{a:"A song",b:"A talk given to an audience",c:"A dance",d:"A type of poem"}, correct:"b"},
    {q:"Who is the audience?", options:{a:"The speaker",b:"The people listening",c:"The topic",d:"The place"}, correct:"b"},
    {q:"How many main points should a short speech have?", options:{a:"One",b:"Two",c:"Three",d:"Ten"}, correct:"c"},
    {q:"Which is good for speech delivery?", options:{a:"Mumbling",b:"Speaking clearly and slowly",c:"Looking at your shoes",d:"Turning your back"}, correct:"b"},
    {q:"What are gestures?", options:{a:"Hand or body movements to support speech",b:"Facial expressions only",c:"Written notes",d:"Loud sounds"}, correct:"a"},
    {q:"What should you do at the start of a speech?", options:{a:"Say nothing",b:"Greet the audience and introduce your topic",c:"Give your ending",d:"Walk away"}, correct:"b"},
    {q:"Why is pausing important in a speech?", options:{a:"To let words sink in",b:"To show off",c:"To waste time",d:"To end the speech"}, correct:"a"},
    {q:"Why do speakers make eye contact?", options:{a:"To see the time",b:"To connect with the audience",c:"To blink",d:"To look at their notes"}, correct:"b"}
  ]
},

/* ---------------- UNIT 10 ---------------- */
{ id:"u10", number:10, term:3,
  strand:"Writing", substrand:"Grammar Usage",
  code:"B4.3.1.4.1",
  title:"Adjectives and Adverbs",
  objectives:[
    "Identify adjectives and adverbs in sentences.",
    "Use adverbs to describe how actions are done.",
    "Distinguish between adjectives and adverbs."
  ],
  vocab:[
    {term:"Adjective", def:"A word that describes a noun."},
    {term:"Adverb", def:"A word that describes a verb, adjective or another adverb."},
    {term:"Manner adverb", def:"Tells how something was done — quickly, softly."},
    {term:"Time adverb", def:"Tells when — yesterday, today, tomorrow."}
  ],
  content:[
    {type:"h", text:"10.1 Adjectives"},
    {type:"p", text:"An <b>adjective</b> describes a noun. It tells us what kind, how many or which one."},
    {type:"ul", items:[
      "The <b>tall</b> tree — <i>tall</i> describes the tree.",
      "A <b>sweet</b> mango — <i>sweet</i> describes the mango.",
      "Three <b>small</b> kittens — <i>three</i> and <i>small</i> describe the kittens."
    ]},
    {type:"h", text:"10.2 Adverbs"},
    {type:"p", text:"An <b>adverb</b> describes a verb, an adjective or another adverb. Many adverbs end in <i>-ly</i>."},
    {type:"table", headers:["Type of adverb","Examples"],
      rows:[
