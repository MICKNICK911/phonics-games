<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Math Tug of War · Two‑Player (Number Pad)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0b1120;
            --surface: #111b2e;
            --blue: #3b82f6;
            --blue-light: #60a5fa;
            --blue-deep: #1e40af;
            --red: #ef4444;
            --red-light: #f87171;
            --red-deep: #991b1b;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
            --border: #1e293b;
            --radius: 16px;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(6px, 1.5vh, 16px);
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            max-width: 1300px;
            gap: clamp(8px, 1.5vh, 14px);
        }

        /* ─────────── TOP WAR BAR ─────────── */
        .war-bar-top-container {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        .war-bar-title {
            font-weight: 900;
            font-size: clamp(0.9rem, 1.8vw, 1.2rem);
            letter-spacing: 2px;
            color: #fbbf24;
            text-shadow: 0 0 18px rgba(251, 191, 36, 0.5);
            text-transform: uppercase;
        }

        .war-bar-outer {
            width: 100%;
            position: relative;
            height: clamp(70px, 10vh, 110px);
            background: #1a1a1a;
            border-radius: 50px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7), inset 0 2px 6px rgba(255, 255, 255, 0.04);
            border: 3px solid #2a2a2a;
        }

        .war-bar-blue,
        .war-bar-red {
            position: absolute;
            top: 0;
            height: 100%;
            transition: width 0.55s cubic-bezier(0.22, 0.9, 0.38, 1);
        }

        .war-bar-blue {
            left: 0;
            background: linear-gradient(180deg, #60a5fa 0%, #3b82f6 30%, #1e40af 70%, #0f1d5c 100%);
            border-radius: 50px 0 0 50px;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.2), inset 0 -2px 4px rgba(0, 0, 0, 0.3);
        }

        .war-bar-red {
            right: 0;
            background: linear-gradient(180deg, #f87171 0%, #ef4444 30%, #991b1b 70%, #5c0f0f 100%);
            border-radius: 0 50px 50px 0;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.2), inset 0 -2px 4px rgba(0, 0, 0, 0.3);
        }

        .bar-divider {
            position: absolute;
            top: 4%;
            height: 92%;
            width: 5px;
            background: #ffffff;
            box-shadow: 0 0 20px 6px rgba(255, 255, 255, 0.7), 0 0 40px 10px rgba(255, 255, 255, 0.35);
            border-radius: 6px;
            transition: left 0.55s cubic-bezier(0.22, 0.9, 0.38, 1);
            z-index: 5;
            animation: dividerPulse 2s ease-in-out infinite;
        }

        @keyframes dividerPulse {
            0%,
            100% {
                box-shadow: 0 0 20px 6px rgba(255, 255, 255, 0.7), 0 0 40px 10px rgba(255, 255, 255, 0.35);
            }
            50% {
                box-shadow: 0 0 28px 10px rgba(255, 255, 255, 0.95), 0 0 55px 16px rgba(255, 255, 255, 0.5);
            }
        }

        .bar-scores {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 clamp(18px, 3vw, 30px);
        }

        .bar-score {
            font-weight: 900;
            font-size: clamp(2rem, 4vw, 3rem);
            color: white;
            text-shadow: 0 3px 12px black, 0 0 24px rgba(0, 0, 0, 0.7);
            line-height: 1;
            letter-spacing: 1px;
        }

        /* ─────────── GAME LAYOUT ─────────── */
        .game-layout {
            display: flex;
            width: 100%;
            flex: 1;
            gap: clamp(10px, 2vw, 22px);
            min-height: 0;
        }

        .player-panel {
            flex: 1;
            background: var(--surface);
            border-radius: var(--radius);
            border: 2px solid var(--border);
            padding: clamp(10px, 2vw, 20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(8px, 1.6vh, 14px);
            min-width: 0;
            transition: box-shadow 0.4s;
        }

        .player-panel.p1 {
            border-top: 4px solid var(--blue);
        }
        .player-panel.p2 {
            border-top: 4px solid var(--red);
        }

        .player-name {
            font-weight: 700;
            font-size: clamp(0.95rem, 1.8vw, 1.3rem);
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.35rem 1rem;
            border-radius: 2rem;
            white-space: nowrap;
        }
        .p1 .player-name {
            color: var(--blue-light);
        }
        .p2 .player-name {
            color: var(--red-light);
        }

        .round-badge {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dim);
            background: rgba(255, 255, 255, 0.05);
            padding: 0.25rem 0.9rem;
            border-radius: 1rem;
        }

        .question {
            font-size: clamp(1.5rem, 3.2vw, 2.4rem);
            font-weight: 700;
            font-family: 'Fira Code', monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.5rem 1.4rem;
            border-radius: 2rem;
            margin: 0.1rem 0;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .answer-box {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 1rem;
            padding: 0.7rem 1.4rem;
            font-size: clamp(1.6rem, 3vw, 2.2rem);
            font-family: 'Fira Code', monospace;
            font-weight: 700;
            text-align: center;
            min-width: 140px;
            transition: border-color 0.2s, background 0.2s;
            letter-spacing: 2px;
        }
        .answer-box.placeholder {
            color: #475569;
            font-weight: 400;
            font-size: 0.95rem;
        }

        .number-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 7px;
            width: 100%;
            max-width: 210px;
        }
        .num-btn {
            aspect-ratio: 1.2;
            font-size: 1.5rem;
            font-weight: 700;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 0.8rem;
            color: white;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .num-btn:active {
            transform: scale(0.92);
            background: #0f172a;
        }
        .num-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .action-row {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 210px;
        }
        .action-btn {
            flex: 1;
            padding: 0.7rem;
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            border-radius: 2rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
        }
        .undo-btn {
            background: #f59e0b;
            color: #0f172a;
        }
        .undo-btn:active {
            background: #b45309;
        }
        .check-btn {
            background: #22c55e;
            color: white;
        }
        .check-btn:active {
            background: #15803d;
        }
        .action-btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .feedback-flash {
            animation: flashBorder 0.5s ease-out;
        }
        @keyframes flashBorder {
            0% {
                border-color: #22c55e;
                box-shadow: 0 0 20px #22c55e;
            }
            100% {
                border-color: #334155;
                box-shadow: none;
            }
        }
        .wrong-flash {
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-6px);
            }
            40% {
                transform: translateX(6px);
            }
            60% {
                transform: translateX(-4px);
            }
            80% {
                transform: translateX(4px);
            }
        }

        /* ─────────── CENTER COLUMN ─────────── */
        .center-column {
            flex: 0 0 clamp(240px, 28vw, 320px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
        }

        .settings-toggle {
            background: none;
            border: 2px solid #334155;
            color: #cbd5e1;
            border-radius: 2rem;
            padding: 0.4rem 1.2rem;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .settings-toggle:hover {
            background: #1e293b;
        }

        .settings-panel {
            display: none;
            background: #1e293b;
            border-radius: 1rem;
            padding: 1rem;
            width: 100%;
            flex-direction: column;
            gap: 0.7rem;
            border: 1px solid #334155;
            max-height: 55vh;
            overflow-y: auto;
        }
        .settings-panel.open {
            display: flex;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        .setting-row label {
            font-size: 0.82rem;
            font-weight: 500;
            color: #cbd5e1;
        }
        .setting-row input[type="text"],
        .setting-row input[type="number"] {
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            padding: 0.35rem 0.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            text-align: center;
        }
        .setting-row input[type="text"] {
            width: 85px;
        }
        .setting-row input[type="number"] {
            width: 55px;
        }

        .radio-group {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            font-size: 0.78rem;
            cursor: pointer;
            color: #cbd5e1;
            background: #0f172a;
            padding: 0.3rem 0.65rem;
            border-radius: 1.5rem;
            border: 1px solid #334155;
            transition: 0.2s;
            white-space: nowrap;
        }
        .radio-group label:has(input:checked) {
            border-color: #6366f1;
            background: #1a1f3a;
            color: #a5b4fc;
        }
        .radio-group input[type="radio"] {
            accent-color: #6366f1;
            width: auto;
            margin: 0;
        }

        .apply-settings-btn {
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 2rem;
            padding: 0.55rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            margin-top: 0.1rem;
        }

        .score-summary {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 0 4px;
        }

        /* ─────────── OVERLAY ─────────── */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }
        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .result-card {
            background: #1e293b;
            border-radius: 2rem;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 20px 40px black;
            max-width: 400px;
            width: 90%;
        }
        .result-icon {
            font-size: 4rem;
            margin-bottom: 0.5rem;
        }
        .result-title {
            font-size: 2rem;
            font-weight: 900;
        }
        .result-scores {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 1.5rem 0;
        }
        .play-again-btn {
            background: #6366f1;
            border: none;
            color: white;
            padding: 0.8rem 2.5rem;
            border-radius: 3rem;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
        }

        /* ─────────── RESPONSIVE ─────────── */
        @media (max-width: 750px) {
            .game-layout {
                flex-direction: column;
                gap: 8px;
            }
            .center-column {
                flex: 0 0 auto;
                width: 100%;
                order: -1;
                gap: 0.5rem;
            }
            .war-bar-outer {
                height: clamp(50px, 8vh, 70px);
                border-radius: 35px;
            }
            .war-bar-blue {
                border-radius: 35px 0 0 35px;
            }
            .war-bar-red {
                border-radius: 0 35px 35px 0;
            }
            .bar-divider {
                width: 4px;
            }
            .bar-score {
                font-size: 1.5rem;
            }
            .number-pad {
                max-width: 180px;
            }
            .num-btn {
                font-size: 1.3rem;
            }
            .question {
                font-size: 1.3rem;
                padding: 0.4rem 1rem;
            }
            .player-panel {
                padding: 8px 12px;
                gap: 6px;
            }
            .answer-box {
                font-size: 1.3rem;
                padding: 0.5rem 1rem;
                min-width: 110px;
            }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <!-- ─────────── TOP WAR BAR ─────────── -->
        <div class="war-bar-top-container">
            <div class="war-bar-title">⚡ TUG OF WAR ⚡</div>
            <div class="war-bar-outer">
                <div class="war-bar-blue" id="blueBar"></div>
                <div class="war-bar-red" id="redBar"></div>
                <div class="bar-divider" id="barDivider"></div>
                <div class="bar-scores">
                    <span class="bar-score" id="blueScore">0</span>
                    <span class="bar-score" id="redScore">0</span>
                </div>
            </div>
        </div>

        <!-- ─────────── MAIN GAME LAYOUT ─────────── -->
        <div class="game-layout">
            <!-- Player 1 Panel -->
            <div class="player-panel p1" id="p1Panel">
                <div class="player-name" id="p1NameDisplay">🔵 PLAYER 1</div>
                <div class="round-badge" id="p1RoundBadge">Round 1 / 10</div>
                <div class="question" id="p1Question">3 + 4 = ?</div>
                <div class="answer-box placeholder" id="p1Answer">Your answer</div>
                <div class="number-pad" id="p1Numpad">
                    <button class="num-btn">1</button><button class="num-btn">2</button><button class="num-btn">3</button>
                    <button class="num-btn">4</button><button class="num-btn">5</button><button class="num-btn">6</button>
                    <button class="num-btn">7</button><button class="num-btn">8</button><button class="num-btn">9</button>
                    <button class="num-btn" style="grid-column:2">0</button>
                </div>
                <div class="action-row">
                    <button class="action-btn undo-btn" id="p1Undo">↩ Undo</button>
                    <button class="action-btn check-btn" id="p1Check" disabled>✓ Check</button>
                </div>
            </div>

            <!-- Center Column -->
            <div class="center-column">
                <button class="settings-toggle" id="settingsToggle">⚙️ Settings</button>
                <div class="settings-panel" id="settingsPanel">
                    <div class="setting-row">
                        <label>Player 1 Name</label>
                        <input type="text" id="p1NameInput" value="Player 1" maxlength="12">
                    </div>
                    <div class="setting-row">
                        <label>Player 2 Name</label>
                        <input type="text" id="p2NameInput" value="Player 2" maxlength="12">
                    </div>
                    <div class="setting-row">
                        <label>Rounds</label>
                        <input type="number" id="roundsInput" value="10" min="1" max="20" step="1">
                    </div>
                    <div class="setting-row">
                        <label>Question Bank</label>
                        <div class="radio-group" id="bankGroup"></div>
                    </div>
                    <div class="setting-row">
                        <label>Shuffle</label>
                        <div class="radio-group" id="shuffleGroup">
                            <label><input type="radio" name="shuffle" value="on" checked> ON</label>
                            <label><input type="radio" name="shuffle" value="off"> OFF</label>
                        </div>
                    </div>
                    <button class="apply-settings-btn" id="applySettingsBtn">Apply & Restart</button>
                </div>
                <div class="score-summary">
                    <span style="color:var(--blue-light);">🔵 <span id="p1SummaryName">Player 1</span>: <strong id="p1ScoreChip">0</strong></span>
                    <span style="color:var(--red-light);">🔴 <span id="p2SummaryName">Player 2</span>: <strong id="p2ScoreChip">0</strong></span>
                </div>
            </div>

            <!-- Player 2 Panel -->
            <div class="player-panel p2" id="p2Panel">
                <div class="player-name" id="p2NameDisplay">🔴 PLAYER 2</div>
                <div class="round-badge" id="p2RoundBadge">Round 1 / 10</div>
                <div class="question" id="p2Question">5 + 2 = ?</div>
                <div class="answer-box placeholder" id="p2Answer">Your answer</div>
                <div class="number-pad" id="p2Numpad">
                    <button class="num-btn">1</button><button class="num-btn">2</button><button class="num-btn">3</button>
                    <button class="num-btn">4</button><button class="num-btn">5</button><button class="num-btn">6</button>
                    <button class="num-btn">7</button><button class="num-btn">8</button><button class="num-btn">9</button>
                    <button class="num-btn" style="grid-column:2">0</button>
                </div>
                <div class="action-row">
                    <button class="action-btn undo-btn" id="p2Undo">↩ Undo</button>
                    <button class="action-btn check-btn" id="p2Check" disabled>✓ Check</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ─────────── OVERLAY ─────────── -->
    <div class="overlay" id="overlay">
        <div class="result-card">
            <div class="result-icon" id="resultIcon">🏆</div>
            <div class="result-title" id="resultTitle"></div>
            <div class="result-scores">
                <div><div style="color:var(--blue-light);" id="finalP1Label">🔵 P1</div><div style="font-size:2.5rem;font-weight:900;" id="finalP1">0</div></div>
                <div><div style="color:var(--red-light);" id="finalP2Label">🔴 P2</div><div style="font-size:2.5rem;font-weight:900;" id="finalP2">0</div></div>
            </div>
            <button class="play-again-btn" id="playAgainBtn">🔄 Play Again</button>
        </div>
    </div>

                        { question: '90 ÷ 9', answer: 10 }

            // ──────────────────────── DOM ELEMENTS ────────────────────────
            const $ = id => document.getElementById(id);
            const p1Panel = $('p1Panel'),
                p2Panel = $('p2Panel');
            const p1NameDisplay = $('p1NameDisplay'),
                p2NameDisplay = $('p2NameDisplay');
            const p1Question = $('p1Question'),
                p2Question = $('p2Question');
            const p1Answer = $('p1Answer'),
                p2Answer = $('p2Answer');
            const p1RoundBadge = $('p1RoundBadge'),
                p2RoundBadge = $('p2RoundBadge');
            const p1Numpad = $('p1Numpad'),
                p2Numpad = $('p2Numpad');
            const p1Undo = $('p1Undo'),
                p2Undo = $('p2Undo');
            const p1Check = $('p1Check'),
                p2Check = $('p2Check');
            const blueBar = $('blueBar'),
                redBar = $('redBar'),
                barDivider = $('barDivider');
            const blueScoreEl = $('blueScore'),
                redScoreEl = $('redScore');
            const p1ScoreChip = $('p1ScoreChip'),
                p2ScoreChip = $('p2ScoreChip');
            const p1SummaryName = $('p1SummaryName'),
                p2SummaryName = $('p2SummaryName');
            const settingsToggle = $('settingsToggle'),
                settingsPanel = $('settingsPanel');
            const p1NameInput = $('p1NameInput'),
                p2NameInput = $('p2NameInput');
            const roundsInput = $('roundsInput'),
                applySettingsBtn = $('applySettingsBtn');
            const bankGroup = $('bankGroup');
            const overlay = $('overlay'),
                resultIcon = $('resultIcon'),
                resultTitle = $('resultTitle');
            const finalP1Label = $('finalP1Label'),
                finalP2Label = $('finalP2Label');
            const finalP1 = $('finalP1'),
                finalP2 = $('finalP2');
            const playAgainBtn = $('playAgainBtn');

            // ──────────────────────── GAME STATE ────────────────────────
            let TOTAL_ROUNDS = 10;
            let SELECTED_BANK = 0;
            let PLAYER1 = 'Player 1',
                PLAYER2 = 'Player 2';
            let SHUFFLE_ENABLED = true;
            let gameActive = true,
                barPosition = 50;

            function createPlayer() {
                return {
                    score: 0,
                    round: 1,
                    input: '',
                    correctAnswer: 0,
                    questionText: '',
                    locked: false,
                    questionQueue: [],
                    queueIndex: 0,
                    lastIdx: -1,
                    currentBankIndex: 0 // for non-shuffle mode
                };
            }

            // Attach player objects to numpad elements
            p1Numpad.player = createPlayer();
            p2Numpad.player = createPlayer();

            // ──────────────────────── UTILITIES ────────────────────────
            const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);
            const currentBank = () => QUESTION_BANKS[SELECTED_BANK] || QUESTION_BANKS[0];

            function buildQueue() {
                return shuffle(currentBank().questions.map((_, i) => i));
            }

            function getQuestion(numpad) {
                const player = numpad.player;
                const bank = currentBank();
                if (!bank.questions.length) {
                    player.questionText = 'No questions';
                    player.correctAnswer = 0;
                    return;
                }

                if (SHUFFLE_ENABLED) {
                    // Shuffle mode: each player has their own shuffled queue
                    if (!player.questionQueue.length || player.queueIndex >= player.questionQueue.length) {
                        player.questionQueue = buildQueue();
                        player.queueIndex = 0;
                        if (player.questionQueue.length > 1 && player.lastIdx >= 0 && player.questionQueue[
                                0] === player.lastIdx) {
                            [player.questionQueue[0], player.questionQueue[1]] = [player.questionQueue[1],
                                player.questionQueue[0]
                            ];
                        }
                    }
                    const idx = player.questionQueue[player.queueIndex++];
                    player.lastIdx = idx;
                    const q = bank.questions[idx];
                    player.questionText = q.question;
                    player.correctAnswer = Number(q.answer);
                } else {
                    // Non-shuffle mode: use currentBankIndex (sequential order)
                    if (player.currentBankIndex >= bank.questions.length) {
                        player.currentBankIndex = 0; // wrap around
                    }
                    const q = bank.questions[player.currentBankIndex];
                    player.questionText = q.question;
                    player.correctAnswer = Number(q.answer);
                    // Note: currentBankIndex is incremented in handleAnswer on correct answer
                }
            }

            // ──────────────────────── UI HELPERS ────────────────────────
            function updateAnswerBox(numpad, answerBox) {
                const player = numpad.player;
                if (player.input === '') {
                    answerBox.textContent = 'Your answer';
                    answerBox.classList.add('placeholder');
                } else {
                    answerBox.textContent = player.input;
                    answerBox.classList.remove('placeholder');
                }
            }

            function updateRoundBadge(numpad, badge) {
                badge.textContent = `Round ${numpad.player.round} / ${TOTAL_ROUNDS}`;
            }

            function updateBar() {
                blueBar.style.width = barPosition + '%';
                redBar.style.width = (100 - barPosition) + '%';
                barDivider.style.left = barPosition + '%';
                blueScoreEl.textContent = p1Numpad.player.score;
                redScoreEl.textContent = p2Numpad.player.score;
                p1ScoreChip.textContent = p1Numpad.player.score;
                p2ScoreChip.textContent = p2Numpad.player.score;
            }

            function updateNames() {
                p1NameDisplay.textContent = `🔵 ${PLAYER1}`;
                p2NameDisplay.textContent = `🔴 ${PLAYER2}`;
                p1SummaryName.textContent = PLAYER1;
                p2SummaryName.textContent = PLAYER2;
                finalP1Label.textContent = `🔵 ${PLAYER1}`;
                finalP2Label.textContent = `🔴 ${PLAYER2}`;
            }

            function shiftBar(favorBlue) {
                barPosition = favorBlue ? Math.min(92, barPosition + 5) : Math.max(8, barPosition - 5);
                updateBar();
            }

            function lockNumpad(numpad, lock) {
                const player = numpad.player;
                player.locked = lock;
                const undoBtn = numpad === p1Numpad ? p1Undo : p2Undo;
                const checkBtn = numpad === p1Numpad ? p1Check : p2Check;
                numpad.querySelectorAll('.num-btn').forEach(btn => btn.disabled = lock);
                undoBtn.disabled = lock;
                checkBtn.disabled = lock || player.input === '';
            }

            // ──────────────────────── INPUT HANDLING ────────────────────────
            function appendDigit(numpad, digit, answerBox, checkBtn) {
                const player = numpad.player;
                if (!gameActive || player.locked || player.round > TOTAL_ROUNDS) return;
                if (player.input.length >= 4) return;
                if (player.input === '0' && digit === '0') return;
                if (player.input === '' && digit === '0') {
                    player.input = '0';
                } else {
                    if (player.input === '0') player.input = '';
                    player.input += digit;
                }
                updateAnswerBox(numpad, answerBox);
                checkBtn.disabled = false;
            }

            function clearInput(numpad, answerBox, checkBtn) {
                const player = numpad.player;
                if (!gameActive || player.locked || player.round > TOTAL_ROUNDS) return;
                player.input = '';
                updateAnswerBox(numpad, answerBox);
                checkBtn.disabled = true;
            }

            // ──────────────────────── ANSWER CHECKING ────────────────────────
            function handleAnswer(numpad, id) {
                const player = numpad.player;
                if (!gameActive || player.locked || player.round > TOTAL_ROUNDS) return;
                if (player.input === '') {
                    const box = id === 'p1' ? p1Answer : p2Answer;
                    box.classList.add('wrong-flash');
                    setTimeout(() => box.classList.remove('wrong-flash'), 400);
                    return;
                }
                const answerNum = parseInt(player.input, 10);
                const isCorrect = answerNum === player.correctAnswer;
                const panel = id === 'p1' ? p1Panel : p2Panel;
                const answerBox = id === 'p1' ? p1Answer : p2Answer;
                const questionEl = id === 'p1' ? p1Question : p2Question;
                const badge = id === 'p1' ? p1RoundBadge : p2RoundBadge;
                const checkBtn = id === 'p1' ? p1Check : p2Check;
                const bank = currentBank();

                lockNumpad(numpad, true);

                if (isCorrect) {
                    answerBox.classList.add('feedback-flash');
                    panel.style.boxShadow = '0 0 30px #22c55e';
                    setTimeout(() => {
                        answerBox.classList.remove('feedback-flash');
                        panel.style.boxShadow = '';
                    }, 500);
                } else {
                    answerBox.classList.add('wrong-flash');
                    setTimeout(() => answerBox.classList.remove('wrong-flash'), 400);
                }

                if (isCorrect) {
                    player.score++;
                    shiftBar(id === 'p1');
                    // Advance bank index in non-shuffle mode
                    if (!SHUFFLE_ENABLED) {
                        player.currentBankIndex++;
                        if (player.currentBankIndex >= bank.questions.length) {
                            player.currentBankIndex = 0;
                        }
                    }
                } else {
                    shiftBar(id !== 'p1');
                }

                setTimeout(() => {
                    if (!gameActive) return;
                    if (isCorrect) {
                        if (player.round === TOTAL_ROUNDS) {
                            player.round = TOTAL_ROUNDS + 1;
                            player.input = '';
                            updateAnswerBox(numpad, answerBox);
                            updateRoundBadge(numpad, badge);
                            endGame();
                            return;
                        }
                        player.round++;
                        player.input = '';
                        getQuestion(numpad);
                        questionEl.textContent = player.questionText + ' = ?';
                        updateAnswerBox(numpad, answerBox);
                        updateRoundBadge(numpad, badge);
                        checkBtn.disabled = true;
                        lockNumpad(numpad, false);
                    } else {
                        player.input = '';
                        updateAnswerBox(numpad, answerBox);
                        checkBtn.disabled = true;
                        lockNumpad(numpad, false);
                    }
                }, 500);
            }

            function endGame() {
                if (!gameActive) return;
                gameActive = false;
                lockNumpad(p1Numpad, true);
                lockNumpad(p2Numpad, true);
                const p1 = p1Numpad.player,
                    p2 = p2Numpad.player;
                if (p1.score > p2.score) {
                    resultIcon.textContent = '🏆';
                    resultTitle.textContent = `🔵 ${PLAYER1} Wins!`;
                    resultTitle.style.color = 'var(--blue-light)';
                } else if (p2.score > p1.score) {
                    resultIcon.textContent = '🏆';
                    resultTitle.textContent = `🔴 ${PLAYER2} Wins!`;
                    resultTitle.style.color = 'var(--red-light)';
                } else {
                    resultIcon.textContent = '🤝';
                    resultTitle.textContent = "It's a Tie!";
                    resultTitle.style.color = '#fbbf24';
                }
                finalP1.textContent = p1.score;
                finalP2.textContent = p2.score;
                overlay.classList.add('active');
            }

            function fullReset() {
                gameActive = true;
                barPosition = 50;
                p1Numpad.player = createPlayer();
                p2Numpad.player = createPlayer();
                getQuestion(p1Numpad);
                getQuestion(p2Numpad);
                p1Question.textContent = p1Numpad.player.questionText + ' = ?';
                p2Question.textContent = p2Numpad.player.questionText + ' = ?';
                updateAnswerBox(p1Numpad, p1Answer);
                updateAnswerBox(p2Numpad, p2Answer);
                updateRoundBadge(p1Numpad, p1RoundBadge);
                updateRoundBadge(p2Numpad, p2RoundBadge);
                updateBar();
                updateNames();
                lockNumpad(p1Numpad, false);
                lockNumpad(p2Numpad, false);
                p1Check.disabled = p2Check.disabled = true;
                overlay.classList.remove('active');
                buildBankRadios();
                buildShuffleRadios();
            }

            // ──────────────────────── SETTINGS ────────────────────────
            function buildBankRadios() {
                bankGroup.innerHTML = '';
                QUESTION_BANKS.forEach((bank, idx) => {
                    const label = document.createElement('label');
                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = 'bank';
                    radio.value = idx;
                    if (idx === SELECTED_BANK) radio.checked = true;
                    label.appendChild(radio);
                    label.appendChild(document.createTextNode(' ' + bank.name));
                    bankGroup.appendChild(label);
                });
            }

            function buildShuffleRadios() {
                // The shuffle radio group is in the HTML; just ensure checked state matches SHUFFLE_ENABLED
                const shuffleRadios = document.getElementsByName('shuffle');
                shuffleRadios.forEach(r => {
                    if (r.value === 'on' && SHUFFLE_ENABLED) r.checked = true;
                    if (r.value === 'off' && !SHUFFLE_ENABLED) r.checked = true;
                });
            }

            function readSettings() {
                const p1name = p1NameInput.value.trim() || 'Player 1';
                const p2name = p2NameInput.value.trim() || 'Player 2';
                let rounds = parseInt(roundsInput.value, 10);
                if (isNaN(rounds) || rounds < 1) rounds = 1;
                if (rounds > 20) rounds = 20;
                roundsInput.value = rounds;
                let bank = 0;
                document.getElementsByName('bank').forEach(r => { if (r.checked) bank = parseInt(r.value,
                10); });
                if (isNaN(bank) || bank < 0 || bank >= QUESTION_BANKS.length) bank = 0;
                let shuffleOn = true;
                document.getElementsByName('shuffle').forEach(r => { if (r.checked) shuffleOn = r.value ===
                        'on'; });
                return { p1name, p2name, rounds, bank, shuffleOn };
            }

            function applySettings() {
                const s = readSettings();
                PLAYER1 = s.p1name;
                PLAYER2 = s.p2name;
                TOTAL_ROUNDS = s.rounds;
                SELECTED_BANK = s.bank;
                SHUFFLE_ENABLED = s.shuffleOn;
                settingsPanel.classList.remove('open');
                fullReset();
            }

            // ──────────────────────── EVENT WIRING ────────────────────────
            function setupNumpadEvents(numpad, answerBox, checkBtn, undoBtn) {
                numpad.querySelectorAll('.num-btn').forEach(btn => {
                    btn.addEventListener('pointerdown', e => {
                        e.preventDefault();
                        const digit = btn.textContent.trim();
                        appendDigit(numpad, digit, answerBox, checkBtn);
                    });
                });
                undoBtn.addEventListener('click', () => clearInput(numpad, answerBox, checkBtn));
                checkBtn.addEventListener('click', () => handleAnswer(numpad, numpad === p1Numpad ? 'p1' :
                    'p2'));
            }

            setupNumpadEvents(p1Numpad, p1Answer, p1Check, p1Undo);
            setupNumpadEvents(p2Numpad, p2Answer, p2Check, p2Undo);

            settingsToggle.addEventListener('click', () => settingsPanel.classList.toggle('open'));
            applySettingsBtn.addEventListener('click', applySettings);
            playAgainBtn.addEventListener('click', applySettings);

            document.addEventListener('touchstart', e => {
                if (e.target.closest('button') && e.touches.length > 1) e.preventDefault();
            }, { passive: false });

            // ──────────────────────── INIT ────────────────────────
            buildBankRadios();
            buildShuffleRadios();
            updateNames();
            fullReset();
        })();
