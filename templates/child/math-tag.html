<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Math Tug of War · Two‑Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0b1120;
      --surface: #111b2e;
      --blue: #3b82f6;
      --blue-light: #60a5fa;
      --red: #ef4444;
      --red-light: #f87171;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --border: #1e293b;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(0,0,0,0.5);
      --transition: 0.4s cubic-bezier(0.2, 0.9, 0.4, 1);
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(8px, 2vh, 20px);
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .game-layout {
      display: flex;
      width: 100%;
      height: 100%;
      gap: clamp(12px, 2vw, 24px);
      max-width: 1300px;
    }

    /* ---------- PLAYER PANELS ---------- */
    .player-panel {
      flex: 1;
      background: var(--surface);
      border-radius: var(--radius);
      border: 2px solid var(--border);
      padding: clamp(12px, 2vw, 24px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(10px, 2vh, 18px);
      box-shadow: var(--shadow);
      transition: border-color 0.2s;
      min-width: 0;
    }
    .player-panel.p1 { border-top: 4px solid var(--blue); }
    .player-panel.p2 { border-top: 4px solid var(--red); }

    .player-name {
      font-weight: 700;
      font-size: clamp(1rem, 2vw, 1.4rem);
      letter-spacing: 1px;
      background: rgba(255,255,255,0.05);
      padding: 0.4rem 1.2rem;
      border-radius: 2rem;
    }
    .p1 .player-name { color: var(--blue-light); }
    .p2 .player-name { color: var(--red-light); }

    .round-badge {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-dim);
      background: rgba(255,255,255,0.05);
      padding: 0.3rem 1rem;
      border-radius: 1rem;
    }

    .question {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 700;
      font-family: 'Fira Code', monospace;
      background: rgba(0,0,0,0.3);
      padding: 0.6rem 1.8rem;
      border-radius: 2rem;
      margin: 0.2rem 0;
    }

    .answer-box {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 1rem;
      padding: 0.8rem 1.5rem;
      font-size: clamp(1.6rem, 3.5vw, 2.2rem);
      font-family: 'Fira Code', monospace;
      font-weight: 700;
      text-align: center;
      min-width: 160px;
      transition: border-color 0.2s, background 0.2s;
    }
    .answer-box.placeholder {
      color: #475569;
      font-weight: 400;
      font-size: 1rem;
    }

    .number-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 240px;
    }
    .num-btn {
      aspect-ratio: 1.2;
      font-size: 1.4rem;
      font-weight: 700;
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 0.8rem;
      color: white;
      cursor: pointer;
      transition: all 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .num-btn:active { transform: scale(0.92); background: #0f172a; }
    .num-btn:disabled { opacity: 0.4; pointer-events: none; }

    .action-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 240px;
    }
    .action-btn {
      flex: 1;
      padding: 0.8rem;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      border-radius: 2rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
    }
    .undo-btn { background: #f59e0b; color: #0f172a; }
    .undo-btn:active { background: #b45309; }
    .check-btn { background: #22c55e; color: white; }
    .check-btn:active { background: #15803d; }
    .action-btn:disabled { opacity: 0.5; pointer-events: none; }

    .feedback-flash {
      animation: flashBorder 0.5s ease-out;
    }
    @keyframes flashBorder {
      0% { border-color: #22c55e; box-shadow: 0 0 20px #22c55e; }
      100% { border-color: #334155; box-shadow: none; }
    }
    .wrong-flash {
      animation: shake 0.4s ease;
    }
    @keyframes shake {
      0%,100%{ transform: translateX(0); }
      20%{ transform: translateX(-6px); }
      40%{ transform: translateX(6px); }
      60%{ transform: translateX(-4px); }
      80%{ transform: translateX(4px); }
    }

    /* ---------- CENTER COLUMN ---------- */
    .center-column {
      flex: 0 0 clamp(240px, 28vw, 320px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
    }

    .settings-toggle {
      background: none;
      border: 2px solid #334155;
      color: #cbd5e1;
      border-radius: 2rem;
      padding: 0.4rem 1.2rem;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .settings-toggle:hover { background: #1e293b; }

    .settings-panel {
      display: none;
      background: #1e293b;
      border-radius: 1rem;
      padding: 1rem;
      width: 100%;
      flex-direction: column;
      gap: 0.8rem;
      border: 1px solid #334155;
    }
    .settings-panel.open { display: flex; }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .setting-row label {
      font-size: 0.85rem;
      font-weight: 500;
      color: #cbd5e1;
    }
    .setting-row input,
    .setting-row select {
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
      padding: 0.4rem 0.8rem;
      border-radius: 0.5rem;
      font-weight: 600;
      text-align: center;
    }
    .apply-settings-btn {
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 2rem;
      padding: 0.6rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
    }

    .war-bar-container {
      width: 100%;
      position: relative;
      height: 70px;
      background: white;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }
    .war-bar-blue, .war-bar-red {
      position: absolute;
      top: 0;
      height: 100%;
      transition: width 0.6s cubic-bezier(0.2, 0.9, 0.4, 1);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .war-bar-blue {
      left: 0;
      background: linear-gradient(180deg, #3b82f6, #1e40af);
      border-radius: 40px 0 0 40px;
    }
    .war-bar-red {
      right: 0;
      background: linear-gradient(180deg, #ef4444, #991b1b);
      border-radius: 0 40px 40px 0;
    }
    .bar-divider {
      position: absolute;
      top: 5%;
      height: 90%;
      width: 4px;
      background: white;
      box-shadow: 0 0 12px white;
      border-radius: 4px;
      transition: left 0.6s cubic-bezier(0.2, 0.9, 0.4, 1);
      z-index: 5;
    }
    .bar-score {
      font-weight: 900;
      font-size: 1.8rem;
      color: white;
      text-shadow: 0 2px 8px black;
    }

    .score-summary {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-weight: 700;
    }

    /* ---------- OVERLAY ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
    }
    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .result-card {
      background: #1e293b;
      border-radius: 2rem;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 20px 40px black;
      max-width: 400px;
      width: 90%;
    }
    .result-icon { font-size: 4rem; margin-bottom: 0.5rem; }
    .result-title { font-size: 2rem; font-weight: 900; }
    .result-scores { display: flex; justify-content: center; gap: 2rem; margin: 1.5rem 0; }
    .play-again-btn {
      background: #6366f1;
      border: none;
      color: white;
      padding: 0.8rem 2.5rem;
      border-radius: 3rem;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
    }

    @media (max-width: 750px) {
      .game-layout {
        flex-direction: column;
        gap: 10px;
      }
      .center-column {
        flex: 0 0 auto;
        width: 100%;
        order: -1;
      }
      .war-bar-container { height: 50px; }
    }
  </style>
</head>
<body>
<div class="game-layout">
  <!-- PLAYER 1 (BLUE) -->
  <div class="player-panel p1" id="p1Panel">
    <div class="player-name">🔵 PLAYER 1</div>
    <div class="round-badge" id="p1RoundBadge">Round 1 / 10</div>
    <div class="question" id="p1Question">3 + 4 = ?</div>
    <div class="answer-box placeholder" id="p1Answer">Your answer</div>
    <div class="number-pad" id="p1Pad">
      <button class="num-btn">1</button><button class="num-btn">2</button><button class="num-btn">3</button>
      <button class="num-btn">4</button><button class="num-btn">5</button><button class="num-btn">6</button>
      <button class="num-btn">7</button><button class="num-btn">8</button><button class="num-btn">9</button>
      <button class="num-btn" style="grid-column:2">0</button>
    </div>
    <div class="action-row">
      <button class="action-btn undo-btn" id="p1Undo">↩ Undo</button>
      <button class="action-btn check-btn" id="p1Check">✓ Check</button>
    </div>
  </div>

  <!-- CENTER TUG OF WAR & SETTINGS -->
  <div class="center-column">
    <button class="settings-toggle" id="settingsToggle">⚙️ Settings</button>
    <div class="settings-panel" id="settingsPanel">
      <div class="setting-row">
        <label>Total Rounds</label>
        <input type="number" id="roundsInput" value="10" min="1" max="20" step="1">
      </div>
      <div class="setting-row">
        <label>Difficulty</label>
        <select id="difficultySelect">
          <option value="easy">Easy (1–5)</option>
          <option value="medium" selected>Medium (1–9)</option>
          <option value="hard">Hard (1–12)</option>
        </select>
      </div>
      <button class="apply-settings-btn" id="applySettingsBtn">Apply & Restart</button>
    </div>

    <div style="font-weight:700; color:#cbd5e1; letter-spacing:1px;">⚡ TUG OF WAR ⚡</div>
    <div class="war-bar-container">
      <div class="war-bar-blue" id="blueBar"><span class="bar-score" id="blueScore">0</span></div>
      <div class="war-bar-red" id="redBar"><span class="bar-score" id="redScore">0</span></div>
      <div class="bar-divider" id="barDivider"></div>
    </div>
    <div class="score-summary">
      <span style="color:var(--blue-light);">🔵 P1: <strong id="p1ScoreChip">0</strong></span>
      <span style="color:var(--red-light);">🔴 P2: <strong id="p2ScoreChip">0</strong></span>
    </div>
  </div>

  <!-- PLAYER 2 (RED) -->
  <div class="player-panel p2" id="p2Panel">
    <div class="player-name">🔴 PLAYER 2</div>
    <div class="round-badge" id="p2RoundBadge">Round 1 / 10</div>
    <div class="question" id="p2Question">5 + 2 = ?</div>
    <div class="answer-box placeholder" id="p2Answer">Your answer</div>
    <div class="number-pad" id="p2Pad">
      <button class="num-btn">1</button><button class="num-btn">2</button><button class="num-btn">3</button>
      <button class="num-btn">4</button><button class="num-btn">5</button><button class="num-btn">6</button>
      <button class="num-btn">7</button><button class="num-btn">8</button><button class="num-btn">9</button>
      <button class="num-btn" style="grid-column:2">0</button>
    </div>
    <div class="action-row">
      <button class="action-btn undo-btn" id="p2Undo">↩ Undo</button>
      <button class="action-btn check-btn" id="p2Check">✓ Check</button>
    </div>
  </div>
</div>

<!-- RESULTS OVERLAY -->
<div class="overlay" id="overlay">
  <div class="result-card">
    <div class="result-icon" id="resultIcon">🏆</div>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-scores">
      <div><div style="color:var(--blue-light);">🔵 P1</div><div style="font-size:2.5rem; font-weight:900;" id="finalP1">0</div></div>
      <div><div style="color:var(--red-light);">🔴 P2</div><div style="font-size:2.5rem; font-weight:900;" id="finalP2">0</div></div>
    </div>
    <button class="play-again-btn" id="playAgainBtn">🔄 Play Again</button>
  </div>
</div>

<script>
  (function() {
    // ---------- DOM references ----------
    const p1Question = document.getElementById('p1Question');
    const p1Answer = document.getElementById('p1Answer');
    const p1RoundBadge = document.getElementById('p1RoundBadge');
    const p1Pad = document.getElementById('p1Pad');
    const p1Undo = document.getElementById('p1Undo');
    const p1Check = document.getElementById('p1Check');
    const p1Panel = document.getElementById('p1Panel');

    const p2Question = document.getElementById('p2Question');
    const p2Answer = document.getElementById('p2Answer');
    const p2RoundBadge = document.getElementById('p2RoundBadge');
    const p2Pad = document.getElementById('p2Pad');
    const p2Undo = document.getElementById('p2Undo');
    const p2Check = document.getElementById('p2Check');
    const p2Panel = document.getElementById('p2Panel');

    const blueBar = document.getElementById('blueBar');
    const redBar = document.getElementById('redBar');
    const barDivider = document.getElementById('barDivider');
    const blueScoreEl = document.getElementById('blueScore');
    const redScoreEl = document.getElementById('redScore');
    const p1ScoreChip = document.getElementById('p1ScoreChip');
    const p2ScoreChip = document.getElementById('p2ScoreChip');

    const settingsToggle = document.getElementById('settingsToggle');
    const settingsPanel = document.getElementById('settingsPanel');
    const roundsInput = document.getElementById('roundsInput');
    const difficultySelect = document.getElementById('difficultySelect');
    const applySettingsBtn = document.getElementById('applySettingsBtn');

    const overlay = document.getElementById('overlay');
    const resultIcon = document.getElementById('resultIcon');
    const resultTitle = document.getElementById('resultTitle');
    const finalP1 = document.getElementById('finalP1');
    const finalP2 = document.getElementById('finalP2');
    const playAgainBtn = document.getElementById('playAgainBtn');

    // ---------- Game state ----------
    let TOTAL_ROUNDS = 10;
    let DIFFICULTY_MAX = 9;   // medium default
    let gameActive = true;
    let barPosition = 50;      // percentage from left (blue%)

    // Player state factory
    function createPlayer() {
      return {
        score: 0,
        round: 1,
        answer: '',
        num1: 0,
        num2: 0,
        correctAnswer: 0,
        locked: false,
        lastKey: ''
      };
    }
    let p1 = createPlayer();
    let p2 = createPlayer();

    // ---------- Helper functions ----------
    function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function generateQuestion(player) {
      let n1, n2, key;
      do {
        n1 = rand(1, DIFFICULTY_MAX);
        n2 = rand(1, DIFFICULTY_MAX);
        key = `${n1}+${n2}`;
      } while (key === player.lastKey);
      player.num1 = n1;
      player.num2 = n2;
      player.correctAnswer = n1 + n2;
      player.lastKey = key;
    }

    function renderQuestion(player, element) {
      element.textContent = `${player.num1} + ${player.num2} = ?`;
    }

    function updateAnswerDisplay(player, element) {
      if (player.answer === '') {
        element.textContent = 'Your answer';
        element.classList.add('placeholder');
      } else {
        element.textContent = player.answer;
        element.classList.remove('placeholder');
      }
    }

    function updateRoundBadge(player, badge) {
      badge.textContent = `Round ${player.round} / ${TOTAL_ROUNDS}`;
    }

    function updateAllBarUI() {
      blueBar.style.width = barPosition + '%';
      redBar.style.width = (100 - barPosition) + '%';
      barDivider.style.left = barPosition + '%';
      blueScoreEl.textContent = p1.score;
      redScoreEl.textContent = p2.score;
      p1ScoreChip.textContent = p1.score;
      p2ScoreChip.textContent = p2.score;
    }

    function shiftBar(favorBlue) {
      if (favorBlue) {
        barPosition = Math.min(92, barPosition + 5);
      } else {
        barPosition = Math.max(8, barPosition - 5);
      }
      updateAllBarUI();
    }

    function setControlsDisabled(player, disabled) {
      const pad = player === p1 ? p1Pad : p2Pad;
      const undo = player === p1 ? p1Undo : p2Undo;
      const check = player === p1 ? p1Check : p2Check;
      const answerEl = player === p1 ? p1Answer : p2Answer;
      pad.querySelectorAll('button').forEach(b => b.disabled = disabled);
      undo.disabled = disabled;
      check.disabled = disabled || (player.answer === '' && !disabled);
    }

    function lockPlayer(player) {
      player.locked = true;
      setControlsDisabled(player, true);
    }
    function unlockPlayer(player) {
      player.locked = false;
      setControlsDisabled(player, false);
    }

    // ---------- Core gameplay ----------
    function handleAnswer(player, playerId) {
      if (!gameActive || player.locked || player.round > TOTAL_ROUNDS) return;
      if (player.answer === '') {
        const ansBox = playerId === 'p1' ? p1Answer : p2Answer;
        ansBox.classList.add('wrong-flash');
        setTimeout(() => ansBox.classList.remove('wrong-flash'), 400);
        return;
      }

      const answerNum = parseInt(player.answer, 10);
      const isCorrect = (answerNum === player.correctAnswer);
      const panel = playerId === 'p1' ? p1Panel : p2Panel;
      const ansBox = playerId === 'p1' ? p1Answer : p2Answer;
      const questionEl = playerId === 'p1' ? p1Question : p2Question;
      const badgeEl = playerId === 'p1' ? p1RoundBadge : p2RoundBadge;

      lockPlayer(player);

      // Visual feedback
      if (isCorrect) {
        ansBox.classList.add('feedback-flash');
        panel.style.transition = '0.2s';
        panel.style.boxShadow = '0 0 30px #22c55e';
        setTimeout(() => {
          ansBox.classList.remove('feedback-flash');
          panel.style.boxShadow = '';
        }, 500);
      } else {
        ansBox.classList.add('wrong-flash');
        setTimeout(() => ansBox.classList.remove('wrong-flash'), 400);
      }

      // Scoring & bar shift
      if (isCorrect) {
        player.score++;
        if (playerId === 'p1') shiftBar(true);
        else shiftBar(false);
      } else {
        if (playerId === 'p1') shiftBar(false);
        else shiftBar(true);
      }
      updateAllBarUI();

      // Determine progression after delay
      setTimeout(() => {
        if (isCorrect) {
          // Progress to next round
          if (player.round === TOTAL_ROUNDS) {
            player.round = TOTAL_ROUNDS + 1; // finished
            player.answer = '';
            updateAnswerDisplay(player, ansBox);
            updateRoundBadge(player, badgeEl);
            unlockPlayer(player);
            // check if game should end
            if (p1.round > TOTAL_ROUNDS || p2.round > TOTAL_ROUNDS) {
              endGame();
            }
          } else {
            player.round++;
            player.answer = '';
            generateQuestion(player);
            renderQuestion(player, questionEl);
            updateAnswerDisplay(player, ansBox);
            updateRoundBadge(player, badgeEl);
            unlockPlayer(player);
          }
        } else {
          // Stay on same round, just clear answer
          player.answer = '';
          updateAnswerDisplay(player, ansBox);
          unlockPlayer(player);
        }
      }, 500);
    }

    function appendDigit(player, digit, answerEl) {
      if (!gameActive || player.locked || player.round > TOTAL_ROUNDS) return;
      if (player.answer.length >= 3) return;
      player.answer += digit;
      updateAnswerDisplay(player, answerEl);
      const checkBtn = player === p1 ? p1Check : p2Check;
      checkBtn.disabled = false;
    }

    function undoAnswer(player, answerEl) {
      if (!gameActive || player.locked || player.round > TOTAL_ROUNDS) return;
      player.answer = '';
      updateAnswerDisplay(player, answerEl);
    }

    // ---------- Game end & reset ----------
    function endGame() {
      if (!gameActive) return;
      gameActive = false;
      setControlsDisabled(p1, true);
      setControlsDisabled(p2, true);

      let winner = '';
      if (p1.score > p2.score) {
        resultIcon.textContent = '🏆';
        resultTitle.textContent = '🔵 Player 1 Wins!';
        resultTitle.style.color = 'var(--blue-light)';
      } else if (p2.score > p1.score) {
        resultIcon.textContent = '🏆';
        resultTitle.textContent = '🔴 Player 2 Wins!';
        resultTitle.style.color = 'var(--red-light)';
      } else {
        resultIcon.textContent = '🤝';
        resultTitle.textContent = "It's a Tie!";
        resultTitle.style.color = '#fbbf24';
      }
      finalP1.textContent = p1.score;
      finalP2.textContent = p2.score;
      overlay.classList.add('active');
    }

    function fullReset() {
      gameActive = true;
      barPosition = 50;
      p1 = createPlayer();
      p2 = createPlayer();
      generateQuestion(p1);
      generateQuestion(p2);

      renderQuestion(p1, p1Question);
      renderQuestion(p2, p2Question);
      updateAnswerDisplay(p1, p1Answer);
      updateAnswerDisplay(p2, p2Answer);
      updateRoundBadge(p1, p1RoundBadge);
      updateRoundBadge(p2, p2RoundBadge);
      updateAllBarUI();

      unlockPlayer(p1);
      unlockPlayer(p2);
      p1Answer.classList.add('placeholder');
      p2Answer.classList.add('placeholder');

      overlay.classList.remove('active');
    }

    function applySettingsAndReset() {
      TOTAL_ROUNDS = parseInt(roundsInput.value, 10);
      if (isNaN(TOTAL_ROUNDS) || TOTAL_ROUNDS < 1) TOTAL_ROUNDS = 1;
      if (TOTAL_ROUNDS > 20) TOTAL_ROUNDS = 20;
      roundsInput.value = TOTAL_ROUNDS;

      const diff = difficultySelect.value;
      if (diff === 'easy') DIFFICULTY_MAX = 5;
      else if (diff === 'hard') DIFFICULTY_MAX = 12;
      else DIFFICULTY_MAX = 9;

      fullReset();
    }

    // ---------- Event wiring ----------
    function setupPad(padElement, player, answerEl) {
      padElement.addEventListener('click', e => {
        const btn = e.target.closest('button');
        if (!btn || btn.disabled) return;
        appendDigit(player, btn.textContent.trim(), answerEl);
      });
      padElement.addEventListener('touchstart', e => {
        const btn = e.target.closest('button');
        if (!btn || btn.disabled) return;
        e.preventDefault();
        appendDigit(player, btn.textContent.trim(), answerEl);
      }, {passive: false});
    }

    setupPad(p1Pad, p1, p1Answer);
    setupPad(p2Pad, p2, p2Answer);

    p1Undo.addEventListener('click', () => undoAnswer(p1, p1Answer));
    p2Undo.addEventListener('click', () => undoAnswer(p2, p2Answer));
    p1Check.addEventListener('click', () => handleAnswer(p1, 'p1'));
    p2Check.addEventListener('click', () => handleAnswer(p2, 'p2'));

    // Settings panel
    settingsToggle.addEventListener('click', () => {
      settingsPanel.classList.toggle('open');
    });
    applySettingsBtn.addEventListener('click', applySettingsAndReset);

    // Play again
    playAgainBtn.addEventListener('click', () => {
      applySettingsAndReset(); // respects current settings
    });

    // Prevent double-tap zoom on buttons
    document.addEventListener('touchstart', e => {
      if (e.target.closest('button') && e.touches.length > 1) e.preventDefault();
    }, {passive: false});

    // Initialise
    generateQuestion(p1);
    generateQuestion(p2);
    renderQuestion(p1, p1Question);
    renderQuestion(p2, p2Question);
    updateRoundBadge(p1, p1RoundBadge);
    updateRoundBadge(p2, p2RoundBadge);
    updateAllBarUI();
    unlockPlayer(p1);
    unlockPlayer(p2);
  })();
</script>
</body>
</html>
