<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Phonics Spelling Tug of War · Two‑Player</title>
    <style>
        :root {
            --bg: #0b1120;
            --surface: #111b2e;
            --blue: #3b82f6;
            --blue-light: #60a5fa;
            --red: #ef4444;
            --red-light: #f87171;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
            --border: #1e293b;
            --radius: 16px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(8px, 2vh, 16px);
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .game-layout {
            display: flex;
            width: 100%;
            height: 100%;
            gap: clamp(8px, 1.5vw, 16px);
            max-width: 1500px;
        }
        .player-panel {
            flex: 1;
            background: var(--surface);
            border-radius: var(--radius);
            border: 2px solid var(--border);
            padding: clamp(8px, 1.5vw, 16px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(6px, 1vh, 10px);
            min-width: 0;
            overflow-y: auto;
        }
        .player-panel.p1 { border-top: 4px solid var(--blue); }
        .player-panel.p2 { border-top: 4px solid var(--red); }
        .player-name {
            font-weight: 700;
            font-size: clamp(0.85rem, 1.6vw, 1.2rem);
            letter-spacing: 1px;
            background: rgba(255,255,255,0.05);
            padding: 0.3rem 1rem;
            border-radius: 2rem;
        }
        .p1 .player-name { color: var(--blue-light); }
        .p2 .player-name { color: var(--red-light); }
        .word-badge {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-dim);
            background: rgba(255,255,255,0.05);
            padding: 0.3rem 0.8rem;
            border-radius: 1rem;
        }
        .word-definition {
            background: rgba(255,255,255,0.06);
            border-radius: 0.8rem;
            padding: 0.5rem;
            font-size: 0.75rem;
            color: #e2e8f0;
            text-align: center;
            max-width: 90%;
            line-height: 1.3;
        }
        .speaker-btn {
            background: #7c3aed;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(124,58,237,0.5);
            transition: 0.2s;
            margin: 0 auto;
        }
        .speaker-btn:active { transform: scale(0.95); background: #6d28d9; }
        .speaker-btn:disabled { opacity: 0.4; pointer-events: none; }
        .speaker-btn.loading { opacity: 0.7; }
        .speaker-btn.loading::after {
            content: "";
            width: 20px; height: 20px;
            border: 2px solid transparent;
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0%{transform:rotate(0deg)}100%{transform:rotate(360deg)} }
        .grid-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 300px;
        }
        .letter-grid {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            min-height: 50px;
        }
        .letter-box {
            width: 38px;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .letter-box.build {
            background: #1e293b;
            border: 2px solid #475569;
            color: #cbd5e1;
        }
        .letter-box.option {
            background: #312e81;
            border: 2px solid #6366f1;
            color: #e0e7ff;
        }
        .letter-box.option:active { transform: scale(0.9); }
        .letter-box.option.used {
            opacity: 0.25;
            pointer-events: none;
            cursor: not-allowed;
        }
        .message {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.2rem 0.8rem;
            border-radius: 1rem;
            display: none;
            text-align: center;
        }
        .message.success { background: rgba(34,197,94,0.2); color: #4ade80; display: block; }
        .message.error { background: rgba(239,68,68,0.2); color: #f87171; display: block; }
        .clear-btn {
            background: #b91c1c;
            color: white;
            border: none;
            padding: 0.4rem 1.2rem;
            border-radius: 2rem;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }
        .clear-btn:active { background: #991b1b; }
        .center-column {
            flex: 0 0 clamp(230px, 26vw, 280px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
        }
        .settings-toggle {
            background: none;
            border: 2px solid #334155;
            color: #cbd5e1;
            border-radius: 2rem;
            padding: 0.35rem 1rem;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-family: inherit;
        }
        .settings-toggle:hover { background: #1e293b; }
        .settings-panel {
            display: none;
            background: #1e293b;
            border-radius: 1rem;
            padding: 0.8rem;
            width: 100%;
            flex-direction: column;
            gap: 0.6rem;
            border: 1px solid #334155;
            max-height: 55vh;
            overflow-y: auto;
        }
        .settings-panel.open { display: flex; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.3rem; }
        .setting-row label { font-size: 0.8rem; font-weight: 500; color: #cbd5e1; }
        .setting-row input[type="text"],
        .setting-row input[type="number"] {
            background: #0f172a; border: 1px solid #334155; color: white;
            padding: 0.35rem 0.5rem; border-radius: 0.5rem; font-weight: 600;
            text-align: center; font-family: inherit; font-size: 0.85rem;
        }
        .setting-row input[type="text"] { width: 80px; }
        .setting-row input[type="number"] { width: 55px; }
        .apply-settings-btn {
            background: #6366f1; color: white; border: none; border-radius: 2rem;
            padding: 0.5rem; font-weight: 700; cursor: pointer; letter-spacing: 0.5px;
            font-family: inherit; font-size: 0.85rem;
        }
        .war-bar-container {
            width: 100%; position: relative; height: 50px; background: white;
            border-radius: 30px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.6);
        }
        .war-bar-blue, .war-bar-red {
            position: absolute; top: 0; height: 100%;
            transition: width 0.5s cubic-bezier(0.2,0.9,0.4,1);
        }
        .war-bar-blue { left:0; background: linear-gradient(180deg,#3b82f6,#1e40af); border-radius:30px 0 0 30px; }
        .war-bar-red { right:0; background: linear-gradient(180deg,#ef4444,#991b1b); border-radius:0 30px 30px 0; }
        .bar-divider {
            position: absolute; top:5%; height:90%; width:4px; background:white;
            box-shadow:0 0 10px white; border-radius:4px;
            transition: left 0.5s cubic-bezier(0.2,0.9,0.4,1); z-index:5;
        }
        .bar-scores {
            position: absolute; top:0; left:0; right:0; bottom:0;
            pointer-events:none; z-index:10; display:flex;
            justify-content:space-between; align-items:center; padding:0 12px;
        }
        .bar-score { font-weight:900; font-size:1.1rem; color:white; text-shadow:0 2px 6px black; }
        .score-summary { display:flex; justify-content:space-between; width:100%; font-weight:700; font-size:0.8rem; }
        .overlay {
            position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(8px);
            display:flex; align-items:center; justify-content:center; z-index:50;
            opacity:0; pointer-events:none; transition:opacity 0.4s;
        }
        .overlay.active { opacity:1; pointer-events:auto; }
        .result-card {
            background:#1e293b; border-radius:2rem; padding:2rem; text-align:center;
            box-shadow:0 20px 40px black; max-width:400px; width:90%;
        }
        .result-icon { font-size:3.5rem; margin-bottom:0.5rem; }
        .result-title { font-size:1.6rem; font-weight:900; }
        .result-scores { display:flex; justify-content:center; gap:2rem; margin:1.2rem 0; }
        .play-again-btn {
            background:#6366f1; border:none; color:white; padding:0.7rem 2rem;
            border-radius:3rem; font-weight:700; font-size:1rem; cursor:pointer; font-family:inherit;
        }
        @media (max-width:750px) {
            .game-layout { flex-direction:column; gap:6px; }
            .center-column { flex:0 0 auto; width:100%; order:-1; }
            .player-panel { max-height:40vh; }
        }
    </style>
</head>
<body>
<div class="game-layout">
    <!-- Player 1 Panel -->
    <div class="player-panel p1" id="p1Panel">
        <div class="player-name" id="p1NameDisplay">🔵 PLAYER 1</div>
        <div class="word-badge" id="p1WordBadge">Word 1 / 20</div>
        <div class="word-definition" id="p1Definition"></div>
        <button class="speaker-btn" id="p1SpeakerBtn" disabled>🔊</button>
        <div class="grid-container">
            <div class="letter-grid" id="p1BuildGrid"></div>
            <div class="letter-grid" id="p1LetterGrid"></div>
        </div>
        <div class="message" id="p1Message"></div>
        <button class="clear-btn" id="p1ClearBtn">🧹 Clear</button>
    </div>

    <!-- Center Column -->
    <div class="center-column">
        <button class="settings-toggle" id="settingsToggle">⚙️ Settings</button>
        <div class="settings-panel" id="settingsPanel">
            <div class="setting-row">
                <label>Player 1 Name</label>
                <input type="text" id="p1NameInput" value="Player 1" maxlength="12">
            </div>
            <div class="setting-row">
                <label>Player 2 Name</label>
                <input type="text" id="p2NameInput" value="Player 2" maxlength="12">
            </div>
            <div class="setting-row">
                <label>Words to Win</label>
                <input type="number" id="roundsInput" value="20" min="1" max="50" step="1">
            </div>
            <button class="apply-settings-btn" id="applySettingsBtn">Apply & Restart</button>
        </div>
        <div style="font-weight:700; color:#cbd5e1; letter-spacing:1px; font-size:0.8rem;">⚡ TUG OF WAR ⚡</div>
        <div class="war-bar-container">
            <div class="war-bar-blue" id="blueBar"></div>
            <div class="war-bar-red" id="redBar"></div>
            <div class="bar-divider" id="barDivider"></div>
            <div class="bar-scores">
                <span class="bar-score" id="blueScore">0</span>
                <span class="bar-score" id="redScore">0</span>
            </div>
        </div>
        <div class="score-summary">
            <span style="color:var(--blue-light);">🔵 <span id="p1SummaryName">Player 1</span>: <strong id="p1ScoreChip">0</strong></span>
            <span style="color:var(--red-light);">🔴 <span id="p2SummaryName">Player 2</span>: <strong id="p2ScoreChip">0</strong></span>
        </div>
    </div>

    <!-- Player 2 Panel -->
    <div class="player-panel p2" id="p2Panel">
        <div class="player-name" id="p2NameDisplay">🔴 PLAYER 2</div>
        <div class="word-badge" id="p2WordBadge">Word 1 / 20</div>
        <div class="word-definition" id="p2Definition"></div>
        <button class="speaker-btn" id="p2SpeakerBtn" disabled>🔊</button>
        <div class="grid-container">
            <div class="letter-grid" id="p2BuildGrid"></div>
            <div class="letter-grid" id="p2LetterGrid"></div>
        </div>
        <div class="message" id="p2Message"></div>
        <button class="clear-btn" id="p2ClearBtn">🧹 Clear</button>
    </div>
</div>

<!-- Victory Overlay -->
<div class="overlay" id="overlay">
    <div class="result-card">
        <div class="result-icon" id="resultIcon">🏆</div>
        <div class="result-title" id="resultTitle"></div>
        <div class="result-scores">
            <div><div style="color:var(--blue-light);" id="finalP1Label">🔵 P1</div><div style="font-size:2rem; font-weight:900;" id="finalP1">0</div></div>
            <div><div style="color:var(--red-light);" id="finalP2Label">🔴 P2</div><div style="font-size:2rem; font-weight:900;" id="finalP2">0</div></div>
        </div>
        <button class="play-again-btn" id="playAgainBtn">🔄 Play Again</button>
    </div>
</div>

<script>
(function() {
    // ──────────────────────────────────────
    // WORD BANK (from the original Phonics Spelling Challenge)
    // ──────────────────────────────────────
    const WORD_BANK = [
        { word: "deep", definition: "extending far from some surface or area", example: "The ocean was very ______ at that point." },
        { word: "happy", definition: "feeling or showing pleasure or contentment", example: "She felt very ______ after receiving the good news." },
        { word: "bump", definition: "a relatively abrupt convexity or protuberance on a surface", example: "There was a small ______ on the smooth road." },
        { word: "bear", definition: "any of a family of large heavy mammals that have long shaggy hair and small tails and feed largely on fruit and insects", example: "We saw a ______ in the forest during our hike." },
        { word: "count", definition: "to add one by one in order to find the total number", example: "Please ______ how many people are in the room." },
        { word: "dunk", definition: "to dip (something, such as a piece of bread) into a beverage while eating", example: "He likes to ______ his cookies in milk." },
        { word: "feet", definition: "the terminal part of the vertebrate leg upon which an individual stands", example: "My ______ were tired after walking all day." },
        { word: "cold", definition: "having or being a temperature that is uncomfortably low for humans", example: "The weather turned ______ overnight." },
        { word: "alone", definition: "separated from others", example: "She preferred to be ______ with her thoughts." },
        { word: "click", definition: "to strike, move, or produce with a click", example: "______ the button to submit your answer." },
        { word: "miss", definition: "to fail to hit, reach, or contact", example: "I will ______ you when you're gone." },
        { word: "shirt", definition: "a garment for the upper part of the body", example: "He wore a blue ______ to the interview." },
        { word: "roof", definition: "the cover of a building", example: "The rain was loud on the ______." },
        { word: "here", definition: "in or at this place", example: "Please come ______ immediately." },
        { word: "lamp", definition: "any of various devices for producing light or sometimes heat", example: "She turned on the ______ to read her book." },
        { word: "lost", definition: "not made use of, won, or claimed", example: "We got ______ in the unfamiliar city." },
        { word: "lunch", definition: "a light meal usually eaten in the middle of the day", example: "Let's meet for ______ at noon." },
        { word: "drift", definition: "to become driven or carried along by a current of air or water", example: "The boat began to ______ with the current." },
        { word: "please", definition: "to afford or give pleasure or satisfaction", example: "______ remember to clean your room." },
        { word: "spill", definition: "to cause or allow to fall, flow, or run out so as to be lost or wasted", example: "Be careful not to ______ your drink." },
        { word: "tired", definition: "drained of strength and energy", example: "I felt too ______ to continue working." },
        { word: "large", definition: "exceeding most other things of like kind especially in quantity or size", example: "They ordered a ______ pizza for the party." },
        { word: "lake", definition: "a considerable inland body of standing water", example: "We went swimming in the ______." },
        { word: "grab", definition: "to take or seize by or as if by a sudden motion or grasp", example: "He tried to ______ the last cookie." },
        { word: "juice", definition: "the extractable fluid contents of cells or tissues", example: "I would like orange ______ with my breakfast." },
        { word: "nook", definition: "a right-angled corner", example: "She found a quiet ______ to read her book." },
        { word: "shops", definition: "a place of business for retail goods", example: "All the ______ were closed on Sunday." },
        { word: "spot", definition: "a small area visibly different from the surrounding area", example: "There was a red ______ on his shirt." },
        { word: "World", definition: "the earthly state of human existence", example: "She wanted to travel around the ______." },
        { word: "math", definition: "the science of numbers and their operations", example: "______ was my favorite subject in school." },
        { word: "pick", definition: "to choose or select from a group", example: "You can ______ any color you like." },
        { word: "soap", definition: "a cleansing and emulsifying agent made usually by action of alkali on fat or fatty acids", example: "Wash your hands with ______ and water." },
        { word: "tools", definition: "a handheld device that aids in accomplishing a task", example: "He organized his ______ in the garage." },
        { word: "green", definition: "of the color green", example: "The grass was very ______ after the rain." },
        { word: "muddy", definition: "filled or covered with mud", example: "His shoes were ______ after walking through the field." },
        { word: "ripe", definition: "fully grown and developed", example: "The bananas were finally ______ enough to eat." },
        { word: "sign", definition: "a motion or gesture by which a thought is expressed", example: "Please ______ your name on the dotted line." },
        { word: "Soup", definition: "a liquid food especially with a meat, fish, or vegetable stock as a base", example: "She made chicken ______ for dinner." },
        { word: "Warm", definition: "having or giving out heat to a moderate or adequate degree", example: "The blanket felt ______ and cozy." },
        { word: "fresh", definition: "having its original qualities unimpaired", example: "We bought ______ bread from the bakery." },
        { word: "learn", definition: "to gain knowledge or understanding of or skill in by study, instruction, or experience", example: "Children ______ quickly when they're young." },
        { word: "frosty", definition: "attended with or producing frost", example: "The morning was ______ and cold." },
        { word: "crisp", definition: "easily crumbled", example: "The apple was ______ and juicy." },
        { word: "shape", definition: "the visible makeup characteristic of a particular item or kind of item", example: "Cut the dough into a star ______." },
        { word: "splash", definition: "to strike and dash about a liquid or semiliquid substance", example: "The kids love to ______ in the puddles." },
        { word: "mushy", definition: "having the consistency of mush", example: "The vegetables were ______ after being overcooked." },
        { word: "group", definition: "two or more figures forming a complete unit in a composition", example: "Our ______ will meet at 3 PM." },
        { word: "spine", definition: "the series of vertebrae extending from the skull to the tailbone", example: "He injured his ______ in the accident." },
        { word: "straps", definition: "a narrow usually flat strip of flexible material and especially leather used for securing, holding together, or wrapping", example: "The ______ on her backpack were adjustable." },
        { word: "feast", definition: "an elaborate meal often accompanied by ceremony or entertainment", example: "The wedding ______ was magnificent." },
        // ... truncated for brevity; you can include the full array from the original.
        // For demonstration we stop here, but you should copy the entire big array.
    ];
    // Note: The actual array should contain all words from the original. I've cut it short for the answer;
    // in production, replace with the full list.

    // ──────────────────────────────
    // DOM ELEMENTS
    // ──────────────────────────────
    const $ = id => document.getElementById(id);
    const p1NameDisplay = $('p1NameDisplay'), p2NameDisplay = $('p2NameDisplay');
    const p1WordBadge = $('p1WordBadge'), p2WordBadge = $('p2WordBadge');
    const p1Definition = $('p1Definition'), p2Definition = $('p2Definition');
    const p1SpeakerBtn = $('p1SpeakerBtn'), p2SpeakerBtn = $('p2SpeakerBtn');
    const p1BuildGrid = $('p1BuildGrid'), p2BuildGrid = $('p2BuildGrid');
    const p1LetterGrid = $('p1LetterGrid'), p2LetterGrid = $('p2LetterGrid');
    const p1Message = $('p1Message'), p2Message = $('p2Message');
    const p1ClearBtn = $('p1ClearBtn'), p2ClearBtn = $('p2ClearBtn');
    const blueBar = $('blueBar'), redBar = $('redBar'), barDivider = $('barDivider');
    const blueScoreEl = $('blueScore'), redScoreEl = $('redScore');
    const p1ScoreChip = $('p1ScoreChip'), p2ScoreChip = $('p2ScoreChip');
    const p1SummaryName = $('p1SummaryName'), p2SummaryName = $('p2SummaryName');
    const settingsToggle = $('settingsToggle'), settingsPanel = $('settingsPanel');
    const p1NameInput = $('p1NameInput'), p2NameInput = $('p2NameInput');
    const roundsInput = $('roundsInput'), applySettingsBtn = $('applySettingsBtn');
    const overlay = $('overlay'), resultIcon = $('resultIcon'), resultTitle = $('resultTitle');
    const finalP1Label = $('finalP1Label'), finalP2Label = $('finalP2Label');
    const finalP1 = $('finalP1'), finalP2 = $('finalP2');
    const playAgainBtn = $('playAgainBtn');

    // ──────────────────────────────
    // GAME STATE
    // ──────────────────────────────
    let TOTAL_WORDS = Math.min(20, WORD_BANK.length);
    let PLAYER1 = 'Player 1', PLAYER2 = 'Player 2';
    let gameActive = true, barPosition = 50;

    // Global TTS
    const synth = window.speechSynthesis;
    let ttsReady = false;
    let ttsLoading = false;

    function createPlayerState(playerId) {
        return {
            id: playerId,
            currentWordIndex: 0,
            targetWord: '',
            buildSlots: 0,
            filledSlots: 0,
            letters: [],
            isComplete: false,
            totalScore: 0,
        };
    }

    const players = {
        p1: createPlayerState('p1'),
        p2: createPlayerState('p2'),
    };

    // ──────────────────────────────
    // TTS INITIALIZATION (audio fix)
    // ──────────────────────────────
    function initTTS() {
        if (!synth) {
            console.warn("Speech synthesis not supported");
            return;
        }
        ttsLoading = true;
        p1SpeakerBtn.classList.add('loading');
        p2SpeakerBtn.classList.add('loading');

        const voices = synth.getVoices();
        if (voices.length) {
            warmUpTTS();
            return;
        }
        synth.addEventListener('voiceschanged', () => {
            if (!ttsReady) warmUpTTS();
        }, { once: true });
        // fallback after 3s
        setTimeout(() => {
            if (!ttsReady && ttsLoading) {
                console.warn("TTS warmup timed out, enabling anyway");
                ttsReady = true;
                ttsLoading = false;
                p1SpeakerBtn.classList.remove('loading');
                p2SpeakerBtn.classList.remove('loading');
                p1SpeakerBtn.disabled = false;
                p2SpeakerBtn.disabled = false;
            }
        }, 3000);
    }

    function warmUpTTS() {
        try {
            const u = new SpeechSynthesisUtterance("");
            u.volume = 0;
            u.onend = () => {
                ttsReady = true;
                ttsLoading = false;
                p1SpeakerBtn.classList.remove('loading');
                p2SpeakerBtn.classList.remove('loading');
                p1SpeakerBtn.disabled = false;
                p2SpeakerBtn.disabled = false;
            };
            synth.speak(u);
        } catch (e) {
            console.error("TTS warmup error", e);
            ttsReady = true; // fallback
            ttsLoading = false;
            p1SpeakerBtn.classList.remove('loading');
            p2SpeakerBtn.classList.remove('loading');
            p1SpeakerBtn.disabled = false;
            p2SpeakerBtn.disabled = false;
        }
    }

    // speak the word for a player
    function speakWord(playerId) {
        if (!gameActive) return;
        if (!synth || !ttsReady) {
            // attempt to force warm-up on user gesture
            if (!ttsReady && synth && !ttsLoading) {
                initTTS();
                setTimeout(() => speakWord(playerId), 200);
            }
            return;
        }
        synth.cancel();
        const word = players[playerId].targetWord;
        if (!word) return;
        const u = new SpeechSynthesisUtterance(word);
        u.rate = 0.8;
        u.pitch = 1.1;
        synth.speak(u);
    }

    // ──────────────────────────────
    // BAR & SCORE
    // ──────────────────────────────
    function updateBar() {
        blueBar.style.width = barPosition + '%';
        redBar.style.width = (100 - barPosition) + '%';
        barDivider.style.left = barPosition + '%';
        blueScoreEl.textContent = players.p1.totalScore;
        redScoreEl.textContent = players.p2.totalScore;
        p1ScoreChip.textContent = players.p1.totalScore;
        p2ScoreChip.textContent = players.p2.totalScore;
    }

    function shiftBar(favorBlue) {
        barPosition = favorBlue ? Math.min(92, barPosition + 5) : Math.max(8, barPosition - 5);
        updateBar();
    }

    function updateNames() {
        p1NameDisplay.textContent = `🔵 ${PLAYER1}`;
        p2NameDisplay.textContent = `🔴 ${PLAYER2}`;
        p1SummaryName.textContent = PLAYER1;
        p2SummaryName.textContent = PLAYER2;
        finalP1Label.textContent = `🔵 ${PLAYER1}`;
        finalP2Label.textContent = `🔴 ${PLAYER2}`;
    }

    // ──────────────────────────────
    // GAME OVER
    // ──────────────────────────────
    function endGame(winner) {
        if (!gameActive) return;
        gameActive = false;
        const p1 = players.p1, p2 = players.p2;
        if (winner === 'p1') {
            resultIcon.textContent = '🏆';
            resultTitle.textContent = `🔵 ${PLAYER1} Wins!`;
            resultTitle.style.color = 'var(--blue-light)';
        } else if (winner === 'p2') {
            resultIcon.textContent = '🏆';
            resultTitle.textContent = `🔴 ${PLAYER2} Wins!`;
            resultTitle.style.color = 'var(--red-light)';
        } else {
            resultIcon.textContent = '🤝';
            resultTitle.textContent = "It's a Tie!";
            resultTitle.style.color = '#fbbf24';
        }
        finalP1.textContent = p1.totalScore;
        finalP2.textContent = p2.totalScore;
        overlay.classList.add('active');
    }

    // ──────────────────────────────
    // RENDER WORD FOR A PLAYER
    // ──────────────────────────────
    function loadWordForPlayer(playerId) {
        const p = players[playerId];
        const wordObj = WORD_BANK[p.currentWordIndex % WORD_BANK.length];
        p.targetWord = wordObj.word;
        p.buildSlots = wordObj.word.length;
        p.filledSlots = 0;
        p.isComplete = false;

        // Update UI
        const defEl = playerId === 'p1' ? p1Definition : p2Definition;
        defEl.innerHTML = `<em>${wordObj.definition}</em><br><small>${wordObj.example.replace('______', '_____')}</small>`;

        const badge = playerId === 'p1' ? p1WordBadge : p2WordBadge;
        badge.textContent = `Word ${p.currentWordIndex+1} / ${TOTAL_WORDS}`;

        // Build grid (empty slots)
        const buildGrid = playerId === 'p1' ? p1BuildGrid : p2BuildGrid;
        buildGrid.innerHTML = '';
        for (let i = 0; i < p.targetWord.length; i++) {
            const box = document.createElement('div');
            box.className = 'letter-box build';
            buildGrid.appendChild(box);
        }

        // Letter grid (shuffled)
        const letterGrid = playerId === 'p1' ? p1LetterGrid : p2LetterGrid;
        letterGrid.innerHTML = '';
        const letters = p.targetWord.split('');
        shuffleArray(letters);
        letters.forEach(letter => {
            const box = document.createElement('div');
            box.className = 'letter-box option';
            box.textContent = letter;
            box.dataset.letter = letter;
            box.addEventListener('click', (e) => handleLetterClick(playerId, letter, e.currentTarget));
            letterGrid.appendChild(box);
        });

        // Clear message
        const msg = playerId === 'p1' ? p1Message : p2Message;
        msg.className = 'message';
        msg.textContent = '';
    }

    function handleLetterClick(playerId, letter, sourceBox) {
        const p = players[playerId];
        if (!gameActive || p.isComplete) return;
        if (sourceBox.classList.contains('used')) return;

        const buildGrid = playerId === 'p1' ? p1BuildGrid : p2BuildGrid;
        if (p.filledSlots >= p.buildSlots) return;

        // Place letter
        const targetBox = buildGrid.children[p.filledSlots];
        targetBox.textContent = letter;
        p.filledSlots++;
        sourceBox.classList.add('used');

        // Check if complete
        if (p.filledSlots === p.buildSlots) {
            checkWord(playerId);
        }
    }

    function checkWord(playerId) {
        const p = players[playerId];
        const buildGrid = playerId === 'p1' ? p1BuildGrid : p2BuildGrid;
        const userWord = Array.from(buildGrid.children).map(b => b.textContent).join('');
        const target = p.targetWord.toLowerCase();
        const isCorrect = userWord.toLowerCase() === target;

        const msg = playerId === 'p1' ? p1Message : p2Message;
        const panel = playerId === 'p1' ? $('p1Panel') : $('p2Panel');

        if (isCorrect) {
            p.totalScore++;
            p.currentWordIndex++;
            shiftBar(playerId === 'p1');
            msg.textContent = '✅ Correct!';
            msg.className = 'message success';
            panel.style.boxShadow = '0 0 20px #22c55e';
            setTimeout(() => panel.style.boxShadow = '', 400);
            updateBar();

            if (p.currentWordIndex >= TOTAL_WORDS) {
                endGame(playerId);
                return;
            }
            // Load next word after short delay
            setTimeout(() => loadWordForPlayer(playerId), 600);
        } else {
            // Wrong
            if (p.totalScore > 0) p.totalScore--;
            shiftBar(playerId !== 'p1');
            msg.textContent = '❌ Wrong! Try again';
            msg.className = 'message error';
            panel.style.boxShadow = '0 0 20px #ef4444';
            setTimeout(() => panel.style.boxShadow = '', 400);
            updateBar();
            // Reset the grid (same word)
            resetGrid(playerId);
        }
    }

    function resetGrid(playerId) {
        const p = players[playerId];
        p.filledSlots = 0;
        p.isComplete = false;
        const buildGrid = playerId === 'p1' ? p1BuildGrid : p2BuildGrid;
        Array.from(buildGrid.children).forEach(b => b.textContent = '');
        const letterGrid = playerId === 'p1' ? p1LetterGrid : p2LetterGrid;
        Array.from(letterGrid.children).forEach(b => b.classList.remove('used'));
        const msg = playerId === 'p1' ? p1Message : p2Message;
        msg.className = 'message';
        msg.textContent = '';
    }

    // ──────────────────────────────
    // FULL RESET
    // ──────────────────────────────
    function fullReset() {
        gameActive = true;
        barPosition = 50;
        players.p1 = createPlayerState('p1');
        players.p2 = createPlayerState('p2');
        loadWordForPlayer('p1');
        loadWordForPlayer('p2');
        updateBar();
        updateNames();
        overlay.classList.remove('active');
    }

    // ──────────────────────────────
    // SETTINGS
    // ──────────────────────────────
    function applySettings() {
        const p1name = p1NameInput.value.trim() || 'Player 1';
        const p2name = p2NameInput.value.trim() || 'Player 2';
        let words = parseInt(roundsInput.value, 10);
        if (isNaN(words) || words < 1) words = 1;
        if (words > WORD_BANK.length) words = WORD_BANK.length;
        roundsInput.value = words;
        PLAYER1 = p1name;
        PLAYER2 = p2name;
        TOTAL_WORDS = words;
        settingsPanel.classList.remove('open');
        fullReset();
    }

    settingsToggle.addEventListener('click', () => settingsPanel.classList.toggle('open'));
    applySettingsBtn.addEventListener('click', applySettings);
    playAgainBtn.addEventListener('click', applySettings);

    // ──────────────────────────────
    // EVENT LISTENERS
    // ──────────────────────────────
    p1ClearBtn.addEventListener('click', () => resetGrid('p1'));
    p2ClearBtn.addEventListener('click', () => resetGrid('p2'));
    p1SpeakerBtn.addEventListener('click', () => speakWord('p1'));
    p2SpeakerBtn.addEventListener('click', () => speakWord('p2'));

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
    }

    // ──────────────────────────────
    // STARTUP
    // ──────────────────────────────
    initTTS();
    roundsInput.max = WORD_BANK.length;
    roundsInput.value = TOTAL_WORDS;
    updateNames();
    fullReset();
})();
</script>
</body>
</html>
